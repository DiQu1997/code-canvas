<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Redis 内存超限时怎么腾内存</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d2330;--mut:#667085;--line:#e2e0d8;--acc:#2456d6;
--e1:#1a7f4b;--e2:#1f5fbf;--e3:#0f7b8a;--e4:#5b4bc4;--infer:#b26a00;--view:#b0237a;--unk:#6b7280;--fact:#475467;
--sans:system-ui,-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei","WenQuanYi Zen Hei",sans-serif;
--mono:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","WenQuanYi Zen Hei Mono",monospace}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--sans)}
a{color:var(--acc)}
button{font:inherit;cursor:pointer}
#top{position:sticky;top:0;z-index:40;height:48px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#1d2330;color:#fff}
#top button{flex:none;height:32px;padding:0 10px;border:1px solid #4a5468;border-radius:6px;background:#2b3345;color:#fff;font-size:14px}
#crumb{flex:1;min-width:0;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;font-size:14px}
#crumb a{color:#c9d6ff;text-decoration:none;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
#crumb b{overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:3em}
#crumb i{font-style:normal;color:#8a93a6;flex:none}
#side{position:fixed;top:48px;left:0;bottom:0;width:290px;overflow:auto;border-right:1px solid var(--line);background:#fbfaf7;padding:10px 8px 40px}
#side .st{font-size:12px;color:var(--mut);padding:2px 8px 6px}
.ol{display:block;padding:4px 8px;border-radius:5px;font-size:14px;line-height:1.4;color:#333;text-decoration:none}
.ol i{font-style:normal;color:#9aa1ad;float:right}
.ol.on{font-weight:700}
.ol.cur{background:var(--acc);color:#fff}
.ol.d0{font-weight:700}
#main{margin-left:290px;padding:22px 32px 90px;max-width:960px;overflow-wrap:anywhere}
#legend{position:fixed;top:54px;right:8px;z-index:50;width:min(360px,calc(100vw - 16px));max-height:calc(100vh - 70px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:12px 14px;font-size:14px}
#legend[hidden]{display:none}
#legend h3{margin:8px 0 4px;font-size:14px}
#legend div{margin:5px 0;line-height:1.5}
.where{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:13px;color:var(--mut)}
.where .lvl{background:#1d2330;color:#fff;border-radius:4px;padding:0 7px;font-weight:700}
.where a{color:var(--acc);text-decoration:none;background:#e9eefb;border-radius:4px;padding:0 6px}
.where b{color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:4px;padding:0 6px}
h1{font-size:24px;line-height:1.3;margin:10px 0 6px}
h2{font-size:18px;margin:26px 0 8px;line-height:1.35}
h2 small{font-size:13px;font-weight:400;color:var(--mut);margin-left:8px}
.lead{font-size:16.5px;color:#2c3445;margin:4px 0 6px}
.src{font-size:12.5px;color:var(--mut)}
.navrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.nb2{font-size:13.5px;text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 9px;color:var(--ink)}
.nb2.off{color:var(--mut);background:transparent}
.pos{font-size:12.5px;color:var(--mut)}
p{margin:10px 0}
code{font-family:var(--mono);font-size:.88em;background:#eceae2;border-radius:3px;padding:0 3px}
a.ref{font-family:var(--mono);font-size:.84em;background:#eef2fb;border:1px solid #cbd6f2;border-radius:4px;padding:0 4px;color:#1d3f9a;cursor:pointer;white-space:nowrap;text-decoration:none}
a.ref::before{content:"⌖ ";opacity:.6}
a.ref.on{background:#1d3f9a;color:#fff}
a.cm{font-family:var(--mono);font-size:.84em;border:1px solid #c8d3ea;border-radius:4px;padding:0 4px;color:#1f5fbf;background:#fff;cursor:pointer;text-decoration:none;white-space:nowrap}
a.cm::before{content:"提交 ";font-family:var(--sans);opacity:.7}
.cinfo{display:block;font-size:12.5px;color:#444;background:#f1f4fb;border-radius:4px;padding:2px 6px;margin:3px 0}
a.lk{font-weight:600;text-decoration:none;border-bottom:1px solid currentColor}
.lv-e1{--c:var(--e1)}.lv-e2{--c:var(--e2)}.lv-e3{--c:var(--e3)}.lv-e4{--c:var(--e4)}.lv-fact{--c:var(--fact)}.lv-infer{--c:var(--infer)}.lv-view{--c:var(--view)}.lv-unk{--c:var(--unk)}
.note{margin:10px 0;padding:8px 12px;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:6px;background:#fff;font:14.5px/1.6 var(--sans);color:var(--ink)}
.note.lv-fact{border-left-color:#b9c0cc}
.note.lv-infer{border:1.5px dashed var(--c);background:#fff8e8}
.note.lv-view{border:1.5px dashed var(--c);background:#fdf0f7}
.note.lv-unk{border:1.5px dotted var(--c);background:#efeeea}
.note.flash{animation:fl 2s}
@keyframes fl{0%,60%{box-shadow:0 0 0 4px rgba(36,86,214,.45)}100%{box-shadow:0 0 0 4px rgba(36,86,214,0)}}
.nh{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:3px}
.bd{display:inline-block;font-size:12px;line-height:18px;font-weight:700;padding:0 8px;border-radius:9px;color:#fff;background:var(--c);white-space:nowrap}
.bd.lv-infer,.bd.lv-view,.bd.lv-unk{background:#fff;color:var(--c);border:1px dashed var(--c);line-height:16px}
.bd.lv-fact{background:#e6e8ee;color:#475467}
.who{font-size:12px;color:#7a4100;background:#ffe3b3;border-radius:4px;padding:0 6px}
.tg{font-size:12px;color:#444;background:#ecebe4;border-radius:4px;padding:0 6px}
.tg::before{content:"#"}
.ln{font-size:12px;color:var(--mut);margin-left:auto;font-family:var(--mono)}
.goto{margin-left:auto;font-size:13px;text-decoration:none;font-weight:600}
.ev{margin-top:6px;font-size:13.5px;line-height:1.7}
.ev .evl{font-size:12px;color:var(--mut)}
.q{margin:3px 0 0;border-left:3px solid #cfcbbd;padding:1px 8px;color:#3d4350;font:italic 13.5px/1.5 Georgia,"Times New Roman",serif;cursor:pointer;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.q.open{display:block}
.q::before{content:"“"}.q::after{content:"”"}
details.more{margin-top:6px;font-size:13.5px}
details.more summary{cursor:pointer;color:var(--acc);font-weight:600}
figure{margin:14px 0}
.cap{font-size:13px;color:var(--mut);margin-top:6px;line-height:1.55}
figure.code{border:1px solid var(--line);border-radius:8px;background:#fbfbf8;overflow:hidden}
figure.code figcaption{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;padding:5px 10px;background:#efede5;border-bottom:1px solid var(--line);font-size:13px}
figcaption .fn{font-family:var(--mono);font-weight:700}
figcaption .rg{color:var(--mut)}
.tgl{margin-left:auto;font-size:12.5px;border:1px solid #c9c5b6;background:#fff;border-radius:5px;padding:1px 8px}
figure.code>.cap{padding:0 10px 8px}
.cb{font:13px/1.55 var(--mono);padding:6px 0}
.cl{display:flex}
.cl.hl{background:#fff4cf}
.no{flex:0 0 3.4em;text-align:right;padding-right:.7em;color:#9aa1ad;user-select:none;font-size:12px;line-height:20.15px}
.tx{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;padding-left:1.6em;text-indent:-1.6em;padding-right:8px}
.k-c{color:#5b6777}.k-s{color:#1a7f4b}.k-k{color:#8b2fa0}
.gap{text-align:center;color:var(--mut);font:12.5px/1.6 var(--sans);background:repeating-linear-gradient(135deg,#f0eee6 0 6px,#f8f7f2 6px 12px);margin:4px 0;padding:1px 0}
.cb .note{margin:6px 10px 10px 3.4em}
figure.code.nonotes .cb .note{display:none}
.snip{display:block;margin:6px 0 4px;border:1px solid #cbd6f2;border-radius:6px;background:#fbfbf8;overflow:hidden;white-space:normal;font-weight:400;text-align:left}
.snip .sh{display:flex;gap:8px;align-items:center;font:12.5px/1.6 var(--mono);background:#eef2fb;padding:2px 8px;color:#1d3f9a}
.snip .sx{margin-left:auto;font:12px var(--sans);border:1px solid #cbd6f2;background:#fff;border-radius:4px;padding:0 6px}
figure.tb{overflow-x:auto}
table{border-collapse:collapse;width:100%;background:#fff;font-size:14.5px;line-height:1.55}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
th{background:#efede5;font-size:13px;white-space:nowrap}
td:first-child{font-weight:600}
ol.flow{list-style:none;margin:14px 0;padding:0;position:relative}
ol.flow::before{content:"";position:absolute;left:15px;top:8px;bottom:8px;width:2px;background:#c9c5b6}
.fs{position:relative;display:flex;gap:10px;margin:8px 0;align-items:flex-start}
.fk{flex:none;width:32px;height:32px;border-radius:50%;background:#1d2330;color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.fbody{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 11px}
.fs[data-to] .fbody{cursor:pointer;border-color:#b9c6ea}
.fs[data-to] .fbody:hover{background:#f4f7ff}
.ft{font-weight:700;font-size:15px;line-height:1.45}
.go{float:right;font-size:13px;color:var(--acc);font-weight:600;margin-left:8px}
.fsub{font-size:13.5px;color:#3d4350;margin-top:2px}
.fref{font-size:13px;margin-top:3px}
.fo{margin-top:5px;display:flex;flex-wrap:wrap;gap:5px}
.pill{font-size:12px;border-radius:9px;padding:0 8px;line-height:18px;font-weight:600}
.o-ok{background:#dff3e6;color:#17663d}.o-run{background:#fff0c9;color:#7a5200}.o-fail{background:#fbdcdc;color:#9b1c1c}
.floop{font-size:12.5px;color:var(--mut);margin-top:3px}
figure.dg{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 10px 10px}
.dgw{position:relative;overflow:hidden}
.dgi{position:absolute;left:0;top:0;transform-origin:0 0}
.dgi svg{position:absolute;left:0;top:0;pointer-events:none}
.dgi polyline{fill:none;stroke:#5c6679;stroke-width:1.5}
.dgi polyline.dash{stroke-dasharray:5 4}
.dgi marker path{fill:#5c6679}
.dfr{position:absolute;border:1.5px dashed #cdc9ba;border-radius:10px;background:rgba(0,0,0,.018)}
.dfr span{position:absolute;top:-10px;left:8px;background:#fff;padding:0 5px;font-size:12px;line-height:18px;color:var(--mut);white-space:nowrap}
.dbx{position:absolute;border:1.5px solid #8fa0c4;border-radius:8px;background:#f5f8ff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:2px 6px;font-size:13.5px;font-weight:700;line-height:1.25}
.dbx small{font-weight:400;font-size:12px;color:#4a5263;line-height:1.25}
.dbx.k-store{background:#fff9e3;border-color:#c9b46a;border-radius:3px;border-top-width:4px}
.dbx.k-ext{background:#f1f1ee;border-color:#a9a595;border-style:dashed}
.dbx.k-bg{background:#f3effc;border-color:#9a8bd0}
.dbx.go{cursor:pointer;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.dbx.go::after{content:"›";position:absolute;right:4px;bottom:0;color:var(--acc);font-size:15px}
.dbx.go:hover{outline:2px solid var(--acc)}
.flag{position:absolute;top:-10px;right:-6px;background:var(--acc);color:#fff;font-size:12px;line-height:17px;border-radius:9px;padding:0 6px;font-style:normal;font-weight:700;white-space:nowrap}
.dlb{position:absolute;transform:translate(-50%,-50%);background:#fff;border:1px solid var(--line);border-radius:4px;font-size:12px;line-height:16px;padding:0 4px;white-space:nowrap;color:#3d4350}
figure.frm{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.fr-top{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}
.fr-t{font-weight:700;color:var(--ink);font-size:14.5px}
.fr-inc{min-height:48px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.fr-cells{display:flex;gap:4px}
.cell{flex:1 1 0;min-width:0;border:1.5px solid #c9b46a;background:#fff9e3;border-radius:5px;text-align:center;padding:3px 1px;display:flex;flex-direction:column;line-height:1.3}
.fr-inc .cell{flex:0 0 64px}
.cell b{font:700 13px var(--mono)}.cell i{font-style:normal;font-size:13px}
.cell.s-empty{background:#f4f3ee;border-style:dashed;color:#9aa1ad}
.cell.s-new{background:#dff3e6;border-color:#1a7f4b}
.cell.s-out{background:#fbdcdc;border-color:#c0392b;text-decoration:line-through}
.cell.s-ghost{background:#eee;border-color:#999;color:#888;border-style:dotted}
.cell.s-pick{background:#1d2330;border-color:#1d2330;color:#fff}
.cell.s-mv{background:#eaf0ff;border-color:#8fa0c4}
.fr-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:3px}
.fr-say{margin:8px 0;font-size:14.5px;min-height:3.2em}
.fr-nav{display:flex;gap:8px}
.fr-nav button{flex:1;height:36px;border:1px solid #b9c6ea;background:#f4f7ff;border-radius:6px;font-size:14px;color:var(--acc);font-weight:600}
.fr-nav button:disabled{opacity:.4}
figure.bar{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.bar-r{display:flex;height:34px;border-radius:5px;overflow:hidden}
.seg{display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;border-right:1px solid #fff;min-width:22px}
.seg.k-in{background:#3b5b9d}
.seg.k-out{background:repeating-linear-gradient(135deg,#b9b5a6 0 6px,#d3cfc1 6px 12px);color:#333}
.bar-l{margin:8px 0 0;padding-left:1.6em;font-size:14px}
.bar-l em{font-style:normal;font-size:12px;border-radius:9px;padding:0 7px;margin-left:4px;background:#e3e9f7;color:#2b4280}
.bar-l li.k-out em{background:#e6e3d8;color:#555}
h2.dn{border-top:1px solid var(--line);padding-top:18px}
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.kid{background:#fff;border:1px solid #b9c6ea;border-radius:8px;padding:9px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.kid:hover{background:#f4f7ff}
.kid b{font-size:15.5px;color:var(--acc)}
.kid b::after{content:" ›"}
.kid span{font-size:13.5px;line-height:1.5;color:#3d4350}
.kid i{font-style:normal;font-size:12px;color:var(--mut)}
.back{margin-top:18px;font-size:13px;color:var(--mut);display:flex;flex-wrap:wrap;gap:4px 8px}
.back a{text-decoration:none}
.pager{display:flex;gap:10px;margin-top:22px}
.pager a{flex:1;text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-size:14px;color:var(--ink);min-width:0}
.pager a small{display:block;font-size:12px;color:var(--mut)}
.pager a.nx{border-color:var(--acc);text-align:right}
.cnt{font-size:13px;color:var(--mut)}
.stubbox{margin:14px 0;padding:14px 16px;border:2px dashed #b9b5a6;border-radius:10px;background:repeating-linear-gradient(135deg,#f3f1e9 0 8px,#faf9f5 8px 16px);color:#555;font-size:15px}
.stubbox b{display:inline-block;background:#6b7280;color:#fff;border-radius:4px;padding:0 8px;margin-right:8px}
.stubm{font-style:normal;font-size:12px;background:#e6e3d8;color:#666;border-radius:9px;padding:0 7px;white-space:nowrap}
.kid.stub{border-style:dashed;border-color:#c9c5b6;background:#faf9f5}
.kid.stub b{color:#667085}
.ol.stub:not(.cur){color:#9aa1ad}
span.lk.dead{font-weight:600;color:#9b1c1c;border-bottom:1px dashed currentColor;cursor:help}
@media (max-width:999px){
 #side{display:none}
 body.mapopen #side{display:block;width:auto;right:0;z-index:35;border-right:0;padding:10px 12px 60px}
 body.mapopen{overflow:hidden}
 .ol{font-size:15px;padding:7px 8px}
 #main{margin-left:0}
}
@media (min-width:1000px){#bmap{display:none}}
@media (max-width:699px){
 #main{padding:14px 14px 80px}
 h1{font-size:21px}
 .lead{font-size:16px}
 .cb{font-size:12px}
 .no{flex-basis:3em;padding-right:.5em;line-height:18.6px}
 .ind{letter-spacing:-.5ch}
 .tx{padding-right:4px}
 .cb .note{margin:6px 6px 10px 8px;font-size:14px}
 figure.tb{overflow:visible}
 .tb table,.tb tbody,.tb tr,.tb td{display:block;width:100%}
 .tb table{background:transparent}
 .tb thead{display:none}
 .tb tr{border:1px solid var(--line);border-radius:8px;background:#fff;margin:8px 0;padding:6px 10px}
 .tb td{border:0;padding:3px 0}
 .tb td::before{content:attr(data-h);display:block;font-size:12px;color:var(--mut);font-weight:400}
 .tb td:first-child{font-size:15px}
 .tb td:empty{display:none}
 figure.dg{padding:14px 4px 8px}
 .kids{grid-template-columns:1fr}
 .pager{flex-direction:column}
}
</style>
</head>
<body>
<header id="top"><button id="bmap">☰ 地图</button><nav id="crumb"></nav><button id="bleg">图例</button></header>
<aside id="side"></aside>

ted and consumed some client output buffer memory.","raw":["src/server.c:4933-4935"],"rh":"<a class=\"ref\" data-k=\"src/server.c:4933-4935\" title=\"src/server.c:4933-4935\">server.c:4933–4935<\/a>"},{"lv":"提交","q":"This prevents eviction or OOM caused by accumulated used memory between all clients.","raw":["c:2753429c9"],"rh":"<a class=\"cm\" data-h=\"2753429c9\">2753429c9<\/a>"}],"a":4936,"b":4936},{"t":"note","k":"n2","lv":"注释","html":"两个前提：设了上限；并且不是在超时的长脚本里重入事件循环，免得脚本的传播和淘汰的 DEL 混在一起。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"to avoid mixing the propagation of scripts with the propagation of DELs due to eviction","raw":["src/server.c:4944-4947"],"rh":"<a class=\"ref\" data-k=\"src/server.c:4944-4947\" title=\"src/server.c:4944-4947\">server.c:4944–4947<\/a>"}],"a":4948,"b":4948},{"t":"note","k":"n3","lv":null,"html":"只有 <code>EVICT_FAIL<\/code> 才记成内存不足。返回 <code>EVICT_RUNNING<\/code>（还超着、还在删）时这里是 0，命令照常执行。为什么见 <a class=\"lk\" href=\"#/ret\">三个返回值<\/a>。","tag":"反直觉","who":null,"more":null,"ev":[],"a":4949,"b":4949}],"cap":null},{"t":"code","file":"src/server.c","parts":[{"a":4951,"b":4972,"lines":["        /* performEvictions may evict keys, so we need flush pending tracking","         * invalidation keys. If we don't do this, we may get an invalidation","         * message after we perform operation on the key, where in fact this","         * message belongs to the old value of the key before it gets evicted.*/","        trackingHandlePendingKeyInvalidations();","","        /* performEvictions may flush slave output buffers. This may result","         * in a slave, that may be the active client, to be freed. */","        if (server.current_client == NULL) return C_ERR;","","        if (out_of_memory && is_denyoom_command) {","            rejectCommand(c, shared.oomerr);","            return C_OK;","        }","","        /* Save out_of_memory result at command start, otherwise if we check OOM","         * in the first write within script, memory used by lua stack and","         * arguments might interfere. We need to save it for EXEC and module","         * calls too, since these can call EVAL, but avoid saving it during an","         * interrupted / yielding busy script / module. */","        server.pre_command_oom_state = out_of_memory;","    }"]}],"notes":[{"t":"note","k":"n4","lv":"注释","html":"马上冲掉淘汰产生的缓存失效消息；不然它会在本条命令操作这个 key 之后才到，而它其实属于被淘汰前的旧值。","tag":null,"who":null,"more":"提交交代了背景：失效消息平时是攒着的，所以这里必须手动冲一次。","ev":[{"lv":"注释","q":"If we don't do this, we may get an invalidation message after we perform operation on the key, where in fact this message belongs to the old value of the key before it gets evicted.","raw":["src/server.c:4951-4954"],"rh":"<a class=\"ref\" data-k=\"src/server.c:4951-4954\" title=\"src/server.c:4951-4954\">server.c:4951–4954<\/a>"},{"lv":"提交","q":"Tracking invalidation messages were sometimes sent in inconsistent order, before the command's reply rather than after.","raw":["c:fd135f3e2"],"rh":"<a class=\"cm\" data-h=\"fd135f3e2\">fd135f3e2<\/a>"}],"a":4955,"b":4955},{"t":"note","k":"n5","lv":"注释","html":"当前客户端可能已经没了：淘汰循环会冲刷副本缓冲，发来这条命令的可能恰好就是被释放的那个副本。","tag":"反直觉","who":null,"more":"具体是哪条出错路径释放了连接，底稿没有逐行跟，只以注释原话为准。冲刷在 <a class=\"lk\" href=\"#/tick16\">每删 16 个 key 停下来做三件事<\/a>。","ev":[{"lv":"注释","q":"performEvictions may flush slave output buffers. This may result in a slave, that may be the active client, to be freed.","raw":["src/server.c:4957-4958"],"rh":"<a class=\"ref\" data-k=\"src/server.c:4957-4958\" title=\"src/server.c:4957-4958\">server.c:4957–4958<\/a>"}],"a":4959,"b":4959},{"t":"note","k":"n6","lv":"文档","html":"只拒绝会涨内存的命令：自己带 <code>CMD_DENYOOM<\/code>，或是 EXEC 且事务里排了这种命令。读命令照常。","tag":null,"who":null,"more":"<code>is_denyoom_command<\/code> 的定义在 <a class=\"ref\" data-k=\"src/server.c:4854-4855\" title=\"src/server.c:4854-4855\">server.c:4854–4855<\/a>。谁会被拒见 <a class=\"lk\" href=\"#/fail\">EVICT_FAIL 之后<\/a>。","ev":[{"lv":"文档","q":"Redis will start to reply with errors to commands that would use more memory, like SET, LPUSH, and so on, and will continue to reply to read-only commands like GET.","raw":["redis.conf:1242-1245"],"rh":"<a class=\"ref\" data-k=\"redis.conf:1242-1245\" title=\"redis.conf:1242-1245\">redis.conf:1242–1245<\/a>"}],"a":4961,"b":4964},{"t":"note","k":"n7","lv":"注释","html":"把结论存起来给脚本用：等脚本里第一次写时再查，Lua 栈和参数占的内存会干扰判断。脚本怎么用见 <a class=\"lk\" href=\"#/fail\">EVICT_FAIL 之后<\/a>。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"Save out_of_memory result at command start, otherwise if we check OOM in the first write within script, memory used by lua stack and arguments might interfere.","raw":["src/server.c:4966-4970"],"rh":"<a class=\"ref\" data-k=\"src/server.c:4966-4970\" title=\"src/server.c:4966-4970\">server.c:4966–4970<\/a>"}],"a":4971,"b":4971}],"cap":null}],"refs":["src/server.c:4933-4935","src/server.c:4944-4947","src/server.c:4951-4954","src/server.c:4957-4958","src/server.c:4854-4855","redis.conf:1242-1245","src/server.c:4966-4970"],"children":[],"back":["root","trig"]},{"id":"trig.timer","nav":"定时器","title":"触发点二：按需存在的定时器","short":"上一轮没删完时挂在事件循环上，每圈再删一小轮；它的开关还决定返回值。","lead":null,"src":"src/evict.c 第 448–473 行","blocks":[{"t":"code","file":"src/evict.c","parts":[{"a":448,"b":473,"lines":["/* The evictionTimeProc is started when \"maxmemory\" has been breached and"," * could not immediately be resolved.  This will spin the event loop with short"," * eviction cycles until the \"maxmemory\" condition has resolved or there are no"," * more evictable items.  */","static int isEvictionProcRunning = 0;","static int evictionTimeProc(","        struct aeEventLoop *eventLoop, long long id, void *clientData) {","    UNUSED(eventLoop);","    UNUSED(id);","    UNUSED(clientData);","","    if (performEvictions() == EVICT_RUNNING) return 0;  /* keep evicting */","","    /* For EVICT_OK - things are good, no need to keep evicting.","     * For EVICT_FAIL - there is nothing left to evict.  */","    isEvictionProcRunning = 0;","    return AE_NOMORE;","}","","void startEvictionTimeProc(void) {","    if (!isEvictionProcRunning) {","        isEvictionProcRunning = 1;","        aeCreateTimeEvent(server.el, 0,","                evictionTimeProc, NULL, NULL);","    }","}"]}],"notes":[{"t":"note","k":"n1","lv":null,"html":"这个开关不只是调度状态，它还直接决定 <code>performEvictions()<\/code> 的返回值（<a class=\"ref\" data-k=\"src/evict.c:787-787\" title=\"src/evict.c:787\">evict.c:787<\/a>）：「定时器在跑」=「对外宣称还在努力，写命令先放行」。","tag":"易混","who":null,"more":null,"ev":[],"a":452,"b":452},{"t":"note","k":"n2","lv":"注释","html":"回调只做一件事：再调一次 <code>performEvictions()<\/code>。还是 RUNNING 就返回 0，下一圈事件循环再来。","tag":null,"who":null,"more":"延迟是 0 毫秒（<a class=\"ref\" data-k=\"src/evict.c:470-471\" title=\"src/evict.c:470-471\">evict.c:470–471<\/a>）；返回 0 时事件循环按 <a class=\"ref\" data-k=\"src/ae.c:339-340\" title=\"src/ae.c:339-340\">ae.c:339–340<\/a> 把它重新排到「现在」。所以每转一圈事件循环跑一小轮淘汰，中间穿插处理客户端命令。","ev":[{"lv":"注释","q":"This will spin the event loop with short eviction cycles until the … condition has resolved or there are no more evictable items.","raw":["src/evict.c:448-451"],"rh":"<a class=\"ref\" data-k=\"src/evict.c:448-451\" title=\"src/evict.c:448-451\">evict.c:448–451<\/a>"}],"a":459,"b":459},{"t":"note","k":"n3","lv":"注释","html":"只要不是 RUNNING 就停表：OK 是没事了，FAIL 是没东西可删了。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"For EVICT_OK - things are good, no need to keep evicting. For EVICT_FAIL - there is nothing left to evict.","raw":["src/evict.c:461-462"],"rh":"<a class=\"ref\" data-k=\"src/evict.c:461-462\" title=\"src/evict.c:461-462\">evict.c:461–462<\/a>"}],"a":463,"b":464},{"t":"note","k":"n4","lv":null,"html":"已经在跑就不再创建，所以不会挂两个。","tag":null,"who":null,"more":null,"ev":[],"a":468,"b":469}],"cap":null},{"t":"note","k":"n5","lv":null,"html":"挂上它的只有两处：主循环用完时间预算（<a class=\"ref\" data-k=\"src/evict.c:778-778\" title=\"src/evict.c:778\">evict.c:778<\/a>），和 <code>CONFIG SET<\/code> 把 maxmemory 调到比当前用量还低（<a class=\"ref\" data-k=\"src/config.c:3431-3431\" title=\"src/config.c:3431\">config.c:3431<\/a>）。","tag":null,"who":null,"more":null,"ev":[]},{"t":"note","k":"n6","lv":"提交","html":"<code>CONFIG SET maxmemory<\/code> 不当场淘汰，只挂定时器：在一条命令执行中途删 key 并传播 DEL，会把传播顺序搞乱。","tag":"历史","who":null,"more":"提交也承认：命令返回时效果不一定可见；但增量淘汰之后这本来就成立，干脆统一交给定时器。","ev":[{"lv":"提交","q":"We do this to fix one of the propagation bugs about eviction see #9890 and #10014.","raw":["c:2e1979a21"],"rh":"<a class=\"cm\" data-h=\"2e1979a21\">2e1979a21<\/a>"},{"lv":"提交","q":"That could anyway happen since incremental eviction was added in redis 6.2 (see #7653)","raw":["c:2e1979a21"],"rh":"<a class=\"cm\" data-h=\"2e1979a21\">2e1979a21<\/a>"}]}],"refs":["src/evict.c:787-787","src/evict.c:470-471","src/ae.c:339-340","src/evict.c:448-451","src/evict.c:461-462","src/evict.c:778-778","src/config.c:3431-3431"],"children":[],"back":["root","trig"]}],"back":["root"]},{"id":"main","nav":"主函数骨架","title":"performEvictions() 的九个阶段","short":"闸 → 算账 → 循环（选、删、看表）→ 三种出口。每一步都能点下去。","lead":null,"src":"src/evict.c performEvictions()，第 543 行起","blocks":[{"t":"flow","steps":[{"k":"A","title":"安全闸","sub":"<code>isSafeToPerformEvictions()<\/code> 说不行就直接返回","to":"gate","out":[{"lv":"ok","text":"假的 EVICT_OK，连指标都不记"}],"loop":false,"ref":"<a class=\"ref\" data-k=\"src/evict.c:546-546\" title=\"src/evict.c:546\">evict.c:546<\/a>"},{"k":"B","title":"算账","sub":"<code>getMaxmemoryState<\/code> 说没超就结束","to":"acct","out":[{"lv":"ok","text":"EVICT_OK"}],"loop":false,"ref":"<a class=\"ref\" data-k=\"src/evict.c:556-559\" title=\"src/evict.c:556-559\">evict.c:556–559<\/a>"},{"k":"C","title":"策略禁止","sub":"策略是 <code>MAXMEMORY_NO_EVICTION<\/code> 就不删","to":"policy","out":[{"lv":"fail","text":"EVICT_FAIL"}],"loop":false,"ref":"<a class=\"ref\" data-k=\"src/evict.c:561-564\" title=\"src/evict.c:561-564\">evict.c:561–564<\/a>"},{"k":"D","title":"起表","sub":"算出本轮时间预算、开始计时；断言传播队列为空","to":"budget","out":[],"loop":false,"ref":"<a class=\"ref\" data-k=\"src/evict.c:566-576\" title=\"src/evict.c:566-576\">evict.c:566–576<\/a>"},{"k":"E","title":"主循环：选一个 key","sub":"循环条件 <code>mem_freed &lt; mem_tofree<\/code>","to":"pick","out":[],"loop":true,"ref":"<a class=\"ref\" data-k=\"src/evict.c:579-579\" title=\"src/evict.c:579\">evict.c:579<\/a>"},{"k":"E′","title":"删掉、记账；每 16 个看一次表","sub":null,"to":"pace","out":[{"lv":"run","text":"预算用完 → 挂定时器"},{"lv":"fail","text":"选不出 key → cant_free"}],"loop":true,"ref":null},{"k":"F","title":"正常出口","sub":"按 <code>isEvictionProcRunning<\/code> 决定返回值","to":"ret","out":[{"lv":"run","text":"EVICT_RUNNING"},{"lv":"ok","text":"EVICT_OK"}],"loop":false,"ref":"<a class=\"ref\" data-k=\"src/evict.c:787-787\" title=\"src/evict.c:787\">evict.c:787<\/a>"},{"k":"G","title":"无物可删","sub":"标签 <code>cant_free<\/code>：result 仍是 FAIL 才等一等后台释放线程","to":"exit","out":[],"loop":false,"ref":"<a class=\"ref\" data-k=\"src/evict.c:789-806\" title=\"src/evict.c:789-806\">evict.c:789–806<\/a>"},{"k":"H","title":"BLESS 宽限","sub":"被保护的 key 挡住时，1.25 倍以内放行","to":"exit","out":[],"loop":false,"ref":"<a class=\"ref\" data-k=\"src/evict.c:813-818\" title=\"src/evict.c:813-818\">evict.c:813–818<\/a>"},{"k":"I","title":"记指标","sub":"标签 <code>update_metrics<\/code>：累计「超限持续了多久」，然后返回 result","to":"exit","out":[],"loop":false,"ref":"<a class=\"ref\" data-k=\"src/evict.c:823-833\" title=\"src/evict.c:823-833\">evict.c:823–833<\/a>"}],"cap":"九个阶段 A–I；E 拆成两行只为各自下钻。"},{"t":"h","text":"主循环的三种离开方式"},{"t":"table","head":["怎么离开","在哪","结果"],"rows":[["删够了","循环条件不再成立","落到第 787 行，由 <code>isEvictionProcRunning<\/code> 定返回值"],["中途 break","后台释放已让内存达标 <a class=\"ref\" data-k=\"src/evict.c:767-771\" title=\"src/evict.c:767-771\">evict.c:767–771<\/a>，或时间预算用完 <a class=\"ref\" data-k=\"src/evict.c:776-779\" title=\"src/evict.c:776-779\">evict.c:776–779<\/a>","同样落到第 787 行"],["选不出 key","<code>goto cant_free<\/code> <a class=\"ref\" data-k=\"src/evict.c:782-784\" title=\"src/evict.c:782-784\">evict.c:782–784<\/a>","跳过第 787 行，result 保持初值 FAIL"]],"cap":"代码见 <a class=\"lk\" href=\"#/main.skel\">骨架代码<\/a>。"}],"refs":["src/evict.c:546-546","src/evict.c:556-559","src/evict.c:561-564","src/evict.c:566-576","src/evict.c:579-579","src/evict.c:787-787","src/evict.c:789-806","src/evict.c:813-818","src/evict.c:823-833","src/evict.c:767-771","src/evict.c:776-779","src/evict.c:782-784"],"children":[{"id":"main.skel","nav":"骨架代码","title":"骨架代码：几处容易看错","short":"函数头注释写明了目标；<code>result<\/code> 初值就是失败；<code>cant_free<\/code> 不是失败专用。","lead":null,"src":"src/evict.c performEvictions() 第 519–790 行（节选）","blocks":[{"t":"code","file":"src/evict.c","parts":[{"a":519,"b":546,"lines":["/* Check that memory usage is within the current \"maxmemory\" limit.  If over"," * \"maxmemory\", attempt to free memory by evicting data (if it's safe to do so)."," *"," * It's possible for Redis to suddenly be significantly over the \"maxmemory\""," * setting.  This can happen if there is a large allocation (like a hash table"," * resize) or even if the \"maxmemory\" setting is manually adjusted.  Because of"," * this, it's important to evict for a managed period of time - otherwise Redis"," * would become unresponsive while evicting."," *"," * The goal of this function is to improve the memory situation - not to"," * immediately resolve it.  In the case that some items have been evicted but"," * the \"maxmemory\" limit has not been achieved, an aeTimeProc will be started"," * which will continue to evict items until memory limits are achieved or"," * nothing more is evictable."," *"," * This should be called before execution of commands.  If EVICT_FAIL is"," * returned, commands which will result in increased memory usage should be"," * rejected."," *"," * Returns:"," *   EVICT_OK       - memory is OK or it's not possible to perform evictions now"," *   EVICT_RUNNING  - memory is over the limit, but eviction is still processing"," *   EVICT_FAIL     - memory is over the limit, and there's nothing to evict"," * */","int performEvictions(void) {","    /* Note, we don't goto update_metrics here because this check skips eviction","     * as if it wasn't triggered. it's a fake EVICT_OK. */","    if (!isSafeToPerformEvictions()) return EVICT_OK;"]}],"notes":[{"t":"note","k":"n1","lv":"注释","html":"内存可能突然超出很多（大块分配如哈希表扩容，或上限被手动调低），所以淘汰必须限时，否则服务器会卡住。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"it's important to evict for a managed period of time - otherwise Redis would become unresponsive while evicting.","raw":["src/evict.c:522-526"],"rh":"<a class=\"ref\" data-k=\"src/evict.c:522-526\" title=\"src/evict.c:522-526\">evict.c:522–526<\/a>"}],"a":522,"b":526},{"t":"note","k":"n2","lv":"注释","html":"目标是「改善」内存状况，不是立刻解决：删了一些但还没达标，就挂定时器接着删。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"The goal of this function is to improve the memory situation - not to immediately resolve it.","raw":["src/evict.c:528-532"],"rh":"<a class=\"ref\" data-k=\"src/evict.c:528-532\" title=\"src/evict.c:528-532\">evict.c:528–532<\/a>"}],"a":528,"b":532},{"t":"note","k":"n3","lv":"注释","html":"契约：返回 <code>EVICT_FAIL<\/code> 才该拒绝会涨内存的命令。这里没有提 RUNNING。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"If EVICT_FAIL is returned, commands which will result in increased memory usage should be rejected.","raw":["src/evict.c:534-536"],"rh":"<a class=\"ref\" data-k=\"src/evict.c:534-536\" title=\"src/evict.c:534-536\">evict.c:534–536<\/a>"}],"a":534,"b":536}],"cap":"函数头注释：作者自己写的设计目标。"},{"t":"code","file":"src/evict.c","parts":[{"a":553,"b":553,"lines":["    int result = EVICT_FAIL;"]},{"a":575,"b":579,"lines":["    /* Try to smoke-out bugs (server.also_propagate should be empty here) */","    serverAssert(server.also_propagate.numops == 0);","    /* Evictions are performed on random keys that have nothing to do with the current command slot. */","","    while (mem_freed < (long long)mem_tofree) {"]},{"a":782,"b":790,"lines":["        } else {","            goto cant_free; /* nothing to free... */","        }","    }","    /* at this point, the memory is OK, or we have reached the time limit */","    result = (isEvictionProcRunning) ? EVICT_RUNNING : EVICT_OK;","","cant_free:","    if (result == EVICT_FAIL) {"]}],"notes":[{"t":"note","k":"n4","lv":null,"html":"<code>result<\/code> 的初值就是失败。「失败」不是某处显式赋的，而是没有任何成功路径改写过它；<code>goto cant_free<\/code>（第 782–784 行）正是靠这个初值表达「没东西可删」。","tag":"隐含前提","who":null,"more":null,"ev":[],"a":553,"b":553},{"t":"note","k":"n5","lv":"注释","html":"进循环前断言传播队列为空：淘汰只该发生在两条命令之间，队列里还有东西说明别处有 bug，宁可崩也不悄悄绕过。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"Try to smoke-out bugs (server.also_propagate should be empty here)","raw":["src/evict.c:575-576"],"rh":"<a class=\"ref\" data-k=\"src/evict.c:575-576\" title=\"src/evict.c:575-576\">evict.c:575–576<\/a>"},{"lv":"提交","q":"Keep that condition may hide bugs (i.e. performEvictions should always expect to have an empty server.also_propagate)","raw":["c:8ad0cfa56"],"rh":"<a class=\"cm\" data-h=\"8ad0cfa56\">8ad0cfa56<\/a>"}],"a":575,"b":576},{"t":"note","k":"n6","lv":null,"html":"正常出口：定时器在跑就返回 RUNNING，否则 OK。删够了和中途 break 都落到这一行。","tag":null,"who":null,"more":null,"ev":[],"a":787,"b":787},{"t":"note","k":"n7","lv":null,"html":"<code>cant_free<\/code> 名字像「失败专用」，其实是所有进过主循环的路径的公共收尾：标签不是函数，第 787 行执行完会自然流进来，只是 <code>result == EVICT_FAIL<\/code> 不成立，里面的等待不执行。","tag":"易混","who":null,"more":null,"ev":[],"a":789,"b":790}],"cap":"三段节选：初值、进循环前的断言、循环之后。"}],"refs":["src/evict.c:522-526","src/evict.c:528-532","src/evict.c:534-536","src/evict.c:575-576"],"children":[],"back":["main","ret"]},{"id":"gate","nav":"安全闸","title":"安全闸：什么时候干脆不淘汰","short":"五种情况下即使超限也不删 key，而且对外假装没事。","lead":"<code>performEvictions()<\/code> 的第一行：先问「现在删 key 安全吗」。输入是服务器当前状态，结果只有两种。","src":"src/evict.c performEvictions() 546 → isSafeToPerformEvictions() 479","blocks":[{"t":"table","head":["结果","发生什么"],"rows":[["不安全","立刻返回 <code>EVICT_OK<\/code>：不删 key、不算账、不记指标 → <a class=\"lk\" href=\"#/gate.fakeok\">假的 OK<\/a>"],["安全","往下走 → <a class=\"lk\" href=\"#/acct\">算账<\/a>"]],"cap":null},{"t":"p","html":"不安全的五种情况（任一成立）：超时长命令重入 · 正在加载数据 · 副本忽略 maxmemory · slot 迁移导入通道 · 淘汰被暂停。逐条看 <a class=\"lk\" href=\"#/gate.five\">五个条件<\/a>。"}],"refs":[],"children":[{"id":"gate.five","nav":"五个条件","title":"五个条件，任一成立就不淘汰","short":"<code>isSafeToPerformEvictions()<\/code> 只有 21 行，每个 <code>return 0<\/code> 各有各的理由。","lead":"返回 0 = 不安全。逐个看每个 <code>return 0<\/code> 凭什么。","src":"src/evict.c isSafeToPerformEvictions() 479–499","blocks":[{"t":"code","file":"src/evict.c","parts":[{"a":479,"b":486,"lines":["static int isSafeToPerformEvictions(void) {","    /* - There must be no script in timeout condition.","     * - Nor we are loading data right now.  */","    if (isInsideYieldingLongCommand() || server.loading) return 0;","","    /* By default replicas should ignore maxmemory","     * and just be masters exact copies. */","    if (server.masterhost && server.repl_slave_ignore_maxmemory) return 0;"]}],"notes":[{"t":"note","k":"n1","lv":"注释","html":"正在一个超时的长命令里重入事件循环时不删。命令入口其实已经判过一次 → <a class=\"lk\" href=\"#/gate.twice\">长命令判两次<\/a>","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"There must be no script in timeout condition.","raw":["src/evict.c:480-481"],"rh":"<a class=\"ref\" data-k=\"src/evict.c:480-481\" title=\"src/evict.c:480-481\">evict.c:480–481<\/a>"},{"lv":"提交","q":"Avoid eviction during yield command processing.","raw":["c:b2061de2e"],"rh":"<a class=\"cm\" data-h=\"b2061de2e\">b2061de2e<\/a>"}],"a":482,"b":482},{"t":"note","k":"n2","lv":"提交","html":"正在加载数据时不删：加载 AOF 途中淘汰会破坏数据一致性。","tag":null,"who":null,"more":null,"ev":[{"lv":"提交","q":"if we are loading AOF it's dangerous, because processCommand would call freeMemoryIfNeeded to evict, and that will break data consistency, see issue #5686.","raw":["c:b9cd89d10"],"rh":"<a class=\"cm\" data-h=\"b9cd89d10\">b9cd89d10<\/a>"}],"a":482,"b":482},{"t":"note","k":"n3","lv":"注释","html":"副本默认不自己删，只做主库的精确副本。谁来删、为什么 → <a class=\"lk\" href=\"#/gate.replica\">副本不自己删<\/a>","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"By default replicas should ignore maxmemory and just be masters exact copies.","raw":["src/evict.c:484-485"],"rh":"<a class=\"ref\" data-k=\"src/evict.c:484-485\" title=\"src/evict.c:484-485\">evict.c:484–485<\/a>"}],"a":486,"b":486}],"cap":null},{"t":"code","file":"src/evict.c","parts":[{"a":488,"b":499,"lines":["    /* Disable eviction during slot migration import to avoid delays and errors","     * caused by failed evictions. A special client is created for data import,","     * identified by the CLIENT_MASTER and CLIENT_ASM_IMPORTING flags. */","    if (server.current_client && server.current_client->flags & CLIENT_MASTER &&","        server.current_client->flags & CLIENT_ASM_IMPORTING)","        return 0;","","    /* If 'evict' action is paused, for whatever reason, then return false */","    if (isPausedActionsWithUpdate(PAUSE_ACTION_EVICT)) return 0;","","    return 1;","}"]}],"notes":[{"t":"note","k":"n4","lv":"注释","html":"当前客户端是 slot 迁移的导入通道时不删：避免淘汰失败带来的延迟和错误。","tag":null,"who":null,"more":"导入通道是一个专用客户端，同时带 <code>CLIENT_MASTER<\/code> 和 <code>CLIENT_ASM_IMPORTING<\/code> 两个标志。","ev":[{"lv":"注释","q":"Disable eviction during slot migration import to avoid delays and errors caused by failed evictions.","raw":["src/evict.c:488-490"],"rh":"<a class=\"ref\" data-k=\"src/evict.c:488-490\" title=\"src/evict.c:488-490\">evict.c:488–490<\/a>"}],"a":491,"b":493},{"t":"note","k":"n5","lv":"提交","html":"淘汰动作被暂停时不删（例如 CLIENT PAUSE、故障切换期间）。提交只有这句标题，理由没查到 → <a class=\"lk\" href=\"#/unknown\">没查到为什么<\/a>","tag":null,"who":null,"more":"提交正文只指向一个底稿作者读不到的 issue。","ev":[{"lv":"提交","q":"Prevent expirations and evictions while paused","raw":["c:a3e53cf9b"],"rh":"<a class=\"cm\" data-h=\"a3e53cf9b\">a3e53cf9b<\/a>"}],"a":496,"b":496}],"cap":null}],"refs":["src/evict.c:480-481","src/evict.c:484-485","src/evict.c:488-490"],"children":[],"back":["gate"]},{"id":"gate.replica","nav":"副本不自己删","title":"副本为什么不自己淘汰","short":"淘汰只在主库做，副本等主库发来的 DEL。Redis 5 起的默认行为，一次有意的不兼容变更。","lead":"第三个条件（<a class=\"ref\" data-k=\"src/evict.c:486-486\" title=\"src/evict.c:486\">evict.c:486<\/a>）背后是配置项 <code>replica-ignore-maxmemory<\/code>，默认开（<a class=\"ref\" data-k=\"src/config.c:4228-4228\" title=\"src/config.c:4228\">config.c:4228<\/a>）。","src":"redis.conf 1321–1330","blocks":[{"t":"code","file":"redis.conf","parts":[{"a":1321,"b":1330,"lines":["# Starting from Redis 5, by default a replica will ignore its maxmemory setting","# (unless it is promoted to master after a failover or manually). It means","# that the eviction of keys will be just handled by the master, sending the","# DEL commands to the replica as keys evict in the master side.","#","# This behavior ensures that masters and replicas stay consistent, and is usually","# what you want, however if your replica is writable, or you want the replica","# to have a different memory setting, and you are sure all the writes performed","# to the replica are idempotent, then you may change this default (but be sure","# to understand what you are doing)."]}],"notes":[{"t":"note","k":"n1","lv":"文档","html":"淘汰只由主库做：主库删了 key，把 DEL 发给副本。","tag":null,"who":null,"more":null,"ev":[{"lv":"文档","q":"It means that the eviction of keys will be just handled by the master, sending the DEL commands to the replica as keys evict in the master side.","raw":["redis.conf:1321-1324"],"rh":"<a class=\"ref\" data-k=\"redis.conf:1321-1324\" title=\"redis.conf:1321-1324\">redis.conf:1321–1324<\/a>"}],"a":1321,"b":1324},{"t":"note","k":"n2","lv":"文档","html":"这样主从保持一致，通常正是你想要的。","tag":null,"who":null,"more":null,"ev":[{"lv":"文档","q":"This behavior ensures that masters and replicas stay consistent, and is usually what you want","raw":["redis.conf:1326-1330"],"rh":"<a class=\"ref\" data-k=\"redis.conf:1326-1330\" title=\"redis.conf:1326-1330\">redis.conf:1326–1330<\/a>"}],"a":1326,"b":1330}],"cap":null},{"t":"note","k":"n3","lv":"提交","html":"有意的不兼容变更：从此副本默认照抄主库，不再自己淘汰。","tag":"历史","who":null,"more":null,"ev":[{"lv":"提交","q":"Note: this breaks backward compatibility with Redis 4, since now slaves by default are exact copies of masters and do not try to evict keys independently.","raw":["c:067647a78"],"rh":"<a class=\"cm\" data-h=\"067647a78\">067647a78<\/a>"}]}],"refs":["src/evict.c:486-486","src/config.c:4228-4228","redis.conf:1321-1324","redis.conf:1326-1330"],"children":[],"back":["gate.five"]},{"id":"gate.twice","nav":"长命令判两次","title":"长命令这个条件为什么判两次","short":"命令入口判过 <code>isInsideYieldingLongCommand()<\/code>，闸里又判一次。看着重复，其实有第二个调用者。","lead":"命令入口已经判过一次，闸里（<a class=\"ref\" data-k=\"src/evict.c:482-482\" title=\"src/evict.c:482\">evict.c:482<\/a>）又判一次。重复吗？","src":"src/server.c 4948 · src/evict.c 459","blocks":[{"t":"code","file":"src/server.c","parts":[{"a":4942,"b":4949,"lines":["    /* Handle the maxmemory directive.","     *","     * Note that we do not want to reclaim memory if we are here re-entering","     * the event loop since there is a busy Lua script running in timeout","     * condition, to avoid mixing the propagation of scripts with the","     * propagation of DELs due to eviction. */","    if (server.maxmemory && !isInsideYieldingLongCommand()) {","        int out_of_memory = (performEvictions() == EVICT_FAIL);"]}],"notes":[{"t":"note","k":"n1","lv":"注释","html":"入口处的注释给了理由：避免脚本的传播和淘汰产生的 DEL 的传播混在一起。","tag":null,"who":"me","more":null,"ev":[{"lv":"注释","q":"to avoid mixing the propagation of scripts with the propagation of DELs due to eviction.","raw":["src/server.c:4944-4947"],"rh":"<a class=\"ref\" data-k=\"src/server.c:4944-4947\" title=\"src/server.c:4944-4947\">server.c:4944–4947<\/a>"}],"a":4944,"b":4947},{"t":"note","k":"n2","lv":null,"html":"第一次：长命令重入时，入口根本不调 <code>performEvictions()<\/code>。","tag":null,"who":null,"more":null,"ev":[],"a":4948,"b":4948}],"cap":"调用者一：命令入口"},{"t":"code","file":"src/evict.c","parts":[{"a":448,"b":459,"lines":["/* The evictionTimeProc is started when \"maxmemory\" has been breached and"," * could not immediately be resolved.  This will spin the event loop with short"," * eviction cycles until the \"maxmemory\" condition has resolved or there are no"," * more evictable items.  */","static int isEvictionProcRunning = 0;","static int evictionTimeProc(","        struct aeEventLoop *eventLoop, long long id, void *clientData) {","    UNUSED(eventLoop);","    UNUSED(id);","    UNUSED(clientData);","","    if (performEvictions() == EVICT_RUNNING) return 0;  /* keep evicting */"]}],"notes":[{"t":"note","k":"n3","lv":"推断","html":"不是冗余：定时器回调这条路不经过命令入口，所以闸必须装在函数内部；入口那次只是提前短路。","tag":"隐含前提","who":null,"more":"依据是两个调用点的位置，没有注释直接这么说。","ev":[],"a":459,"b":459}],"cap":"调用者二：定时器回调"}],"refs":["src/evict.c:482-482","src/server.c:4944-4947"],"children":[],"back":["gate.five"]},{"id":"gate.fakeok","nav":"假的 OK","title":"不安全时回 OK，而且不记指标","short":"超限了却不删，为什么对外说「没事」而不是「失败」？为什么连指标都不记？","lead":null,"src":"src/evict.c performEvictions() 543–546","blocks":[{"t":"code","file":"src/evict.c","parts":[{"a":543,"b":546,"lines":["int performEvictions(void) {","    /* Note, we don't goto update_metrics here because this check skips eviction","     * as if it wasn't triggered. it's a fake EVICT_OK. */","    if (!isSafeToPerformEvictions()) return EVICT_OK;"]}],"notes":[{"t":"note","k":"n1","lv":"注释","html":"注释自己叫它「假的 OK」：当作淘汰根本没触发，所以直接 return，不去 <code>update_metrics<\/code>，指标也不记。","tag":"易混","who":null,"more":null,"ev":[{"lv":"注释","q":"we don't goto update_metrics here because this check skips eviction as if it wasn't triggered. it's a fake EVICT_OK.","raw":["src/evict.c:544-545"],"rh":"<a class=\"ref\" data-k=\"src/evict.c:544-545\" title=\"src/evict.c:544-545\">evict.c:544–545<\/a>"}],"a":544,"b":545},{"t":"note","k":"n2","lv":"提交","html":"回 OK 而不是 FAIL：回 FAIL 可能挡住写命令。提交自己也说实践中可能没区别，只是概念上更对。","tag":null,"who":null,"more":"这条提交说的只是「客户端被暂停」那一种情况。","ev":[{"lv":"提交","q":"It looks safer to return C_OK from freeMemoryIfNeeded() when clients are paused because returning C_ERR may prevent success of writes. It is possible that there is no difference in practice since clients cannot execute writes while clients are paused, but it looks more correct this way, at least conceptually.","raw":["c:c9097393b"],"rh":"<a class=\"cm\" data-h=\"c9097393b\">c9097393b<\/a>"}],"a":546,"b":546},{"t":"note","k":"n3","lv":"推断","html":"其余几种同理：回 FAIL 的唯一后果是拒绝写命令（<a class=\"lk\" href=\"#/fail\">EVICT_FAIL 之后<\/a>）；而在加载 AOF、或副本回放主库命令时拒绝写入，会直接破坏数据一致性。","tag":null,"who":null,"more":null,"ev":[],"a":546,"b":546}],"cap":null}],"refs":["src/evict.c:544-545"],"children":[],"back":["gate"]}],"back":["main","ret","why"]},{"id":"acct","nav":"算账","title":"算账：到底超了多少","short":"「已用内存」不是直接拿分配器的数字：先扣掉一笔缓冲，再和上限比。","lead":"输入：分配器的数字和 <code>maxmemory<\/code>。输出：没超（C_OK），或超了（C_ERR）外加要腾出的字节数 <code>mem_tofree<\/code>。","src":"src/evict.c performEvictions() 556 → getMaxmemoryState() 395","blocks":[{"t":"bar","segs":[{"w":10,"label":"其余已分配内存（主要是数据）","kind":"in","tag":"计入"},{"w":3,"label":"复制缓冲：backlog 以内","kind":"in","tag":"计入"},{"w":2,"label":"复制缓冲：超出 backlog 的部分","kind":"out","tag":"扣掉"},{"w":1,"label":"slot 迁移输出缓冲","kind":"out","tag":"扣掉"},{"w":1,"label":"AOF 缓冲","kind":"out","tag":"扣掉"}],"cap":"整条 = 分配器报的 <code>mem_reported<\/code>；实心部分 = 拿去和 <code>maxmemory<\/code> 比的 <code>mem_used<\/code>。宽度只是示意，不是真实比例。"},{"t":"flow","steps":[{"k":"1","title":"取分配器的数字","sub":"<code>mem_reported<\/code>","to":null,"out":[],"loop":false,"ref":"<a class=\"ref\" data-k=\"src/evict.c:400-400\" title=\"src/evict.c:400\">evict.c:400<\/a>"},{"k":"2","title":"没设 <code>maxmemory<\/code>？","sub":null,"to":null,"out":[{"lv":"ok","text":"是 → C_OK"}],"loop":false,"ref":"<a class=\"ref\" data-k=\"src/evict.c:404-407\" title=\"src/evict.c:404-407\">evict.c:404–407<\/a>"},{"k":"3","title":"原始数字就没超？","sub":"快路径","to":null,"out":[{"lv":"ok","text":"是 → C_OK"}],"loop":false,"ref":"<a class=\"ref\" data-k=\"src/evict.c:408-408\" title=\"src/evict.c:408\">evict.c:408<\/a>"},{"k":"4","title":"扣掉不计入的缓冲","sub":"得到 <code>mem_used<\/code>","to":"acct.deduct","out":[],"loop":false,"ref":"<a class=\"ref\ ,"ev":[],"a":400,"b":400},{"t":"note","k":"n2","lv":"提交","html":"没设上限就直接走。这个判断是后来特意提到「算缓冲」之前的。","tag":"历史","who":null,"more":null,"ev":[{"lv":"提交","q":"when server.maxmemory is not set, don't count AOF and replicas buffers.","raw":["c:f0fab99d6"],"rh":"<a class=\"cm\" data-h=\"f0fab99d6\">f0fab99d6<\/a>"}],"a":404,"b":407},{"t":"note","k":"n3","lv":"注释","html":"快路径：连原始数字都没超，就不必再算要扣多少。","tag":null,"who":null,"more":"底稿作者补充（不是注释原话）：这是每条命令都要走的路径，所以值得省。","ev":[{"lv":"注释","q":"If we are not, no need to subtract the slaves output buffers. We can just return ASAP.","raw":["src/evict.c:398-399"],"rh":"<a class=\"ref\" data-k=\"src/evict.c:398-399\" title=\"src/evict.c:398-399\">evict.c:398–399<\/a>"}],"a":408,"b":408}],"cap":"上半：能早走就早走"},{"t":"code","file":"src/evict.c","parts":[{"a":410,"b":431,"lines":["    /* Remove the size of slaves output buffers and AOF buffer from the","     * count of used memory. */","    mem_used = mem_reported;","    size_t overhead = freeMemoryGetNotCountedMemory();","    mem_used = (mem_used > overhead) ? mem_used-overhead : 0;","","    /* Compute the ratio of memory usage. */","    if (level) *level = (float)mem_used / (float)server.maxmemory;","","    if (mem_reported <= server.maxmemory) return C_OK;","","    /* Check if we are still over the memory limit. */","    if (mem_used <= server.maxmemory) return C_OK;","","    /* Compute how much memory we need to free. */","    mem_tofree = mem_used - server.maxmemory;","","    if (logical) *logical = mem_used;","    if (tofree) *tofree = mem_tofree;","","    return C_ERR;","}"]}],"notes":[{"t":"note","k":"n4","lv":"推断","html":"三目运算是防无符号下溢：两个量都是 <code>size_t<\/code>，缓冲比总量还大的瞬间直接相减会变成天文数字。","tag":null,"who":null,"more":null,"ev":[],"a":414,"b":414},{"t":"note","k":"n5","lv":"推断","html":"看着和 408 行重复：调用者要 <code>level<\/code> 时 408 行不会提前返回，算完比例后在这里补上同一个判断。","tag":"易混","who":"me","more":null,"ev":[],"a":419,"b":419},{"t":"note","k":"n6","lv":null,"html":"再比一次：扣完以后不超，也算没事。","tag":null,"who":null,"more" t them, we need to evict more keys, and then generate more DELs, maybe cause massive eviction loop, even all keys are evicted.","raw":["src/evict.c:321-328"],"rh":"<a class=\"ref\" data-k=\"src/evict.c:321-328\" title=\"src/evict.c:321-328\">evict.c:321–328<\/a>"},{"lv":"文档","q":"network problems / resyncs will not trigger a loop where keys are evicted, and in turn the output buffer of replicas is full with DELs of keys evicted triggering the deletion of more keys, and so forth until the database is completely emptied.","raw":["redis.conf:1250-1255"],"rh":"<a class=\"ref\" data-k=\"redis.conf:1250-1255\" title=\"redis.conf:1250-1255\">redis.conf:1250–1255<\/a>"},{"lv":"测试","q":"replica buffer don't induce eviction","raw":["tests/unit/maxmemory.tcl:422-422"],"rh":"<a class=\"ref\" data-k=\"tests/unit/maxmemory.tcl:422-422\" title=\"tests/unit/maxmemory.tcl:422\">maxmemory.tcl:422<\/a>"}],"a":323,"b":326}],"cap":null},{"t":"note","k":"n2","lv":"提交","html":"这条规则很老（2012 年），而且作者坦白是试出来的。","tag":"历史","who":null,"more":null,"ev":[{"lv":"提交","q":"This three changes are the result of many tests, I found (partially empirically) that is the best way to address the problem, but maybe we'll find better solutions in the future.","raw":["c:f6b32c14f"],"rh":"<a class=\"cm\" data-h=\"f6b32c14f\">f6b32c14f<\/a>"}]},{"t":"note","k":"n3","lv":"文档","html":"被扣掉的缓冲是真实占着内存的：挂了副本，就该把 <code>maxmemory<\/code> 设低一点，给副本输出缓冲留出 RAM。","tag":"后果","who":null,"more":"被扣掉的量可以在 INFO 里看到：<code>mem_not_counted_for_evict<\/code>（<a class=\"ref\" data-k=\"src/server.c:6965-6965\" title=\"src/server.c:6965\">server.c:6965<\/a>）。","ev":[{"lv":"文档","q":"if you have replicas attached it is suggested that you set a lower limit for maxmemory so that there is some free RAM on the system for replica output buffers","raw":["redis.conf:1257-1259"],"rh":"<a class=\"ref\" data-k=\"redis.conf:1257-1259\" title=\"redis.conf:1257-1259\">redis.conf:1257–1259<\/a>"}]}],"refs":["src/evict.c:347-358","src/evict.c:360-363","sr 46},{"t":"note","k":"n2","lv":"注释","html":"抓至多 <code>maxmemory_samples<\/code> 个 key。为了快，不保证抓满，也不保证不重复。","tag":null,"who":null,"more":"最终落到 <a class=\"ref\" data-k=\"src/dict.c:1347-1347\" title=\"src/dict.c:1347\">dict.c:1347<\/a> 的 <code>dictGetSomeKeys<\/code>。底稿的判断：这对淘汰够用，抽样本来就是近似。","ev":[{"lv":"注释","q":"It does not guarantee to return all the keys specified in 'count', nor it does guarantee to return non-duplicated elements","raw":["src/dict.c:1325-1346"],"rh":"<a class=\"ref\" data-k=\"src/dict.c:1325-1346\" title=\"src/dict.c:1325-1346\">dict.c:1325–1346<\/a>"}],"a":148,"b":148},{"t":"note","k":"n3","lv":null,"html":"受保护（<a class=\"lk\" href=\"#/bless\">BLESS 过<\/a>）的 key 跳过，也不计入 <code>*candidates<\/code>。这是入池这一道；出池还有一道，见 <a class=\"lk\" href=\"#/loop.ghost\">幽灵与受保护<\/a>。","tag":null,"who":null,"more":null,"ev":[],"a":156,"b":158}],"cap":null},{"t":"code","file":"src/evict.c","parts":[{"a":90,"b":94,"lines":["/* During atomic slot migration, keys that are being imported are in an"," * intermediate state. We cannot evict them and therefore skip them. */","static int randomEvictionShouldSkipDictIndex(int didx) {","    return !clusterCanAccessKeysInSlot(didx);","}"]}],"notes":[{"t":"note","k":"n4","lv":"注释","html":"正在导入的 slot 整个跳过：里面的 key 处于中间状态，不能淘汰。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"keys that are being imported are in an intermediate state. We cannot evict them and therefore skip them.","raw":["src/evict.c:90-91"],"rh":"<a class=\"ref\" data-k=\"src/evict.c:90-91\" title=\"src/evict.c:90-91\">evict.c:90–91<\/a>"}],"a":90,"b":91}],"cap":"上面第 146 行传进去的回调。"}],"refs":["src/kvstore.c:421-422","src/kvstore.c:400-417","src/dict.c:1347-1347","src/dict.c:1325-1346","src/evict.c:90-91"],"children":[],"back":["pool.populate"]},{"id":"pool.populate.score","nav":"打分","title":"打分：三种算法，统一成「越大越该删」","short":"空闲时间、访问频率、过期时间都换算成同一个分数，池只管排序。","lead":null,"src":"src/evict.c 第 160–179 行","blocks":[{"t":"code","file":"src/evict.c","parts":[{"a":160,"b":179,"lines":["        /* Calculate the idle time according to the policy. This is called","         * idle just because the code initially handled LRU, but is in fact","         * just a score where a higher score means better candidate. */","        if (server.maxmemory_policy & (MAXMEMORY_FLAG_LRU|MAXMEMORY_FLAG_LRM)) {","            idle = estimateObjectIdleTime(kv);","        } else if (server.maxmemory_policy & MAXMEMORY_FLAG_LFU) {","            /* When we use an LRU policy, we sort the keys by idle time","             * so that we expire keys starting from greater idle time.","             * However when the policy is an LFU one, we have a frequency","             * estimation, and we want to evict keys with lower frequency","             * first. So inside the pool we put objects using the inverted","             * frequency subtracting the actual frequency to the maximum","             * frequency of 255. */","            idle = 255-LFUDecrAndReturn(kv);","        } else if (server.maxmemory_policy == MAXMEMORY_VOLATILE_TTL) {","            /* In this case the sooner the expire the better. */","            idle = ULLONG_MAX - kvobjGetExpire(kv);","        } else {","            serverPanic(\"Unknown eviction policy in evictionPoolPopulate()\");","        }"]}],"notes":[{"t":"note","k":"n1","lv":"注释","html":"变量还叫 <code>idle<\/code>，其实是统一的淘汰分：越大越该删。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"just a score where a higher score means better candidate","raw":["src/evict.c:160-162"],"rh":"<a class=\"ref\" data-k=\"src/evict.c:160-162\" title=\"src/evict.c:160-162\">evict.c:160–162<\/a>"}],"a":160,"b":162},{"t":"note","k":"n2","lv":null,"html":"LRU、LRM：分数 = 空闲毫秒数。时钟从哪来见 <a class=\"lk\" href=\"#/clock\">对象头里的 24 位<\/a>。","tag":null,"who":null,"more":null,"ev":[],"a":163,"b":164},{"t":"note","k":"n3","lv":null,"html":"LFU：访问越少分越高，所以用 255 减去频率。","tag":null,"who":null,"more":null,"ev":[],"a":173,"b":173},{"t":"note","k":"n4","lv":null,"html":"volatile-ttl：过期越早分越高，所以用最大值减去过期时间。","tag":null,"who":null,"more":null,"ev":[],"a":174,"b":176}],"cap":null},{"t":"note","k":"n5","lv":"提交","html":"为什么要统一成一个分数：把 volatile-ttl 也接进池以后，淘汰更准，而且大多数策略共用一条代码路径。","tag":null,"who":null,"more":null,"ev":[{"lv":"提交","q":"Precision of the eviction improved sensibly. Also this allows us to have a single code path for most eviction types.","raw":["c:2d5eb1f1a"],"rh":"<a class=\"cm\" data-h=\"2d5eb1f1a\">2d5eb1f1a<\/a>"}]},{"t":"p","html":"这几个策略位怎么判断，见 <a class=\"lk\" href=\"#/policy\">策略位标志<\/a>。"}],"refs":["src/evict.c:160-162"],"children":[],"back":["pool.populate"]},{"id":"pool.populate.place","nav":"找位置","title":"找位置：直接放、右移、挤掉最左，或者丢弃","short":"四种情况，两次 memmove；memmove 前后存取 <code>cached<\/code> 的那两行最容易看不懂。","lead":"先看 <a class=\"lk\" href=\"#/pool.demo\">逐帧演示<\/a> 的动画，再对着代码看每种情况落在哪几行。","src":"src/evict.c 第 181–216 行","blocks":[{"t":"code","file":"src/evict.c","parts":[{"a":181,"b":193,"lines":["        /* Insert the element inside the pool.","         * First, find the first empty bucket or the first populated","         * bucket that has an idle time smaller than our idle time. */","        k = 0;","        while (k < EVPOOL_SIZE &&","               pool[k].key &&","               pool[k].idle < idle) k++;","        if (k == 0 && pool[EVPOOL_SIZE-1].key != NULL) {","            /* Can't insert if the element is < the worst element we have","             * and there are no empty buckets. */","            continue;","        } else if (k < EVPOOL_SIZE && pool[k].key == NULL) {","            /* Inserting into empty position. No setup needed before insert. */"]}],"notes":[{"t":"note","k":"n1","lv":"推断","html":"注释说找「比自己小的」格子；代码实际停在第一个空格，或第一个分数「不小于」自己的格子。以代码为准。","tag":"易混","who":"me","more":null,"ev":[],"a":181,"b":183},{"t":"note","k":"n2","lv":"推断","html":"这里拿「最右格非空」当「池满」用。前提是已占的格子总从最左连续排起，空格都在右边。","tag":"隐含前提","who":"me","more":"连续性靠两处保证：插入只往已占的左段里放或紧接其后（本页）；取的时候从右往左扫、扫过即清（<a class=\"lk\" href=\"#/loop.take\">从池里取<\/a>）。全仓库只有这两处会改池。","ev":[],"a":188,"b":188},{"t":"note","k":"n3","lv":null,"html":"池满且 <code>k == 0<\/code>：新候选比池里最低分还低，丢弃。","tag":null,"who":null,"more":null,"ev":[],"a":189,"b":191},{"t":"note","k":"n4","lv":null,"html":"<code>k<\/code> 指着空格：直接放，不用挪。","tag":null,"who":null,"more":null,"ev":[],"a":192,"b":193}],"cap":null},{"t":"code","file":"src/evict.c","parts":[{"a":194,"b":216,"lines":["        } else {","            /* Inserting in the middle. Now k points to the first element","             * greater than the element to insert.  */","            if (pool[EVPOOL_SIZE-1].key == NULL) {","                /* Free space on the right? Insert at k shifting","                 * all the elements from k to end to the right. */","","                /* Save SDS before overwriting. */","                sds cached = pool[EVPOOL_SIZE-1].cached;","                memmove(pool+k+1,pool+k,","                    sizeof(pool[0])*(EVPOOL_SIZE-k-1));","                pool[k].cached = cached;","            } else {","                /* No free space on right? Insert at k-1 */","                k--;","                /* Shift all elements on the left of k (included) to the","                 * left, so we discard the element with smaller idle time. */","                sds cached = pool[0].cached; /* Save SDS before overwriting. */","                if (pool[0].key != pool[0].cached) sdsfree(pool[0].key);","                memmove(pool,pool+1,sizeof(pool[0])*k);","                pool[k].cached = cached;","            }","        }"]}],"notes":[{"t":"note","k":"n5","lv":null,"html":"右边还有空位：从 <code>k<\/code> 起整体右移一格，新候选放在 <code>k<\/code>。","tag":null,"who":null,"more":null,"ev":[],"a":197,"b":199},{"t":"note","k":"n6","lv":"推断","html":"为什么 memmove 前先存 <code>cached<\/code>、之后再放回：memmove 把整个结构体连 <code>cached<\/code> 指针一起搬走，不放回就会有两格指着同一块缓冲，末尾那块没人指。","tag":"隐含前提","who":null,"more":"存了再放回，是为了保持「16 块缓冲，每块恰好属于一个格子」。依据是这几行代码本身；注释只说了复用缓冲是为了性能（<a class=\"ref\" data-k=\"src/evict.c:218-221\" title=\"src/evict.c:218-221\">evict "notes":[{"t":"note","k":"n1","lv":"注释","html":"OK 有两种完全不同的含义：真的没超；或「现在不允许淘汰」，作者自己叫它假的 OK（见 <a class=\"lk\" href=\"#/gate\">安全闸<\/a>）。","tag":"易混","who":null,"more":null,"ev":[{"lv":"注释","q":"memory is OK or it's not possible to perform evictions now","raw":["src/evict.c:539-539"],"rh":"<a class=\"ref\" data-k=\"src/evict.c:539-539\" title=\"src/evict.c:539-539\">evict.c:539<\/a>"},{"lv":"注释","q":"it's a fake EVICT_OK.","raw":["src/evict.c:544-545"],"rh":"<a class=\"ref\" data-k=\"src/evict.c:544-545\" title=\"src/evict.c:544-545\">evict.c:544–545<\/a>"}],"a":539,"b":539},{"t":"note","k":"n2","lv":"注释","html":"RUNNING = 还超着，但还在删。命令入口只判断 <code>== EVICT_FAIL<\/code>（<a class=\"ref\" data-k=\"src/server.c:4949-4949\" title=\"src/server.c:4949\">server.c:4949<\/a>），所以此时写命令照样放行。","tag":"反直觉","who":null,"more":null,"ev":[{"lv":"注释","q":"memory is over the limit, but eviction is still processing","raw":["src/evict.c:540-540"],"rh":"<a class=\"ref\" data-k=\"src/evict.c:540-540\" title=\"src/evict.c:540-540\">evict.c:540<\/a>"}],"a":540,"b":540},{"t":"note","k":"n3","lv":"注释","html":"FAIL = 还超着，而且没东西可删。只有它会让带 DENYOOM 标志的命令收到 OOM。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"memory is over the limit, and there's nothing to evict","raw":["src/evict.c:541-541"],"rh":"<a class=\"ref\" data-k=\"src/evict.c:541-541\" title=\"src/evict.c:541-541\">evict.c:541<\/a>"}],"a":541,"b":541}],"cap":null},{"t":"table","head":["返回值","命令入口","定时器"],"rows":[["<code>EVICT_OK<\/code> <a class=\"ref\" data-k=\"src/server.h:4757-4757\" title=\"src/server.h:4757\">server.h:4757<\/a>","照常执行命令","停表"],["<code>EVICT_RUNNING<\/code> <a class=\"ref\" data-k=\"src/server.h:4758-4758\" title=\"src/server.h:4758\">server.h:4758<\/a>","照常执行命令","返回 0，下一圈事件循环再来"],["<code>EVICT_FAIL<\/code> <a class=\"ref\" data-k=\"src/server.h:4759-4759\" title=\"src/server.h:4759\">server.h:4759<\/a>","带 DENYOOM 标志的命令回 OOM 错误","停表"]],"cap":null},{"t":"h","text":"还在删的时候，为什么敢放行"},{"t":"note","k":"n4","lv":"提交","html":"因为目标是「改善」而不是立刻解决（注释见 <a class=\"lk\" href=\"#/main.skel\">骨架代码<\/a>）；代价是承认的：极端情况下内存会继续涨。","tag":"后果","who":null,"more":"这是引入增量淘汰的那次提交；<code>maxmemory-eviction-tenacity<\/code> 就是留给用户的缓解手段。","ev":[{"lv":"提交","q":"There is a risk that some other edge cases (like massive pipelined use of MGET) could cause Redis memory usage to keep growing despite the eviction attempts, so a new maxmemory-eviction-tenacity config is introduced to let users mitigate that.","raw":["c:810e28a39"],"rh":"<a class=\"cm\" data-h=\"810e28a39\">810e28a39<\/a>"}]},{"t":"note","k":"n5","lv":"推断","html":"放行而不拒绝：「时间到了但还有 key 可删」不等于「没内存了」，这时拒写会把一次延迟优化变成一批业务报错。","tag":null,"who":null,"more":"依据：注释和提交都把目标定为「改善而不是立刻解决」；但没有哪句话直接说「RUNNING 时必须放行」。","ev":[]},{"t":"note","k":"n6","lv":"提交","html":"能不能接受写命令，由这个函数的返回值说了算，命令入口不自己比内存。","tag":"历史","who":null,"more":"2012 年的提交，那时函数还叫 <code>freeMemoryIfNeeded()<\/code>。底稿的解释：记账规则（扣掉哪些缓冲）只有这个函数知道，入口自己比会得出不一样的结论。","ev":[{"lv":"提交","q":"To say if we can accept or not write queries is up to the return value of freeMemoryIfNeeded(), that has full control about that.","raw":["c:f6b32c14f"],"rh":"<a class=\"cm\" data-h=\"f6b32c14f\">f6b32c14f<\/a>"}]}],"refs":["src/evict.c:539-539","src/evict.c:544-545","src/server.c:4949-4949","src/evict.c:540-540","src/evict.c:541-541","src/server.h:4757-4757","src/server.h:4758-4758","src/server.h:4759-4759"],"children":[{"id":"exit","nav":"出口","title":"出口：等一等、宽限、记指标","short":"这一节还没有内容。","lead":null,"src":null,"blocks":[],"refs":[],"children":[],"stub":"还没有模块提供这个槽位","back":["main","acct"]},{"id":"fail","nav":"EVICT_FAIL 之后","title":"EVICT_FAIL 之后：谁被拒，脚本怎么办","short":"这一节还没有内容。","lead":null,"src":null,"blocks":[],"refs":[],"children":[],"stub":"还没有模块提供这个槽位","back":["trig.cmd","gate.fakeok"]}],"back":["root","trig.cmd","main","why"]},{"id":"why","nav":"为什么这样","title":"宏观：为什么设计成这样","short":"七个设计决定，各一两句：换来什么、代价是什么、证据在哪。","lead":"把各页的局部「为什么」收拢成七个设计决定。每条先说决定和代价；长理由点「展开」。","src":null,"blocks":[{"t":"h","text":"它解决什么问题"},{"t":"note","k":"n1","lv":"文档","html":"两种用法：当缓存（满了自动腾），或当硬上限（noeviction：满了拒写、绝不丢数据）。","tag":null,"who":null,"more":"默认策略是后一种：<a class=\"ref\" data-k=\"redis.conf:1299-1299\" title=\"redis.conf:1299\">redis.conf:1299<\/a> 的 <code>maxmemory-policy noeviction<\/code>，代码默认值在 <a class=\"ref\" data-k=\"src/config.c:4294-4294\" title=\"src/config.c:4294\">config.c:4294<\/a>。而 <code>maxmemory<\/code> 本身默认是 0，也就是不限（<a class=\"ref\" data-k=\"src/config.c:4393-4393\" title=\"src/config.c:4393\">config.c:4393<\/a>）。所以什么都没配的 Redis 既不淘汰也不拒写。为什么默认策略选 noeviction，没查到，见 <a class=\"lk\" href=\"#/unknown\">没查到为什么<\/a>。","ev":[{"lv":"文档","q":"This option is usually useful when using Redis as an LRU or LFU cache, or to set a hard memory limit for an instance (using the 'noeviction' policy).","raw":["redis.conf:1247-1248"],"rh":"<a class=\"ref\" data-k=\"redis.conf:1247-1248\" title=\"redis.conf:1247-1248\">redis.conf:1247–1248<\/a>"}]},{"t":"note","k":"n2","lv":"注释","html":"32 位实例是例外：没配上限时，启动自动设成 3GB 加 noeviction。","tag":null,"who":null,"more":"代码在 <a class=\"ref\" data-k=\"src/server.c:3312-3315\" title=\"src/server.c:3312-3315\">server.c:3312–3315<\/a>。","ev":[{"lv":"注释","q":"This avoids useless crashes of the Redis instance for out of memory.","raw":["src/server.c:3308-3311"],"rh":"<a class=\"ref\" data-k=\"src/server.c:3308-3311\" title=\"src/server.c:3308-3311\">server.c:3308–3311<\/a>"}]},{"t":"h","text":"七个设计决定"},{"t":"note","k":"n3","lv":"文档","html":"一 · 近似，而不是精确。不维护全局 LRU 链表，每次只抽几个 key 打分；为了省内存。","tag":null,"who":null,"more":"代价：删掉的只是「抽到过的 key 里最该删的」，不是全局最该删的；候选池（决定二）用来缩小这个差距。怎么选见 <a class=\"lk\" href=\"#/pick\">选谁<\/a>。","ev":[{"lv":"文档","q":"LRU, LFU and minimal TTL algorithms are not precise algorithms but approximated algorithms (in order to save memory), so you can tune it for speed or accuracy.","raw":["redis.conf:1301-1305"],"rh":"<a class=\"ref\" data-k=\"redis.conf:1301-1305\" title=\"redis.conf:1301-1305\">redis.conf:1301–1305<\/a>"},{"lv":"注释","q":"Redis uses an approximation of the LRU algorithm that runs in constant memory.","raw":["src/evict.c:98-101"],"rh":"<a class=\"ref\" data-k=\"src/evict.c:98-101\" title=\"src/evict.c:98-101\">evict.c:98–101<\/a>"},{"lv":"文档","q":"The default of 5 produces good enough results. 10 Approximates very closely true LRU but costs more CPU. 3 is faster but not very accurate.","raw":["redis.conf:1307-1309"],"rh":"<a class=\"ref\" data-k=\"redis.conf:1307-1309\" title=\"redis.conf:1307-1309\">redis.conf:1307–1309<\/a>"}]},{"t":"note","k":"n4","lv":"推断","html":"省下的具体是什么：精确 LRU 要把所有 key 串成按访问时间排序的链，每个 key 至少多两个指针，每次访问还要挪节点；近似做法只用对象头里本来就有的 24 位。","tag":null,"who":null,"more":"依据是这个字段的位置和大小（<a class=\"ref\" data-k=\"src/object.h:112-112\" title=\"src/object.h:112\">object.h:112<\/a>）。仓库里的文档只说了「为了省内存」，没有做这个对比。","ev":[]},{"t":"note","k":"n5","lv":"提交","html":"二 · 候选池跨调用保留。代价：池里会有过时条目，所以取用时必须回查。","tag":null,"who":null,"more":"提交原话在 <a class=\"lk\" href=\"#/pool\">候选池<\/a>；回查在 <a class=\"lk\" href=\"#/loop\">主循环怎么用池<\/a>。","ev":[{"lv":"提交","q":null,"raw":["c:22c9cfaf5","c:6416ab19d"],"rh":"<a class=\"cm\" data-h=\"22c9cfaf5\">22c9cfaf5<\/a> <a class=\"cm\" data-h=\"6416ab19d\">6416ab19d<\/a>"}]},{"t":"note","k":"n6","lv":"提交","html":"三 · 跨库统一选，而不是每个库各选各的。","tag":null,"who":null,"more":"证据原话在 <a class=\"lk\" href=\"#/loop\">主循环怎么用池<\/a>。","ev":[{"lv":"提交","q":null,"raw":["c:e423f76e7"],"rh":"<a class=\"cm\" data-h=\"e423f76e7\">e423f76e7<\/a>"}]},{"t":"note","k":"n7","lv":"提交","html":"四 · 限时、增量，而不是一次删够。代价：上限变软，「还在删」时写命令照样放行，极端情况下内存会继续涨。","tag":null,"who":null,"more":"提交说明自己承认了这个代价，原话见 <a class=\"lk\" href=\"#/ret\">三个返回值<\/a>。节奏怎么控见 <a class=\"lk\" href=\"#/pace\">删与看表<\/a>。","ev":[{"lv":"提交","q":"Rather than blindly evicting until maxmemory limit is achieved, this update adds a time limit to eviction. While over the maxmemory limit, eviction will process before each command AND as a timeProc when no commands are running.","raw":["c:810e28a39"],"rh":"<a class=\"cm\" data-h=\"810e28a39\">810e28a39<\/a>"}]},{"t":"note","k":"n8","lv":null,"html":"五 · 记账时扣掉复制缓冲和 AOF 缓冲（<a class=\"ref\" data-k=\"src/evict.c:329-329\" title=\"src/evict.c:329\">evict.c:329<\/a>、<a class=\"ref\" data-k=\"src/evict.c:413-414\" title=\"src/evict.c:413-414\">evict.c:413–414<\/a>）。为什么、证据都在 <a class=\"lk\" href=\"#/acct\">算账<\/a>。代价：这部分内存不受 maxmemory 约束，要靠运维预留。","tag":null,"who":null,"more":null,"ev":[]},{"t":"note","k":"n9","lv":null,"html":"六 · 删不删由主库一家说了算：副本默认不淘汰（<a class=\"lk\" href=\"#/gate\">安全闸<\/a>），主库把每次淘汰当成一条删除命令传下去（<a class=\"lk\" href=\"#/delete\">删 key 并通知<\/a>）。代价：副本的内存占用完全跟着主库走，自己没有保护。","tag":null,"who":null,"more":null,"ev":[]},{"t":"note","k":"n10","lv":"文档","html":"七 · 删除默认在主线程同步完成，后台释放是可选项。同步删除的风险，配置文件写得很直白：可能阻塞很久，甚至数秒。","tag":null,"who":null,"more":"淘汰是可以打开后台释放的场景之一（<a class=\"ref\" data-k=\"redis.conf:1382-1384\" title=\"redis.conf:1382-1384\">redis.conf:1382–1384<\/a>）。为什么默认不开，没查到，见 <a class=\"lk\" href=\"#/unknown\">没查到为什么<\/a>。一条历史线索：提交 <a class=\"cm\" data-h=\"7af4eeb74\">7af4eeb74<\/a> 的标题是 \"Lazyfree: incremental removed, only threaded survived.\"，说明早期还试过不用线程的增量释放，后来删掉了；这次提交没有正文，原因没查到。","ev":[{"lv":"文档","q":"the server can block for a long time (even seconds) in order to complete the operation.","raw":["redis.conf:1360-1367"],"rh":"<a class=\"ref\" data-k=\"redis.conf:1360-1367\" title=\"redis.conf:1360-1367\">redis.conf:1360–1367<\/a>"},{"lv":"文档","q":"Another thread will incrementally free the object in the background as fast as possible.","raw":["redis.conf:1369-1373"],"rh":"<a class=\"ref\" data-k=\"redis.conf:1369-1373\" title=\"redis.conf:1369-1373\">redis.conf:1369–1373<\/a>"}]}],"refs":["redis.conf:1299-1299","src/config.c:4294-4294","src/config.c:4393-4393","redis.conf:1247-1248","src/server.c:3312-3315","src/server.c:3308-3311","redis.conf:1301-1305","src/evict.c:98-101","redis.conf:1307-1309","src/object.h:112-112","src/evict.c:329-329","src/evict.c:413-414","redis.conf:1382-1384","redis.conf:1360-1367","redis.conf:1369-1373"],"children":[],"back":["root","pick"]},{"id":"idx   h+='<div><a class="ref">文件:行号</a> 点开看仓库里的原文</div><div><a class="cm">哈希</a> 点开看日期和标题</div>';
  h+='<h3>困惑类型（# 标签）</h3>';
  (M.tags||[]).forEach(function(t){h+='<div><span class="tg">'+esc(t.name)+'</span> '+esc(t.desc)+'</div>';});
  h+='<h3>操作</h3><div>← → 同层前后翻；u 回上一层；任何页都可以点顶栏路径或「地图」跳走。</div>';
  $('#legend').innerHTML=h;
})();
window.__cv={cur:function(){return cur;},has:function(id){return !!byId[id];}};
route();
})();
</script>
