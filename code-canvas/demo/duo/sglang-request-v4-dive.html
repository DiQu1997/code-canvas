<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>sglang：一条请求怎么走一圈</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d2330;--mut:#667085;--line:#e2e0d8;--acc:#2456d6;
--e1:#1a7f4b;--e2:#1f5fbf;--e3:#0f7b8a;--e4:#5b4bc4;--infer:#b26a00;--view:#b0237a;--unk:#6b7280;--fact:#475467;
--sans:system-ui,-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei","WenQuanYi Zen Hei",sans-serif;
--mono:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","WenQuanYi Zen Hei Mono",monospace}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--sans)}
a{color:var(--acc)}
button{font:inherit;cursor:pointer}
:root{--stage:#e7e5dc;--fw:1322px;--kc:3}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--stage)}
#top{position:fixed;top:0;left:0;right:0;z-index:40;height:48px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#1d2330;color:#fff}
#stage{position:fixed;left:0;right:0;top:48px;bottom:0;overflow:hidden;touch-action:none;cursor:grab;background-color:var(--stage);background-image:radial-gradient(circle,#c9c6b8 1.1px,transparent 1.5px);background-size:24px 24px}
#stage.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-select:none}
#side{position:fixed;top:48px;left:0;bottom:0;width:min(320px,100vw);z-index:45;overflow:auto;border-right:1px solid var(--line);background:#fbfaf7;padding:10px 8px 70px;transform:translateX(-105%);visibility:hidden;transition:transform .2s,visibility .2s;box-shadow:8px 0 30px rgba(0,0,0,.18)}
body.mapopen #side{transform:none;visibility:visible}
#top button{flex:none;height:32px;padding:0 10px;border:1px solid #4a5468;border-radius:6px;background:#2b3345;color:#fff;font-size:14px}
#crumb{flex:1;min-width:0;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;font-size:14px}
#crumb a{color:#c9d6ff;text-decoration:none;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
#crumb b{overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:3em}
#crumb i{font-style:normal;color:#8a93a6;flex:none}
#side .st{font-size:12px;color:var(--mut);padding:2px 8px 6px}
.ol{display:block;padding:4px 8px;border-radius:5px;font-size:14px;line-height:1.4;color:#333;text-decoration:none}
.ol i{font-style:normal;color:#9aa1ad;float:right}
.ol.on{font-weight:700}
.ol.cur{background:var(--acc);color:#fff}
.ol.d0{font-weight:700}
#legend{position:fixed;top:54px;right:8px;z-index:50;width:min(360px,calc(100vw - 16px));max-height:calc(100vh - 70px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:12px 14px;font-size:14px}
#legend[hidden]{display:none}
#legend h3{margin:8px 0 4px;font-size:14px}
#legend div{margin:5px 0;line-height:1.5}
.where{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:13px;color:var(--mut)}
.where .lvl{background:#1d2330;color:#fff;border-radius:4px;padding:0 7px;font-weight:700}
.where a{color:var(--acc);text-decoration:none;background:#e9eefb;border-radius:4px;padding:0 6px}
.where b{color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:4px;padding:0 6px}
h1{font-size:24px;line-height:1.3;margin:10px 0 6px}
h2{font-size:18px;margin:26px 0 8px;line-height:1.35}
h2 small{font-size:13px;font-weight:400;color:var(--mut);margin-left:8px}
.lead{font-size:16.5px;color:#2c3445;margin:4px 0 6px}
.src{font-size:12.5px;color:var(--mut)}
p{margin:10px 0}
code{font-family:var(--mono);font-size:.88em;background:#eceae2;border-radius:3px;padding:0 3px}
a.ref{font-family:var(--mono);font-size:.84em;background:#eef2fb;border:1px solid #cbd6f2;border-radius:4px;padding:0 4px;color:#1d3f9a;cursor:pointer;white-space:nowrap;text-decoration:none}
a.ref::before{content:"⌖ ";opacity:.6}
a.ref.on{background:#1d3f9a;color:#fff}
a.cm{font-family:var(--mono);font-size:.84em;border:1px solid #c8d3ea;border-radius:4px;padding:0 4px;color:#1f5fbf;background:#fff;cursor:pointer;text-decoration:none;white-space:nowrap}
a.cm::before{content:"提交 ";font-family:var(--sans);opacity:.7}
.cinfo{display:block;font-size:12.5px;color:#444;background:#f1f4fb;border-radius:4px;padding:2px 6px;margin:3px 0}
a.lk{font-weight:600;text-decoration:none;border-bottom:1px solid currentColor}
.lv-e1{--c:var(--e1)}.lv-e2{--c:var(--e2)}.lv-e3{--c:var(--e3)}.lv-e4{--c:var(--e4)}.lv-fact{--c:var(--fact)}.lv-infer{--c:var(--infer)}.lv-view{--c:var(--view)}.lv-unk{--c:var(--unk)}
.note{margin:10px 0;padding:8px 12px;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:6px;background:#fff;font:14.5px/1.6 var(--sans);color:var(--ink)}
.note.lv-fact{border-left-color:#b9c0cc}
.note.lv-infer{border:1.5px dashed var(--c);background:#fff8e8}
.note.lv-view{border:1.5px dashed var(--c);background:#fdf0f7}
.note.lv-unk{border:1.5px dotted var(--c);background:#efeeea}
.note.flash{animation:fl 2s}
@keyframes fl{0%,60%{box-shadow:0 0 0 4px rgba(36,86,214,.45)}100%{box-shadow:0 0 0 4px rgba(36,86,214,0)}}
.nh{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:3px}
.bd{display:inline-block;font-size:12px;line-height:18px;font-weight:700;padding:0 8px;border-radius:9px;color:#fff;background:var(--c);white-space:nowrap}
.bd.lv-infer,.bd.lv-view,.bd.lv-unk{background:#fff;color:var(--c);border:1px dashed var(--c);line-height:16px}
.bd.lv-fact{background:#e6e8ee;color:#475467}
.who{font-size:12px;color:#7a4100;background:#ffe3b3;border-radius:4px;padding:0 6px}
.tg{font-size:12px;color:#444;background:#ecebe4;border-radius:4px;padding:0 6px}
.tg::before{content:"#"}
.ln{font-size:12px;color:var(--mut);margin-left:auto;font-family:var(--mono)}
.goto{margin-left:auto;font-size:13px;text-decoration:none;font-weight:600}
.ev{margin-top:6px;font-size:13.5px;line-height:1.7}
.ev .evl{font-size:12px;color:var(--mut)}
.q{margin:3px 0 0;border-left:3px solid #cfcbbd;padding:1px 8px;color:#3d4350;font:italic 13.5px/1.5 Georgia,"Times New Roman",serif;cursor:pointer;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.q.open{display:block}
.q::before{content:"“"}.q::after{content:"”"}
details.more{margin-top:6px;font-size:13.5px}
details.more summary{cursor:pointer;color:var(--acc);font-weight:600}
figure{margin:14px 0}
.cap{font-size:13px;color:var(--mut);margin-top:6px;line-height:1.55}
figure.code{border:1px solid var(--line);border-radius:8px;background:#fbfbf8;overflow:hidden}
figure.code figcaption{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;padding:5px 10px;background:#efede5;border-bottom:1px solid var(--line);font-size:13px}
figcaption .fn{font-family:var(--mono);font-weight:700}
figcaption .rg{color:var(--mut)}
.tgl{margin-left:auto;font-size:12.5px;border:1px solid #c9c5b6;background:#fff;border-radius:5px;padding:1px 8px}
figure.code>.cap{padding:0 10px 8px}
.cb{font:13px/1.55 var(--mono);padding:6px 0}
.cl{display:flex}
.cl.hl{background:#fff4cf}
.no{flex:0 0 3.4em;text-align:right;padding-right:.7em;color:#9aa1ad;user-select:none;font-size:12px;line-height:20.15px}
.tx{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;padding-left:1.6em;text-indent:-1.6em;padding-right:8px}
.k-c{color:#5b6777}.k-s{color:#1a7f4b}.k-k{color:#8b2fa0}
.gap{text-align:center;color:var(--mut);font:12.5px/1.6 var(--sans);background:repeating-linear-gradient(135deg,#f0eee6 0 6px,#f8f7f2 6px 12px);margin:4px 0;padding:1px 0}
.cb .note{margin:6px 10px 10px 3.4em}
figure.code.nonotes .cb .note{display:none}
.snip{display:block;margin:6px 0 4px;border:1px solid #cbd6f2;border-radius:6px;background:#fbfbf8;overflow:hidden;white-space:normal;font-weight:400;text-align:left}
.snip .sh{display:flex;gap:8px;align-items:center;font:12.5px/1.6 var(--mono);background:#eef2fb;padding:2px 8px;color:#1d3f9a}
.snip .sx{margin-left:auto;font:12px var(--sans);border:1px solid #cbd6f2;background:#fff;border-radius:4px;padding:0 6px}
figure.tb{overflow:visible}
table{border-collapse:collapse;width:100%;background:#fff;font-size:14.5px;line-height:1.55}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
th{background:#efede5;font-size:13px;white-space:nowrap}
td:first-child{font-weight:600}
ol.flow{list-style:none;margin:14px 0;padding:0;position:relative}
ol.flow::before{content:"";position:absolute;left:15px;top:8px;bottom:8px;width:2px;background:#c9c5b6}
.fs{position:relative;display:flex;gap:10px;margin:8px 0;align-items:flex-start}
.fk{flex:none;width:32px;height:32px;border-radius:50%;background:#1d2330;color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.fbody{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 11px}
.fs[data-to] .fbody{cursor:pointer;border-color:#b9c6ea}
.fs[data-to] .fbody:hover{background:#f4f7ff}
.ft{font-weight:700;font-size:15px;line-height:1.45}
.go{float:right;font-size:13px;color:var(--acc);font-weight:600;margin-left:8px}
.fsub{font-size:13.5px;color:#3d4350;margin-top:2px}
.fref{font-size:13px;margin-top:3px}
.fo{margin-top:5px;display:flex;flex-wrap:wrap;gap:5px}
.pill{font-size:12px;border-radius:9px;padding:0 8px;line-height:18px;font-weight:600}
.o-ok{background:#dff3e6;color:#17663d}.o-run{background:#fff0c9;color:#7a5200}.o-fail{background:#fbdcdc;color:#9b1c1c}
.floop{font-size:12.5px;color:var(--mut);margin-top:3px}
figure.dg{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 10px 10px}
.dgw{position:relative;overflow:hidden}
.dgi{position:absolute;left:0;top:0;transform-origin:0 0}
.dgi svg{position:absolute;left:0;top:0;pointer-events:none}
.dgi polyline{fill:none;stroke:#5c6679;stroke-width:1.5}
.dgi polyline.dash{stroke-dasharray:5 4}
.dgi marker path{fill:#5c6679}
.dfr{position:absolute;border:1.5px dashed #cdc9ba;border-radius:10px;background:rgba(0,0,0,.018)}
.dfr span{position:absolute;top:-10px;left:8px;background:#fff;padding:0 5px;font-size:12px;line-height:18px;color:var(--mut);white-space:nowrap}
.dbx{position:absolute;border:1.5px solid #8fa0c4;border-radius:8px;background:#f5f8ff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:2px 6px;font-size:13.5px;font-weight:700;line-height:1.25}
.dbx small{font-weight:400;font-size:12px;color:#4a5263;line-height:1.25}
.dbx.k-store{background:#fff9e3;border-color:#c9b46a;border-radius:3px;border-top-width:4px}
.dbx.k-ext{background:#f1f1ee;border-color:#a9a595;border-style:dashed}
.dbx.k-bg{background:#f3effc;border-color:#9a8bd0}
.dbx.go{cursor:pointer;box-shadow:0 1px 0 rgba(0,0,0,.08);margin:0;float:none}
.dbx.go::after{content:"›";position:absolute;right:4px;bottom:0;color:var(--acc);font-size:15px}
.dbx.go:hover{outline:2px solid var(--acc)}
.flag{position:absolute;top:-10px;right:-6px;background:var(--acc);color:#fff;font-size:12px;line-height:17px;border-radius:9px;padding:0 6px;font-style:normal;font-weight:700;white-space:nowrap}
.dlb{position:absolute;transform:translate(-50%,-50%);background:#fff;border:1px solid var(--line);border-radius:4px;font-size:12px;line-height:16px;padding:0 4px;white-space:nowrap;color:#3d4350}
figure.frm{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.fr-top{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}
.fr-t{font-weight:700;color:var(--ink);font-size:14.5px}
.fr-inc{min-height:48px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.fr-cells{display:flex;gap:4px}
.cell{flex:1 1 0;min-width:0;border:1.5px solid #c9b46a;background:#fff9e3;border-radius:5px;text-align:center;padding:3px 1px;display:flex;flex-direction:column;line-height:1.3}
.fr-inc .cell{flex:0 0 64px}
.cell b{font:700 13px var(--mono)}.cell i{font-style:normal;font-size:13px}
.cell.s-empty{background:#f4f3ee;border-style:dashed;color:#9aa1ad}
.cell.s-new{background:#dff3e6;border-color:#1a7f4b}
.cell.s-out{background:#fbdcdc;border-color:#c0392b;text-decoration:line-through}
.cell.s-ghost{background:#eee;border-color:#999;color:#888;border-style:dotted}
.cell.s-pick{background:#1d2330;border-color:#1d2330;color:#fff}
.cell.s-mv{background:#eaf0ff;border-color:#8fa0c4}
.fr-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:3px}
.fr-say{margin:8px 0;font-size:14.5px;min-height:3.2em}
.fr-nav{display:flex;gap:8px}
.fr-nav button{flex:1;height:36px;border:1px solid #b9c6ea;background:#f4f7ff;border-radius:6px;font-size:14px;color:var(--acc);font-weight:600}
.fr-nav button:disabled{opacity:.4}
figure.bar{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.bar-r{display:flex;height:34px;border-radius:5px;overflow:hidden}
.seg{display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;border-right:1px solid #fff;min-width:22px}
.seg.k-in{background:#3b5b9d}
.seg.k-out{background:repeating-linear-gradient(135deg,#b9b5a6 0 6px,#d3cfc1 6px 12px);color:#333}
.bar-l{margin:8px 0 0;padding-left:1.6em;font-size:14px}
.bar-l em{font-style:normal;font-size:12px;border-radius:9px;padding:0 7px;margin-left:4px;background:#e3e9f7;color:#2b4280}
.bar-l li.k-out em{background:#e6e3d8;color:#555}
.back{margin-top:18px;font-size:13px;color:var(--mut);display:flex;flex-wrap:wrap;gap:4px 8px}
.back a{text-decoration:none}
.pager{display:flex;gap:10px;margin-top:22px}
.pager a{flex:1;text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-size:14px;color:var(--ink);min-width:0}
.pager a small{display:block;font-size:12px;color:var(--mut)}
.pager a.nx{border-color:var(--acc);text-align:right}
.cnt{font-size:13px;color:var(--mut)}
.stubbox{margin:14px 0;padding:14px 16px;border:2px dashed #b9b5a6;border-radius:10px;background:repeating-linear-gradient(135deg,#f3f1e9 0 8px,#faf9f5 8px 16px);color:#555;font-size:15px}
.stubbox b{display:inline-block;background:#6b7280;color:#fff;border-radius:4px;padding:0 8px;margin-right:8px}
.stubm{font-style:normal;font-size:12px;background:#e6e3d8;color:#666;border-radius:9px;padding:0 7px;white-space:nowrap}
.ol.stub:not(.cur){color:#9aa1ad}
span.lk.dead{font-weight:600;color:#9b1c1c;border-bottom:1px dashed currentColor;cursor:help}
/* ---------- v2：画框（每个节点一个，子节点的画框缩小后住在父节点的格子里） ---------- */
.nf{position:absolute;left:0;top:0;transform-origin:0 0;width:var(--fw);background:var(--bg);border-radius:14px;clip-path:inset(0 0 calc(100% - var(--ch,100%)) 0 round 14px)}
.nf.open{clip-path:none;box-shadow:0 0 0 1px #c9c5b6,0 0 0 99999px rgba(231,229,220,0);transition:box-shadow .35s}
.nf.cur{box-shadow:0 0 0 1px #8fa0c4,0 0 0 99999px rgba(231,229,220,.86);transition:box-shadow .35s .25s}
#world>.nf.cur{box-shadow:0 0 0 1px #c9c5b6,0 0 0 99999px rgba(231,229,220,0)}
.card{background:var(--card);min-width:0;overflow-wrap:anywhere;cursor:pointer}
.nf:not(.cur)>.card *{pointer-events:none}
.nf.cur>.card{cursor:auto;user-select:text;-webkit-user-select:text}
body.wide .nf{display:grid;grid-template-columns:780px 470px;gap:28px;padding:22px;width:1322px;align-items:start}
body.wide .nf.leaf{grid-template-columns:780px;width:824px}
body.wide .card{border:1px solid var(--line);border-radius:10px;padding:20px 26px 26px}
body.wide figure.dg{margin-left:-14px;margin-right:-14px;padding:14px 8px 10px}
body.nar .card{border-radius:14px 14px 0 0;padding:14px 14px 22px}
body.nar .nf.leaf>.card{border-radius:14px}
.lbl{position:absolute;left:0;top:0;right:0;height:var(--ch,100%);display:none;align-items:center;justify-content:center;text-align:center;padding:0 5%;background:rgba(246,245,241,.94);border-radius:14px;color:#1d2330;font-weight:700;line-height:1.2;pointer-events:none;z-index:2}
.nf.open>.lbl{height:100%}
.nf.far>.lbl{display:flex}
.nf.far>.card,.nf.far>.kz{visibility:hidden}
.nf.tiny>.lbl{display:none}
.nf.stub>.lbl{color:#8a8f99}
.nf.huge:not(.cur)>.card,.nf.huge:not(.cur)>.kz>.kg>.tile:not(.open):not(.closing){visibility:hidden}
.kz{min-width:0}
body.nar .kz{padding:12px 8px 14px}
.kzh{font-size:14px;font-weight:700;color:#3d4350;margin:2px 4px 10px;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.kzh small{font-weight:400;font-size:12.5px;color:var(--mut)}
.kg{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
body.nar .kg{grid-template-columns:repeat(var(--kc),minmax(0,1fr));gap:8px}
.tile{position:relative;min-width:0;background:#fff;border:1px solid #b9c6ea;border-radius:10px;padding:8px;cursor:pointer}
body.nar .tile{padding:6px}
.tile.stub{border-style:dashed;border-color:#c9c5b6;background:#faf9f5}
.tile.open,.tile.closing{z-index:5}
.nf.cur>.kz>.kg>.tile:hover{border-color:var(--acc);box-shadow:0 0 0 2px rgba(36,86,214,.18)}
.tl{display:flex;flex-wrap:wrap;align-items:center;gap:3px 7px;margin-bottom:4px}
.tn{flex:none;width:22px;height:22px;border-radius:50%;background:#1d2330;color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tl b{font-size:15.5px;color:var(--acc);line-height:1.3}
.tl b::after{content:" ›"}
.tile.stub .tl b{color:#667085}
.tl i{font-style:normal;font-size:12px;color:var(--mut);margin-left:auto}
.ts{font-size:13.5px;line-height:1.5;color:#3d4350;margin:0 2px 7px}
.ts *{pointer-events:none}
.slot{position:relative;height:60px}
.slot.cut::after{content:"";position:absolute;left:0;right:0;bottom:0;height:28px;background:linear-gradient(rgba(255,255,255,0),#fff);pointer-events:none}
.tile.stub>.slot.cut::after{background:linear-gradient(rgba(250,249,245,0),#faf9f5)}
.tile.open>.slot::after,.tile.closing>.slot::after{display:none}
.fr-nav .fa{flex:0 0 auto;padding:0 14px}
.lx{float:right;font-size:12.5px;border:1px solid var(--line);background:#fff;border-radius:5px;padding:1px 9px}
/* ---------- 浮层：底部导航、缩放按钮、提示 ---------- */
#dock{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;display:flex;gap:4px;padding:5px;background:rgba(29,35,48,.94);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#dock button,#zb button{height:36px;min-width:36px;padding:0 10px;border:0;border-radius:8px;background:#2f384c;color:#fff;font-size:13.5px;white-space:nowrap}
#dock button:disabled{opacity:.35;cursor:default}
#dock .pos{background:transparent;font-family:var(--mono);font-size:12.5px;color:#c9d6ff}
/* 只有一页（单张机器图、没有下层）：翻页 / 层级这些控件没有意义，收起来，只留「回正」 */
body.solo #bmap,body.solo .where,body.solo #dock button:not(.pos){display:none}
body.solo #dock .pos{font-family:inherit;font-size:13.5px;color:#fff}
#zb{position:fixed;right:12px;bottom:12px;z-index:30;display:flex;flex-direction:column;gap:4px;padding:5px;background:rgba(29,35,48,.94);border-radius:12px}
#zb button{padding:0;font-size:16px}
@media (hover:none){#zb{display:none}}
#hint{position:fixed;top:58px;left:50%;transform:translateX(-50%);z-index:30;width:max-content;max-width:calc(100vw - 24px);background:rgba(29,35,48,.9);color:#fff;font-size:13px;line-height:1.5;padding:5px 14px;border-radius:16px;pointer-events:none;transition:opacity .4s;text-align:center}
#hint.off{opacity:0}
/* ---------- 手机宽度的画框（按画框宽度切换，不按视口） ---------- */
.ph h1{font-size:21px}
.ph .lead{font-size:16px}
.ph .cb{font-size:12px}
.ph .no{flex-basis:3em;padding-right:.5em;line-height:18.6px}
.ph .ind{letter-spacing:-.5ch}
.ph .tx{padding-right:4px}
.ph .cb .note{margin:6px 6px 10px 8px;font-size:14px}
.ph .tb table,.ph .tb tbody,.ph .tb tr,.ph .tb td{display:block;width:100%}
.ph .tb table{background:transparent}
.ph .tb thead{display:none}
.ph .tb tr{border:1px solid var(--line);border-radius:8px;background:#fff;margin:8px 0;padding:6px 10px}
.ph .tb td{border:0;padding:3px 0}
.ph .tb td::before{content:attr(data-h);display:block;font-size:12px;color:var(--mut);font-weight:400}
.ph .tb td:first-child{font-size:15px}
.ph .tb td:empty{display:none}
.ph figure.dg{padding:14px 4px 8px}
.ph .nf.cur{box-shadow:0 0 0 1px #8fa0c4,0 0 0 99999px rgba(231,229,220,.93)}
.ph .pager{flex-direction:column}
.ph .ol{font-size:15px;padding:7px 8px}
.ph .tl b{font-size:14.5px}
.ph .tl i{margin-left:0;flex-basis:100%}
.ph .ts{font-size:12.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ph #legend{top:auto;left:0;right:0;bottom:0;width:auto;max-height:62vh;border-radius:14px 14px 0 0}
.ph #dock button{padding:0 8px;font-size:13px}
/* ---------- 机器图（scene）：部件 + 连线 + 图层 + 推演条 + 说明卡 ---------- */
body.wide .nf.sc{grid-template-columns:minmax(0,1fr);width:1322px}
body.wide .nf.sc .kg{grid-template-columns:repeat(5,minmax(0,1fr))}
body.wide .nf.sc>.card>h1{font-size:22px;margin:2px 0 4px}
body.wide .nf.sc>.card>.lead{font-size:15.5px;margin:2px 0 4px}
.scn{margin:8px 0 4px;user-select:none;-webkit-user-select:none;cursor:grab}
.scw{position:relative}
.sci{position:absolute;top:0;transform-origin:0 0}
.sgr{position:absolute;box-sizing:border-box;border:1.5px dashed #b9b5a6;border-radius:12px}
.sgr>span{position:absolute;left:10px;top:-10px;background:var(--card);padding:0 6px;font-size:12px;line-height:18px;color:var(--mut);white-space:nowrap}
.wsv{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.wr{color:#7c8494;cursor:pointer;transition:opacity .25s}
.wr .wp{fill:none;stroke:currentColor;stroke-width:1.6}
.wr.dash .wp{stroke-dasharray:5 4}
.wr .wh{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke}
.wr .wa{fill:currentColor}
.pt{position:absolute;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;border:1.5px solid #8fa0c4;background:#f5f8ff;border-radius:10px;color:var(--ink);cursor:pointer;transition:opacity .25s,box-shadow .2s}
.pt.k-store{background:#fff9e3;border-color:#c9b46a}
.pt.k-ext{background:#f1f1ee;border-color:#a9a595;border-style:dashed}
.pt.k-bg{background:#f3effc;border-color:#9a8bd0}
.pt.k-gate{background:#fff3e6;border-color:#d9a05b}
.pt.k-out{background:#eaf6ee;border-color:#7fb894}
.nf.cur .pt:hover{box-shadow:0 0 0 2px rgba(36,86,214,.35)}
.pth{flex:none;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 6px;padding:5px 22px 1px 8px;font-size:13.5px;line-height:1.35}
.pth b{white-space:nowrap}
.pth code{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:11px/1.5 var(--mono);color:var(--mut);background:none;padding:0;border:0}
.pn,.wn,.pidx i,.pbody h4 i{flex:none;display:inline-block;min-width:17px;height:17px;padding:0 3px;box-sizing:border-box;border-radius:9px;background:var(--ink);color:#fff;font:700 11px/17px var(--sans);font-style:normal;text-align:center;align-self:center}
.pmore{position:absolute;right:6px;top:4px;font:12px/1.4 var(--sans);font-style:normal;color:#98a0ae}
.ptg{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:2px 8px;overflow:hidden}
.ptg:empty{padding:0}
.ptg.chg{animation:gchg .8s}
@keyframes gchg{0%{background:rgba(36,86,214,.28)}100%{background:transparent}}
.pts{flex:none;padding:3px 8px 4px;border-top:1px solid rgba(0,0,0,.09);background:rgba(255,255,255,.62);font-size:13px;line-height:1.35;color:#2c3445;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.pts .bd{font-size:10.5px;line-height:15px;padding:0 5px;margin-right:4px;vertical-align:1px}
.wl{position:absolute;box-sizing:border-box;min-height:22px;max-width:min(9.6em,var(--mx,999px));padding:1px 8px;background:#fff;border:1px solid #c9cdd6;border-radius:11px;font-size:12.5px;line-height:1.35;color:#2c3445;text-align:center;cursor:pointer;transition:opacity .25s}
.wl .wn{min-width:15px;height:15px;line-height:15px;font-size:10px;margin-right:4px;vertical-align:1px}
.nf.cur .wl:hover{border-color:var(--acc)}
/* 小图（glyph） */
.gcs{display:flex;flex-wrap:wrap;align-items:stretch;justify-content:center;gap:3px;max-width:100%}
.gc{box-sizing:border-box;min-width:22px;min-height:20px;padding:1px 4px;border:1px solid #c9cdd6;border-radius:4px;background:#fff;font:11px/1.25 var(--mono);text-align:center;display:flex;flex-direction:column;justify-content:center}
.gc b{display:block;font-weight:700}
.gc i{display:block;font-style:normal;font-size:10px;color:var(--mut)}
.gc.s-new{background:#dff3e6;border-color:#1a7f4b}
.gc.s-out{background:#fbdcdc;border-color:#c0392b;text-decoration:line-through}
.gc.s-ghost{background:#eee;border-color:#999;border-style:dotted;color:#999}
.gc.s-pick{background:#1d2330;border-color:#1d2330;color:#fff}
.gc.s-pick i{color:#cfd3dc}
.gc.s-mv{background:#eaf0ff;border-color:#8fa0c4}
.gc.s-empty{background:#f4f3ee;border-style:dashed}
.gce{align-self:center;font-size:10.5px;color:var(--mut);white-space:nowrap}
.gg{width:100%}
.ggb{position:relative;height:12px;background:#e4e2da;border-radius:6px}
.ggb i{position:absolute;top:0;bottom:0}
.ggf{left:0;background:#8fa0c4;border-radius:6px 0 0 6px}
.ggo{background:#d94f4f;border-radius:0 6px 6px 0}
.ggb .ggm{top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:#1d2330}
.ggt{margin-top:3px;font:11.5px/1.35 var(--mono);text-align:center;color:#2c3445}
.ggt b.ov{color:#c0392b}
.ggl{font-size:11.5px;line-height:1.3;color:var(--mut);text-align:center}
.gl,.gx{width:100%;font-size:12px;line-height:1.38}
.gl div{padding:0 6px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gl div.on{background:#1d2330;color:#fff}
.gk{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 8px;font-size:12px;line-height:1.38}
.gk span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gk span:nth-child(odd){color:var(--mut)}
.gk span:nth-child(even){font-family:var(--mono);text-align:right}
.gx div{display:flex;gap:5px;white-space:nowrap;overflow:hidden}
.gx i{flex:none;width:1em;font-style:normal;text-align:center;color:#98a0ae}
.gx .c-ok i{color:#1a7f4b}
.gx .c-no{color:#c0392b;font-weight:600}
.gx .c-no i{color:#c0392b}
.gx .c-skip{color:#a3a8b3}
.gt{text-align:center;line-height:1.2}
.gt b{display:block;font:700 19px/1.25 var(--mono)}
.gt span{display:block;font-size:11.5px;line-height:1.3;color:var(--mut)}
.gt.t-ok b{color:#1a7f4b}.gt.t-run b{color:#b26a00}.gt.t-fail b{color:#c0392b}
.ptg code,.wl code,.pts code{font-size:.92em;padding:0 2px}
/* 图层：主流程 / 为什么 / 易混点 */
.scn .o-why,.scn .o-trap{display:none}
.scn.l-why .has-why .o-main,.scn.l-trap .has-trap .o-main{display:none}
.scn.l-why .has-why .o-why,.scn.l-trap .has-trap .o-trap{display:inline}
.scn.l-why .pt.has-why .pts{background:#fff;border-top:2px solid var(--c,#b9c0cc)}
.scn.l-why .pt:not(.has-why) .pts{opacity:.42}
.scn.l-why .wl.has-why{border-left:4px solid var(--c,#b9c0cc);text-align:left}
.scn.l-why .wl:not(.has-why){opacity:.42}
.scn.l-trap .pt:not(.has-trap){opacity:.32}
.scn.l-trap .wl:not(.has-trap){opacity:.3}
.scn.l-trap .wr:not(.has-trap){opacity:.25}
.scn.l-trap .pt.has-trap{box-shadow:0 0 0 2px #d9822b}
.scn.l-trap .pt.has-trap .pts{background:#fff1e0;color:#7a4300}
.scn.l-trap .wl.has-trap{background:#fff1e0;border-color:#d9822b;color:#7a4300;text-align:left}
.scn.l-trap .wr.has-trap{color:#d9822b}
/* 推演：点亮这一步碰到的，其余压暗 */
.scn.st .pt{opacity:.38}
.scn.st .wr{opacity:.2}
.scn.st .wl{opacity:.3}
.scn.st .pt.fx,.scn.st .wr.fx,.scn.st .wl.fx{opacity:1}
.scn.st .pt.fx{box-shadow:0 0 0 2.5px var(--acc)}
.scn.st .wr.fx{color:var(--acc)}
.scn.st .wr.fx .wp{stroke-width:2.4}
.scn.st .wl.fx{border-color:var(--acc);color:var(--acc);font-weight:600}
.scn .pt.sel,.scn .wl.sel,.scn .wr.sel{opacity:1!important}
.scn .pt.sel{box-shadow:0 0 0 3px var(--ink)!important}
.scn .wl.sel{background:var(--ink)!important;border-color:var(--ink)!important;color:#fff!important}
.scn .wr.sel{color:var(--ink)!important}
.scn .wr.sel .wp{stroke-width:2.8}
/* 底部推演条 */
#play{position:fixed;z-index:31;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom));width:min(980px,calc(100vw - 24px));box-sizing:border-box;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(20,25,40,.18);font-size:14px;color:var(--ink)}
#play[hidden],#xp[hidden]{display:none}
body.nar #play{left:8px;right:8px;width:auto;transform:none}
body.wide.xpo #play{left:12px;transform:none;width:min(980px,calc(100vw - 464px))}
body.wide.xpo #dock{left:calc((100vw - 440px)/2)}
body.nar.xpo #play{display:none}
.pr1{display:flex;align-items:center;gap:8px;padding:5px 6px}
.seg{display:flex;background:#eeece5;border-radius:8px;padding:2px}
.seg button{border:0;background:none;height:30px;padding:0 10px;border-radius:6px;font:13px/1 var(--sans);color:#2c3445;cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.18);font-weight:700}
.seg small{margin-left:3px;font-size:11px;color:var(--mut);font-weight:400}
.pnav{margin-left:auto;display:flex;align-items:center;gap:4px;flex:none}
.pnav button,.pcol{height:30px;min-width:34px;border:1px solid var(--line);background:#fff;border-radius:8px;font:13px/1 var(--sans);color:var(--ink);cursor:pointer}
.pnav button{white-space:nowrap}
.pnav button:disabled{opacity:.35;cursor:default}
.pnav button.go{background:var(--acc);border-color:var(--acc);color:#fff;padding:0 12px}
.pcnt{min-width:3.6em;text-align:center;font:12.5px/1 var(--mono);color:var(--mut)}
.pbody{border-top:1px solid var(--line);padding:8px 12px 10px;max-height:30vh;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;font-size:14.5px;line-height:1.55}
body.wide #play .pbody{height:150px;max-height:none;box-sizing:border-box}
body.wide #play.nost .pbody{height:auto}
body.wide #play.ov .pbody{height:auto;padding:7px 12px 8px}
body.wide #play.ov .phint{margin:0}
body.wide #play.ov .pidx{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;margin-top:6px;padding-bottom:3px}
body.wide #play.ov .pidx button{flex:none}
#play.col .pbody{display:none}
.pbody p{margin:2px 0 4px}
.pbody h4{display:flex;align-items:center;gap:7px;margin:0 0 4px;font-size:15px;line-height:1.4}
.pbody h4 button{margin-left:auto;border:0;background:none;font:12.5px/1.4 var(--sans);color:var(--acc);cursor:pointer;padding:2px 4px;white-space:nowrap}
.pk{display:block;font-size:11.5px;line-height:1.5;letter-spacing:.06em;color:var(--mut)}
body.wide .pcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 18px}
#play .note{margin:2px 0 0;padding:5px 10px;font-size:14px}
.phint{color:#2c3445}
body.nar .ph-l,body.wide .ph-s{display:none}
body.nar .pr1{gap:6px}
body.nar .seg{min-width:0}
body.nar .seg button{padding:0 7px}
body.nar .pnav button.go{padding:0 9px}
body.nar #play.ov .pcnt,body.nar #play.ov .pnav button:disabled{display:none}
body.nar .pidx{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
body.nar .pidx::-webkit-scrollbar{display:none}
body.nar .pidx button{flex:none}
.pidx{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pidx button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:2px 10px 2px 3px;font:13px/1.5 var(--sans);color:var(--ink);cursor:pointer}
.ph .seg button{padding:0 7px;font-size:12.5px}
.ph .pr1{gap:5px}
/* 说明卡：桌面是右侧抽屉，手机是底部抽屉 */
#xp{position:fixed;z-index:44;display:flex;flex-direction:column;background:#fff;color:var(--ink)}
body.wide #xp{top:48px;right:0;bottom:0;width:440px;border-left:1px solid var(--line);box-shadow:-6px 0 24px rgba(20,25,40,.14)}
body.nar #xp{left:0;right:0;bottom:0;max-height:58vh;border-radius:14px 14px 0 0;box-shadow:0 -6px 24px rgba(20,25,40,.22)}
.xh{flex:none;display:flex;align-items:flex-start;gap:8px;padding:11px 10px 8px 14px;border-bottom:1px solid var(--line)}
.xt{flex:1;min-width:0;font-size:17px;line-height:1.4}
.xt code{font:12px/1.5 var(--mono);color:var(--mut);background:none;padding:0;border:0;word-break:break-all}
.xk{display:inline-block;margin-right:7px;padding:0 6px;border-radius:4px;background:#eeece5;color:#555;font-size:11px;line-height:18px;vertical-align:2px;font-weight:400}
.xft{font-size:12.5px;color:var(--mut);font-weight:400}
.xx{flex:none;width:32px;height:32px;border:0;border-radius:8px;background:#f1f0ea;font-size:14px;color:var(--ink);cursor:pointer}
.xb{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:2px 14px 14px}
.xb h5{margin:14px 0 2px;font-size:13px;line-height:1.5;letter-spacing:.04em;color:var(--acc)}
.xb .xs-traps h5{color:#b8650f}
.xb p{margin:6px 0;font-size:15px;line-height:1.65}
.xb .note{margin:8px 0}
.xnone{color:var(--mut)}
.xgo{display:block;width:100%;box-sizing:border-box;margin:12px 0 0;padding:8px 10px;border:1px solid var(--acc);border-radius:8px;background:#f2f6ff;color:var(--acc);font:14px/1.4 var(--sans);text-align:left;cursor:pointer}
.xf{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px calc(6px + env(safe-area-inset-bottom));border-top:1px solid var(--line);font:12.5px/1 var(--mono);color:var(--mut)}
.xf button{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font:13px/1 var(--sans);color:var(--ink);cursor:pointer}
.wl{width:max-content}
.scn.l-why .wl.has-why,.scn.l-trap .wl.has-trap{max-width:min(11em,var(--mx,999px))}
.scn.l-why .wl.v.has-why,.scn.l-trap .wl.v.has-trap{max-width:13em}
</style>
</head>
<body>
<header id="top"><button id="bmap">☰ 地图</button><nav id="crumb"></nav><button id="bleg">图例</button></header>
<div id="stage"><div id="world"></div></div>
<aside id="side"></aside>
<div id="legend" hidden></div>
<div id="hint"></div>
<nav id="dock"><button data-act="up">↑ 上层</button><button data-act="prev">‹ 上页</button><button data-act="fit" class="pos" title="回正；已经回正时再点一次看全图">1 / 1</button><button data-act="next">下页 ›</button><button data-act="kids">▾ 下层</button></nav>
<div id="zb"><button data-act="zin" title="放大">＋</button><button data-act="zout" title="缩小">－</button><button data-act="all" title="看全图">⤢</button></div>

"}]},{"t":"note","k":"n4","lv":"注释","html":"防死锁：批已经空了，就强制清掉 <code>batch_is_full<\/code>——否则没有请求可离开，标志永远清不掉，装入永远关着。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"An empty batch has no request left to leave, and only a leaving","raw":["python/sglang/srt/managers/scheduler.py:4602-4602"],"rh":"<a class=\"ref\" data-k=\"python/sglang/srt/managers/scheduler.py:4602-4602\" title=\"python/sglang/srt/managers/scheduler.py:4602\">scheduler.py:4602<\/a>"}]}],"traps":[{"t":"p","html":"<code>batch_is_full<\/code> <b>不是每圈重算<\/b>的：它被置位后一直保持，直到有请求离开批。看到「满」不代表这一圈重新量过。"},{"t":"p","html":"闸门只管「开不开始」。一条请求装不装得下，要到下一步逐条试才知道。"}]},"to":["schedloop.gate"]},{"id":"order","name":"排队序","code":"waiting_queue.reorder","kind":"act","n":"3","d":[630,30,170,150],"m":[76,416,188,124],"glyph":{"g":"kv","rows":[["策略","fcfs"],["队列","[A]"],["A 命中","0 个"]]},"say":"默认先来先服务，队列不动","why":"排序在闸门之后","trap":"FCFS 也匹配前缀","card":{"does":[{"t":"p","html":"给 <code>waiting_queue<\/code> 排个序，并给每条等待请求在 radix 树里找一次最长的已缓存前缀（<a class=\"ref\" data-k=\"python/sglang/srt/managers/scheduler.py:4651-4661\" title=\"python/sglang/srt/managers/scheduler.py:4651-4661\">scheduler.py:4651–4661<\/a>）。"},{"t":"p","html":"默认策略是 <code>fcfs<\/code>（<a class=\"ref\" data-k=\"python/sglang/srt/arg_groups/fields/schedule.py:109-109\" title=\"python/sglang/srt/arg_groups/fields/schedule.py:109\">schedule.py:109<\/a>）：不开优先级调度时队列保持入队顺序（<a class=\"ref\" data-k=\"python/sglang/srt/managers/schedule_policy.py:355-359\" title=\"python/sglang/srt/managers/schedule_policy.py:355-359\">schedule_policy.py:355–359<\/a>），所以这一步基本不改顺序。"}],"how":[{"t":"p","html":"<code>reorder<\/code> 只许改顺序，成员变了会抛错（<a class=\"ref\" data-k=\"python/sglang/srt/managers/scheduler_components/request_list.py:183-191\" title=\"python/sglang/srt/managers/scheduler_components/request_list.py:183-191\">request_list.py:183–191<\/a>）。"},{"t":"p","html":"别的策略分两类：看缓存的（<code>lpm<\/code> 最长前缀优先、<code>dfs-weight<\/code>、<code>hrrn<\/code>、<code>shortest-prefill-first<\/code>、 −5=195"],["预留","195×0.7=136.5"]]},"say":"先替在跑的请求留出空间","why":"免得 decode 中途没地方","trap":"比例小于 1，是估的","card":{"does":[{"t":"p","html":"装入器一上来先给每条<b>在跑<\/b>请求预留它还要生成的那部分显存，从「余量」里扣掉：每条预留 = <code>min(max_new_tokens − 已生成, 4096) × new_token_ratio<\/code>；<code>ignore_eos<\/code> 的请求比例取 1（<a class=\"ref\" data-k=\"python/sglang/srt/managers/schedule_policy.py:1174-1185\" title=\"python/sglang/srt/managers/schedule_policy.py:1174-1185\">schedule_policy.py:1174–1185<\/a>）。"}],"how":[{"t":"p","html":"例子：B 的 <code>max_new_tokens<\/code> = 200，已生成 5 个（设）：min(195, 4096) × 0.7 = <b>136.5<\/b>。0.7 是 ratio 的初值（<a class=\"ref\" data-k=\"python/sglang/srt/environ.py:708-708\" title=\"python/sglang/srt/environ.py:708\">environ.py:708<\/a>）。"},{"t":"p","html":"预留之和是「总量」账的初始偏移 <code>total_offset<\/code>（<a class=\"ref\" data-k=\"python/sglang/srt/managers/schedule_policy.py:1095-1100\" title=\"python/sglang/srt/managers/schedule_policy.py:1095-1100\">schedule_policy.py:1095–1100<\/a>）。"},{"t":"p","html":"4096 只截断这个<b>估计<\/b>，不改请求真正的停止条件（<a class=\"ref\" data-k=\"python/sglang/srt/managers/schedule_policy.py:92-96\" title=\"python/sglang/srt/managers/schedule_policy.py:92-96\">schedule_policy.py:92–96<\/a>）。"}],"why":[{"t":"note","k":"n1","lv":"注释","html":"新请求不能把在跑请求将来要用的 KV 抢光，否则 decode 中途没地方放新 token。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"Fixed token pool. Offsets include pending allocations and decode headroom.","raw":["python/sglang/srt/mem_cache/prefill_budget.py:91-91"],"rh":"<a class=\"ref\" data-k=\"python/sglang/srt/mem_cache/prefill_budget.py:91-91\" title=\"python/sglang/srt/mem_cache/prefill_budget.py:91\">prefill_budget.py:91<\/a>"}]},{"t":"note","k":"n2","lv":"注释","html":"太大的 <code>max_new_tokens<\/code> 要截断，否则服务器会过于保守。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"This can prevent the server from being too conservative.","raw":["python/sglang/srt/managers/schedule_policy.py:93-93"],"rh":"<a class=\"ref\" data-k=\"python/sglang/srt/managers/schedule_policy.py:93-93\" title=\"python/sglang/srt/managers/schedule_policy.py:93\">schedule_policy.py:93<\/a>"}]},{"t":"note","k":"n3","lv":"推断","html":"乘一个小于 1 的比例：大多数请求会提前遇到结束符，全按上限预留会让并发上不去。估错了怎么办——走撤回（见 decode 那一层）。","tag":null,"who":null,"more":null,"ev":[]}],"traps":[{"t":"p","html":"这个比例不是常数：撞墙撤回之后会被重估，之后每个 decode 步又慢慢降下来（见撤回那一页）。"}]},"to":[]},{"id":"ledger","name":"本圈的几本账","code":"PrefillBudget","kind":"store","n":"2","d":[330,30,170,150],"m":[76,194,188,150],"glyph":{"g":"kv","rows":[["KV 总量","99863.5"],["块预算","8192"],["输入预算","16384"]]},"say":"总量、当前、块大小三本账","why":"总量含将来，当前只含眼前","trap":"可驱逐的也算余量","card":{"does":[{"t":"p","html":"装入器手里的预算：<b>KV 总量<\/b>、<b>KV 当前<\/b>、输入 token（默认 16384）、块大小（80GB 档默认 8192）；外加两个个数上限：请求槽、<code>prefill_max_requests<\/code>（默认不限）。"}],"how":[{"t":"p","html":"KV 总量 <code>remaining_total<\/code> = 池里可用 + 可驱逐 − <code>total_offset<\/code>（<a class=\"ref\" data-k=\"python/sglang/srt/mem_cache/prefill_budget.py:155-157\" title=\"python/sglang/srt/mem_cache/prefill_budget.py:155-157\">prefill_budget.py:155–157<\/a>）。"},{"t":"p","html":"KV 当前 <code>remaining_current<\/code> = 同样的余量 − <code>current_offset<\/code>（<a class=\"ref\" data-k=\"python/sglang/srt/mem_cache/prefill_budget.py:159-161\" title=\"python/sglang/srt/mem_cache/prefill_budget.py:159-161\">prefill_budget.py:159–161<\/a>）。"},{"t":"p","html":"区别：总量账含「在跑请求将来要生成的」，当前账只含「眼前要写进去的」。例子（设）：池 100000，总量 = 100000 − 136.5 = 99863.5。底稿没给当前账的初值，这里不写数。"},{"t":"p","html":"输入 token 与块大小每装一条都扣同样的量；默认块大小 8192 比 16384 小，所以先耗尽的是块（推断，<a class=\"ref\" data-k=\"python/sglang/srt/managers/schedule_policy.py:1385-1391\" title=\"python/sglang/srt/managers/schedule_policy.py:1385-1391\">schedule_policy.py:1385–1391<\/a>）。"}],"why":[{"t":"note","k":"n4","lv":"推断","html":"把「可驱逐」的也算进余量：radix 树里的缓存本来就是需要时可以让出的，不算的话会把能用的空间白白浪费掉。","tag":null,"who":null,"more":null,"ev":[]},{"t":"note","k":"n5","lv":"推断","html":"分两本账：一本管「会不会撑爆」（含将来），一本管「眼前这一步写不写得下」（只含眼前）。底稿没找到写明这一设计理由的注释。","tag":null,"who":null,"more":null,"ev":[]}],"traps":[{"t":"p","html":"「可驱逐」也算余量，但装入时会给命中的树节点<b>临时加锁<\/b>，让自己要复用的前缀不算可驱逐，免得余量虚高（<a class=\"ref\" data-k=\"python/sglang/srt/managers/schedule_policy.py:2052-2052\" title=\"python/sglang/srt/managers/schedule_policy.py:2052\">schedule_policy.py:2052<\/a>）。"},{"t":"p","html":"<code>max_prefill_tokens<\/code> 名字像主角，其实默认配置下块大小先到零；它真正当主角是关掉分块的时候。"}]},"to":["schedloop.adder.budget"]},{"id":"check","name":"装得下吗","code":"check_prefill","kind":"gate","n":"3","d":[630,30,170,130],"m":[76,394,188,130],"glyph":{"g":"checks","rows":[["83 &lt; 99863.5","ok"]]},"say":"总占量 &lt; 总量余量才放行","why":"严格小于，贴线就不装","trap":"还要算前缀命中","card":{"does":[{"t":"p","html":"先算这条请求要占多少，再对着「KV 总量」比：<code>total_tokens &lt; remaining_total<\/code> 才放行（<a class=\"ref\" data-k=\"python/sglang/srt/mem_cache/prefill_budget.py:211-215\" title=\"python/sglang/srt/mem_cache/prefill_budget.py:211-215\">prefill_budget.py:211–215<\/a>）。不过就被拒绝（<code>NO_TOKEN<\/code>；永远装不下的是 <code>UNSCHEDULABLE<\/code>）。"}],"how":[{"t":"p","html":"总占量 = (整段待填长度 − 命中前缀) + 还可能生成的 token（截到 4096）+ 每请求额外一页（<a class=\"ref\" data-k=\"python/sglang/srt/managers/schedule_policy.py:2215-2229\" title=\"python/sglang/srt/managers/schedule_policy.py:2215-2229\">schedule_policy.py:2215–2229<\/a>）。"},{"t":"p","html":"例子：A 整段 18、命中 0、最多再生成 64、页 = 1 个 token（设）：18 + 64 + 1 = <b>83<\/b>；余量 99863.5；83 &lt; 99863.5，过。"},{"t":"p","html":"命中的前缀越长，要算的越少：<code>extend_len = 整段 − prefix_len<\/code>（<a class=\"ref\" data-k=\"python/sglang/srt/managers/schedule_policy.py:2244-2244\" title=\"python/sglang/srt/managers/schedule_policy.py:2244\">schedule_policy.py:2244<\/a>）。"},{"t":"p","html":"为什么多留一页：分页的分配器可能给每条请求多占一页。"}],"why":[{"t":"note","k":"n6","lv":"注释","html":"每请求多留一页，给页对齐的开销。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"Reserve page_size for page-alignment overhead: the paged allocator may","raw":["python/sglang/srt/managers/schedule_policy.py:2217-2217"],"rh":"<a class=\"ref\" data-k=\"python/sglang/srt/managers/schedule_policy.py:2217- agers/scheduler.py:4876-4880\">scheduler.py:4876–4880<\/a>）。"},{"t":"p","html":"<code>UNSCHEDULABLE<\/code>：这条<b>永远<\/b>装不下（没有任何持有显存的请求会还内存），单独收集、<code>continue<\/code>，循环后直接中止它并回错（<a class=\"ref\" data-k=\"python/sglang/srt/managers/scheduler.py:4890-4894\" title=\"python/sglang/srt/managers/scheduler.py:4890-4894\">scheduler.py:4890–4894<\/a>）。"}],"why":[{"t":"note","k":"n12","lv":"注释","html":"永远装不下就不能留队等，否则它会永远排在队里。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"Nothing holding memory will give it back: waiting would","raw":["python/sglang/srt/managers/scheduler.py:4891-4891"],"rh":"<a class=\"ref\" data-k=\"python/sglang/srt/managers/scheduler.py:4891-4891\" title=\"python/sglang/srt/managers/scheduler.py:4891\">scheduler.py:4891<\/a>"}]},{"t":"note","k":"n13","lv":"推断","html":"遇到第一个装不下的就停、不跳过去找小的：跳过会让大请求在小请求不断到来时饿死，停下来等则保证队首最终有机会（与 FCFS 的公平语义一致）。代码和提交都没写理由。","tag":null,"who":null,"more":null,"ev":[]}],"traps":[{"t":"p","html":"装入失败是<b>留队等<\/b>，不是撤回：撤回只发生在 decode 时 KV 不够（见撤回那一层）。"},{"t":"p","html":"队首的大请求会挡住后面的小请求，是这个设计的已知代价。"}]},"to":["schedloop.adder.loop"]}],"wires":[{"id":"w_res","f":"reserve","t":"ledger","label":"先留出空间","ml":"先预留","n":"1","why":"总量余量 = 池 − 预留","trap":null,"card":{"does":[{"t":"p","html":"在跑请求的预留，就是「总量」账的初始偏移：从可用 + 可驱逐里先扣掉它。"}],"how":[{"t":"p","html":"例子：100000 − 136.5 = 99863.5（设）。"}],"why":[{"t":"note","k":"n14","lv":"注释","html":"偏移里含 decode 的余量。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"Fixed token pool. Offsets include pending allocations and decode headroom.","raw":["python/sglang/srt/mem_cache/prefill_budget.py:91-91"],"rh":"<a class=\"ref\" data-k=\"python/sglang/srt/mem_cache/prefill_budget.py:91-91\" title=\"python/sglang/srt/mem_cache/prefill_budget.py:91\">prefill_budget.py:91<\/a>"}]}],"traps":[{"t":"p","html":"预留是估计（<code>max_new × ratio<\/code>），不是真实占用；估低了的后果在 decode 那一层。"}]},"to":[],"fs":null,"ts":null,"mfs":null,"mts":null,"lp":null,"mlp":null,"cls":null},{"id":"w_read","f":"ledger","t":"check","labe <script>
(function(){
'use strict';
var D=JSON.parse(document.getElementById('data').textContent),M=D.meta;
var byId={},par={},DEP={},ORD=[],OI={},maxDep=0;
(function ix(n,p,d){byId[n.id]=n;par[n.id]=p;DEP[n.id]=d;OI[n.id]=ORD.length;ORD.push(n.id);if(d>maxDep)maxDep=d;n.children.forEach(function(c){ix(c,n.id,d+1);});})(D.root,null,0);
var SOLO=!D.root.children.length;if(SOLO)document.body.classList.add('solo');
var LV={};M.levels.forEach(function(l){LV[l.name]=l;});
function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function pathOf(id){var r=[];while(id){r.unshift(id);id=par[id];}return r;}
function walk(n,f){f(n);n.children.forEach(function(c){walk(c,f);});}
function bd(lv){if(lv==null)return '';var l=LV[lv]||{cls:'fact'};return '<span class="bd lv-'+l.cls+'">'+(l.mark?esc(l.mark)+' ':'')+esc(lv)+'</span>';}
function cap(b){return b.cap?'<div class="cap">'+b.cap+'</div>':'';}
function rng(a,b){return a+(b>a?'–'+b:'');}
/* ---------- 代码行 ---------- */
var KW=/\b(if|else|while|for|return|break|continue|goto|static|int|long|unsigned|void|size_t|struct|define|NULL|sizeof|double|char|const|uint8_t|uint64_t)\b/g;
function kw(t){return esc(t).replace(KW,'<span class="k-k">$1</span>');}
function cs(t){return '<span class="k-c">'+esc(t)+'</span>';}
function hi(s,isC,st){
  var m=/^[ \t]*/.exec(s)[0],ind=m.replace(/\t/g,'    '),rest=s.slice(m.length),out='';
  if(!isC){out=/^#/.test(rest)?cs(rest):esc(rest);}
  else if(!st.inC&&/^\*(\s|\/|$)/.test(rest)){out=cs(rest);}
  else{
    var i=0;
    while(i<rest.length){
      if(st.inC){var e=rest.indexOf('*/',i);if(e<0){out+=cs(rest.slice(i));i=rest.length;}else{out+=cs(rest.slice(i,e+2));i=e+2;st.inC=false;}continue;}
      var a=rest.indexOf('/*',i),b=rest.indexOf('//',i),q=rest.indexOf('"',i),nx=-1,kind='';
      [[a,'c'],[b,'l'],[q,'s']].forEach(function(x){if(x[0]>=0&&(nx<0||x[0]<nx)){nx=x[0];kind=x[1];}});
      if(nx<0){out+=kw(rest.slice(i));break;}
      out+=kw(rest.slice(i,nx));
      if(kind==='c'){st.inC=true;i=nx;var e2=rest.indexOf('*/',nx+2);if(e2<0){out+=cs(rest.slice(nx));i=rest.length;}else{out+=cs(rest.slice(nx,e2+2));i=e2+2;st.inC=false;}}
      else if(kind==='l'){out+=cs(rest.slice(nx));i=rest.length;}
      else{var j=nx+1;while(j<rest.length&&rest[j]!=='"'){if(rest[j]==='\\')j++;j++;}out+='<span class="k-s">'+esc(rest.slice(nx,j+1))+'</span>';i=j+1;}
    }
  }
  return (ind?'<span class="ind">'+ind+'</span>':'')+(out||'\u200b');
}
function linesH(file,a,lines,st,hl,byEnd){
  var isC=/\.(c|h)$/.test(file),h='';
  lines.forEach(function(ln,i){
    var no=a+i;
    h+='<div class="cl'+(hl&&hl[no]?' hl':'')+'"><span class="no">'+no+'</span><span class="tx">'+hi(ln,isC,st)+'</span></div>';
    if(byEnd&&byEnd[no])byEnd[no].forEach(function(n){h+=noteH(n,true,true);});
  });
  return h;
}

/* ---------- 各种块 ---------- */
function noteH(n,inCode,withId){
  var l=LV[n.lv]||{cls:'fact'};
  var h='<div class="note lv-'+l.cls+'"'+(withId?' id="nt-'+n.k+'"':'')+'><div class="nh">'+bd(n.lv);
  if(n.who)h+='<span class="who">'+esc(M.who[n.who]||n.who)+'</span>';
  if(n.tag)h+='<span class="tg">'+esc(n.tag)+'</span>';
  if(inCode)h+='<span class="ln">第 '+rng(n.a,n.b)+' 行</span>';
  h+='</div><div class="nb">'+n.html+'</div>';
  n.ev.forEach(function(e){
    h+='<div class="ev">'+(e.lv!==n.lv?bd(e.lv)+' ':'<span class="evl">依据 </span>')+e.rh+(e.q?'<div class="q" title="点一下展开/收起">'+esc(e.q)+'</div>':'')+'</div>';
  });
  if(n.more)h+='<details class="more"><summary>展开</summary><div class="mb">'+n.more+'</div></details>';
  return h+'</div>';
}
function codeH(b){
  var h='<figure class="code"><figcaption><span class="fn">'+esc(b.file)+'</span><span class="rg">第 '+b.parts.map(function(p){return rng(p.a,p.b);}).join('、')+' 行</span>'+(b.notes.length?'<button class="tgl">只看代码</button>':'')+'</figcaption><div class="cb">';
  var byEnd={},hl={},st={inC:false};
  b.notes.forEach(function(n){(byEnd[n.b]=byEnd[n.b]||[]).push(n);for(var i=n.a;i<=n.b;i++)hl[i]=1;});
  b.parts.forEach(function(p,pi){
    if(pi>0){var pv=b.parts[pi-1];st.inC=false;
      h+='<div class="gap">'+(p.a>pv.b+1?'⋯ 省略第 '+rng(pv.b+1,p.a-1)+' 行 ⋯':'⋯ 以下是另一处 ⋯')+'</div>';}
    h+=linesH(b.file,p.a,p.lines,st,hl,byEnd);
  });
  return h+'</div>'+cap(b)+'</figure>';
}
function tableH(b){
  var h='<figure class="tb"><table><thead><tr>'+b.head.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr></thead><tbody>';
  b.rows.forEach(function(r){h+='<tr>'+r.map(function(c,j){return '<td data-h="'+esc(b.head[j]||'')+'">'+(c==null?'':c)+'</td>';}).join('')+'</tr>';});
  return h+'</tbody></table>'+cap(b)+'</figure>';
}
function flowH(b){
  var h='<ol class="flow">';
  b.steps.forEach(function(s){
    h+='<li class="fs"'+(s.to?' data-to="'+s.to+'"':'')+'><span class="fk">'+esc(s.k)+'</span><div class="fbody"><div class="ft">'+(s.to?'<span class="go">下钻 ›</span>':'')+s.title+'</div>';
    if(s.sub)h+='<div class="fsub">'+s.sub+'</div>';
    if(s.ref)h+='<div class="fref">'+s.ref+'</div>';
    if(s.out&&s.out.length)h+='<div class="fo">'+s.out.map(function(o){return '<span class="pill o-'+o.lv+'">'+esc(o.text)+'</span>';}).join('')+'</div>';
    if(s.loop)h+='<div class="floop">↻ 这一步会重复</div>';
    h+='</div></li>';
  });
  return h+'</ol>'+cap(b);
}
function barH(b){
  return '<figure class="bar"><div class="bar-r">'+b.segs.map(function(s,i){return '<span class="seg k-'+s.kind+'" style="flex:'+s.w+' 1 0">'+(i+1)+'</span>';}).join('')+'</div><ol class="bar-l">'+b.segs.map(function(s){return '<li class="k-'+s.kind+'">'+esc(s.label)+(s.tag?'<em>'+esc(s.tag)+'</em>':'')+'</li>';}).join('')+'</ol>'+cap(b)+'</figure>';
}
function collectH(b,host){
  var g={},td={};b.keys.forEach(function(k){g[k]=[];});(M.tags||[]).forEach(function(t){td[t.name]=t.desc;});
  walk(D.root,function(n){if(n.id===host)return;n.blocks.forEach(function(bl){
    (bl.t==='note'?[bl]:bl.t==='code'?bl.notes:[]).forEach(function(x){var key=b.by==='tag'?x.tag:x.lv;if(key!=null&&g[key])g[key].push([n,x]);});});});
  var h='';
  b.keys.forEach(function(k){
    if(!g[k].length)return;
    if(b.keys.length>1)h+='<h2>'+esc(k)+'<small>'+g[k].length+' 处'+(b.by==='tag'&&td[k]?' · '+esc(td[k]):'')+'</small></h2>';
    else h+='<div class="cnt">共 '+g[k].length+' 条，散在各处；点「去看」跳到它所在的那行代码旁边。</div>';
    g[k].forEach(function(it){var n=it[0],x=it[1],l=LV[x.lv]||{cls:'fact'};
      h+='<div class="note lv-'+l.cls+'"><div class="nh">'+bd(x.lv)+(x.who?'<span class="who">'+esc(M.who[x.who]||x.who)+'</span>':'')+(b.by!=='tag'&&x.tag?'<span class="tg">'+esc(x.tag)+'</span>':'')+'<a class="goto" href="#/'+n.id+'~'+x.k+'">去看：'+esc(n.nav)+' ›</a></div><div class="nb">'+x.html+'</div></div>';});
  });
  return h;
}

  var eT=fig.querySelector('.fr-t'),eC=fig.querySelector('.fr-c'),eI=fig.querySelector('.fr-inc'),eR=fig.querySelector('.fr-cells'),eS=fig.querySelector('.fr-say');
  var bP=fig.querySelector('.fp'),bA=fig.querySelector('.fa'),bX=fig.querySelector('.fx');

/* 落点对齐到整像素。
   每一页（.nf）都是缩小了塞在上一层格子里的。带 scale 的元素，浏览器「画它」和「判定点没点中它」时，
   会把它在上一层里的落点四舍五入到整像素；可 getBoundingClientRect 量到的仍是带小数的落点。
   两者最多差半个像素——是上一层尺度里的半个像素。镜头飞到第三、四层要放大三十到一百多倍，
   这半个像素就成了十几到几十个屏幕像素：镜头按量到的位置停，停歪；脚本按量到的位置点，点空。
   （实测：第四层差 81px。跟屏幕密度无关，只看排版恰好落在几点几像素上。）
   所以这里把每一页相对「上一层那一页」的落点补成整数：量到的 = 画出来的 = 点得中的。
   画面不会因此挪动——它本来就画在整像素上，补的只是排版位置里那点小数。
   所有数都取 1/64 像素的整倍数（浏览器排版的最小单位），免得它再舍入一次。 */
function q64(v){return Math.round(v*64)/64;}
function snapAll(){
  var m=[];
  ORD.forEach(function(id){
    if(id===ROOT)return;
    var el=F[id],pe=F[par[id]];
    if(!el||!pe||el._bl==null)return;
    var a=el.getBoundingClientRect(),b=pe.getBoundingClientRect(),k=b.width/pe.offsetWidth;
    if(!(k>0))return;
    m.push({el:el,x:(a.left-b.left)/k-(el._sx||0),y:(a.top-b.top)/k-(el._sy||0)});
  });
  m.forEach(function(o){
    var sx=q64(Math.round(o.x)-o.x),sy=q64(Math.round(o.y)-o.y),el=o.el;
    if(sx===el._sx&&sy===el._sy)return;
    el._sx=sx;el._sy=sy;
    el.style.left=(el._bl+sx)+'px';
    el.style.top=sy+'px';
  });
}
