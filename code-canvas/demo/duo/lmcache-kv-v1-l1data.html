ip 按 block 向下取整","card":{"does":[{"t":"p","html":"把 vLLM 的分页 block 和 L1 里连续的对象互相搬：一个 chunk = 16 个 block ↔ 一个 <code>[kv][layer][token][nh*hs]<\/code> 对象（例子里 36 MiB）。有三条路径，按条件挑一条。"}],"how":[{"t":"p","html":"平铺：第 j 个 block id → 对象里第 j×16 到 j×16+15 个 token。b0–b15 → h0，b16–b31 → h1，b32–b47 → h2。block 编号不必连续，只要按顺序给（内核源码见下一层）。"},{"t":"p","html":"三选一（每段同类对象挑一次）：<b>direct<\/b> 每个 chunk 一次 <code>cudaMemcpyBatchAsync<\/code>，不用暂存、不跑内核；<b>native plan<\/b> 暂存拷贝 + 内核，整批一次 native 调用；<b>staged loop<\/b> 兜底，逐批在 Python 里发射。 <a class=\"ref\" data-k=\"lmcache/v1/multiprocess/object_group_transfer/dispatch.py:69-111\" title=\"lmcache/v1/multiprocess/object_group_transfer/dispatch.py:69-111\">dispatch.py:69–111<\/a>"},{"t":"p","html":"例子：每层每块 16 token × 1024 × 2 B = <b>32 KiB<\/b>；direct 的门槛是「小于 32 KiB 才拒」，刚好过线。 <a class=\"ref\" data-k=\"lmcache/v1/multiprocess/object_group_transfer/direct_copy.py:110-113\" title=\"lmcache/v1/multiprocess/object_group_transfer/direct_copy.py:110-113\">direct_copy.py:110–113<\/a>"},{"t":"p","html":"staged 的方向：取回先 stage（宿主→暂存）再内核（暂存→分页）；存反过来。 <a class=\"ref\" data-k=\"lmcache/v1/multiprocess/object_group_transfer/staged.py:399-413\" title=\"lmcache/v1/multiprocess/object_group_transfer/staged.py:399-413\">staged.py:399–413<\/a>"}],"why":[{"t":"note","k":"n11","lv":"注释","html":"32 KiB 门槛：块再小，逐条 memcpy 的开销占上风，staged 内核路径更快。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"Smallest per-layer paged block the direct path moves. Below it, per-entry cost dominates and the staged kernel path wins","raw":["lmcache/v1/multiprocess/object_group_transfer/direct_copy.py:38-39"],"rh":"<a class=\"ref\" data-k=\"lmcache/v1/multiprocess/object_group_transfer/direct_copy.py:38-39\" title=\"lmcache/v1/multiprocess/object_group_transfer/direct_copy.py:38-39\">direct_copy.py:38–39<\/a>"}]},{"t":"note","k":"n12","lv":"文档","html":"direct 没有配置开关，能走就走。","tag":null,"who":null,"more":null,"ev":[{"lv":"文档","q":"There is no configuration knob: the direct path is taken whenever it can be.","raw":["docs/design/v1/multiprocess/lmcache_driven_transfer_copy_paths.md:232-232"],"rh":"<a class=\"ref\" data-k=\"docs/design/v1/multiprocess/lmcache_driven_transfer_copy_paths.md:232-232\" title=\"docs/design/v1/multiprocess/lmcache_driven_transfer_copy_paths.md:232\">lmcache_driven_transfer_copy_paths.md:232<\/a>"}]},{"t":"note","k":"n13","lv":"推断","html":"例子落在哪条取决于构建：CUDA ≥ 12.8 走 direct，否则走 native plan / staged。","tag":null,"who":null,"more":null,"ev":[]},{"t":"note","k":"n14","lv":"推断","html":"staged 为什么要经过 GPU 暂存缓冲，仓库没写；猜测是大块连续 DMA 吃满带宽，内核只做 GPU 内部的分散 / 收集。","tag":null,"who":null,"more":null,"ev":[]}],"traps":[{"t":"p","html":"取回的 <code>skip_first_n_tokens<\/code> 会换成 block <b>向下取整<\/b>：B′ 跳 64 token = 4 个 block。 <a class=\"ref\" data-k=\"lmcache/v1/multiprocess/object_group_transfer/staged.py:384-388\" title=\"lmcache/v1/multiprocess/object_group_transfer/staged.py:384-388\">staged.py:384–388<\/a>"},{"t":"p","html":"staged 路径里，被跳过的 block 所在的 chunk 仍整块搬进暂存；direct 按 block 跳，不多搬。"}]},"to":["xfer.copy"]},{"id":"stream","name":"服务端 CUDA 流","code":"cache_context.stream","kind":"act","n":"3","d":[710,250,240,250],"m":[72,964,200,260],"glyph":{"g":"text","big":"空","small":"流上没有活","tone":null},"say":"GPU 按这个顺序真正执行","why":"同一条流，天然排好先后","trap":"完成 event 在提交之前","card":{"does":[{"t":"p","html":"服务端为每个注册的 vLLM 实例开的一条 CUDA 流：GPU 上真正按顺序执行「等待 → 拷贝 → 录 event → 回调」的队列。亲和线程往队尾放，GPU 从队头取。"}],"how":[{"t":"p","html":"流挂在每实例一份的 <code>cache_context<\/code> 上，同挂着的还有 4 槽 GPU 暂存缓冲（例子里 4 × 36 MiB = 144 MiB）和 block id 缓冲。 <a class=\"ref\" data-k=\"lmcache/v1/platform/devices/cuda/cache_context.py:443-453\" title=\"lmcache/v1/platform/devices/cuda/cache_context.py:443-453\">cache_context.py:443–453<\/a>"},{"t":"p","html":"「等 event」是流级等待：只在流里插一个依赖，CPU 立刻往下走。 <a class=\"ref\" data-k=\"lmcache/v1/platform/base/event_ipc.py:250-252\" title=\"lmcache/v1/platform/base/event_ipc.py:250-252\">event_ipc.py:250–252<\/a>"},{"t":"p","html":"STORE 在流上的顺序：等 ev_A → 放导入 event 的回调 → 3 次拷贝 → ★ 录 ev_done → <code>finish_write<\/code> 回调。"}],"why":[{"t":"note","k":"n15","lv":"测试","html":"测试把入队顺序钉死：回调、拷贝、拷贝、录 event、回调。那个测试是 2 个 chunk 的失败 STORE，最后一个回调是 abort_write；成功时同一位置是 finish_write。","tag":null,"who":null,"more":null,"ev":[{"lv":"测试","q":"assert order == [\"callback\", \"copy\", \"copy\", \"record\", \"callback\"]","raw":["tests/v1/multiprocess/test_l1_owner_completion.py:193-193"],"rh":"<a class=\"ref\" data-k=\"tests/v1/multiprocess/test_l1_owner_completion.py:193-193\" title=\"tests/v1/multiprocess/test_l1_owner_completion.py:193\">test_l1_owner_completion.py:193<\/a>"}]},{"t":"note","k":"n16","lv":"注释","html":"流要先等 vLLM 的 event：要读的 KV 是 vLLM 流上的前向写的。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"Producer event that orders reads of the engine KV cache.","raw":["lmcache/v1/client/worker_transfer.py:702-702"],"rh":"<a class=\"ref\" data-k=\"lmcache/v1/client/worker_transfer.py:702-702\" title=\"lmcache/v1/client/worker_transfer.py:702\">worker_transfer.py:702<\/a>"}]},{"t":"note","k":"n17","lv":"推断","html":"不加这个依赖，拷贝可能读到前向还没写完的 KV；拷贝、event、回调都在同一条流上，彼此不用再同步。","tag":null,"who":null,"more":null,"ev":[]},{"t":"note","k":"n18","lv":"推断","html":"完成 event 录在拷贝之后、提交回调之前：worker 只关心 block 能不能回收 / 能不能用，那只取决于拷贝。","tag":null,"who":null,"more":null,"ev":[]}],"traps":[{"t":"p","html":"worker 看到「完成」时，对象还没转正：提交回调排在 ev_done 后面，还要等排空线程一轮。"},{"t":"note","k":"n19","lv":"推断","html":"同一实例的 STORE 和 RETRIEVE 进同一条流：后面的拷贝要等前面的拷贝物理完成才开始，即使 block 毫无交集。","tag":null,"who":null,"more":null,"ev":[]}]},"to":["xfer.store","xfer.cb"]},{"id":"drain","name":"排空线程","code":null,"kind":"bg","n":"4","d":[1060,250,150,170],"m":[72,1290,200,150],"glyph":{"g":"list","rows":["C++ 缓冲：空","每 5 ms 取"],"on":[]},"say":"拷完后做收尾","why":"驱动线程不拿 GIL","trap":"最多晚 5 ms","card":{"does":[{"t":"p","html":"<code>DeviceHostFuncDispatcher<\/code>：一条后台线程，每 5 ms 去 C++ 缓冲里取「流走到这里了」的消息，按 kind 解码、调对应的 Python 处理函数。转正、放锁、放导入 event 都是它做的。"}],"how":[{"t":"p","html":"亲和线程挂回调只做两件事：msgpack 编码载荷，交给 C++ 在流上挂一个 host 函数。 ache/v1/distributed/api.py:701\">api.py:701<\/a>"},{"t":"p","html":"它调 <code>StorageManager.submit_prefetch_task<\/code>，门面再交给预取控制器。 <a class=\"ref\" data-k=\"lmcache/v1/distributed/storage_manager.py:584-584\" title=\"lmcache/v1/distributed/storage_manager.py:584\">storage_manager.py:584<\/a>"}],"why":[{"t":"note","k":"n3","lv":"文档","html":"门面只管请求句柄和日志；规划、上锁、加载都在预取控制器里。","tag":null,"who":null,"more":null,"ev":[{"lv":"文档","q":"planning, locking and loading live in the prefetch controller","raw":["docs/design/v1/distributed/storage_manager.md:5-7"],"rh":"<a class=\"ref\" data-k=\"docs/design/v1/distributed/storage_manager.md:5-7\" title=\"docs/design/v1/distributed/storage_manager.md:5-7\">storage_manager.md:5–7<\/a>"}]}],"traps":[{"t":"p","html":"读者数是「每个 key 上几把读锁」，不是「几个请求」：TP=1 时是 1；MLA 模型 TP&gt;1 时每个 worker 各一把。"}]},"to":["l1.prefetch"]},{"id":"staging","name":"暂存表","code":"_staging","kind":"store","n":"1","d":[325,100,240,175],"m":[8,200,165,160],"glyph":{"g":"kv","rows":[["结构","key → tag → 对象"],["现在","空"]]},"say":"拷了一半的对象放这，读者看不见","why":"占住内存，又不让人读半截","trap":"同 key 同 tag 只能有一个","card":{"does":[{"t":"p","html":"写入中的对象住在这里：内存已经分好、GPU 还在往里拷。读者查不到它们，淘汰也碰不了它们（写锁有效时）。"}],"how":[{"t":"p","html":"结构：<code>_staging[key][tag] → L1ObjectState<\/code>，一个 key 底下按写者的 tag 再分一层。 <a class=\"ref\" data-k=\"lmcache/v1/distributed/l1_manager/base.py:217-219\" title=\"lmcache/v1/distributed/l1_manager/base.py:217-219\">base.py:217–219<\/a>"},{"t":"p","html":"<code>reserve_write<\/code> 逐 key 判断：已在常驻表 → <code>KEY_NOT_WRITABLE<\/code>；同 tag 已有写锁有效的 → <code>KEY_NOT_WRITABLE<\/code>；同 tag 的旧预留写锁过期了 → 把那块 buffer 交给新写者；其余的进「要分配」名单。 <a class=\"ref\" data-k=\"lmcache/v1/distributed/l1_manager/base.py:526-549\" title=\"lmcache/v1/distributed/l1_manager/base.py:526-549\">base.py:526–549<\/a>"},{"t":"p","html":"「要分配」的<b>一次<\/b>向分配器要：A 是 3 块 × 36 MiB。拿不齐就整批 <code>OUT_OF_MEMORY<\/code>，已分到的退回。 <a class=\"ref\" data-k=\"lmcache/v1/distributed/l1_manager/base.py:555-565\" title=\"lmcache/v1/distributed/l1_manager/base.py:555-565\">base.py:555–565<\/a>"},{"t":"p","html":"每块包成 <code>L1ObjectState<\/code>，配两把新 <code>TTLLock<\/code>（写 600 s、读 300 s），只锁上写锁。 <a class=\"ref\" data-k=\"lmcache/v1/distributed/l1_manager/base.py:572-579\" title=\"lmcache/v1/distributed/l1_manager/base.py:572-579\">base.py:572–579<\/a>"}],"why":[{"t":"note","k":"n4","lv":"文档","html":"旧设计把预留直接放进常驻表：两个预取同时加载同一个对象就撞车，第二个整单放弃。","tag":null,"who":null,"more":null,"ev":[{"lv":"文档","q":"Two prefetch requests loading the same L2 object therefore collided","raw":["docs/design/v1/distributed/l1_manager/staging-and-write-tags.md:11-12"],"rh":"<a class=\"ref\" data-k=\"docs/design/v1/distributed/l1_manager/staging-and-write-tags.md:11-12\" title=\"docs/design/v1/distributed/l1_manager/staging-and-write-tags.md:11-12\">staging-and-write-tags.md:11–12<\/a>"}]},{"t":"note","k":"n5","lv":"注释","html":"分开放：读者看不见暂存对象，不同 tag 的写者可以同时暂存同一个 key。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"Staging objects are kept apart from the resident objects: readers of the key do not see them, and writers with different tags may stage the same key at the same time.","raw":["lmcache/v1/distributed/l1_manager/base.py:151-154"],"rh":"<a class=\"ref\" data-k=\"lmcache/v1/distributed/l1_manager/base.py:151-154\" title=\"lmcache/v1/distributed/l1_manager/base.py:151-154\">base.py:151–154<\/a>"}]},{"t":"note","k":"n6","lv":"推断","html":"对主路来说：GPU 异步拷贝要时间，内存得先占住，但没拷完不能让人读——暂存表正好满足这两点。","tag":null,"who":null,"more":null,"ev":[]}],"traps":[{"t":"p","html":"整批原子：A 的 3 块若只剩 2 块空位，是 3 块全 OOM，不是存 2 块；也不会当场去挤掉别的对象，腾地方只靠后台淘汰。 <a class=\"ref\" data-k=\"lmcache/v1/distributed/l1_manager/base.py:559-561\" title=\"lmcache/v1/distributed/l1_manager/base.py:559-561\">base.py:559–561<\/a>"},{"t":"p","html":"写锁过期（600 s）的暂存对象不会自己消失：它留在原地，等淘汰来回收，或被同 tag 的下一个写者接手。"}]},"to":["l1.write"]},{"id":"objects","name":"常驻表","code":"_objects","kind":"store","n":"2","d":[685,100,250,410],"m":[8,430,324,190],"glyph":{"g":"kv","rows":[["结构","key → 对象"],["每个对象","写锁 + 读锁"],["现在","空"]]},"say":"读者能查到的对象，各带一把读锁计数","why":"状态 = 在哪张表 + 锁是否有效","trap":"没有 state 字段","card":{"does":[{"t":"p","html":"对读者可见的对象表：<code>reserve_read<\/code> / <code>unsafe_read<\/code> / <code>delete<\/code> 都只查这张表。每个对象挂一把读锁 <code>TTLLock<\/code>，计数 &gt; 0 且没过期，就是「正被人用着，不许删」。"}],"how":[{"t":"p","html":"结构：<code>_objects[key] → L1ObjectState<\/code>，字段只有 <code>memory_obj / write_lock / read_lock / is_temporary / staging_charge<\/code>。 <a class=\"ref\" data-k=\"lmcache/v1/distributed/l1_manager/base.py:79-97\" title=\"lmcache/v1/distributed/l1_manager/base.py:79-97\">base.py:79–97<\/a> <a class=\"ref\" data-k=\"lmcache/v1/distributed/l1_manager/base.py:216-216\" title=\"lmcache/v1/distributed/l1_manager/base.py:216\">base.py:216<\/a>"},{"t":"p","html":"<code>TTLLock<\/code> 只有三个数：计数、过期时刻、TTL 时长。 <a class=\"ref\" data-k=\"csrc/lmcache_native/ttl_lock.h:79-86\" title=\"csrc/lmcache_native/ttl_lock.h:79-86\">ttl_lock.h:79–86<\/a>"},{"t":"p","html":"它的规则：<code>lock()<\/code> 若旧锁已过期，计数<b>重置为 1<\/b>，否则 +1；两种情况都把过期时刻刷新成「现在 + TTL」。<code>unlock()<\/code> 减 1，最低到 0。<code>is_locked()<\/code> = 计数 &gt; 0 <b>且<\/b>没过期。 <a class=\"ref\" data-k=\"csrc/lmcache_native/ttl_lock.h:33-58\" title=\"csrc/lmcache_native/ttl_lock.h:33-58\">ttl_lock.h:33–58<\/a>"},{"t":"p","html":"两张表的几乎所有读写方法都挂同一把全局锁 <code>self._lock<\/code>；例外是 <code>is_key_evictable<\/code> 和 <code>touch_keys<\/code>，它们不拿。 <a class=\"ref\" data-k=\"lmcache/v1/distributed/l1_manager/base.py:213-213\" title=\"lmcache/v1/distributed/l1_manager/base.py:213\">base.py:213<\/a>"}],"why":[{"t":"note","k":"n7","lv":"注释","html":"锁带过期，计数残留不会累积：过期后下一次 <code>lock()<\/code> 直接从 1 开始。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"If the previous TTL has expired, the counter is reset to 1.","raw":["csrc/lmcache_native/ttl_lock.h:36-36"],"rh":"<a class=\"ref\" data-k=\"csrc/lmcache_native/ttl_lock.h:36-36\" title=\"csrc/lmcache_native/ttl_lock.h:36\">ttl_lock.h:36<\/a>"}]},{"t":"note","k":"n8","lv":"测试","h f","evict","objects"],"state":{"pc":{"g":"checks","rows":[["① 上锁 3/4","ok"],["② 留 3 格","ok"],["③ 收尾 · 768","ok"]]},"look":{"g":"kv","rows":[["B 命中","3 块 = 768"],["读者数","1（TP=1）"]]}}},{"title":"设：L1 满到 80%，淘汰线程来了","what":"设：B 在 vLLM 队里等着，这期间别的请求又存进 453 个对象 → 共 <b>456<\/b> 个 × 36 MiB = 16416 MiB ≥ 16384（80%）。下一秒淘汰线程醒来：目标 <code>int(456 × 0.2)<\/code> = <b>91<\/b> 个。从最旧的一端扫：h2、h1、h0 读锁有效 → 跳过，<b>不占名额<\/b>；接着取 x1…x91。<code>delete<\/code> 在全局锁里再查一次，没锁就删、还内存。剩 365 个 ≈ 64%。","why":{"t":"note","k":"n37","lv":"注释","html":"挑的时候不拿全局锁图快，删的时候再查一次保证对。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"will check again and safely reject a key that became locked between the check and the actual deletion.","raw":["lmcache/v1/distributed/l1_manager/base.py:973-974"],"rh":"<a class=\"ref\" data-k=\"lmcache/v1/distributed/l1_manager/base.py:973-974\" title=\"lmcache/v1/distributed/l1_manager/base.py:973-974\">base.py:973–974<\/a>"}]},"focus":["evict","w_del","objects","w_tick"],"state":{"evict":{"g":"list","rows":["用量 80.2% ≥ 80%","h2 h1 h0：锁着，跳过","x1…x91：删","x92…x453：留"],"on":[1,2]},"objects":{"g":"kv","rows":[["h0 h1 h2","读锁 1 · 到 t=300"],["x1…x91","已删"],["x92…x453","读锁 0"]]}}},{"title":"B 取回：读，拷完放锁","what":"设 t=90（还没到 300）：RETRIEVE 调 <code>unsafe_read([h0, h1, h2])<\/code>：对象在、锁有效 → 交出对象，<b>不加锁<\/b>。CPU→GPU 拷完，回调放锁：先确认锁有效，再减 1——计数 1→<b>0<\/b>，3 个对象回到 ready。放锁不刷新 LRU；下一轮淘汰它们就能被挑了。","why":{"t":"note","k":"n38","lv":"注释","html":"读锁释放不代表这个 key 有用，所以 LRU 不动。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"No-op: releasing a read lock does not mean the key was useful.","raw":["lmcache/v1/distributed/eviction.py:196-196"],"rh":"<a class=\"ref\" data-k=\"lmcache/v1/distributed/eviction.py:196-196\" title=\"lmcache/v1/distributed/eviction.py:196\">eviction.py:196<\/a>"}]},"focus":["w_rd","objects","xfer"],"state":{"xfer":{"g":"list","rows":["STORE A：完成 ✓","RETRIEVE B：3 块 ✓"],"on":[1]},"objects":{"g":"kv","rows":[["h0 h1 h2","读锁 0 · ready"],["x1…x91","已删"],["x92…x453","读锁 0"]]}} ","  // The TTL duration in milliseconds","  const int64_t ttl_ms_;"]}],"notes":[{"t":"note","k":"n1","lv":"注释","html":"上锁：旧锁已过期 → 计数重置为 1；否则 +1。两种都把到期刷新成「现在 + TTL」。B 在 t=0 上锁：计数 1，到期 t=300。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"If the previous TTL has expired, the counter is reset to 1.","raw":["csrc/lmcache_native/ttl_lock.h:33-40"],"rh":"<a class=\"ref\" data-k=\"csrc/lmcache_native/ttl_lock.h:33-40\" title=\"csrc/lmcache_native/ttl_lock.h:33-40\">ttl_lock.h:33–40<\/a>"}],"a":33,"b":40},{"t":"note","k":"n2","lv":null,"html":"放锁：减 1，最低到 0。不检查是谁放的——锁是匿名的。","tag":null,"who":null,"more":null,"ev":[],"a":42,"b":47},{"t":"note","k":"n3","lv":null,"html":"有效 = 计数 &gt; 0 <b>且<\/b>没过期。B 崩了不放锁：t=301 时计数仍是 1，但已过期，所以算没锁。","tag":null,"who":null,"more":null,"ev":[],"a":49,"b":58},{"t":"note","k":"n4","lv":null,"html":"整把锁的全部数据：计数、到期时刻（毫秒）、TTL 时长。没有「持有者」字段。","tag":null,"who":null,"more":null,"ev":[],"a":79,"b":86}],"cap":"数据：TTLLock 的规则和字段（C++ 头文件）"},{"t":"table","head":["情况","时刻（设）","事件","计数","到期","有效？"],"rows":[["正常","t=0","B 的 LOOKUP 上锁","1","t=300","是"],["正常","t=90","B 拷完放锁","0","t=300","否（计数 0）"],["两个读者","t=200","B 还没放，请求 C 也锁 h0","2","t=500","是"],["B 崩了","t=301","没人放锁","1","t=300","否（过期）"],["B 崩了","t=400","有人再锁 h0","1（重置）","t=700","是"]],"cap":"h0 的读锁在三种情况下的值：每种情况从 t=0 B 上锁开始，各自独立"},{"t":"code","file":"csrc/lmcache_native/ttl_lock.cpp","parts":[{"a":13,"b":48,"lines":["void TTLLock::lock() {","  int64_t current_time = now_ms();","  int64_t new_expiration = current_time + ttl_ms_;","","  // Use compare-and-swap loop to handle the TTL expiration case","  while (true) {","    int64_t old_expiration = expiration_ms_.load(std::memory_order_acquire);","    int64_t old_counter = counter_.load(std::memory_order_acquire);","","    // Check if TTL has expired","    bool expired = (current_time >= old_expiration);","","    if (expired) {","      // TTL expired, try to reset counter to 1 and set new expiration","      // First, try to update the expiration","      i         self._order: OrderedDict[ObjectKey, None] = OrderedDict()"]},{"a":83,"b":92,"lines":["            # NOTE: for the request, the later keys should be evicted first.","            # For example, the request has (key1, key2, key3), if we first","            # evict key1, due to prefix match, key2 and key3 will not be hit.","            for key in reversed(keys):","                # If key already exists, move it to the end (most recently used)","                if key in self._order:","                    self._order.move_to_end(key)","                else:","                    # Add new key at the end (most recently used)","                    self._order[key] = None"]},{"a":107,"b":110,"lines":["            for key in reversed(keys):","                if key in self._order:","                    # Move to end (most recently used)","                    self._order.move_to_end(key)"]}],"notes":[{"t":"note","k":"n3","lv":null,"html":"名单就是一个有序字典：开头最旧。例子：<code>[h2, h1, h0, x1, …, x453]<\/code>。","tag":null,"who":null,"more":null,"ev":[],"a":53,"b":53},{"t":"note","k":"n4","lv":"注释","html":"同一请求的后几块应该先删：先删第一块，后面几块因为前缀匹配也命不中了。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"for the request, the later keys should be evicted first.","raw":["lmcache/v1/distributed/eviction_policy/lru.py:83-85"],"rh":"<a class=\"ref\" data-k=\"lmcache/v1/distributed/eviction_policy/lru.py:83-85\" title=\"lmcache/v1/distributed/eviction_policy/lru.py:83-85\">lru.py:83–85<\/a>"}],"a":83,"b":85},{"t":"note","k":"n5","lv":"提交","html":"所以倒序挪到末尾：h2 先挪、h0 最后挪 → h0 最新、h2 最先被扫到。","tag":null,"who":null,"more":null,"ev":[{"lv":"提交","q":"optimize evict in lru policy","raw":["c:bdf4c9a9"],"rh":"<a class=\"cm\" data-h=\"bdf4c9a9\">bdf4c9a9<\/a>"}],"a":86,"b":92},{"t":"note","k":"n6","lv":null,"html":"touch 也是倒序挪到末尾。","tag":null,"who":null,"more":null,"ev":[],"a":107,"b":110}],"cap":"数据：LRU 名单，以及为什么倒序登记"},{"t":"table","head":["名单位置（旧 → 新）","key","过滤器","结果"],"rows":[["1–3","h2、h1、h0","读锁有效 → 假   function cost(r){var c=0;rec.b.parts.forEach(function(x){c+=ov(r,rec.pos[x.id],3);});placed.forEach(function(q){c+=ov(r,q,4);});return c;}

    var id=el.getAttribute('data-w'),w=rec.ob[id],g=rec.G[id],lw=el.offsetWidth,lh=el.offsetHeight,p=rec.mob?w.mlp:w.lp,at,s;

    }else auto.push([el,g,lw,lh]);

    for(i=0;i<TT.length;i++){
      t=TT[i];u=1-t;
      x=u*u*u*P[0][0]+3*u*u*t*P[1][0]+3*u*t*t*P[2][0]+t*t*t*P[3][0];
      y=u*u*u*P[0][1]+3*u*u*t*P[1][1]+3*u*t*t*P[2][1]+t*t*t*P[3][1];
      if(a[2]<rec.W-4)x=Math.min(Math.max(x,a[2]/2+2),rec.W-a[2]/2-2);
      if(a[3]<rec.H-4)y=Math.min(Math.max(y,a[3]/2+2),rec.H-a[3]/2-2);
      r=[x-a[2]/2,y-a[3]/2,a[2],a[3]];c=cost(r);

/* 落点对齐到整像素。
   每一页（.nf）都是缩小了塞在上一层格子里的。带 scale 的元素，浏览器「画它」和「判定点没点中它」时，
   会把它在上一层里的落点四舍五入到整像素；可 getBoundingClientRect 量到的仍是带小数的落点。
   两者最多差半个像素——是上一层尺度里的半个像素。镜头飞到第三、四层要放大三十到一百多倍，
   这半个像素就成了十几到几十个屏幕像素：镜头按量到的位置停，停歪；脚本按量到的位置点，点空。
   （实测：第四层差 81px。跟屏幕密度无关，只看排版恰好落在几点几像素上。）
   所以这里把每一页相对「上一层那一页」的落点补成整数：量到的 = 画出来的 = 点得中的。
   画面不会因此挪动——它本来就画在整像素上，补的只是排版位置里那点小数。
   所有数都取 1/64 像素的整倍数（浏览器排版的最小单位），免得它再舍入一次。 */
function q64(v){return Math.round(v*64)/64;}
function snapAll(){
  var m=[];
  ORD.forEach(function(id){
    if(id===ROOT)return;
    var el=F[id],pe=F[par[id]];
    if(!el||!pe||el._bl==null)return;
    var a=el.getBoundingClientRect(),b=pe.getBoundingClientRect(),k=b.width/pe.offsetWidth;
    if(!(k>0))return;
    m.push({el:el,x:(a.left-b.left)/k-(el._sx||0),y:(a.top-b.top)/k-(el._sy||0)});
  });
  m.forEach(function(o){
    var sx=q64(Math.round(o.x)-o.x),sy=q64(Math.round(o.y)-o.y),el=o.el;
    if(sx===el._sx&&sy===el._sy)return;
    el._sx=sx;el._sy=sy;
    el.style.left=(el._bl+sx)+'px';
    el.style.top=sy+'px';
  });
}
