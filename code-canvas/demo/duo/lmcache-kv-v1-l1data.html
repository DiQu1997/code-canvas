<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>LMCache：KV cache 怎么存、怎么取回复用</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d2330;--mut:#667085;--line:#e2e0d8;--acc:#2456d6;
--e1:#1a7f4b;--e2:#1f5fbf;--e3:#0f7b8a;--e4:#5b4bc4;--infer:#b26a00;--view:#b0237a;--unk:#6b7280;--fact:#475467;
--sans:system-ui,-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei","WenQuanYi Zen Hei",sans-serif;
--mono:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","WenQuanYi Zen Hei Mono",monospace}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--sans)}
a{color:var(--acc)}
button{font:inherit;cursor:pointer}
:root{--stage:#e7e5dc;--fw:1322px;--kc:3}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--stage)}
#top{position:fixed;top:0;left:0;right:0;z-index:40;height:48px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#1d2330;color:#fff}
#stage{position:fixed;left:0;right:0;top:48px;bottom:0;overflow:hidden;touch-action:none;cursor:grab;background-color:var(--stage);background-image:radial-gradient(circle,#c9c6b8 1.1px,transparent 1.5px);background-size:24px 24px}
#stage.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-select:none}
#side{position:fixed;top:48px;left:0;bottom:0;width:min(320px,100vw);z-index:45;overflow:auto;border-right:1px solid var(--line);background:#fbfaf7;padding:10px 8px 70px;transform:translateX(-105%);visibility:hidden;transition:transform .2s,visibility .2s;box-shadow:8px 0 30px rgba(0,0,0,.18)}
body.mapopen #side{transform:none;visibility:visible}
#top button{flex:none;height:32px;padding:0 10px;border:1px solid #4a5468;border-radius:6px;background:#2b3345;color:#fff;font-size:14px}
#crumb{flex:1;min-width:0;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;font-size:14px}
#crumb a{color:#c9d6ff;text-decoration:none;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
#crumb b{overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:3em}
#crumb i{font-style:normal;color:#8a93a6;flex:none}
#side .st{font-size:12px;color:var(--mut);padding:2px 8px 6px}
.ol{display:block;padding:4px 8px;border-radius:5px;font-size:14px;line-height:1.4;color:#333;text-decoration:none}
.ol i{font-style:normal;color:#9aa1ad;float:right}
.ol.on{font-weight:700}
.ol.cur{background:var(--acc);color:#fff}
.ol.d0{font-weight:700}
#legend{position:fixed;top:54px;right:8px;z-index:50;width:min(360px,calc(100vw - 16px));max-height:calc(100vh - 70px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:12px 14px;font-size:14px}
#legend[hidden]{display:none}
#legend h3{margin:8px 0 4px;font-size:14px}
#legend div{margin:5px 0;line-height:1.5}
.where{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:13px;color:var(--mut)}
.where .lvl{background:#1d2330;color:#fff;border-radius:4px;padding:0 7px;font-weight:700}
.where a{color:var(--acc);text-decoration:none;background:#e9eefb;border-radius:4px;padding:0 6px}
.where b{color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:4px;padding:0 6px}
h1{font-size:24px;line-height:1.3;margin:10px 0 6px}
h2{font-size:18px;margin:26px 0 8px;line-height:1.35}
h2 small{font-size:13px;font-weight:400;color:var(--mut);margin-left:8px}
.lead{font-size:16.5px;color:#2c3445;margin:4px 0 6px}
.src{font-size:12.5px;color:var(--mut)}
p{margin:10px 0}
code{font-family:var(--mono);font-size:.88em;background:#eceae2;border-radius:3px;padding:0 3px}
a.ref{font-family:var(--mono);font-size:.84em;background:#eef2fb;border:1px solid #cbd6f2;border-radius:4px;padding:0 4px;color:#1d3f9a;cursor:pointer;white-space:nowrap;text-decoration:none}
a.ref::before{content:"⌖ ";opacity:.6}
a.ref.on{background:#1d3f9a;color:#fff}
a.cm{font-family:var(--mono);font-size:.84em;border:1px solid #c8d3ea;border-radius:4px;padding:0 4px;color:#1f5fbf;background:#fff;cursor:pointer;text-decoration:none;white-space:nowrap}
a.cm::before{content:"提交 ";font-family:var(--sans);opacity:.7}
.cinfo{display:block;font-size:12.5px;color:#444;background:#f1f4fb;border-radius:4px;padding:2px 6px;margin:3px 0}
a.lk{font-weight:600;text-decoration:none;border-bottom:1px solid currentColor}
.lv-e1{--c:var(--e1)}.lv-e2{--c:var(--e2)}.lv-e3{--c:var(--e3)}.lv-e4{--c:var(--e4)}.lv-fact{--c:var(--fact)}.lv-infer{--c:var(--infer)}.lv-view{--c:var(--view)}.lv-unk{--c:var(--unk)}
.note{margin:10px 0;padding:8px 12px;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:6px;background:#fff;font:14.5px/1.6 var(--sans);color:var(--ink)}
.note.lv-fact{border-left-color:#b9c0cc}
.note.lv-infer{border:1.5px dashed var(--c);background:#fff8e8}
.note.lv-view{border:1.5px dashed var(--c);background:#fdf0f7}
.note.lv-unk{border:1.5px dotted var(--c);background:#efeeea}
.note.flash{animation:fl 2s}
@keyframes fl{0%,60%{box-shadow:0 0 0 4px rgba(36,86,214,.45)}100%{box-shadow:0 0 0 4px rgba(36,86,214,0)}}
.nh{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:3px}
.bd{display:inline-block;font-size:12px;line-height:18px;font-weight:700;padding:0 8px;border-radius:9px;color:#fff;background:var(--c);white-space:nowrap}
.bd.lv-infer,.bd.lv-view,.bd.lv-unk{background:#fff;color:var(--c);border:1px dashed var(--c);line-height:16px}
.bd.lv-fact{background:#e6e8ee;color:#475467}
.who{font-size:12px;color:#7a4100;background:#ffe3b3;border-radius:4px;padding:0 6px}
.tg{font-size:12px;color:#444;background:#ecebe4;border-radius:4px;padding:0 6px}
.tg::before{content:"#"}
.ln{font-size:12px;color:var(--mut);margin-left:auto;font-family:var(--mono)}
.goto{margin-left:auto;font-size:13px;text-decoration:none;font-weight:600}
.ev{margin-top:6px;font-size:13.5px;line-height:1.7}
.ev .evl{font-size:12px;color:var(--mut)}
.q{margin:3px 0 0;border-left:3px solid #cfcbbd;padding:1px 8px;color:#3d4350;font:italic 13.5px/1.5 Georgia,"Times New Roman",serif;cursor:pointer;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.q.open{display:block}
.q::before{content:"“"}.q::after{content:"”"}
details.more{margin-top:6px;font-size:13.5px}
details.more summary{cursor:pointer;color:var(--acc);font-weight:600}
figure{margin:14px 0}
.cap{font-size:13px;color:var(--mut);margin-top:6px;line-height:1.55}
figure.code{border:1px solid var(--line);border-radius:8px;background:#fbfbf8;overflow:hidden}
figure.code figcaption{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;padding:5px 10px;background:#efede5;border-bottom:1px solid var(--line);font-size:13px}
figcaption .fn{font-family:var(--mono);font-weight:700}
figcaption .rg{color:var(--mut)}
.tgl{margin-left:auto;font-size:12.5px;border:1px solid #c9c5b6;background:#fff;border-radius:5px;padding:1px 8px}
figure.code>.cap{padding:0 10px 8px}
.cb{font:13px/1.55 var(--mono);padding:6px 0}
.cl{display:flex}
.cl.hl{background:#fff4cf}
.no{flex:0 0 3.4em;text-align:right;padding-right:.7em;color:#9aa1ad;user-select:none;font-size:12px;line-height:20.15px}
.tx{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;padding-left:1.6em;text-indent:-1.6em;padding-right:8px}
.k-c{color:#5b6777}.k-s{color:#1a7f4b}.k-k{color:#8b2fa0}
.gap{text-align:center;color:var(--mut);font:12.5px/1.6 var(--sans);background:repeating-linear-gradient(135deg,#f0eee6 0 6px,#f8f7f2 6px 12px);margin:4px 0;padding:1px 0}
/* 钉在代码行上的批注：默认收起，只把那几行染色 + 行尾一个「注」；点行 → 像 PDF 便签一样浮在那几行旁边（不挤开下面的代码） */
.cl.nl{cursor:pointer}
.cl.nl:hover,.cl.nl.on{background:#ffe8a8}
.cl.nl.on{box-shadow:inset 3px 0 0 var(--infer)}
.nmk{flex:none;align-self:flex-start;margin:2px 8px 0 4px;min-width:18px;height:16px;padding:0 3px;border-radius:4px;background:var(--c);color:#fff;font:700 11px/16px var(--sans);text-align:center;user-select:none}
.nmk.lv-infer,.nmk.lv-view,.nmk.lv-unk{background:#fff;color:var(--c);border:1px dashed var(--c);line-height:14px}
.nmk.lv-fact{background:#e6e8ee;color:#475467}
.cb .note{display:none;margin:6px 10px 10px 3.4em}
.cb .note.pop{display:block;position:absolute;z-index:8;box-sizing:border-box;margin:2px 0 0;box-shadow:0 8px 26px rgba(20,25,40,.24);cursor:auto}
.nx{flex:none;margin-left:6px;width:24px;height:22px;border:0;border-radius:5px;background:rgba(0,0,0,.06);font-size:12px;line-height:22px;color:var(--ink);cursor:pointer;padding:0}
figure.code.allnotes .cb .note{display:block}
figure.code.allnotes .nx{display:none}
.snip{display:block;margin:6px 0 4px;border:1px solid #cbd6f2;border-radius:6px;background:#fbfbf8;overflow:hidden;white-space:normal;font-weight:400;text-align:left}
.snip .sh{display:flex;gap:8px;align-items:center;font:12.5px/1.6 var(--mono);background:#eef2fb;padding:2px 8px;color:#1d3f9a}
.snip .sx{margin-left:auto;font:12px var(--sans);border:1px solid #cbd6f2;background:#fff;border-radius:4px;padding:0 6px}
figure.tb{overflow:visible}
table{border-collapse:collapse;width:100%;background:#fff;font-size:14.5px;line-height:1.55}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
th{background:#efede5;font-size:13px;white-space:nowrap}
td:first-child{font-weight:600}
ol.flow{list-style:none;margin:14px 0;padding:0;position:relative}
ol.flow::before{content:"";position:absolute;left:15px;top:8px;bottom:8px;width:2px;background:#c9c5b6}
.fs{position:relative;display:flex;gap:10px;margin:8px 0;align-items:flex-start}
.fk{flex:none;width:32px;height:32px;border-radius:50%;background:#1d2330;color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.fbody{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 11px}
.fs[data-to] .fbody{cursor:pointer;border-color:#b9c6ea}
.fs[data-to] .fbody:hover{background:#f4f7ff}
.ft{font-weight:700;font-size:15px;line-height:1.45}
.go{float:right;font-size:13px;color:var(--acc);font-weight:600;margin-left:8px}
.fsub{font-size:13.5px;color:#3d4350;margin-top:2px}
.fref{font-size:13px;margin-top:3px}
.fo{margin-top:5px;display:flex;flex-wrap:wrap;gap:5px}
.pill{font-size:12px;border-radius:9px;padding:0 8px;line-height:18px;font-weight:600}
.o-ok{background:#dff3e6;color:#17663d}.o-run{background:#fff0c9;color:#7a5200}.o-fail{background:#fbdcdc;color:#9b1c1c}
.floop{font-size:12.5px;color:var(--mut);margin-top:3px}
figure.dg{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 10px 10px}
.dgw{position:relative;overflow:hidden}
.dgi{position:absolute;left:0;top:0;transform-origin:0 0}
.dgi svg{position:absolute;left:0;top:0;pointer-events:none}
.dgi polyline{fill:none;stroke:#5c6679;stroke-width:1.5}
.dgi polyline.dash{stroke-dasharray:5 4}
.dgi marker path{fill:#5c6679}
.dfr{position:absolute;border:1.5px dashed #cdc9ba;border-radius:10px;background:rgba(0,0,0,.018)}
.dfr span{position:absolute;top:-10px;left:8px;background:#fff;padding:0 5px;font-size:12px;line-height:18px;color:var(--mut);white-space:nowrap}
.dbx{position:absolute;border:1.5px solid #8fa0c4;border-radius:8px;background:#f5f8ff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:2px 6px;font-size:13.5px;font-weight:700;line-height:1.25}
.dbx small{font-weight:400;font-size:12px;color:#4a5263;line-height:1.25}
.dbx.k-store{background:#fff9e3;border-color:#c9b46a;border-radius:3px;border-top-width:4px}
.dbx.k-ext{background:#f1f1ee;border-color:#a9a595;border-style:dashed}
.dbx.k-bg{background:#f3effc;border-color:#9a8bd0}
.dbx.go{cursor:pointer;box-shadow:0 1px 0 rgba(0,0,0,.08);margin:0;float:none}
.dbx.go::after{content:"›";position:absolute;right:4px;bottom:0;color:var(--acc);font-size:15px}
.dbx.go:hover{outline:2px solid var(--acc)}
.flag{position:absolute;top:-10px;right:-6px;background:var(--acc);color:#fff;font-size:12px;line-height:17px;border-radius:9px;padding:0 6px;font-style:normal;font-weight:700;white-space:nowrap}
.dlb{position:absolute;transform:translate(-50%,-50%);background:#fff;border:1px solid var(--line);border-radius:4px;font-size:12px;line-height:16px;padding:0 4px;white-space:nowrap;color:#3d4350}
figure.frm{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.fr-top{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}
.fr-t{font-weight:700;color:var(--ink);font-size:14.5px}
.fr-inc{min-height:48px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.fr-cells{display:flex;gap:4px}
.cell{flex:1 1 0;min-width:0;border:1.5px solid #c9b46a;background:#fff9e3;border-radius:5px;text-align:center;padding:3px 1px;display:flex;flex-direction:column;line-height:1.3}
.fr-inc .cell{flex:0 0 64px}
.cell b{font:700 13px var(--mono)}.cell i{font-style:normal;font-size:13px}
.cell.s-empty{background:#f4f3ee;border-style:dashed;color:#9aa1ad}
.cell.s-new{background:#dff3e6;border-color:#1a7f4b}
.cell.s-out{background:#fbdcdc;border-color:#c0392b;text-decoration:line-through}
.cell.s-ghost{background:#eee;border-color:#999;color:#888;border-style:dotted}
.cell.s-pick{background:#1d2330;border-color:#1d2330;color:#fff}
.cell.s-mv{background:#eaf0ff;border-color:#8fa0c4}
.fr-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:3px}
.fr-say{margin:8px 0;font-size:14.5px;min-height:3.2em}
.fr-nav{display:flex;gap:8px}
.fr-nav button{flex:1;height:36px;border:1px solid #b9c6ea;background:#f4f7ff;border-radius:6px;font-size:14px;color:var(--acc);font-weight:600}
.fr-nav button:disabled{opacity:.4}
figure.bar{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.bar-r{display:flex;height:34px;border-radius:5px;overflow:hidden}
.seg{display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;border-right:1px solid #fff;min-width:22px}
.seg.k-in{background:#3b5b9d}
.seg.k-out{background:repeating-linear-gradient(135deg,#b9b5a6 0 6px,#d3cfc1 6px 12px);color:#333}
.bar-l{margin:8px 0 0;padding-left:1.6em;font-size:14px}
.bar-l em{font-style:normal;font-size:12px;border-radius:9px;padding:0 7px;margin-left:4px;background:#e3e9f7;color:#2b4280}
.bar-l li.k-out em{background:#e6e3d8;color:#555}
.back{margin-top:18px;font-size:13px;color:var(--mut);display:flex;flex-wrap:wrap;gap:4px 8px}
.back a{text-decoration:none}
.pager{display:flex;gap:10px;margin-top:22px}
.pager a{flex:1;text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-size:14px;color:var(--ink);min-width:0}
.pager a small{display:block;font-size:12px;color:var(--mut)}
.pager a.nx{border-color:var(--acc);text-align:right}
.cnt{font-size:13px;color:var(--mut)}
.stubbox{margin:14px 0;padding:14px 16px;border:2px dashed #b9b5a6;border-radius:10px;background:repeating-linear-gradient(135deg,#f3f1e9 0 8px,#faf9f5 8px 16px);color:#555;font-size:15px}
.stubbox b{display:inline-block;background:#6b7280;color:#fff;border-radius:4px;padding:0 8px;margin-right:8px}
.stubm{font-style:normal;font-size:12px;background:#e6e3d8;color:#666;border-radius:9px;padding:0 7px;white-space:nowrap}
.ol.stub:not(.cur){color:#9aa1ad}
span.lk.dead{font-weight:600;color:#9b1c1c;border-bottom:1px dashed currentColor;cursor:help}
/* ---------- v2：画框（每个节点一个，子节点的画框缩小后住在父节点的格子里） ---------- */
.nf{position:absolute;left:0;top:0;transform-origin:0 0;width:var(--fw);background:var(--bg);border-radius:14px;clip-path:inset(0 0 calc(100% - var(--ch,100%)) 0 round 14px)}
.nf.open{clip-path:none;box-shadow:0 0 0 1px #c9c5b6,0 0 0 99999px rgba(231,229,220,0);transition:box-shadow .35s}
.nf.cur{box-shadow:0 0 0 1px #8fa0c4,0 0 0 99999px rgba(231,229,220,.86);transition:box-shadow .35s .25s}
#world>.nf.cur{box-shadow:0 0 0 1px #c9c5b6,0 0 0 99999px rgba(231,229,220,0)}
.card{background:var(--card);min-width:0;overflow-wrap:anywhere;cursor:pointer}
.nf:not(.cur)>.card *{pointer-events:none}
.nf.cur>.card{cursor:auto;user-select:text;-webkit-user-select:text}
body.wide .nf{display:grid;grid-template-columns:780px 470px;gap:28px;padding:22px;width:1322px;align-items:start}
body.wide .nf.leaf{grid-template-columns:780px;width:824px}
body.wide .card{border:1px solid var(--line);border-radius:10px;padding:20px 26px 26px}
body.wide figure.dg{margin-left:-14px;margin-right:-14px;padding:14px 8px 10px}
body.nar .card{border-radius:14px 14px 0 0;padding:14px 14px 22px}
body.nar .nf.leaf>.card{border-radius:14px}
.lbl{position:absolute;left:0;top:0;right:0;height:var(--ch,100%);display:none;align-items:center;justify-content:center;text-align:center;padding:0 5%;background:rgba(246,245,241,.94);border-radius:14px;color:#1d2330;font-weight:700;line-height:1.2;pointer-events:none;z-index:2}
.nf.open>.lbl{height:100%}
.nf.far>.lbl{display:flex}
.nf.far>.card,.nf.far>.kz{visibility:hidden}
.nf.tiny>.lbl{display:none}
.nf.stub>.lbl{color:#8a8f99}
.nf.huge:not(.cur)>.card,.nf.huge:not(.cur)>.kz>.kg>.tile:not(.open):not(.closing){visibility:hidden}
.kz{min-width:0}
body.nar .kz{padding:12px 8px 14px}
.kzh{font-size:14px;font-weight:700;color:#3d4350;margin:2px 4px 10px;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.kzh small{font-weight:400;font-size:12.5px;color:var(--mut)}
.kg{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
body.nar .kg{grid-template-columns:repeat(var(--kc),minmax(0,1fr));gap:8px}
.tile{position:relative;min-width:0;background:#fff;border:1px solid #b9c6ea;border-radius:10px;padding:8px;cursor:pointer}
body.nar .tile{padding:6px}
.tile.stub{border-style:dashed;border-color:#c9c5b6;background:#faf9f5}
.tile.open,.tile.closing{z-index:5}
.nf.cur>.kz>.kg>.tile:hover{border-color:var(--acc);box-shadow:0 0 0 2px rgba(36,86,214,.18)}
.tl{display:flex;flex-wrap:wrap;align-items:center;gap:3px 7px;margin-bottom:4px}
.tn{flex:none;width:22px;height:22px;border-radius:50%;background:#1d2330;color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tl b{font-size:15.5px;color:var(--acc);line-height:1.3}
.tl b::after{content:" ›"}
.tile.stub .tl b{color:#667085}
.tl i{font-style:normal;font-size:12px;color:var(--mut);margin-left:auto}
.ts{font-size:13.5px;line-height:1.5;color:#3d4350;margin:0 2px 7px}
.ts *{pointer-events:none}
.slot{position:relative;height:60px}
.slot.cut::after{content:"";position:absolute;left:0;right:0;bottom:0;height:28px;background:linear-gradient(rgba(255,255,255,0),#fff);pointer-events:none}
.tile.stub>.slot.cut::after{background:linear-gradient(rgba(250,249,245,0),#faf9f5)}
.tile.open>.slot::after,.tile.closing>.slot::after{display:none}
.fr-nav .fa{flex:0 0 auto;padding:0 14px}
.lx{float:right;font-size:12.5px;border:1px solid var(--line);background:#fff;border-radius:5px;padding:1px 9px}
/* ---------- 浮层：底部导航、缩放按钮、提示 ---------- */
#dock{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;display:flex;gap:4px;padding:5px;background:rgba(29,35,48,.94);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#dock button,#zb button{height:36px;min-width:36px;padding:0 10px;border:0;border-radius:8px;background:#2f384c;color:#fff;font-size:13.5px;white-space:nowrap}
#dock button:disabled{opacity:.35;cursor:default}
#dock .pos{background:transparent;font-family:var(--mono);font-size:12.5px;color:#c9d6ff}
/* 只有一页（单张机器图、没有下层）：翻页 / 层级这些控件没有意义，收起来，只留「回正」 */
body.solo #bmap,body.solo .where,body.solo #dock button:not(.pos){display:none}
body.solo #dock .pos{font-family:inherit;font-size:13.5px;color:#fff}
#zb{position:fixed;right:12px;bottom:12px;z-index:30;display:flex;flex-direction:column;gap:4px;padding:5px;background:rgba(29,35,48,.94);border-radius:12px}
#zb button{padding:0;font-size:16px}
@media (hover:none){#zb{display:none}}
#hint{position:fixed;top:58px;left:50%;transform:translateX(-50%);z-index:30;width:max-content;max-width:calc(100vw - 24px);background:rgba(29,35,48,.9);color:#fff;font-size:13px;line-height:1.5;padding:5px 14px;border-radius:16px;pointer-events:none;transition:opacity .4s;text-align:center}
#hint.off{opacity:0}
/* ---------- 手机宽度的画框（按画框宽度切换，不按视口） ---------- */
.ph h1{font-size:21px}
.ph .lead{font-size:16px}
.ph .cb{font-size:12px}
.ph .no{flex-basis:3em;padding-right:.5em;line-height:18.6px}
.ph .ind{letter-spacing:-.5ch}
.ph .tx{padding-right:4px}
.ph .cb .note{margin:6px 6px 10px 8px;font-size:14px}
.ph .cb .note.pop{margin:2px 0 0}
.ph .nmk{margin-right:4px}
.ph .tb table,.ph .tb tbody,.ph .tb tr,.ph .tb td{display:block;width:100%}
.ph .tb table{background:transparent}
.ph .tb thead{display:none}
.ph .tb tr{border:1px solid var(--line);border-radius:8px;background:#fff;margin:8px 0;padding:6px 10px}
.ph .tb td{border:0;padding:3px 0}
.ph .tb td::before{content:attr(data-h);display:block;font-size:12px;color:var(--mut);font-weight:400}
.ph .tb td:first-child{font-size:15px}
.ph .tb td:empty{display:none}
.ph figure.dg{padding:14px 4px 8px}
.ph .nf.cur{box-shadow:0 0 0 1px #8fa0c4,0 0 0 99999px rgba(231,229,220,.93)}
.ph .pager{flex-direction:column}
.ph .ol{font-size:15px;padding:7px 8px}
.ph .tl b{font-size:14.5px}
.ph .tl i{margin-left:0;flex-basis:100%}
.ph .ts{font-size:12.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ph #legend{top:auto;left:0;right:0;bottom:0;width:auto;max-height:62vh;border-radius:14px 14px 0 0}
.ph #dock button{padding:0 8px;font-size:13px}
/* ---------- 机器图（scene）：部件 + 连线 + 图层 + 推演条 + 说明卡 ---------- */
body.wide .nf.sc{grid-template-columns:minmax(0,1fr);width:1322px}
body.wide .nf.sc .kg{grid-template-columns:repeat(5,minmax(0,1fr))}
body.wide .nf.sc>.card>h1{font-size:22px;margin:2px 0 4px}
body.wide .nf.sc>.card>.lead{font-size:15.5px;margin:2px 0 4px}
.scn{margin:8px 0 4px;user-select:none;-webkit-user-select:none;cursor:grab}
.scw{position:relative}
.sci{position:absolute;top:0;transform-origin:0 0}
.sgr{position:absolute;box-sizing:border-box;border:1.5px dashed #b9b5a6;border-radius:12px}
.sgr>span{position:absolute;left:10px;top:-10px;background:var(--card);padding:0 6px;font-size:12px;line-height:18px;color:var(--mut);white-space:nowrap}
.wsv{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.wr{color:#7c8494;cursor:pointer;transition:opacity .25s}
.wr .wp{fill:none;stroke:currentColor;stroke-width:1.6}
.wr.dash .wp{stroke-dasharray:5 4}
.wr .wh{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke}
.wr .wa{fill:currentColor}
.pt{position:absolute;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;border:1.5px solid #8fa0c4;background:#f5f8ff;border-radius:10px;color:var(--ink);cursor:pointer;transition:opacity .25s,box-shadow .2s}
.pt.k-store{background:#fff9e3;border-color:#c9b46a}
.pt.k-ext{background:#f1f1ee;border-color:#a9a595;border-style:dashed}
.pt.k-bg{background:#f3effc;border-color:#9a8bd0}
.pt.k-gate{background:#fff3e6;border-color:#d9a05b}
.pt.k-out{background:#eaf6ee;border-color:#7fb894}
.nf.cur .pt:hover{box-shadow:0 0 0 2px rgba(36,86,214,.35)}
.pth{flex:none;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 6px;padding:5px 22px 1px 8px;font-size:13.5px;line-height:1.35}
.pth b{white-space:nowrap}
.pth code{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:11px/1.5 var(--mono);color:var(--mut);background:none;padding:0;border:0}
.pn,.wn,.pidx i,.pbody h4 i{flex:none;display:inline-block;min-width:17px;height:17px;padding:0 3px;box-sizing:border-box;border-radius:9px;background:var(--ink);color:#fff;font:700 11px/17px var(--sans);font-style:normal;text-align:center;align-self:center}
.pmore{position:absolute;right:6px;top:4px;font:12px/1.4 var(--sans);font-style:normal;color:#98a0ae}
.ptg{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:2px 8px;overflow:hidden}
.ptg:empty{padding:0}
.ptg.chg{animation:gchg .8s}
@keyframes gchg{0%{background:rgba(36,86,214,.28)}100%{background:transparent}}
.pts{flex:none;padding:3px 8px 4px;border-top:1px solid rgba(0,0,0,.09);background:rgba(255,255,255,.62);font-size:13px;line-height:1.35;color:#2c3445;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.pts .bd{font-size:10.5px;line-height:15px;padding:0 5px;margin-right:4px;vertical-align:1px}
.wl{position:absolute;box-sizing:border-box;min-height:22px;max-width:min(9.6em,var(--mx,999px));padding:1px 8px;background:#fff;border:1px solid #c9cdd6;border-radius:11px;font-size:12.5px;line-height:1.35;color:#2c3445;text-align:center;cursor:pointer;transition:opacity .25s}
.wl .wn{min-width:15px;height:15px;line-height:15px;font-size:10px;margin-right:4px;vertical-align:1px}
.nf.cur .wl:hover{border-color:var(--acc)}
/* 小图（glyph） */
.gcs{display:flex;flex-wrap:wrap;align-items:stretch;justify-content:center;gap:3px;max-width:100%}
.gc{box-sizing:border-box;min-width:22px;min-height:20px;padding:1px 4px;border:1px solid #c9cdd6;border-radius:4px;background:#fff;font:11px/1.25 var(--mono);text-align:center;display:flex;flex-direction:column;justify-content:center}
.gc b{display:block;font-weight:700}
.gc i{display:block;font-style:normal;font-size:10px;color:var(--mut)}
.gc.s-new{background:#dff3e6;border-color:#1a7f4b}
.gc.s-out{background:#fbdcdc;border-color:#c0392b;text-decoration:line-through}
.gc.s-ghost{background:#eee;border-color:#999;border-style:dotted;color:#999}
.gc.s-pick{background:#1d2330;border-color:#1d2330;color:#fff}
.gc.s-pick i{color:#cfd3dc}
.gc.s-mv{background:#eaf0ff;border-color:#8fa0c4}
.gc.s-empty{background:#f4f3ee;border-style:dashed}
.gce{align-self:center;font-size:10.5px;color:var(--mut);white-space:nowrap}
.gg{width:100%}
.ggb{position:relative;height:12px;background:#e4e2da;border-radius:6px}
.ggb i{position:absolute;top:0;bottom:0}
.ggf{left:0;background:#8fa0c4;border-radius:6px 0 0 6px}
.ggo{background:#d94f4f;border-radius:0 6px 6px 0}
.ggb .ggm{top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:#1d2330}
.ggt{margin-top:3px;font:11.5px/1.35 var(--mono);text-align:center;color:#2c3445}
.ggt b.ov{color:#c0392b}
.ggl{font-size:11.5px;line-height:1.3;color:var(--mut);text-align:center}
.gl,.gx{width:100%;font-size:12px;line-height:1.38}
.gl div{padding:0 6px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gl div.on{background:#1d2330;color:#fff}
.gk{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 8px;font-size:12px;line-height:1.38}
.gk span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gk span:nth-child(odd){color:var(--mut)}
.gk span:nth-child(even){font-family:var(--mono);text-align:right}
.gx div{display:flex;gap:5px;white-space:nowrap;overflow:hidden}
.gx i{flex:none;width:1em;font-style:normal;text-align:center;color:#98a0ae}
.gx .c-ok i{color:#1a7f4b}
.gx .c-no{color:#c0392b;font-weight:600}
.gx .c-no i{color:#c0392b}
.gx .c-skip{color:#a3a8b3}
.gt{text-align:center;line-height:1.2}
.gt b{display:block;font:700 19px/1.25 var(--mono)}
.gt span{display:block;font-size:11.5px;line-height:1.3;color:var(--mut)}
.gt.t-ok b{color:#1a7f4b}.gt.t-run b{color:#b26a00}.gt.t-fail b{color:#c0392b}
.ptg code,.wl code,.pts code{font-size:.92em;padding:0 2px}
/* 图层：主流程 / 为什么 / 易混点 */
.scn .o-why,.scn .o-trap{display:none}
.scn.l-why .has-why .o-main,.scn.l-trap .has-trap .o-main{display:none}
.scn.l-why .has-why .o-why,.scn.l-trap .has-trap .o-trap{display:inline}
.scn.l-why .pt.has-why .pts{background:#fff;border-top:2px solid var(--c,#b9c0cc)}
.scn.l-why .pt:not(.has-why) .pts{opacity:.42}
.scn.l-why .wl.has-why{border-left:4px solid var(--c,#b9c0cc);text-align:left}
.scn.l-why .wl:not(.has-why){opacity:.42}
.scn.l-trap .pt:not(.has-trap){opacity:.32}
.scn.l-trap .wl:not(.has-trap){opacity:.3}
.scn.l-trap .wr:not(.has-trap){opacity:.25}
.scn.l-trap .pt.has-trap{box-shadow:0 0 0 2px #d9822b}
.scn.l-trap .pt.has-trap .pts{background:#fff1e0;color:#7a4300}
.scn.l-trap .wl.has-trap{background:#fff1e0;border-color:#d9822b;color:#7a4300;text-align:left}
.scn.l-trap .wr.has-trap{color:#d9822b}
/* 推演：点亮这一步碰到的，其余压暗 */
.scn.st .pt{opacity:.38}
.scn.st .wr{opacity:.2}
.scn.st .wl{opacity:.3}
.scn.st .pt.fx,.scn.st .wr.fx,.scn.st .wl.fx{opacity:1}
.scn.st .pt.fx{box-shadow:0 0 0 2.5px var(--acc)}
.scn.st .wr.fx{color:var(--acc)}
.scn.st .wr.fx .wp{stroke-width:2.4}
.scn.st .wl.fx{border-color:var(--acc);color:var(--acc);font-weight:600}
.scn .pt.sel,.scn .wl.sel,.scn .wr.sel{opacity:1!important}
.scn .pt.sel{box-shadow:0 0 0 3px var(--ink)!important}
.scn .wl.sel{background:var(--ink)!important;border-color:var(--ink)!important;color:#fff!important}
.scn .wr.sel{color:var(--ink)!important}
.scn .wr.sel .wp{stroke-width:2.8}
/* 底部推演条 */
#play{position:fixed;z-index:31;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom));width:min(980px,calc(100vw - 24px));box-sizing:border-box;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(20,25,40,.18);font-size:14px;color:var(--ink)}
#play[hidden],#xp[hidden]{display:none}
body.nar #play{left:8px;right:8px;width:auto;transform:none}
body.wide.xpo #play{left:12px;transform:none;width:min(980px,calc(100vw - 464px))}
body.wide.xpo #dock{left:calc((100vw - 440px)/2)}
body.nar.xpo #play{display:none}
.pr1{display:flex;align-items:center;gap:8px;padding:5px 6px}
.seg{display:flex;background:#eeece5;border-radius:8px;padding:2px}
.seg button{border:0;background:none;height:30px;padding:0 10px;border-radius:6px;font:13px/1 var(--sans);color:#2c3445;cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.18);font-weight:700}
.seg small{margin-left:3px;font-size:11px;color:var(--mut);font-weight:400}
.pnav{margin-left:auto;display:flex;align-items:center;gap:4px;flex:none}
.pnav button,.pcol{height:30px;min-width:34px;border:1px solid var(--line);background:#fff;border-radius:8px;font:13px/1 var(--sans);color:var(--ink);cursor:pointer}
.pnav button{white-space:nowrap}
.pnav button:disabled{opacity:.35;cursor:default}
.pnav button.go{background:var(--acc);border-color:var(--acc);color:#fff;padding:0 12px}
.pcnt{min-width:3.6em;text-align:center;font:12.5px/1 var(--mono);color:var(--mut)}
.pbody{border-top:1px solid var(--line);padding:8px 12px 10px;max-height:30vh;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;font-size:14.5px;line-height:1.55}
body.wide #play .pbody{height:150px;max-height:none;box-sizing:border-box}
body.wide #play.nost .pbody{height:auto}
body.wide #play.ov .pbody{height:auto;padding:7px 12px 8px}
body.wide #play.ov .phint{margin:0}
body.wide #play.ov .pidx{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;margin-top:6px;padding-bottom:3px}
body.wide #play.ov .pidx button{flex:none}
#play.col .pbody{display:none}
.pbody p{margin:2px 0 4px}
.pbody h4{display:flex;align-items:center;gap:7px;margin:0 0 4px;font-size:15px;line-height:1.4}
.pbody h4 button{margin-left:auto;border:0;background:none;font:12.5px/1.4 var(--sans);color:var(--acc);cursor:pointer;padding:2px 4px;white-space:nowrap}
.pk{display:block;font-size:11.5px;line-height:1.5;letter-spacing:.06em;color:var(--mut)}
body.wide .pcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 18px}
#play .note{margin:2px 0 0;padding:5px 10px;font-size:14px}
.phint{color:#2c3445}
body.nar .ph-l,body.wide .ph-s{display:none}
body.nar .pr1{gap:6px}
body.nar .seg{min-width:0}
body.nar .seg button{padding:0 7px}
body.nar .pnav button.go{padding:0 9px}
body.nar #play.ov .pcnt,body.nar #play.ov .pnav button:disabled{display:none}
body.nar .pidx{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
body.nar .pidx::-webkit-scrollbar{display:none}
body.nar .pidx button{flex:none}
.pidx{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pidx button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:2px 10px 2px 3px;font:13px/1.5 var(--sans);color:var(--ink);cursor:pointer}
.ph .seg button{padding:0 7px;font-size:12.5px}
.ph .pr1{gap:5px}
/* 说明卡：桌面是右侧抽屉，手机是底部抽屉 */
#xp{position:fixed;z-index:44;display:flex;flex-direction:column;background:#fff;color:var(--ink)}
body.wide #xp{top:48px;right:0;bottom:0;width:440px;border-left:1px solid var(--line);box-shadow:-6px 0 24px rgba(20,25,40,.14)}
body.nar #xp{left:0;right:0;bottom:0;max-height:58vh;border-radius:14px 14px 0 0;box-shadow:0 -6px 24px rgba(20,25,40,.22)}
.xh{flex:none;display:flex;align-items:flex-start;gap:8px;padding:11px 10px 8px 14px;border-bottom:1px solid var(--line)}
.xt{flex:1;min-width:0;font-size:17px;line-height:1.4}
.xt code{font:12px/1.5 var(--mono);color:var(--mut);background:none;padding:0;border:0;word-break:break-all}
.xk{display:inline-block;margin-right:7px;padding:0 6px;border-radius:4px;background:#eeece5;color:#555;font-size:11px;line-height:18px;vertical-align:2px;font-weight:400}
.xft{font-size:12.5px;color:var(--mut);font-weight:400}
.xx{flex:none;width:32px;height:32px;border:0;border-radius:8px;background:#f1f0ea;font-size:14px;color:var(--ink);cursor:pointer}
.xb{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:2px 14px 14px}
.xb h5{margin:14px 0 2px;font-size:13px;line-height:1.5;letter-spacing:.04em;color:var(--acc)}
.xb .xs-traps h5{color:#b8650f}
.xb p{margin:6px 0;font-size:15px;line-height:1.65}
.xb .note{margin:8px 0}
.xnone{color:var(--mut)}
.xgo{display:block;width:100%;box-sizing:border-box;margin:12px 0 0;padding:8px 10px;border:1px solid var(--acc);border-radius:8px;background:#f2f6ff;color:var(--acc);font:14px/1.4 var(--sans);text-align:left;cursor:pointer}
.xf{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px calc(6px + env(safe-area-inset-bottom));border-top:1px solid var(--line);font:12.5px/1 var(--mono);color:var(--mut)}
.xf button{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font:13px/1 var(--sans);color:var(--ink);cursor:pointer}
.wl{width:max-content}
.scn.l-why .wl.has-why,.scn.l-trap .wl.has-trap{max-width:min(11em,var(--mx,999px))}
.scn.l-why .wl.v.has-why,.scn.l-trap .wl.v.has-trap{max-width:13em}
</style>
</head>
<body>
<header id="top"><button id="bmap">☰ 地图</button><nav id="crumb"></nav><button id="bleg">图例</button></header>
<div id="stage"><div id="world"></div></div>
<aside id="side"></aside>
<div id="legend" hidden></div>
<div id="hint"></div>
<nav id="dock"><button data-act="up">↑ 上层</button><button data-act="prev">‹ 上页</button><button data-act="fit" class="pos" title="回正；已经回正时再点一次看全图">1 / 1</button><button data-act="next">下页 ›</button><button data-act="kids">▾ 下层</button></nav>
<div id="zb"><button data-act="zin" title="放大">＋</button><button data-act="zout" title="缩小">－</button><button data-act="all" title="看全图">⤢</button></div>

ml":"LOOKUP / QUERY 跑在普通 CPU 线程池上（默认 1 条线程）。 <a class=\"ref\" data-k=\"lmcache/v1/multiprocess/transport/zmq_impl/server.py:139-140\" title=\"lmcache/v1/multiprocess/transport/zmq_impl/server.py:139-140\">server.py:139–140<\/a>"}],"why":[{"t":"note","k":"n11","lv":"推断","html":"从查到到真正取回，中间隔着好几个调度步；不先锁住，这段时间里块可能被淘汰掉，取的时候就扑空。","tag":null,"who":null,"more":null,"ev":[]},{"t":"note","k":"n12","lv":"推断","html":"锁带超时：客户端崩了，锁也会自己过期，不会死锁（MP 文档 docs/source/mp/index.rst 第 370–371 行有此说法；舞台不收 .rst 锚点）。","tag":null,"who":null,"more":null,"ev":[]},{"t":"note","k":"n13","lv":"文档","html":"没有 L2 时预取在调用线程上做完，所以主路下第一次 QUERY 通常就有结果。","tag":null,"who":null,"more":null,"ev":[{"lv":"文档","q":"is served on the calling thread and its result is available when the call returns.","raw":["docs/design/v1/distributed/storage_manager.md:50-52"],"rh":"<a class=\"ref\" data-k=\"docs/design/v1/distributed/storage_manager.md:50-52\" title=\"docs/design/v1/distributed/storage_manager.md:50-52\">storage_manager.md:50–52<\/a>"}]}],"traps":[{"t":"p","html":"锁是三方经手的：<b>调度器的 LOOKUP 上锁<\/b>，worker 的 RETRIEVE 用锁（不再加锁），服务端 GPU 流上的回调放锁。用不上的部分由调度器发 <code>free_lookup_locks<\/code> 放；谁都没放，读锁 300 秒后过期。 <a class=\"ref\" data-k=\"lmcache/v1/distributed/config.py:432-432\" title=\"lmcache/v1/distributed/config.py:432\">config.py:432<\/a>"},{"t":"p","html":"只能前缀命中：第 2 块没命中，第 3 块就算在 L1 里也不算。 <a class=\"ref\" data-k=\"lmcache/v1/distributed/api.py:743-743\" title=\"lmcache/v1/distributed/api.py:743\">api.py:743<\/a>"}]},"to":["lookup_src"]},{"id":"hasher","name":"身份：滚动哈希","code":"Session","kind":"store","n":null,"d":[930,30,270,130],"m":[206,30,130,130],"glyph":{"g":"cells","cells":[{"k":"h0","v":"块0","s":null},{"k":"h1","v":"块1","s":null},{"k":"h2","v":"块2","s":null}],"left":null,"right":null},"say":"token → 滚动哈希 → key","why":"同前缀才同哈希","trap":"request_id 不算身份","card":{"does":[{"t":"p","html":"决定「一块 KV 是谁」。客户端只发原始 token；服务端按 256 token 一块切开，算链式哈希，再拼上模型名、rank 等，组成存储用的 <code>ObjectKey<\/code>。存和取用的是同一套算法，所以同样的前缀一定算出同样的 key。"}],"how":[{"t":"p","html":"每个 token 打包成 4 字节，256 token = 1024 字节一段。 <a class=\"ref\" data-k=\"lmcache/v1/common/token_codec.py:19-19\" title=\"lmcache/v1/common/token_codec.py:19\">token_codec.py:19<\/a>"},{"t":"p","html":"链式：<code>h_i = blake3(h_{i-1} ‖ 第 i 块)<\/code>，32 字节。 <a class=\"ref\" data-k=\"lmcache/v1/common/token_hasher.py:43-53\" title=\"lmcache/v1/common/token_hasher.py:43-53\">token_hasher.py:43–53<\/a>"},{"t":"p","html":"每个请求一个 Session，缓存已经算过的哈希，后面只从断点接着算；STORE / RETRIEVE 重算 key 时用的是同一条链。 <a class=\"ref\" data-k=\"lmcache/v1/multiprocess/session.py:172-196\" title=\"lmcache/v1/multiprocess/session.py:172-196\">session.py:172–196<\/a> <a class=\"ref\" data-k=\"lmcache/v1/multiprocess/engine_context.py:611-622\" title=\"lmcache/v1/multiprocess/engine_context.py:611-622\">engine_context.py:611–622<\/a>"},{"t":"p","html":"<code>ObjectKey<\/code> = 块哈希 + 模型名 + kv_rank + object group + cache_salt + tags。 <a class=\"ref\" data-k=\"lmcache/v1/distributed/api.py:226-250\" title=\"lmcache/v1/distributed/api.py:226-250\">api.py:226–250<\/a>"}],"why":[{"t":"note","k":"n14","lv":"推断","html":"KV 依赖整个前缀：把前一块的哈希喂进下一块，第 i 块的 key 就隐含「前面所有 token 都相同」，这正是这块 KV 可以复用的前提。","tag":null,"who":null,"more":null,"ev":[]},{"t":"note","k":"n15","lv":"推断","html":"为什么改成服务端用原始 token 算哈希（以前用 vLLM 的 block 哈希）：相关提交只有标题，仓库里没写原因。","tag":null,"who":null,"more":null,"ev":[]}],"traps":[{"t":"note","k":"n16","lv":"注释","html":"<code>request_id<\/code> 在 key 里，但不参与相等比较，只用来找 Session。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"The request_id field is for session tracking and is NOT included in equality/hash comparisons","raw":["lmcache/v1/common/custom_types.py:63-64"],"rh":"<a class=\"ref\" data-k=\"lmcache/v1/common/custom_types.py:63-64\" title=\"lmcache/v1/common/custom_types.py:63-64\">custom_types.py:63–64<\/a>"}]},{"t":"p","html":"<code>cache_salt<\/code> 参与身份：不同租户的相同 prompt 不会互相命中。 <a class=\"ref\" data-k=\"lmcache/v1/common/custom_types.py:79-88\" title=\"lmcache/v1/common/custom_types.py:79-88\">custom_types.py:79–88<\/a>"}]},"to":["hash_src"]},{"id":"xfer","name":"传输模块","code":"TransferModule","kind":"act","n":null,"d":[500,360,230,150],"m":[4,520,126,170],"glyph":{"g":"text","big":"空闲","small":"还没有拷贝","tone":null},"say":"GPU↔CPU 真正的拷贝","why":"拷完才转正、才放锁","trap":"返回时还没拷完","card":{"does":[{"t":"p","html":"服务端里真正搬数据的模块。STORE：把 vLLM GPU block 里的 KV 拷进 L1 的 CPU 内存；RETRIEVE：反过来，拷回 vLLM 新分配的 block。拷贝在<b>服务端自己的 CUDA 流<\/b>上做。"}],"how":[{"t":"p","html":"STORE ①：算 key → 检查 block 数够不够 → 让自己的流等 vLLM 的 event。 <a class=\"ref\" data-k=\"lmcache/v1/multiprocess/modules/lmcache_driven_transfer.py:891-894\" title=\"lmcache/v1/multiprocess/modules/lmcache_driven_transfer.py:891-894\">lmcache_driven_transfer.py:891–894<\/a>"},{"t":"p","html":"STORE ②：向 L1 申请对象（staging）→ 入队 GPU→CPU 拷贝 → 在流上挂回调 <code>finish_write<\/code>。 <a class=\"ref\" data-k=\"lmcache/v1/multiprocess/modules/lmcache_driven_transfer.py:960-962\" title=\"lmcache/v1/multiprocess/modules/lmcache_driven_transfer.py:960-962\">lmcache_driven_transfer.py:960–962<\/a> <a class=\"ref\" data-k=\"lmcache/v1/multiprocess/modules/lmcache_driven_transfer.py:1003-1011\" title=\"lmcache/v1/multiprocess/modules/lmcache_driven_transfer.py:1003-1011\">lmcache_driven_transfer.py:1003–1011<\/a>"},{"t":"p","html":"RETRIEVE ①：算 key → 让自己的流等 vLLM 的 event → 先定好拷完要放的锁。 <a class=\"ref\" data-k=\"lmcache/v1/multiprocess/modules/lmcache_driven_transfer.py:1269-1272\" title=\"lmcache/v1/multiprocess/modules/lmcache_driven_transfer.py:1269-1272\">lmcache_driven_transfer.py:1269–1272<\/a> <a class=\"ref\" data-k=\"lmcache/v1/multiprocess/modules/lmcache_driven_transfer.py:1314-1318\" title=\"lmcache/v1/multiprocess/modules/lmcache_driven_transfer.py:1314-1318\">lmcache_driven_transfer.py:1314–1318<\/a>"},{"t":"p","html":"RETRIEVE ②：<code>unsafe_read<\/code> 读 LOOKUP 已锁住的对象（不再加锁）→ 入队 CPU→GPU 拷贝 → 挂回调 <code>finish_read_by_owner<\/code> 放锁。 <a class=\"ref\" data-k=\"lmcache/v1/multiprocess/modules/lmcache_driven_transfer.py:1371-1377\" title=\"lmcache/v1/multiprocess/modules/lmcache_driven_transfer.py:1371-1377\">lmcache_driven_transfer.py:1371–1377<\/a>"},{"t":"p","html":"两者都<b>立即返回<\/b>一个完成 event 的句柄；GPU 真拷完时，提交 / 放锁由另一条线程来做。 <a class=\"ref\" data-k=\"lmcache/v1/multiprocess/modules/lmcache_driven_transfer.py:269-293\" title=\"lmcache/v1/multiprocess/modules/lmcache_driven_transfer.py:269-293\">lmcache_driven_transfer.py:269–293<\/a>"},{"t":"p","html":"跑在「GPU 亲和线程池」上：同一个 vLLM 实例的请求总落在同一条线程，按到达顺序串行。 <a class=\"ref\" data-k=\"lmcache/v1/multiprocess/modules/lmcache_driven_transfer.py:714-719\" title=\"lmcache/v1/multiprocess/modules/lmcache_driven_transfer.py:714-719\">lmcache_driven_transfer.py:714–719<\/a> <a class=\"ref\" data-k=\"lmcache/v1/multiprocess/affinity_pool.py:6-6\" title=\"lmcache/v1/multiprocess/affinity_pool.py:6\">affinity_pool.py:6<\/a>"}],"why":[{"t":"note","k":"n17","lv":"注释","html":"要么全存，要么全不存：每块都拷成功才提交，否则整单放弃。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"Fail closed: commit the reserved objects only when every chunk copied successfully; otherwise the whole store is skipped.","raw":["lmcache/v1/multiprocess/modules/lmcache_driven_transfer.py:1003-1004"],"rh":"<a class=\"ref\" data-k=\"lmcache/v1/multiprocess/modules/lmcache_driven_transfer.py:1003-1004\" title=\"lmcache/v1/multiprocess/modules/lmcache_driven_transfer.py:1003-1004\">lmcache_driven_transfer.py:1003–1004<\/a>"}]},{"t":"note","k":"n18","lv":"注释","html":"完成回调绕道 C++，让驱动线程不用拿 GIL——以前 GIL 和驱动锁互相等，发生过死锁。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"Route finish_write / finish_read_prefetched through a C++ host callback so the driver thread doesn't acquire the GIL.","raw":["lmcache/v1/multiprocess/modules/lmcache_driven_transfer.py:269-270"],"rh":"<a class=\"ref\" data-k=\"lmcache/v1/multiprocess/modules/lmcache_driven_transfer.py:269-270\" title=\"lmcache/v1/multiprocess/modules/lmcache_driven_transfer.py:269-270\">lmcache_driven_transfer.py:269–270<\/a>"}]},{"t":"note","k":"n19","lv":"注释","html":"亲和线程：同一 vLLM 实例的操作都在一条线程上，共享的 GPU 临时缓冲就不用加锁。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"so that all operations for a given vLLM instance land on one thread, eliminating the need for per-instance locks on the shared temporary GPU buffer.","raw":["lmcache/v1/multiprocess/affinity_pool.py:8-10"],"rh":"<a class=\"ref\" data-k=\"lmcache/v1/multiprocess/affinity_pool.py:8-10\" title=\"lmcache/v1/multiprocess/affinity_pool.py:8-10\">affinity_pool.py:8–10<\/a>"}]}],"traps":[{"t":"p","html":"STORE 返回时数据还没拷完：回的是「已入队 + 完成 event」。对象要等回调 <code>finish_write<\/code> 之后才对读者可见。"},{"t":"p","html":"「全不存」只指入队出错或 block id 不够；key 已在 L1 时只跳过那几块，其余照存——这不算失败。 <a class=\"ref\" data-k=\"lmcache/v1/multiprocess/modules/lmcache_driven_transfer.py:973-975\" title=\"lmcache/v1/multiprocess/modules/lmcache_driven_transfer.py:973-975\">lmcache_driven_transfer.py:973–975<\/a>"},{"t":"p","html":"RETRIEVE 不加锁：锁是之前调度器的 LOOKUP 上的，它只负责用完放掉。"}]},"to":["xfer"]},{"id":"l1","name":"L1 存储","code":"StorageManager","kind":"store","n":null,"d":[930,215,270,295],"m":[210,540,126,260],"glyph":{"g":"list","rows":["（空）","0 / 20 GiB"],"on":[]},"say":"CPU 内存里一块块 KV","why":"先暂存后转正，锁住不淘汰","trap":"L1 是 CPU 内存，不是显存","card":{"does":[{"t":"p","html":"KV 存下来的地方：服务端进程里的 CPU 固定内存（pinned DRAM）。一个对象装一块 256 token 的 KV（所有层），例子里约 36 MiB（按设定的模型形状推算）。主路没有 L2，所以只有这一层。 <a class=\"ref\" data-k=\"lmcache/v1/multiprocess/modules/lmcache_driven_transfer.py:77-104\" title=\"lmcache/v1/multiprocess/modules/lmcache_driven_transfer.py:77-104\">lmcache_driven_transfer.py:77–104<\/a>"}],"how":[{"t":"p","html":"写入两阶段：<code>reserve_write<\/code> 先申请一个对读者<b>不可见<\/b>的 staging 对象；拷完调 <code>finish_write<\/code> 才转正。 <a class=\"ref\" data-k=\"lmcache/v1/distributed/storage_manager.py:289-289\" title=\"lmcache/v1/distributed/storage_manager.py:289\">storage_manager.py:289<\/a> <a class=\"ref\" data-k=\"lmcache/v1/distributed/storage_manager.py:353-353\" title=\"lmcache/v1/distributed/storage_manager.py:353\">storage_manager.py:353<\/a> <a class=\"ref\" data-k=\"lmcache/v1/distributed/l1_manager/base.py:649-649\" title=\"lmcache/v1/distributed/l1_manager/base.py:649\">base.py:649<\/a>"},{"t":"p","html":"读取三步：<code>submit_prefetch_task<\/code>（查 + 上读锁）→ <code>unsafe_read<\/code>（读）→ <code>finish_read<\/code>（放锁）。 <a class=\"ref\" data-k=\"lmcache/v1/distributed/storage_manager.py:565-565\" title=\"lmcache/v1/distributed/storage_manager.py:565\">storage_manager.py:565<\/a> <a class=\"ref\" data-k=\"lmcache/v1/distributed/storage_manager.py:710-710\" title=\"lmcache/v1/distributed/storage_manager.py:710\">storage_manager.py:710<\/a> <a class=\"ref\" data-k=\"lmcache/v1/distributed/storage_manager.py:1424-1424\" title=\"lmcache/v1/distributed/storage_manager.py:1424\">storage_manager.py:1424<\/a>"},{"t":"p","html":"读锁是计数：TP=1 时一把；TP&gt;1 时每个 worker 各取各放，一次上 n 把。 <a class=\"ref\" data-k=\"lmcache/v1/distributed/l1_manager/base.py:328-337\" title=\"lmcache/v1/distributed/l1_manager/base.py:328-337\">base.py:328–337<\/a>"},{"t":"p","html":"后台淘汰：用量过 80% 时删掉约 20% 的对象（按个数，不按内存），只挑没被读锁锁住的。 <a class=\"ref\" data-k=\"lmcache/v1/distributed/config.py:491-495\" title=\"lmcache/v1/distributed/config.py:491-495\">config.py:491–495<\/a> <a class=\"ref\" data-k=\"lmcache/v1/distributed/l1_manager/base.py:969-984\" title=\"lmcache/v1/distributed/l1_manager/base.py:969-984\">base.py:969–984<\/a>"}],"why":[{"t":"note","k":"n20","lv":"注释","html":"staging 对象和常驻对象分开放，读这个 key 的人看不见它。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"Staging objects are kept apart from the resident objects: readers of the key do not see them","raw":["lmcache/v1/distributed/l1_manager/base.py:151-154"],"rh":"<a class=\"ref\" data-k=\"lmcache/v1/distributed/l1_manager/base.py:151-154\" title=\"lmcache/v1/distributed/l1_manager/base.py:151-154\">base.py:151–154<\/a>"}]},{"t":"note","k":"n21","lv":"推断","html":"所以拷了一半的数据不会被读到；读锁则是「正被某个请求用着，不许淘汰」的标记。","tag":null,"who":null,"more":null,"ev":[]},{"t":"note","k":"n22","lv":"推断","html":"读写锁都带超时，防止客户端崩了把对象永远锁死（默认读锁 300 秒、写锁 600 秒；理由出自 MP 文档 docs/source/mp/index.rst 第 370–371 行，舞台不收 .rst 锚点）。","tag":null,"who":null,"more":null,"ev":[]}],"traps":[{"t":"p","html":"对已经存在的 key，<code>reserve_write<\/code> 会拒绝（<code>KEY_NOT_WRITABLE<\/code>），所以同一块不会写两份。 <a class=\"ref\" data-k=\"lmcache/v1/distributed/l1_manager/base.py:527-529\" title=\"lmcache/v1/distributed/l1_manager/base.py:527-529\">base.py:527–529<\/a>"},{"t":"p","html":"L1 满了不会卡住：<code>reserve_write<\/code> 返回 OUT_OF_MEMORY，这次就不存——而且整批一起失败（差一块也全不存），也不会当场挤掉旧的。 <a class=\"ref\" data-k=\"lmcache/v1/distributed/l1_manager/base.py:555-564\" title=\"lmcache/v1/distributed/l1_manager/base.py:555-564\">base.py:555–564<\/a>"}]},"to":["l1"]}],"wires":[{"id":"w_lookup","f":"sched","t":"lookup","label":"LOOKUP（不等）","ml":"LOOKUP","n":null,"why":"等回执会卡调度线程","trap":"这一下就上了锁","card":{"does":[{"t":"p","html":"调度器把这个请求的<b>全部 token<\/b> 和查找区间发给服务端，问「能命中多少」；之后再发 <code>QUERY_PREFETCH_STATUS<\/code> 取结果。"}],"how":[{"t":"p","html":"走 ZMQ 异步 RPC，key 是 <code>IPCCacheServerKey<\/code>（worker_id 为空）。 <a class=\"ref\" data-k=\"lmcache/integration/vllm/vllm_multi_process_adapter.py:865-885\" title=\"lmcache/integration/vllm/vllm_multi_process_adapter.py:865-885\">vllm_multi_process_adapter.py:865–885<\/a>"},{"t":"p","html":"发全部 token 而不是只发要查的那段：服务端要从头算链式哈希。 <a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_metadata.py:289-289\" title=\"lmcache/integration/vllm/lmcache_mp_metadata.py:289\">lmcache_mp_metadata.py:289<\/a>"}],"why":[{"t":"note","k":"n23","lv":"提交","html":"把等 LOOKUP 回执这件事挪出调度线程。","tag":null,"who":null,"more":null,"ev":[{"lv":"提交","q":"defer LOOKUP acknowledgement off the scheduler thread","raw":["c:ba8acd84"],"rh":"<a class=\"cm\" data-h=\"ba8acd84\">ba8acd84<\/a>"}]},{"t":"note","k":"n24","lv":"注释","html":"token 打包是增量的：每步只追加新 token，不重打整串，免得上下文越长调度越慢。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"repacking the whole sequence each time would put the context length back on the scheduler's critical path.","raw":["lmcache/integration/vllm/lmcache_mp_metadata.py:134-136"],"rh":"<a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_metadata.py:134-136\" title=\"lmcache/integration/vllm/lmcache_mp_metadata.py:134-136\">lmcache_mp_metadata.py:134–136<\/a>"}]}],"traps":[{"t":"p","html":"这条线（调度器进程发）和 worker 的 STORE / RETRIEVE（worker 进程发）是两个进程对同一批 key 的两次 RPC：这条上锁，那条用锁、放锁。"}]},"to":[],"fs":null,"ts":null,"mfs":"b","mts":"t","lp":null,"mlp":null,"cls":null},{"id":"w_hash","f":"lookup","t":"hasher","label":"算哈希链","ml":null,"n":null,"why":"存取同一套算法","trap":null,"card":{"does":[{"t":"p","html":"查找模块把 token 交给 Session 算哈希，拿到每块的 <code>ObjectKey<\/code>。 <a class=\"ref\" data-k=\"lmcache/v1/multiprocess/engine_context.py:578-622\" title=\"lmcache/v1/multiprocess/engine_context.py:578-622\">engine_context.py:578–622<\/a>"}],"how":[{"t":"p","html":"同一个 Session 后面还会被 STORE / RETRIEVE 用到：服务端重算 key 时，拿到的是同一条链。 <a class=\"ref\" data-k=\"lmcache/v1/multiprocess/engine_context.py:611-622\" title=\"lmcache/v1/multiprocess/engine_context.py:611-622\">engine_context.py:611–622<\/a>"}],"why":[{"t":"note","k":"n25","lv":"推断","html":"key 全在服务端按同一套规则算，客户端不用知道哈希细节，存和取也不会两边算得不一样。","tag":null,"who":null,"more":null,"ev":[]}],"traps":[{"t":"p","html":"传输模块也会走这一步，图上为了不交叉没画那条线。"}]},"to":[],"fs":null,"ts":null,"mfs":null,"mts":null,"lp":null,"mlp":null,"cls":null},{"id":"w_lock","f":"lookup","t":"l1","label":"查 + 上读锁","ml":"查+上锁","n":null,"why":"取之前不被淘汰","trap":"不取的锁要显式放","card":{"does":[{"t":"p","html":"预取任务对每个 key 在 L1 上 <code>reserve_read<\/code>：存在就读锁计数 +1，不存在就返回 <code>KEY_NOT_EXIST<\/code>。 <a class=\"ref\" data-k=\"lmcache/v1/distributed/storage_controllers/prefetch_controller.py:1274-1278\" title=\"lmcache/v1/distributed/storage_controllers/prefetch_controller.py:1274-1278\">prefetch_controller.py:1274–1278<\/a> <a class=\"ref\" data-k=\"lmcache/v1/distributed/l1_manager/base.py:328-337\" title=\"lmcache/v1/distributed/l1_manager/base.py:328-337\">base.py:328–337<\/a>"}],"how":[{"t":"p","html":"主路没有 L2：预取在当前线程同步做完。 <a class=\"ref\" data-k=\"lmcache/v1/distributed/storage_controllers/prefetch_controller.py:718-722\" title=\"lmcache/v1/distributed/storage_controllers/prefetch_controller.py:718-722\">prefetch_controller.py:718–722<\/a>"},{"t":"p","html":"命中后在 Session 里记下「这次锁了前几块」，以后放锁按它来。 <a class=\"ref\" data-k=\"lmcache/v1/multiprocess/modules/lookup.py:800-804\" title=\"lmcache/v1/multiprocess/modules/lookup.py:800-804\">lookup.py:800–804<\/a>"}],"why":[{"t":"note","k":"n26","lv":"注释","html":"用不上的块要显式放锁，否则一直锁到超时。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"Calling this prevents those chunks from holding read locks until TTL expiry.","raw":["lmcache/integration/vllm/vllm_multi_process_adapter.py:1025-1026"],"rh":"<a class=\"ref\" data-k=\"lmcache/integration/vllm/vllm_multi_process_adapter.py:1025-1026\" title=\"lmcache/integration/vllm/vllm_multi_process_adapter.py:1025-1026\">vllm_multi_process_adapter.py:1025–1026<\/a>"}]},{"t":"note","k":"n27","lv":"推断","html":"查到就锁：查到和真正取回之间隔着调度步，这段时间块不能被淘汰。","tag":null,"who":null,"more":null,"ev":[]}],"traps":[{"t":"p","html":"放锁有三条路：RETRIEVE 拷完后的流回调；查到却用不上的（不用取时的全部命中、多服务端取最小后的尾部、APC 缩水后被放弃的 LOOKUP），调度器发 <code>free_lookup_locks<\/code>。 <a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_connector.py:1678-1678\" title=\"lmcache/integration/vllm/lmcache_mp_connector.py:1678\">lmcache_mp_connector.py:1678<\/a>"},{"t":"p","html":"第三条：谁都没放（比如客户端崩了），就等读锁 300 秒超时。 <a class=\"ref\" data-k=\"lmcache/v1/distributed/config.py:432-432\" title=\"lmcache/v1/distributed/config.py:432\">config.py:432<\/a>"}]},"to":[],"fs":"b","ts":"l","mfs":null,"mts":null,"lp":null,"mlp":null,"cls":null},{"id":"w_meta","f":"sched","t":"worker","label":"工单 LoadStoreOp","ml":"工单","n":null,"why":"跨进程，随调度结果下发","trap":"不是 RPC，是元数据","card":{"does":[{"t":"p","html":"调度器每步把要做的 STORE / RETRIEVE 打成工单，随 vLLM 的 <code>SchedulerOutput<\/code> 一起发到 worker 进程。 <a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_metadata.py:666-672\" title=\"lmcache/integration/vllm/lmcache_mp_metadata.py:666-672\">lmcache_mp_metadata.py:666–672<\/a>"}],"how":[{"t":"p","html":"一张 <code>LoadStoreOp<\/code>：打包的 token、要搬的 GPU block 编号、token 区间 <code>[start, end)<\/code>、<code>skip_first_n_tokens<\/code>。 <a class=\"ref\" data-k=\"lmcache/integration/vllm/vllm_multi_process_adapter.py:483-502\" title=\"lmcache/integration/vllm/vllm_multi_process_adapter.py:483-502\">vllm_multi_process_adapter.py:483–502<\/a>"},{"t":"p","html":"例子：A 的 STORE 工单 <code>[0, 768)<\/code>，block b0–b47；B 的 RETRIEVE 工单 <code>[0, 768)<\/code>，写进 B 的前 48 个 block。"}],"why":[{"t":"note","k":"n28","lv":"推断","html":"决定在调度器做，动手在 worker 做：调度器知道每个请求的全局状态，worker 只在前向前后照单执行。","tag":null,"who":null,"more":null,"ev":[]}],"traps":[{"t":"note","k":"n29","lv":"注释","html":"取回时要跳过 vLLM 自己已有的那几个 token（<code>skip_first_n_tokens<\/code>）：那些 block 可能正被别的请求读，重写一遍就是跨流的数据竞争。例子里 vLLM 本地命中 0，所以跳过 0。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"to avoid a cross-stream data race","raw":["lmcache/integration/vllm/lmcache_mp_metadata.py:640-643"],"rh":"<a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_metadata.py:640-643\" title=\"lmcache/integration/vllm/lmcache_mp_metadata.py:640-643\">lmcache_mp_metadata.py:640–643<\/a>"}]}]},"to":[],"fs":null,"ts":null,"mfs":null,"mts":null,"lp":null,"mlp":null,"cls":null},{"id":"w_done","f":"worker","t":"sched","label":"完成名单","ml":null,"n":null,"why":"拷完才回收 block","trap":"只报延迟回收的","card":{"does":[{"t":"p","html":"worker 每步 <code>get_finished<\/code> 报出已完成的「存」（finished_sending）和「取」（finished_recving）请求，经 vLLM 回到调度这边。 <a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_connector.py:1228-1258\" title=\"lmcache/integration/vllm/lmcache_mp_connector.py:1228-1258\">lmcache_mp_connector.py:1228–1258<\/a>"}],"how":[{"t":"p","html":"A：结束时调度器因为发过 STORE，返回「延迟回收」，vLLM 先留着 A 的 63 个 block。 <a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_connector.py:1794-1794\" title=\"lmcache/integration/vllm/lmcache_mp_connector.py:1794\">lmcache_mp_connector.py:1794<\/a> <a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_connector.py:1824-1824\" title=\"lmcache/integration/vllm/lmcache_mp_connector.py:1824\">lmcache_mp_connector.py:1824<\/a>"},{"t":"p","html":"等 worker 报 A 存完，vLLM 才回收这些 block。 <a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_connector.py:1252-1256\" title=\"lmcache/integration/vllm/lmcache_mp_connector.py:1252-1256\">lmcache_mp_connector.py:1252–1256<\/a>"},{"t":"p","html":"B：worker 报 B 取完，vLLM 才把 B 放进前向。 <a class=\"ref\" data-k=\"lmcache/integration/vllm/vllm_multi_process_adapter.py:2193-2197\" title=\"lmcache/integration/vllm/vllm_multi_process_adapter.py:2193-2197\">vllm_multi_process_adapter.py:2193–2197<\/a>"}],"why":[{"t":"note","k":"n30","lv":"注释","html":"只在 STORE 可能还在读这些 block 时才留着它们。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"Keep the blocks only while a store may still read them.","raw":["lmcache/integration/vllm/lmcache_mp_connector.py:1791-1791"],"rh":"<a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_connector.py:1791-1791\" title=\"lmcache/integration/vllm/lmcache_mp_connector.py:1791\">lmcache_mp_connector.py:1791<\/a>"}]},{"t":"note","k":"n31","lv":"提交","html":"只对真的发过 STORE 的请求延迟回收。","tag":null,"who":null,"more":null,"ev":[{"lv":"提交","q":"Delay frees only for requests with a scheduled store","raw":["c:752e01fd"],"rh":"<a class=\"cm\" data-h=\"752e01fd\">752e01fd<\/a>"}]}],"traps":[{"t":"note","k":"n32","lv":"注释","html":"反过来：没要求延迟回收的请求不能报「存完」，否则 vLLM 会断言失败。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"asserts on a finished_sending report for a request it freed.","raw":["lmcache/integration/vllm/lmcache_mp_connector.py:1253-1253"],"rh":"<a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_connector.py:1253-1253\" title=\"lmcache/integration/vllm/lmcache_mp_connector.py:1253\">lmcache_mp_connector.py:1253<\/a>"}]}]},"to":[],"fs":null,"ts":null," /lmcache_mp_connector.py:846-846\" title=\"lmcache/integration/vllm/lmcache_mp_connector.py:846\">lmcache_mp_connector.py:846<\/a> <a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_metadata.py:69-69\" title=\"lmcache/integration/vllm/lmcache_mp_metadata.py:69\">lmcache_mp_metadata.py:69<\/a>"},{"t":"p","html":"图上四个回调都读写它。一个请求的 LOOKUP、分配、取回、存，分散在好几个调度步里，靠的就是这本账上的几个字段接力。"}],"how":[{"t":"p","html":"<b>state<\/b>：<code>PREFETCHING<\/code>（在查）/ <code>WAITING_FOR_LOAD<\/code>（要取）/ <code>READY<\/code> / <code>BYPASS_LMCACHE<\/code>（加载失败后绕开）。 <a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_metadata.py:53-66\" title=\"lmcache/integration/vllm/lmcache_mp_metadata.py:53-66\">lmcache_mp_metadata.py:53–66<\/a>"},{"t":"p","html":"<b>vLLM 命中<\/b>：vLLM 自己前缀缓存已有的 token，向下取整到 block 边界（例子里是 16）。每次拿到 LOOKUP 结果时重写。 <a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_connector.py:1491-1495\" title=\"lmcache/integration/vllm/lmcache_mp_connector.py:1491-1495\">lmcache_mp_connector.py:1491–1495<\/a>"},{"t":"p","html":"<b>LMCache 命中<\/b>：LOOKUP 返回的命中 token 数（从 0 数起的绝对值）。 <a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_connector.py:1540-1540\" title=\"lmcache/integration/vllm/lmcache_mp_connector.py:1540\">lmcache_mp_connector.py:1540<\/a>"},{"t":"p","html":"<b>已下单存<\/b>（<code>num_stored_tokens<\/code>）：已在 LMCache 里、或已经下过 STORE 单的 token 数，永远是 256 的倍数。命中时先设成命中数（取整块）。 <a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_connector.py:1539-1539\" title=\"lmcache/integration/vllm/lmcache_mp_connector.py:1539\">lmcache_mp_connector.py:1539<\/a>"},{"t":"p","html":"之后每出一张 STORE 单就加上。 <a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_metadata.py:456-456\" title=\"lmcache/integration/vllm/lmcache_mp_metadata.py:456\">lmcache_mp_metadata.py:456<\/a>"},{"t":"p","html":"<b>block<\/b>：vLLM 分给它的 block 编号；<b>已调度<\/b>：从建账起累计调度过的 token。另有 <code>num_engine_computed_tokens<\/code>（vLLM 真实已算位置）、<code>store_scheduled<\/code>（发没发过 STORE 单）。 <a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_metadata.py:83-99\" title=\"lmcache/integration/vllm/lmcache_mp_metadata.py:83-99\">lmcache_mp_metadata.py:83–99<\/a>"},{"t":"p","html":"还有三个只在「vLLM 自己命中一部分」时才用的字段：LOOKUP 起点、粘性的「从 0 重查」、待放的锁区间。 <a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_metadata.py:122-130\" title=\"lmcache/integration/vllm/lmcache_mp_metadata.py:122-130\">lmcache_mp_metadata.py:122–130<\/a>"}],"why":[{"t":"note","k":"n1","lv":"推断","html":"vLLM 的回调是一次一次互不相干的函数调用，没有地方替连接器记「这个请求走到哪了」；跨步的接力只能放在连接器自己的这本账里。","tag":null,"who":null,"more":null,"ev":[]},{"t":"note","k":"n2","lv":"注释","html":"记「已调度」是为了不把还没算出来的 token 拿去存。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"avoid saving tokens whose KV has not been computed yet.","raw":["lmcache/integration/vllm/lmcache_mp_metadata.py:86-86"],"rh":"<a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_metadata.py:86-86\" title=\"lmcache/integration/vllm/lmcache_mp_metadata.py:86\">lmcache_mp_metadata.py:86<\/a>"}]}],"traps":[{"t":"p","html":"「已下单存」是<b>下单那一步<\/b>就加的，不等 STORE 做完。非 lazy 模式下调度侧收不到存储失败的回报，失败了也不会补存。 <a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_metadata.py:456-456\" title=\"lmcache/integration/vllm/lmcache_mp_metadata.py:456\">lmcache_mp_metadata.py:456<\/a> <a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_connector.py:1742-1743\" title=\"lmcache/integration/vllm/lmcache_mp_connector.py:1742-1743\">lmcache_mp_connector.py:1742–1743<\/a>"},{"t":"p","html":"状态枚举的 docstring 还写着旧函数名 <code>process_loading_requests<\/code>，现在叫 <code>_process_retrieve_requests<\/code>。 <a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_metadata.py:57-57\" title=\"lmcache/integration/vllm/lmcache_mp_metadata.py:57\">lmcache_mp_metadata.py:57<\/a> <a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_connector.py:1971-1971\" title=\"lmcache/integration/vllm/lmcache_mp_connector.py:1971\">lmcache_mp_connector.py:1971<\/a>"}]},"to":["sched.tracker"]},{"id":"ask","name":"问：能取多少","code":"get_num_new_matched…","kind":"act","n":"1","d":[130,120,240,140],"m":[4,456,160,140],"glyph":{"g":"kv","rows":[["第几次问","2"],["查","[0, 1024)"],["答","(768, True)"]]},"say":"没好就答 None，下步再问","why":"不在调度线程上等","trap":"True 不等于命中","card":{"does":[{"t":"p","html":"vLLM 调度器想把一个请求排进来之前，先问它：「这个请求有多少 token 能从外面拿？」（<code>get_num_new_matched_tokens<\/code>）。 <a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_connector.py:1377-1377\" title=\"lmcache/integration/vllm/lmcache_mp_connector.py:1377\">lmcache_mp_connector.py:1377<\/a>"},{"t":"p","html":"三种回答：<code>(None, True)<\/code> 还没查完、下一步再问我；<code>(0, False)<\/code> 没命中；<code>(n, True)<\/code> 有 n 个要异步取回。 <a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_connector.py:1395-1400\" title=\"lmcache/integration/vllm/lmcache_mp_connector.py:1395-1400\">lmcache_mp_connector.py:1395–1400<\/a>"}],"how":[{"t":"p","html":"每被问一次都从头走一遍：先看是不是 BYPASS → 算 LOOKUP 起点 → <b>试着<\/b>发 LOOKUP（这个请求已经发过就什么也不做）→ 问一次结果。 <a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_connector.py:1409-1480\" title=\"lmcache/integration/vllm/lmcache_mp_connector.py:1409-1480\">lmcache_mp_connector.py:1409–1480<\/a>"},{"t":"p","html":"查的终点 = 总 token 向下取整到 256：A 1000 → 768，B 1200 → 1024。 <a class=\"ref\" data-k=\"lmcache/integration/vllm/vllm_multi_process_adapter.py:857-863\" title=\"lmcache/integration/vllm/vllm_multi_process_adapter.py:857-863\">vllm_multi_process_adapter.py:857–863<\/a>"},{"t":"p","html":"查的起点 = vLLM 已有的 token 先取整到 16、再取整到 256：A、B 都是 0；B′（vLLM 已有 320）是 256。 <a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_connector.py:1450-1459\" title=\"lmcache/integration/vllm/lmcache_mp_connector.py:1450-1459\">lmcache_mp_connector.py:1450–1459<\/a>"},{"t":"p","html":"拿到结果 ret：写 vLLM 命中、LMCache 命中，「已下单存」= ret 取整块；要取 = max(0, ret − vLLM 已算)。 <a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_connector.py:1491-1544\" title=\"lmcache/integration/vllm/lmcache_mp_connector.py:1491-1544\">lmcache_mp_connector.py:1491–1544<\/a>"}],"why":[{"t":"note","k":"n3","lv":"注释","html":"不等 LOOKUP 回执：那是调度线程上一整趟服务端往返。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"Do not wait for the acknowledgement here: that is a full server","raw":["lmcache/integration/vllm/vllm_multi_process_adapter.py:874-874"],"rh":"<a class=\"ref\" data-k=\"lmcache/integration/vllm/vllm_multi_process_adapter.py:874-874\" title=\"lmcache/integration/vllm/vllm_multi_process_adapter.py:874\">vllm_multi_process_adapter.py:874<\/a>"}]},{"t":"note","k":"n4","lv":"提交","html":"后来连查状态也改成不阻塞：没回来就答 None，交还给 vLLM 下一步再问。","tag":null,"who":null,"more":null,"ev":[{"lv":"提交","q":"Poll lookup status without blocking the scheduler","raw":["c:588c5366"],"rh":"<a class=\"cm\" data-h=\"588c5366\">588c5366<\/a>"}]},{"t":"note","k":"n5","lv":"注释","html":"起点只在「真发出 LOOKUP」那次记下；之后的空转询问不改它，否则会记成在途 LOOKUP 根本没用过的边界。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"Freeze only on a real submit","raw":["lmcache/integration/vllm/lmcache_mp_connector.py:1473-1473"],"rh":"<a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_connector.py:1473-1473\" title=\"lmcache/integration/vllm/lmcache_mp_connector.py:1473\">lmcache_mp_connector.py:1473<\/a>"}]},{"t":"note","k":"n6","lv":"注释","html":"整段 prompt 都命中时少报一个 token，让 vLLM 至少算一个（否则调度器断言失败）；账上的命中数不减。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"In full-prompt-hit case, we need to recompute the last token.","raw":["lmcache/integration/vllm/lmcache_mp_connector.py:1555-1555"],"rh":"<a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_connector.py:1555-1555\" title=\"lmcache/integration/vllm/lmcache_mp_connector.py:1555\">lmcache_mp_connector.py:1555<\/a>"}]}],"traps":[{"t":"p","html":"第二项 <code>True<\/code> 不是「命中了」，是「异步：这个请求先别算」——<code>(None, True)<\/code> 也是 True。"},{"t":"p","html":"要问几次不固定：最快是下一步就拿到（设 RPC 往返比一个调度步短）；仓库里没有实测步数。"},{"t":"note","k":"n7","lv":"注释","html":"APC 缩水（设 B″：vLLM 已有从 320 掉到 128）：记下旧 LOOKUP 锁住的区间、清账、同一步从 0 重发 LOOKUP，之后一直从 0 查。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"Sticky: after a shrink, the request looks up the full prefix from token 0.","raw":["lmcache/integration/vllm/lmcache_mp_metadata.py:126-126"],"rh":"<a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_metadata.py:126-126\" title=\"lmcache/integration/vllm/lmcache_mp_metadata.py:126\">lmcache_mp_metadata.py:126<\/a>"}]}]},"to":["sched.ask"]},{"id":"alloc","name":"分配后：定岔路","code":"update_state_after…","kind":"gate","n":"2","d":[880,190,240,140],"m":[176,456,160,140],"glyph":{"g":"kv","rows":[["岔路","→ 要取"],["FREE","终点 0，不发"]]},"say":"要取还是不用取，顺手放锁","why":"有了 block 才知道往哪写","trap":"blocks 是全部不是新增","card":{"does":[{"t":"p","html":"vLLM 给请求分好 block 后回调 <code>update_state_after_alloc(请求, 全部 block, 外部 token 数)<\/code>。这里做四件事：记 block、定岔路、丢掉 LookupState、放用不上的读锁。 <a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_connector.py:1600-1600\" title=\"lmcache/integration/vllm/lmcache_mp_connector.py:1600\">lmcache_mp_connector.py:1600<\/a>"}],"how":[{"t":"p","html":"只追加超出已记录数量的 block。 <a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_connector.py:1629-1638\" title=\"lmcache/integration/vllm/lmcache_mp_connector.py:1629-1638\">lmcache_mp_connector.py:1629–1638<\/a>"},{"t":"p","html":"岔路：外部 token &gt; 0 <b>且<\/b> LMCache 命中 &gt; vLLM 命中 → <code>WAITING_FOR_LOAD<\/code>（要取）；否则 → <code>READY<\/code>。 <a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_connector.py:1648-1656\" title=\"lmcache/integration/vllm/lmcache_mp_connector.py:1648-1656\">lmcache_mp_connector.py:1648–1656<\/a> <a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_metadata.py:179-189\" title=\"lmcache/integration/vllm/lmcache_mp_metadata.py:179-189\">lmcache_mp_metadata.py:179–189<\/a>"},{"t":"p","html":"到这时才 <code>cleanup_lookup_result<\/code>：LookupState 一直活到分配成功。 <a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_connector.py:1658-1658\" title=\"lmcache/integration/vllm/lmcache_mp_connector.py:1658\">lmcache_mp_connector.py:1658<\/a>"},{"t":"p","html":"FREE 的终点三选一：LMCache 没命中 → 0；不用取 → 全部命中；要取 → vLLM 命中数。再加上以前留下的待放区间；有东西可放才发。 <a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_connector.py:1663-1687\" title=\"lmcache/integration/vllm/lmcache_mp_connector.py:1663-1687\">lmcache_mp_connector.py:1663–1687<\/a>"},{"t":"p","html":"BYPASS 的请求在这里直接回 <code>READY<\/code>，不走岔路。 <a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_connector.py:1641-1646\" title=\"lmcache/integration/vllm/lmcache_mp_connector.py:1641-1646\">lmcache_mp_connector.py:1641–1646<\/a>"}],"why":[{"t":"note","k":"n8","lv":"注释","html":"FREE 的终点在服务端向下取整：vLLM 命中落在某块中间时，那块还要取，它的锁由 RETRIEVE 放。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"the end LMCache block is not freed (i.e., floor division)","raw":["lmcache/integration/vllm/lmcache_mp_connector.py:1672-1672"],"rh":"<a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_connector.py:1672-1672\" title=\"lmcache/integration/vllm/lmcache_mp_connector.py:1672\">lmcache_mp_connector.py:1672<\/a>"}]},{"t":"note","k":"n9","lv":"注释","html":"用不上的块要显式放锁，否则锁到超时。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"this prevents those chunks from holding read locks until TTL expiry.","raw":["lmcache/integration/vllm/vllm_multi_process_adapter.py:1026-1026"],"rh":"<a class=\"ref\" data-k=\"lmcache/integration/vllm/vllm_multi_process_adapter.py:1026-1026\" title=\"lmcache/integration/vllm/vllm_multi_process_adapter.py:1026\">vllm_multi_process_adapter.py:1026<\/a>"}]},{"t":"note","k":"n10","lv":"推断","html":"岔路放在分配之后：要取就得有 block 可写，分配前取回的数据没有落脚处。","tag":null,"who":null,"more":null,"ev":[]}],"traps":[{"t":"note","k":"n11","lv":"注释","html":"<code>blocks<\/code> 是这个请求的<b>全部<\/b> block。要异步取的请求会被调两次（第一次分配取回用的，取完再分配其余），所以只追加新增部分。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"which returns ALL blocks for the request (not just newly allocated).","raw":["lmcache/integration/vllm/lmcache_mp_connector.py:1619-1619"],"rh":"<a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_connector.py:1619-1619\" title=\"lmcache/integration/vllm/lmcache_mp_connector.py:1619\">lmcache_mp_connector.py:1619<\/a>"}]},{"t":"p","html":"FREE 常常什么都不放：B 的 vLLM 命中 0 → 不发；B′ 发 <code>[0, 320)<\/code>，服务端取整成 <code>[0, 256)<\/code> 是空的，因为 LOOKUP 从 256 查起、h0 根本没锁。真放东西的是：不用取（放全部）、起点记得比最终 vLLM 命中低、APC 缩水留下的区间。"},{"t":"p","html":"请求在分配之前就被取消：不发 FREE，读锁等 TTL（默认 300 秒）。底稿没查到这是有意还是遗漏。 <a class=\"ref\" data-k=\"lmcache/v1/distributed/config.py:432-432\" title=\"lmcache/v1/distributed/config.py:432\">config.py:432<\/a>"}]},"to":["sched.alloc"]},{"id":"build","name":"每步出单","code":"build_connector_meta","kind":"act","n":"3","d":[130,370,240,140],"m":[4,1036,160,140],"glyph":{"g":"kv","rows":[["取 start","0"],["取 end","768"],["skip","0"]]},"say":"算出存哪几块、取哪几块","why":"两个 max，防重算防漏存","trap":"下单即记账，不是纯函数","card":{"does":[{"t":"p","html":"每个调度步 vLLM 调一次 <code>build_connector_meta<\/code>：为所有请求出本步的工单，打进本步元数据。 <a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_connector.py:1694-1713\" title=\"lmcache/integration/vllm/lmcache_mp_connector.py:1694-1713\">lmcache_mp_connector.py:1694–1713<\/a>"}],"how":[{"t":"p","html":"顺序：交出延迟名单 → 遍历<b>所有<\/b>账本，<code>WAITING_FOR_LOAD<\/code> 的出 RETRIEVE 单并置 <code>READY<\/code> → 本步新调度的请求 → 已在跑的请求（这两类先更新「已调度」和 vLLM 已算位置，再试着出 STORE 单）。"},{"t":"p","html":"取单和存单各自的入口： <a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_connector.py:1977-1987\" title=\"lmcache/integration/vllm/lmcache_mp_connector.py:1977-1987\">lmcache_mp_connector.py:1977–1987<\/a> <a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_connector.py:1996-2020\" title=\"lmcache/integration/vllm/lmcache_mp_connector.py:1996-2020\">lmcache_mp_connector.py:1996–2020<\/a>"},{"t":"p","html":"存多少：computed = max(已调度 + max(vLLM 命中, LMCache 命中), vLLM 已算位置)；avail = min(总 token, 已分配 block × 16, computed)，再按 prompt 长度封顶；staging = avail − 已下单存；够几个 256 就出几块。"},{"t":"p","html":"公式 ull,"who":null,"more":null,"ev":[{"lv":"注释","q":"avoid saving tokens whose KV has not been computed yet.","raw":["lmcache/integration/vllm/lmcache_mp_metadata.py:86-86"],"rh":"<a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_metadata.py:86-86\" title=\"lmcache/integration/vllm/lmcache_mp_metadata.py:86\">lmcache_mp_metadata.py:86<\/a>"}]},{"t":"note","k":"n15","lv":"注释","html":"取回要跳过 vLLM 已有的那几个 token：那些 block 可能正被别的请求在 vLLM 的流上读。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"to avoid a cross-stream data race","raw":["lmcache/integration/vllm/lmcache_mp_metadata.py:641-641"],"rh":"<a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_metadata.py:641-641\" title=\"lmcache/integration/vllm/lmcache_mp_metadata.py:641\">lmcache_mp_metadata.py:641<\/a>"}]}],"traps":[{"t":"p","html":"两个 max 不是一回事：内层防重复计数，外层是下界。"},{"t":"p","html":"RETRIEVE 单跟着账本的状态出，不跟着「请求被调度」出：B 那一步没被调度计算，照样出了取单。（看循环遍历的是全部账本得出。） <a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_connector.py:1977-1978\" title=\"lmcache/integration/vllm/lmcache_mp_connector.py:1977-1978\">lmcache_mp_connector.py:1977–1978<\/a>"},{"t":"p","html":"存的算术在函数里就改了「已下单存」：同一步调两次会少出单。"},{"t":"p","html":"分块预填（设每步预算 512）：A 第 1 步只分到 32 个 block → STORE <code>[0, 512)<\/code>；第 2 步补齐 → STORE <code>[512, 768)<\/code>。"}]},"to":["sched.store"]},{"id":"finish","name":"结束：延迟回收","code":"request_finished","kind":"act","n":"4","d":[880,370,240,140],"m":[176,1036,160,140],"glyph":{"g":"kv","rows":[["store 过?","否"],["延迟名单","{}"]]},"say":"下过存单的，block 晚点还","why":"STORE 可能还在读 block","trap":"名单要绕 worker 一圈","card":{"does":[{"t":"p","html":"请求结束时 vLLM 调 <code>request_finished<\/code>，问：这个请求的 block 能马上回收吗？返回 True = 先别回收，等我报。 <a class=\"ref\" data-k=\"lmcache/integration/vllm/lmcache_mp_connector.py:1754-1754\" title=\"lmcache/integration/vllm/lmcache_mp_connector.py:1754\">lmcache_mp_connector.py:1754<\/a>"}],"how":[{"t":"p","html":"先读 <code>store_scheduled<\/code> 定下 delay_free，<b>再<\/b>删账本——顺序不能反。 <a class=\ ass=\"ref\" data-k=\"lmcache/v1/multiprocess/config.py:59-59\" title=\"lmcache/v1/multiprocess/config.py:59\">config.py:59<\/a>"}],"why":[{"t":"note","k":"n4","lv":"注释","html":"同一实例的操作都落在一条线程上，共享的 GPU 临时缓冲就不用加锁。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"so that all operations for a given vLLM instance land on one thread, eliminating the need for per-instance locks on the shared temporary GPU buffer.","raw":["lmcache/v1/multiprocess/affinity_pool.py:8-10"],"rh":"<a class=\"ref\" data-k=\"lmcache/v1/multiprocess/affinity_pool.py:8-10\" title=\"lmcache/v1/multiprocess/affinity_pool.py:8-10\">affinity_pool.py:8–10<\/a>"}]},{"t":"note","k":"n5","lv":"注释","html":"那块 block id 缓冲（以及 4 槽暂存缓冲）每实例只有一份，每次覆盖写，靠「只有一条线程在用」免锁。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"Single-thread assumption: no lock needed.","raw":["lmcache/v1/platform/devices/cuda/cache_context.py:417-419"],"rh":"<a class=\"ref\" data-k=\"lmcache/v1/platform/devices/cuda/cache_context.py:417-419\" title=\"lmcache/v1/platform/devices/cuda/cache_context.py:417-419\">cache_context.py:417–419<\/a>"}]},{"t":"note","k":"n6","lv":"提交","html":"引入亲和池的同一个提交里，删掉了原来的每设备锁。","tag":null,"who":null,"more":null,"ev":[{"lv":"提交","q":"support worker-affinity in the MQ thread pool","raw":["c:3137ce0b"],"rh":"<a class=\"cm\" data-h=\"3137ce0b\">3137ce0b<\/a>"}]}],"traps":[{"t":"p","html":"线程数不是「每 worker 一条」：默认全局 1 条，所有 worker 的 STORE / RETRIEVE 都排在它上面；槽位用完后来的 key 共享线程，只警告一次。 <a class=\"ref\" data-k=\"lmcache/v1/multiprocess/affinity_pool.py:156-166\" title=\"lmcache/v1/multiprocess/affinity_pool.py:156-166\">affinity_pool.py:156–166<\/a>"},{"t":"p","html":"同一条线程上 STORE 和 RETRIEVE 串行：后到的等前一个<b>入队完<\/b>（不是拷完）才开始。"}]},"to":["xfer.pool"]},{"id":"aff","name":"亲和线程：只下单","code":"store()","kind":"act","n":"1","d":[330,20,260,230],"m":[72,422,200,240],"glyph":{"g":"checks","rows":[["48 个 id ≥ 3×16",null],["流等 ev_A",null],["预留 h0 h1 h2",null],["发 3 次拷贝",null],["录 ev·挂提交",null]]},"say":"检查、预留、把活排进流","why":"不等拷贝，线程很快空出来","trap":"返回时还没拷完","card":{"does":[{"t":"p","html":"亲和线程上跑 <code>store()<\/code> / <code>retrieve()<\/code>。它只做「排队下单」：检查、向 L1 预留、把等待 / 拷贝 / event / 回调依次排进服务端的 CUDA 流，然后就返回。它自己<b>不等任何一次拷贝<\/b>。"}],"how":[{"t":"p","html":"进入 <code>torch_dev.stream(服务端流)<\/code>：之后发的东西默认都进这条流；最先建好自己的完成 event。 <a class=\"ref\" data-k=\"lmcache/v1/multiprocess/modules/lmcache_driven_transfer.py:840-844\" title=\"lmcache/v1/multiprocess/modules/lmcache_driven_transfer.py:840-844\">lmcache_driven_transfer.py:840–844<\/a>"},{"t":"p","html":"守卫：每组 block id 数 &lt; chunk 数 × 16 → 整单放弃。查的是裁剪前的原始 id。 <a class=\"ref\" data-k=\"lmcache/v1/multiprocess/modules/lmcache_driven_transfer.py:853-858\" title=\"lmcache/v1/multiprocess/modules/lmcache_driven_transfer.py:853-858\">lmcache_driven_transfer.py:853–858<\/a>"},{"t":"p","html":"先算「全空块掩码」，再把 block id 裁剪、拷进 GPU 缓冲（这一步会就地改写列表）。 <a class=\"ref\" data-k=\"lmcache/v1/multiprocess/modules/lmcache_driven_transfer.py:874-889\" title=\"lmcache/v1/multiprocess/modules/lmcache_driven_transfer.py:874-889\">lmcache_driven_transfer.py:874–889<\/a>"},{"t":"p","html":"每个 object group：<code>reserve_write<\/code> → 记 owner → <code>transfer_object_group<\/code>。 <a class=\"ref\" data-k=\"lmcache/v1/multiprocess/modules/lmcache_driven_transfer.py:960-987\" title=\"lmcache/v1/multiprocess/modules/lmcache_driven_transfer.py:960-987\">lmcache_driven_transfer.py:960–987<\/a>"},{"t":"p","html":"<code>finally<\/code>：录完成 event → 全成功挂 <code>finish_write<\/code>，否则挂 <code>abort_write<\/code>。 <a class=\"ref\" data-k=\"lmcache/v1/multiprocess/modules/lmcache_driven_transfer.py:1001-1018\" title=\"lmcache/v1/multiprocess/modules/lmcache_driven_transfer.py:1001-1018\">lmcache_driven_transfer.py:1001–1018<\/a>"}],"why":[{"t":"note","k":"n7","lv":"注释","html":"「要么全存要么全不存」：失败时整单不提交，之后的取回只是 miss、引擎重算——丢的是一次复用，不是正确性。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"the whole store is skipped and nothing is committed; a subsequent retrieve misses and the engine recomputes
