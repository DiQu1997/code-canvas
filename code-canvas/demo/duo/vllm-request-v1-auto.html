EnabledFor(DEBUG):","                    logger.debug(\"EngineCore waiting for work.\")","                    waited = True","            block = self.process_input_queue_block","            try:","                with get_watch_dog().disable():","                    req = self.input_queue.get(block=block)","                self._handle_client_request(*req)","            except queue.Empty:","                break","            if not block:","                break","","        if waited:","            logger.debug(\"EngineCore loop active.\")","","        # Handle any more client requests.","        while not self.input_queue.empty():","            req = self.input_queue.get_nowait()","            self._handle_client_request(*req)"]}],"notes":[{"t":"note","k":"n3","lv":null,"html":"只有「没活」时才进这个等待循环；本例请求到达前就停在这里。","tag":null,"who":null,"more":null,"ev":[],"a":1847,"b":1847},{"t":"note","k":"n4","lv":null,"html":"阻塞在 input_queue 上，输入线程一放进请求就醒。","tag":null,"who":null,"more":null,"ev":[],"a":1860,"b":1860},{"t":"note","k":"n5","lv":null,"html":"有活时不阻塞：只把已经到了的消息处理完就去跑 step。","tag":null,"who":null,"more":null,"ev":[],"a":1871,"b":1873}],"cap":"_process_input_queue：空闲时等，忙时只清空"},{"t":"code","file":"vllm/v1/engine/core.py","parts":[{"a":783,"b":852,"lines":["        model_executed = False","        # Workers need a deferred step's sample_tokens() before the next step.","        if self.deferred_step is None and self.scheduler.has_requests():","            scheduler_output = self.scheduler.schedule(self._should_throttle_prefills())","            with self.log_error_detail(scheduler_output):","                exec_future = self.model_executor.execute_model(","                    scheduler_output, non_block=True","                )","            if not self.is_mm_encoder_only:","                model_executed = scheduler_output.total_num_scheduled_tokens > 0","            if model_executed:","                self.num_executed_steps += 1","","            if self.is_pooling_model or not model_executed:","                # No sampling required (no requests scheduled).","                future = cast(Future[ModelRunnerOutput], exec_future)","            else:","                if not scheduler_output.pending_structured_output_tokens:","                    if scheduler_output.has_structured_output_spec_decode:","                        draft_token_ids = self.model_executor.take_draft_token_ids()","                        if draft_token_ids is not None:","                            self.scheduler.update_draft_token_ids_in_output(","                                draft_token_ids, scheduler_output","                            )","                    # We aren't waiting for any tokens, get any grammar output","                    # and sample immediately.","                    grammar_output = self.scheduler.get_grammar_bitmask(","                        scheduler_output","                    )","                    future = self.model_executor.sample_tokens(","                        grammar_output, non_block=True","                    )","                else:","                    # We need to defer sampling until we have processed the model","                    # outputs from the prior steps.","                    self.deferred_step = (scheduler_output, exec_future)","","            if self.deferred_step is None:","                # Add this step's future to the queue.","                batch_queue.appendleft((future, scheduler_output, exec_future))","                if len(batch_queue) < self.batch_queue_size and (","                    model_executed or self.scheduler.has_requests()","                ):","                    # Don't block on next worker response unless the queue is full","                    # or there are no more requests to schedule.","                    return None, model_executed","","        elif not batch_queue:","            # Queue is empty. We should not reach here since this method should","            # only be called when the scheduler contains requests or the queue","            # is non-empty.","            return None, False","","        # Block until the next result is available.","        future, scheduler_output, exec_model_fut = batch_queue.pop()","        with self.log_error_detail(scheduler_output):","            model_output = self._wait_for_output(future)","            if model_output is None:","                # None from sample_tokens() implies that the original execute_model()","                # call failed - raise that exception.","                exec_model_fut.result()","                raise RuntimeError(\"unexpected error\")","        iteration_details = self._untimed_iteration_details(scheduler_output)","","        # Before processing the model output, process any aborts that happened","        # during the model execution.","        self._process_aborts_queue()","        engine_core_outputs = self.scheduler.update_from_output(","            scheduler_output, model_output","        )"]}],"notes":[{"t":"note","k":"n6","lv":null,"html":"排这一步：本例第 1 轮排 20 个 token，之后每轮 1 个。","tag":null,"who":null,"more":null,"ev":[],"a":786,"b":786},{"t":"note","k":"n7","lv":null,"html":"发射前向，不等，拿回 Future。","tag":null,"who":null,"more":null,"ev":[],"a":788,"b":790},{"t":"note","k":"n8","lv":null,"html":"没有结构化输出就立刻发射采样，同样不等。","tag":null,"who":null,"more":null,"ev":[],"a":812,"b":814},{"t":"note","k":"n9","lv":"注释","html":"队列没满就直接返回、不等结果：先把下一批排上。本例第 1 轮在这里返回。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"Don't block on next worker response unless the queue is full","raw":["vllm/v1/engine/core.py:822-828"],"rh":"<a class=\"ref\" data-k=\"vllm/v1/engine/core.py:822-828\" title=\"vllm/v1/engine/core.py:822-828\">core.py:822–828<\/a>"}],"a":822,"b":828},{"t":"note","k":"n10","lv":null,"html":"队列满了：取出最早那批（第 1 轮排的），等它的 token 拷回 CPU。","tag":null,"who":null,"more":null,"ev":[],"a":837,"b":839},{"t":"note","k":"n11","lv":null,"html":"先处理 abort，再把结果交给调度器：追加 token、判停、产出 EngineCoreOutput。","tag":null,"who":null,"more":null,"ev":[],"a":849,"b":852}],"cap":"step_with_batch_queue：先排后取"}],"refs":["vllm/v1/engine/core.py:822-828"],"children":[],"back":["root"]},{"id":"sched","nav":"调度器内部","title":"调度器：一步是怎么排出来的","short":"顶层「调度器」框里面：两个队列、token 预算、KV 账房和块仓库、抢占，以及「已算 / 占位」怎么变。","lead":"你在顶层图「调度器」这个框里面。顶层只画了三个数（本步排 / 已算 / 占位）；这里拆开看它们是怎么定出来的。按 ▶ 接着顶层的例子 R（20 个 prompt token，生成 7 个，最后一个是 <code>&lt;eos&gt;<\/code>，<code>max_tokens=8<\/code>）走一遍，中间插进三个补设的场景：长 prompt 挤进来、同样的 prompt 再来一次、显存满了要抢占。","src":"vllm/v1/core/sched/scheduler.py schedule() / update_from_output()","blocks":[{"t":"scene","w":1220,"h":520,"mw":340,"mh":1212,"parts":[{"id":"req","name":"请求的三个数","code":"Request","kind":"store","n":null,"d":[1010,16,200,124],"m":[70,8,200,124],"glyph":{"g":"kv","rows":[["已有","20"],["已算","0"],["占位","0"]]},"say":"每步让「已算」追上「已有+占位」","why":"没有 prefill/decode 两阶段","trap":"「已算」其实是「已排」","card":{"does":[{"t":"p","html":"调度器眼里，每个请求只有三个数：<b>已有<\/b>（<code>num_tokens<\/code>，prompt + 已确认的输出）、<b>已算<\/b>（<code>num_computed_tokens<\/code>）、<b>占位<\/b>（<code>num_output_placeholders<\/code>，已经排出去、值还没回来的输出个数）。 <a class=\"ref\" data-k=\"vllm/v1/request.py:338-338\" title=\"vllm/v1/request.py:338\">request.py:338<\/a> <a class=\"ref\" data-k=\"vllm/v1/request.py:172-172\" title=\"vllm/v1/request.py:172\">request.py:172<\/a>"}],"how":[{"t":"p","html":"每一步做的事，就是给每个请求分几个 token，让「已算」追上「已有 + 占位」。"},{"t":"p","html":"running 请求这一步要排的量 = 已有 + 占位 − 已算。本例第 1 步：20 + 0 − 0 = 20；之后每步：x + 1 − x = 1。 <a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:824-828\" title=\"vllm/v1/core/sched/scheduler.py:824-828\">scheduler.py:824–828<\/a>"},{"t":"p","html":"「已算」在<b>排完的那一刻<\/b>就加上去，不等 GPU 算完；只要这一步会采样，就再记 1 个占位。结果回来时「已有」+1、占位 −1。 <a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:1892-1892\" title=\"vllm/v1/core/sched/scheduler.py:1892\">scheduler.py:1892<\/a> <a class=\"ref\" data-k=\"vllm/v1/core/sched/async_scheduler.py:45-48\" title=\"vllm/v1/core/sched/async_scheduler.py:45-48\">async_scheduler.py:45–48<\/a> <a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:2957-2957\" title=\"vllm/v1/core/sched/scheduler.py:2957\">scheduler.py:2957<\/a>"},{"t":"p","html":"「已算」也会往回走：被抢占时清零；投机 token 被拒、或一次回来多个 token 中途停下时回退。 <a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:1854-1854\" title=\"vllm/v1/core/sched/scheduler.py:1854\">scheduler.py:1854<\/a> <a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:1887-1888\" title=\"vllm/v1/core/sched/scheduler.py:1887-1888\">scheduler.py:1887–1888<\/a> <a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:2947-2952\" title=\"vllm/v1/core/sched/scheduler.py:2947-2952\">scheduler.py:2947–2952<\/a>"}],"why":[{"t":"note","k":"n1","lv":"注释","html":"调度器里没有「prefill 阶段」「decode 阶段」，只有「已算」追「已有」；分块 prefill、前缀缓存、投机解码都只是这一个追赶循环的不同取值。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"so that each request's num_computed_tokens can catch up its","raw":["vllm/v1/core/sched/scheduler.py:710-710"],"rh":"<a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:710-710\" title=\"vllm/v1/core/sched/scheduler.py:710\">scheduler.py:710<\/a>"}]},{"t":"note","k":"n2","lv":"注释","html":"排完就推进「已算」：下一步可以马上再排这个请求（比如分块 prefill 的下一块），不用等结果回来。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"schedule the prefill request again immediately in the next","raw":["vllm/v1/core/sched/scheduler.py:1885-1885"],"rh":"<a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:1885-1885\" title=\"vllm/v1/core/sched/scheduler.py:1885\">scheduler.py:1885<\/a>"}]}],"traps":[{"t":"p","html":"「已算」其实是「已排」：GPU 还没算，它就加了。顶层框上的三个数（本步排 / 已算 / 占位）就是这里的值。"},{"t":"p","html":"占位不是一个 token 值，只是个计数：它让「已有 + 占位 − 已算」在结果还没回来时仍然等于 1，于是不用等就能排下一步。"}]},"to":["sched.ph"]},{"id":"running","name":"运行队列","code":"running","kind":"store","n":null,"d":[120,16,160,124],"m":[220,388,118,140],"glyph":{"g":"text","big":"空","small":"还没有请求","tone":null},"say":"有 KV 的请求，按进入顺序","why":"先排它：decode 不断流","trap":"最后进的最先被踢","card":{"does":[{"t":"p","html":"已经分到 KV block 的请求，不管在 decode 还是 prefill 到一半。每一步 <code>schedule()<\/code> <b>先<\/b>从头到尾过一遍它。"}],"how":[{"t":"p","html":"一个按进入顺序排的 <code>list[Request]<\/code>：waiting 里的请求分到 block 后被 <code>append<\/code> 到末尾，越靠后越晚进。 <a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:1596-1598\" title=\"vllm/v1/core/sched/scheduler.py:1596-1598\">scheduler.py:1596–1598<\/a>"},{"t":"p","html":"循环条件是 <code>token_budget &gt; 0<\/code>：预算用完就停，没排上的留在原地，下一步再来。 <a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:780-780\" title=\"vllm/v1/core/sched/scheduler.py:780\">scheduler.py:780<\/a>"},{"t":"p","html":"某个请求这一步排不了（<code>num_new_tokens == 0<\/code>）就 <code>continue<\/code> 跳过它，接着排后面的。 <a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:890-894\" title=\"vllm/v1/core/sched/scheduler.py:890-894\">scheduler.py:890–894<\/a>"}],"why":[{"t":"note","k":"n3","lv":"文档","html":"先排所有 decode，再排 prefill：decode 优先，token 间延迟（ITL）更好；同一批里 prefill（算力密集）和 decode（访存密集）搭配，GPU 用得更满。","tag":null,"who":null,"more":null,"ev":[{"lv":"文档","q":"It batches all pending decode requests before scheduling any prefill operations.","raw":["docs/configuration/optimization.md:91-91"],"rh":"<a class=\"ref\" data-k=\"docs/configuration/optimization.md:91-91\" title=\"docs/configuration/optimization.md:91\">optimization.md:91<\/a>"}]},{"t":"note","k":"n4","lv":"推断","html":"running 的请求已经占着 KV；先把它们排完，剩下的预算和 KV 才给新请求，新请求就不会把老请求饿住、或逼老请求被抢占。","tag":null,"who":null,"more":null,"ev":[]},{"t":"note","k":"n5","lv":"注释","html":"排不了就跳过（<code>continue<\/code> 而不是 <code>break<\/code>）：不死守先来先服务，让后面的请求也能排上。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"we do not strictly follow the FCFS scheduling policy and","raw":["vllm/v1/core/sched/scheduler.py:891-891"],"rh":"<a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:891-891\" title=\"vllm/v1/core/sched/scheduler.py:891\">scheduler.py:891<\/a>"}]}],"traps":[{"t":"p","html":"「最后一个」= 最晚进来的那个：显存不够时，FCFS 抢占踢的就是它。 <a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:923-923\" title=\"vllm/v1/core/sched/scheduler.py:923\">scheduler.py:923<\/a>"},{"t":"p","html":"人数另有上限 <code>max_num_seqs<\/code>（显存 ≥70GB 默认 1024，其余 256）；满了 waiting 里的就进不来。 <a class=\"ref\" data-k=\"vllm/engine/arg_utils.py:3008-3008\" title=\"vllm/engine/arg_utils.py:3008\">arg_utils.py:3008<\/a> <a class=\"ref\" data-k=\"vllm/engine/arg_utils.py:3032-3032\" title=\"vllm/engine/arg_utils.py:3032\">arg_utils.py:3032<\/a>"}]},"to":["sched.loop"]},{"id":"waiting","name":"等待队列","code":"waiting","kind":"store","n":null,"d":[120,402,160,116],"m":[220,858,118,124],"glyph":{"g":"cells","cells":[{"k":null,"v":"","s":"empty"},{"k":null,"v":"","s":"empty"}],"left":"队首","right":null},"say":"还没 KV：新来的+被踢的","why":"队首卡住，后面也不排","trap":"本步踢过人就不排它","card":{"does":[{"t":"p","html":"还没分到 KV block 的请求：<code>add_request<\/code> 新来的，和被抢占踢回来的。"}],"how":[{"t":"p","html":"默认 FCFS：一个 deque；被抢占的请求用 <code>prepend_request<\/code>（<code>appendleft<\/code>）插回<b>队首<\/b>。 <a class=\"ref\" data-k=\"vllm/v1/core/sched/request_queue.py:75-75\" title=\"vllm/v1/core/sched/request_queue.py:75\">request_queue.py:75<\/a> <a class=\"ref\" data-k=\"vllm/v1/core/sched/request_queue.py:94-94\" title=\"vllm/v1/core/sched/request_queue.py:94\">request_queue.py:94<\/a>"},{"t":"p","html":"<code>--scheduling-policy priority<\/code> 时换成堆。 <a class=\"ref\" data-k=\"vllm/v1/core/sched/request_queue.py:131-131\" title=\"vllm/v1/core/sched/request_queue.py:131\">request_queue.py:131<\/a>"},{"t":"p","html":"running 排完才轮到它，而且只在<b>这一步没发生过抢占<\/b>时：<code>if not preempted_reqs<\/code>。 <a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:1041-1041\" title=\"vllm/v1/core/sched/scheduler.py:1041\">scheduler.py:1041<\/a>"},{"t":"p","html":"一次看队首一个：查前缀缓存 → 定排几个 → 要 block；分到就弹出、加进 running；分不到就 <code>break<\/code>，后面的也不排。 <a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:1508-1515\" title=\"vllm/v1/core/sched/scheduler.py:1508-1515\">scheduler.py:1508–1515<\/a>"}],"why":[{"t":"note","k":"n6","lv":"推断","html":"队首分不到就停、不让后面的小请求插队：否则大请求可能一直排不上。仓库里没有注释说明这一点；依据是它和 running 那边「continue」的注释正好相反。","tag":null,"who":null,"more":null,"ev":[]},{"t":"note","k":"n7","lv":"推断","html":"刚因为 KV 不够踢了人，说明显存紧；这时再放新请求进来，要么分不到，要么又逼出下一次抢占。这一行从 V1 第一个提交就在，没有注释。","tag":null,"who":null,"more":null,"ev":[]}],"traps":[{"t":"p","html":"这一步排不了、但<b>不是显存问题<\/b>的（比如多模态编码预算用完），不会 <code>break<\/code>，而是暂放一边，循环结束放回队首。 <a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:1449-1449\" title=\"vllm/v1/core/sched/scheduler.py:1449\">scheduler.py:1449<\/a>"}]},"to":["sched.admit"]},{"id":"budget","name":"本步 token 预算","code":"token_budget","kind":"gate","n":null,"d":[400,402,190,116],"m":[85,1078,170,126],"glyph":{"g":"gauge","used":0,"limit":2048,"total":2300,"label":"本步已用","unit":""},"say":"每排一个就扣掉","why":"按 token 数限","trap":"满了下一步再排","card":{"does":[{"t":"p","html":"<code>schedule()<\/code> 开头设的一个局部变量：这一步所有请求加起来最多排多少 token。每排上一个请求就扣掉它的 token 数。"}],"how":[{"t":"p","html":"<code>token_budget = self.max_num_scheduled_tokens<\/code>；没开投机解码时就等于 <code>max_num_batched_tokens<\/code>。 <a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:728-731\" title=\"vllm/v1/core/sched/scheduler.py:728-731\">scheduler.py:728–731<\/a> <a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:147-150\" title=\"vllm/v1/core/sched/scheduler.py:147-150\">scheduler.py:147–150<\/a>"},{"t":"p","html":"单个请求一次最多拿 <code>min(待算, 剩余预算)<\/code>：一个长 prompt 就这样被<b>自然地切块<\/b>，没有专门的分块分支。 <a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:831-833\" title=\"vllm/v1/core/sched/scheduler.py:831-833\">scheduler.py:831–833<\/a> <a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:1388-1388\" title=\"vllm/v1/core/sched/scheduler.py:1388\">scheduler.py:1388<\/a>"},{"t":"p","html":"默认值按显存分档：≥160GB 是 16384；≥70GB（A100 / GB10 除外）是 8192；其余 2048。本页设为 <b>2048<\/b>。 <a class=\"ref\" data-k=\"vllm/engine/arg_utils.py:3004-3004\" title=\"vllm/engine/arg_utils.py:3004\">arg_utils.py:3004<\/a> <a class=\"ref\" data-k=\"vllm/engine/arg_utils.py:3018-3018\" title=\"vllm/engine/arg_utils.py:3018\">arg_utils.py:3018<\/a> <a class=\"ref\" data-k=\"vllm/engine/arg_utils.py:3028-3028\" title=\"vllm/engine/arg_utils.py:3028\">arg_utils.py:3028<\/a>"},{"t":"p","html":"结尾有硬断言：总数不超过预算。 <a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:1674-1674\" title=\"vllm/v1/core/sched/scheduler.py:1674\">scheduler.py:1674<\/a>"}],"why":[{"t":"note","k":"n8","lv":"文档","html":"预算小（如 2048），夹进来的 prefill 少，decode 的 token 间延迟（ITL）更好；预算大，一批能吞更多 prefill，首 token 延迟（TTFT）更好。","tag":null,"who":null,"more":null,"ev":[{"lv":"文档","q":"Smaller values (e.g., 2048) achieve better ITL because there are fewer prefills slowing down decodes.","raw":["docs/configuration/optimization.md:102-102"],"rh":"<a class=\"ref\" data-k=\"docs/configuration/optimization.md:102-102\" title=\"docs/configuration/optimization.md:102\">optimization.md:102<\/a>"}]},{"t":"note","k":"n9","lv":"推断","html":"按 token 而不按请求数限：一步的计算量约正比于 token 数；一个 prefill 可能几千 token、一个 decode 只有 1 个，按请求数限不住一步的耗时。","tag":null,"who":null,"more":null,"ev":[]}],"traps":[{"t":"p","html":"预算满了不是错误：没排上的请求原地不动，下一步再来。"},{"t":"p","html":"三档默认值里只有 A100 有一条注释说明；其余硬件源码里写着「还没调」。 <a class=\"ref\" data-k=\"vllm/engine/arg_utils.py:3025-3025\" title=\"vllm/engine/arg_utils.py:3025\">arg_utils.py:3025<\/a>"}]},"to":["sched.loop"]},{"id":"calc","name":"定这步排几个","code":"num_new_tokens","kind":"gate","n":null,"d":[400,196,190,150],"m":[94,623,156,165],"glyph":{"g":"kv","rows":[["待算","—"],["预算剩","2048"],["本步排","—"]]},"say":"待算和剩余预算取小","why":"一个公式盖住 prefill 和 decode","trap":"命中的 token 不算待算","card":{"does":[{"t":"p","html":"对眼下这个请求，算这一步给它排几个 token。running 和 waiting 两个循环都要过这一关。"}],"how":[{"t":"p","html":"running 的请求：待算 = 已有 + 占位 − 已算，再和剩余预算取小。 <a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:824-833\" title=\"vllm/v1/core/sched/scheduler.py:824-833\">scheduler.py:824–833<\/a>"},{"t":"p","html":"waiting 的请求：先查前缀缓存，命中的 token 直接当「已算」；待算 = 已有 − 命中，再和预算取小。 <a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:1239-1239\" title=\"vllm/v1/core/sched/scheduler.py:1239\">scheduler.py:1239<\/a> <a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:1348-1348\" title=\"vllm/v1/core/sched/scheduler.py:1348\">scheduler.py:1348<\/a> <a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:1388-1388\" title=\"vllm/v1/core/sched/scheduler.py:1388\">scheduler.py:1388<\/a>"},{"t":"p","html":"running 的请求<b>先<\/b>过一道守卫：在飞的几步已经确定能凑满 <code>max_tokens<\/code>，这一步就不排它（推演第 9 步算给你看）。 <a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:785-799\" title=\"vllm/v1/core/sched/scheduler.py:785-799\">scheduler.py:785–799<\/a>"},{"t":"p","html":"另有两个封顶：<code>long_prefill_token_threshold<\/code>（默认关；只有一个请求时也不生效）和 <code>max_model_len<\/code>。 <a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:829-829\" title=\"vllm/v1/core/sched/scheduler.py:829\">scheduler.py:829<\/a> <a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:835-842\" title=\"vllm/v1/core/sched/scheduler.py:835-842\">scheduler.py:835–842<\/a>"}],"why":[{"t":"note","k":"n10","lv":"注释","html":"没有 prefill / decode 之分：整段 prompt、分块 prefill、decode、前缀缓存命中，都是同一个「已算追已有」。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"There's no \"decoding phase\" nor \"prefill phase\" in the scheduler.","raw":["vllm/v1/core/sched/scheduler.py:705-705"],"rh":"<a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:705-705\" title=\"vllm/v1/core/sched/scheduler.py:705\">scheduler.py:705<\/a>"}]},{"t":"note","k":"n11","lv":"注释","html":"守卫的用意：异步调度下，确定在飞的几步会到达 <code>max_tokens<\/code> 时，不再多排一步。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"Async scheduling: Avoid scheduling an extra step when we are sure that","raw":["vllm/v1/core/sched/scheduler.py:795-795"],"rh":"<a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:795-795\" title=\"vllm/v1/core/sched/scheduler.py:795\">scheduler.py:795<\/a>"}]}],"traps":[{"t":"p","html":"waiting 这边用的是 <code>num_tokens<\/code> 而不是 prompt 长度：被抢占后重来的请求，已经生成的 token 也要重算。 <a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:1345-1347\" title=\"vllm/v1/core/sched/scheduler.py:1345-1347\">scheduler.py:1345–1347<\/a>"},{"t":"p","html":"守卫只挡得住「长度」，挡不住 <code>&lt;eos&gt;<\/code>：EOS 由生成的数据决定，排的时候还不知道（推断）。"}]},"to":["sched.loop"]},{"id":"kvm","name":"KV 账房","code":"KVCacheManager","kind":"gate","n":null,"d":[710,196,180,150],"m":[2,388,126,165],"glyph":{"g":"checks","rows":[["查前缀缓存",null],["块够不够",null]]},"say":"查命中、分块，不够就回 None","why":"整条放得下才放行","trap":"None 不是报错","card":{"does":[{"t":"p","html":"调度器的 KV 账房：替每个请求记着它占了哪几块，管三件事——查前缀缓存命中多少（<code>get_computed_blocks<\/code>）、给这一步的 token 分块（<code>allocate_slots<\/code>）、请求结束时还块（<code>free<\/code>）。"}],"how":[{"t":"p","html":"要几块：需要的槽位 = 已算 + 本步排（+ lookahead），按 <code>block_size<\/code> 向上取整，减去已经有的。 <a class=\"ref\" data-k=\"vllm/v1/core/kv_cache_manager.py:561-564\" title=\"vllm/v1/core/kv_cache_manager.py:561-564\">kv_cache_manager.py:561–564<\/a> <a class=\"ref\" data-k=\"vllm/v1/core/single_type_kv_cache_manager.py:322-322\" title=\"vllm/v1/core/single_type_kv_cache_manager.py:322\">single_type_kv_cache_manager.py:322<\/a>"},{"t":"p","html":"空闲块不够就**返回 <code>None<\/code>**：running 那边据此去抢占别人，waiting 那边据此 <code>break<\/code>。 <a class=\"ref\" data-k=\"vllm/v1/core/kv_cache_manager.py:593-599\" title=\"vllm/v1/core/kv_cache_manager.py:593-599\">kv_cache_manager.py:593–599<\/a>"},{"t":"p","html":"waiting 的请求多一道闸（默认开）：<b>整条<\/b> prompt 要的块都放得下，才让第一块进来。 <a class=\"ref\" data-k=\"vllm/v1/core/kv_cache_manager.py:542-559\" title=\"vllm/v1/core/kv_cache_manager.py:542-559\">kv_cache_manager.py:542–559<\/a>"},{"t":"p","html":"分完，把<b>已满、且 token 已确认<\/b>的块登记进前缀缓存。 <a class=\"ref\" data-k=\"vllm/v1/core/kv_cache_manager.py:628-637\" title=\"vllm/v1/core/kv_cache_manager.py:628-637\">kv_cache_manager.py:628–637<\/a>"}],"why":[{"t":"note","k":"n12","lv":"文档","html":"整条放得下才放行：只看第一块就放进来，后面的块可能分不到，造成过量准入和 KV cache 来回抖动。","tag":null,"who":null,"more":null,"ev":[{"lv":"文档","q":"checking the first chunk. Prevents over-admission and KV cache thrashing","raw":["vllm/config/scheduler.py:229-229"],"rh":"<a class=\"ref\" data-k=\"vllm/config/scheduler.py:229-229\" title=\"vllm/config/scheduler.py:229\">scheduler.py:229<\/a>"}]},{"t":"note","k":"n13","lv":"注释","html":"只登记「已确认」的 token：投机解码的草稿 token 可能被拒，不能进缓存。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"Therefore, we cap the number at `request.num_tokens`, ensuring only","raw":["vllm/v1/core/kv_cache_manager.py:631-631"],"rh":"<a class=\"ref\" data-k=\"vllm/v1/core/kv_cache_manager.py:631-631\" title=\"vllm/v1/core/kv_cache_manager.py:631\">kv_cache_manager.py:631<\/a>"}]}],"traps":[{"t":"p","html":"它自己不碰物理块：块本身、空闲队列、「哈希 → 块」表都在块仓库（BlockPool）；中间还隔着一层 <code>coordinator<\/code>。 <a class=\"ref\" data-k=\"vllm/v1/core/kv_cache_manager.py:164-164\" title=\"vllm/v1/core/kv_cache_manager.py:164\">kv_cache_manager.py:164<\/a>"},{"t":"p","html":"前缀缓存只按<b>整块<\/b>命中，而且最多命中「已有 − 1」个 token：最后一个 token 总要重算，才拿得到采样要的 logits。 <a class=\"ref\" data-k=\"vllm/v1/request.py:359-359\" title=\"vllm/v1/request.py:359\">request.py:359<\/a>"}]},"to":["sched.kv"]},{"id":"pool","name":"块仓库","code":"BlockPool","kind":"store","n":null,"d":[1010,196,200,150],"m":[2,858,126,150],"glyph":{"g":"cells","cells":[{"k":"#1","v":"空","s":null},{"k":"#2","v":"空","s":null},{"k":"#3","v":"空","s":null}],"left":"队头","right":null},"say":"所有物理块 + 哈希表","why":"有哈希的放队尾，最后复用","trap":"还了≠清空，还能命中","card":{"does":[{"t":"p","html":"所有物理 KV block 的仓库：每块的引用计数 <code>ref_cnt<\/code>、一条空闲队列、一张「块哈希 → 块」表——前缀缓存就是这张表。"}],"how":[{"t":"p","html":"分块：从空闲队列<b>头部<\/b>弹出；弹出的块要是还挂着旧哈希，这时才把它从缓存表里摘掉（驱逐）。 <a class=\"ref\" data-k=\"vllm/v1/core/block_pool.py:696-696\" title=\"vllm/v1/core/block_pool.py:696\">block_pool.py:696<\/a> <a class=\"ref\" data-k=\"vllm/v1/core/block_pool.py:710-715\" title=\"vllm/v1/core/block_pool.py:710-715\">block_pool.py:710–715<\/a>"},{"t":"p","html":"命中：被命中的块 <code>touch<\/code>：<code>ref_cnt + 1<\/code>，正在空闲队列里的就摘出来，免得被别人弹走。两个请求共用的是<b>同一个物理块<\/b>。 <a class=\"ref\" data-k=\"vllm/v1/core/block_pool.py:783-790\" title=\"vllm/v1/core/block_pool.py:783-790\">block_pool.py:783–790<\/a>"},{"t":"p","html":"还块：<code>ref_cnt<\/code> 减到 0 的块回到空闲队列——没哈希的放<b>队头<\/b>（最先复用），有哈希的放<b>队尾<\/b>（最后复用）。 <a class=\"ref\" data-k=\"vllm/v1/core/block_pool.py:824-837\" title=\"vllm/v1/core/block_pool.py:824-837\">block_pool.py:824–837<\/a>"},{"t":"p","html":"块 0 是全局的 <code>null_block<\/code>，不分给任何请求，只作占位。 <a class=\"ref\" data-k=\"vllm/v1/core/block_pool.py:161-164\" title=\"vllm/v1/core/block_pool.py:161-164\">block_pool.py:161–164<\/a>"}],"why":[{"t":"note","k":"n14","lv":"注释","html":"有哈希的块先进先出地复用，效果就是 LRU：越久没被用的缓存块越先被挤掉。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"FIFO reuse of cached blocks for LRU eviction behavior.","raw":["vllm/v1/core/block_pool.py:831-831"],"rh":"<a class=\"ref\" data-k=\"vllm/v1/core/block_pool.py:831-831\" title=\"vllm/v1/core/block_pool.py:831\">block_pool.py:831<\/a>"}]},{"t":"note","k":"n15","lv":"注释","html":"没哈希的块后进先出：刚还回来的马上再用，GPU 局部性更好。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"LIFO reuse of non-cached blocks for better GPU locality,","raw":["vllm/v1/core/block_pool.py:827-827"],"rh":"<a class=\"ref\" data-k=\"vllm/v1/core/block_pool.py:827-827\" title=\"vllm/v1/core/block_pool.py:827\">block_pool.py:827<\/a>"}]},{"t":"note","k":"n16","lv":"文档","html":"一个请求的块倒着还：尾块的哈希里含的 token 更多，更不容易被别人复用，应该先被挤掉。","tag":null,"who":null,"more":null,"ev":[{"lv":"文档","q":"This is because the last block of a request must hash more tokens and is less likely to be reused by other requests.","raw":["docs/design/prefix_caching.md:198-198"],"rh":"<a class=\"ref\" data-k=\"docs/design/prefix_caching.md:198-198\" title=\"docs/design/prefix_caching.md:198\">prefix_caching.md:198<\/a>"}]}],"traps":[{"t":"p","html":"<b>还块不是清空<\/b>：请求结束后，有哈希的块还留在缓存表里，直到被后来者弹出时才真正驱逐。所以请求结束了，前缀缓存还能命中它。"},{"t":"p","html":"本页 <code>block_size<\/code> 设为 16，才看得见两块；这个版本 config 的默认是 <b>64<\/b>（旧资料里的 16 已过时），本例全程只要 1 块。实际值还可能被注意力后端改掉，以启动日志为准。 <a class=\"ref\" data-k=\"vllm/config/cache.py:185-185\" title=\"vllm/config/cache.py:185\">cache.py:185<\/a> <a class=\"ref\" data-k=\"vllm/platforms/interface.py:800-812\" title=\"vllm/platforms/interface.py:800-812\">interface.py:800–812<\/a>"}]},"to":["sched.kv"]},{"id":"out","name":"本步工单","code":"SchedulerOutput","kind":"out","n":null,"d":[710,16,180,124],"m":[2,196,126,124],"glyph":{"g":"kv","rows":[["首次","—"],["增量","—"]]},"say":"谁排几个、用哪几块","why":"老请求只发增量","trap":"被抢占的重来算首次","card":{"does":[{"t":"p","html":"<code>schedule()<\/code> 的产物，交给 GPU 那边（顶层的「GPU 执行」）：这一步每个请求排几个 token、用哪几块。"}],"how":[{"t":"p","html":"<code>scheduled_new_reqs<\/code>：第一次被排的请求，发<b>完整<\/b>数据；<code>scheduled_cached_reqs<\/code>：排过的，只发变化；<code>num_scheduled_tokens<\/code>：每个请求本步几个。 <a class=\"ref\" data-k=\"vllm/v1/core/sched/output.py:241-249\" title=\"vllm/v1/core/sched/output.py:241-249\">output.py:241–249<\/a>"},{"t":"p","html":"打包之后马上 <code>_update_after_schedule<\/code>：每个请求「已算 += 本步排」，会采样的再记 1 个占位。 <a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:1889-1892\" title=\"vllm/v1/core/sched/scheduler.py:1889-1892\">scheduler.py:1889–1892<\/a> <a class=\"ref\" data-k=\"vllm/v1/core/sched/async_scheduler.py:45-48\" title=\"vllm/v1/core/sched/async_scheduler.py:45-48\">async_scheduler.py:45–48<\/a>"}],"why":[{"t":"note","k":"n17","lv":"注释","html":"请求的数据缓存在 worker 进程里，所以排过的请求只发变化，省通信。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"We cache the request's data in each worker process, so that we don't","raw":["vllm/v1/core/sched/output.py:243-243"],"rh":"<a class=\"ref\" data-k=\"vllm/v1/core/sched/output.py:243-243\" title=\"vllm/v1/core/sched/output.py:243\">output.py:243<\/a>"}]},{"t":"note","k":"n18","lv":"注释","html":"「已算」在打包<b>之后<\/b>才推进：工单里要带着推进前的值，GPU 那边才定得出输入 token 的位置。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"original number of scheduled tokens to determine input IDs.","raw":["vllm/v1/core/sched/scheduler.py:1883-1883"],"rh":"<a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:1883-1883\" title=\"vllm/v1/core/sched/scheduler.py:1883\">scheduler.py:1883<\/a>"}]}],"traps":[{"t":"p","html":"被抢占后重新入场的请求，会作为 <code>scheduled_new_reqs<\/code> <b>再发一次完整数据<\/b>：它的块已经还了，worker 上的状态也丢了。 <a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:1606-1607\" title=\"vllm/v1/core/sched/scheduler.py:1606-1607\">scheduler.py:1606–1607<\/a>"}]},"to":["sched.ph"]},{"id":"update","name":"收结果","code":"update_from_output","kind":"act","n":null,"d":[400,16,190,124],"m":[212,196,126,124],"glyph":{"g":"kv","rows":[["回来","—"],["判停","—"]]},"say":"追加 token、消占位、判停","why":"停了立刻还块","trap":"晚到的结果找不到人就丢","card":{"does":[{"t":"p","html":"GPU 结果回来后（默认处理的是上上一步排的那批，见顶层）：把新 token 追加到请求上、消掉占位、判停；停了就还块，并做出发回 API 进程的 <code>EngineCoreOutput<\/code>。"}],"how":[{"t":"p","html":"每回来 N 个 token：逐个追加、逐个 <code>check_stop<\/code>，最后占位 −N。 <a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:2941-2958\" title=\"vllm/v1/core/sched/scheduler.py:2941-2958\">scheduler.py:2941–2958<\/a>"},{"t":"p","html":"判停顺序：EOS → <code>stop_token_ids<\/code> → 长度（<code>max_tokens<\/code> / <code>max_model_len<\/code>）→ <code>min_tokens<\/code> 门 → 重复检测。 <a class=\"ref\" data-k=\"vllm/v1/core/sched/utils.py:98-140\" title=\"vllm/v1/core/sched/utils.py:98-140\">utils.py:98–140<\/a>"},{"t":"p","html":"停了：<code>_free_request<\/code> → 记进 <code>finished_req_ids<\/code>、还块、从总表 <code>requests<\/code> 里删掉；它也退出 running。 <a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:2587-2587\" title=\"vllm/v1/core/sched/scheduler.py:2587\">scheduler.py:2587<\/a> <a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:3244-3257\" title=\"vllm/v1/core/sched/scheduler.py:3244-3257\">scheduler.py:3244–3257<\/a> <a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:2655-2656\" title=\"vllm/v1/core/sched/scheduler.py:2655-2656\">scheduler.py:2655–2656<\/a>"},{"t":"p","html":"分块 prefill 的中间块回来时没有 token，不产生输出。 <a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:2649-2649\" title=\"vllm/v1/core/sched/scheduler.py:2649\">scheduler.py:2649<\/a>"}],"why":[{"t":"note","k":"n19","lv":"注释","html":"先判停、再做输出：输出里要带上结束原因。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"This must be called before we make the EngineCoreOutput.","raw":["vllm/v1/core/sched/scheduler.py:2945-2945"],"rh":"<a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:2945-2945\" title=\"vllm/v1/core/sched/scheduler.py:2945\">scheduler.py:2945<\/a>"}]},{"t":"note","k":"n20","lv":"推断","html":"判停和还块在同一处：请求一结束，它的块下一步就能分给别人。","tag":null,"who":null,"more":null,"ev":[]}],"traps":[{"t":"p","html":"结果回来时请求可能已经不在了（被 abort，或像本例这样已因 EOS 结束）：<code>requests.get<\/code> 拿到 <code>None<\/code>，整条结果直接丢掉。 <a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:2403-2403\" title=\"vllm/v1/core/sched/scheduler.py:2403\">scheduler.py:2403<\/a> <a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:2415-2423\" title=\"vllm/v1/core/sched/scheduler.py:2415-2423\">scheduler.py:2415–2423<\/a>"},{"t":"p","html":"被抢占的请求还在飞的输出<b>照样收下<\/b>，只是不许改已经清零的计数器。 <a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:1857-1858\" title=\"vllm/v1/core/sched/scheduler.py:1857-1858\">scheduler.py:1857–1858<\/a>"}]},"to":["sched.ph"]}],"wires":[{"id":"w_run","f":"running","t":"calc","label":"先排 running","ml":"先排","n":"1","why":"decode 优先","trap":null,"card":{"does":[{"t":"p","html":"每一步先把 running 从头到尾过一遍，每个请求都去「定排几个」→「要块」。"}],"how":[{"t":"p","html":"<code>while req_index &lt; len(self.running) and token_budget &gt; 0<\/code>：预算用完就停。 <a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:778-780\" title=\"vllm/v1/core/sched/scheduler.py:778-780\">scheduler.py:778–780<\/a>"}],"why":[{"t":"note","k":"n21","lv":"文档","html":"decode 优先，token 间延迟更好。","tag":null,"who":null,"more":null,"ev":[{"lv":"文档","q":"It improves inter-token latency (ITL) and generation decode because decode requests are prioritized.","raw":["docs/configuration/optimization.md:95-95"],"rh":"<a class=\"ref\" data-k=\"docs/configuration/optimi _scheduler.py:542-542","tests/v1/core/test_scheduler.py:2496-2496","docs/design/arch_overview.md:151-151"],"children":[{"id":"sched.loop","nav":"schedule() 主线","title":"schedule()：设预算，先排 running","short":"<code>schedule()<\/code> 的开头和 running 循环：没有 prefill/decode 之分的那段注释、两个预算、<code>max_tokens<\/code> 守卫、待算公式。","lead":"你在「调度器」框里的「定这步排几个」「本步 token 预算」「运行队列」这几块后面。<code>schedule()<\/code> 一千多行，这里只留主线；连接器、Mamba、编码器、DP 节流等旁支都省略了。","src":"vllm/v1/core/sched/scheduler.py:702-993","blocks":[{"t":"code","file":"vllm/v1/core/sched/scheduler.py","parts":[{"a":702,"b":714,"lines":["    def schedule(self, throttle_prefills: bool = False) -> SchedulerOutput:","        self.current_step += 1","        # NOTE(woosuk) on the scheduling algorithm:","        # There's no \"decoding phase\" nor \"prefill phase\" in the scheduler.","        # Each request just has the num_computed_tokens and","        # num_tokens_with_spec. num_tokens_with_spec =","        # len(prompt_token_ids) + len(output_token_ids) + len(spec_token_ids).","        # At each step, the scheduler tries to assign tokens to the requests","        # so that each request's num_computed_tokens can catch up its","        # num_tokens_with_spec. This is general enough to cover","        # chunked prefills, prefix caching, speculative decoding,","        # and the \"jump decoding\" optimization in the future.",""]},{"a":728,"b":734,"lines":["        token_budget = self.max_num_scheduled_tokens","        spec = self.vllm_config.speculative_config","        draft_slots = spec.max_num_new_slots_for_drafting if spec is not None else 0","        input_budget = self.scheduler_config.max_num_batched_tokens","        if self._pause_state == PauseState.PAUSED_ALL:","            # Do not schedule any requests when paused.","            token_budget = 0"]}],"notes":[{"t":"note","k":"n1","lv":"注释","html":"整个设计的钥匙：没有 prefill / decode 阶段，每个请求只有「已算」和「已有」，调度器每步让前者追后者。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"There's no \"deco uted tokens here allowing us to","        #    schedule the prefill request again immediately in the next","        #    scheduling step.","        # 3. If some tokens (e.g. spec tokens) are rejected later, the number of","        #    computed tokens will be adjusted in update_from_output.","        num_scheduled_tokens = scheduler_output.num_scheduled_tokens","        for req_id, num_scheduled_token in num_scheduled_tokens.items():","            request = self.requests[req_id]","            request.num_computed_tokens += num_scheduled_token","            request.num_in_flight_tokens += num_scheduled_token","            if self.defer_block_free:","                # Record the in-flight step, to fence deferred block freeing.","                request.last_sched_seq = self.sched_step_seq","            request.is_prefill_chunk = request.num_computed_tokens < (","                request.num_tokens + request.num_output_placeholders","            )"]}],"notes":[{"t":"note","k":"n1","lv":"注释","html":"排完就推进「已算」：工单里要带推进前的值；推进后下一步能马上再排；投机 token 被拒时再回退。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"Advance the number of computed tokens for the request AFTER","raw":["vllm/v1/core/sched/scheduler.py:1880-1888"],"rh":"<a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:1880-1888\" title=\"vllm/v1/core/sched/scheduler.py:1880-1888\">scheduler.py:1880–1888<\/a>"}],"a":1880,"b":1888},{"t":"note","k":"n2","lv":null,"html":"本例 S1：0 → 20；之后每步 +1。","tag":null,"who":null,"more":null,"ev":[],"a":1892,"b":1892},{"t":"note","k":"n3","lv":null,"html":"还没追上「已有 + 占位」= 分块 prefill 的中间块。场景 B 的 L 在 S3、S4 是。","tag":null,"who":null,"more":null,"ev":[],"a":1897,"b":1899}],"cap":"_update_after_schedule：推进「已算」"},{"t":"code","file":"vllm/v1/core/sched/async_scheduler.py","parts":[{"a":18,"b":19,"lines":["    def _update_after_schedule(self, scheduler_output: SchedulerOutput) -> None:","        super()._update_after_schedule(scheduler_output)"]},{"a":29,"b":48,"lines":["        for req_id in scheduler_output.num_scheduled_tokens:","            request = self.requests[req_id]","            if request.is_prefill_chunk:","                continue","","            # The request will generate num_sampled_tokens_per_step new tokens","            # plus num_spec_tokens in this scheduling step. Diffusion has no AR","            # bonus token (num_sampled_tokens_per_step == 0) — only the canvas","            # (spec) tokens.","            cur_num_spec_tokens = len(spec_decode_tokens.get(req_id, ()))","            if (","                scheduler_output.has_structured_output_requests","                and request.use_structured_output","            ):","                pending_structured_output_tokens |= request.num_output_placeholders > 0","                structured_output_spec_decode |= cur_num_spec_tokens > 0","            request.num_output_placeholders += (","                self.num_sampled_tokens_per_step + cur_num_spec_tokens","            )","            request.num_output_placeholder_steps += 1"]}],"notes":[{"t":"note","k":"n4","lv":null,"html":"中间块这一步不采样，不记占位。","tag":null,"who":null,"more":null,"ev":[],"a":31,"b":32},{"t":"note","k":"n5","lv":null,"html":"这一步会采样：占位 + 1（没开投机解码）。本例 S1 之后占位 1；稳态下排完是 2，结果回来后是 1。","tag":null,"who":null,"more":null,"ev":[],"a":45,"b":47}],"cap":"AsyncScheduler：记占位"},{"t":"code","file":"vllm/v1/core/sched/scheduler.py","parts":[{"a":2401,"b":2423,"lines":["        for req_id, num_tokens_scheduled in num_scheduled_tokens.items():","            assert num_tokens_scheduled > 0","            request = self.requests.get(req_id)","            output_is_stale = False","            if request is not None:","                request.num_in_flight_tokens -= num_tokens_scheduled","                # Drain any stale share (see _preempt_request) in lockstep.","                if request.num_stale_output_tokens > 0:","                    output_is_stale = True","                    request.num_stale_output_tokens -= num_tokens_scheduled","                    assert request.num_stale_output_tokens >= 0","            if failed_kv_load_req_ids and req_id in failed_kv_load_req_ids:","                # skip failed or rescheduled requests from KV load failure","                continue","            if request is None or request.is_finished():","                # The request is already finished. This can happen if the","                # request is aborted while the model is executing it (e.g.,","                # in pipeline parallelism or in async scheduling).","                # NOTE(Kuntai): When delay_free_blocks=True (for async KV","                # cache transfer in KV connector), the aborted request will not","                # be set to None (in order to finish async KV transfer).","                # In this case, we use is_finished() to check.","                continue"]}],"notes":[{"t":"note","k":"n6","lv":null,"html":"按 id 找请求；已经结束、从总表删掉的，拿到 <code>None<\/code>。","tag":null,"who":null,"more":null,"ev":[],"a":2403,"b":2403},{"t":"note","k":"n7","lv":"注释","html":"请求已经结束就丢掉这条结果。注释只写了 abort；本例 S8 的结果（R 已因 EOS 结束）也走这里，这一点是推断。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"The request is already finished. This can happen if the","raw":["vllm/v1/core/sched/scheduler.py:2415-2423"],"rh":"<a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:2415-2423\" title=\"vllm/v1/core/sched/scheduler.py:2415-2423\">scheduler.py:2415–2423<\/a>"}],"a":2415,"b":2423}],"cap":"update_from_output：先找人"},{"t":"code","file":"vllm/v1/core/sched/scheduler.py","parts":[{"a":2933,"b":2959,"lines":["    def _update_request_with_output(","        self, request: Request, new_token_ids: list[int], is_stale: bool = False","    ) -> tuple[list[int], bool]:","        num_new_tokens = len(new_token_ids)","        # Append generated tokens and check for stop. Note that if","        # a request is still being prefilled, we expect the model runner","        # to return empty token ids for the request.","        stopped = False","        for num_new, output_token_id in enumerate(new_token_ids, 1):","            request.append_output_token_ids(output_token_id)","","            # Check for stop and update request state.","            # This must be called before we make the EngineCoreOutput.","            stopped = check_stop(request, self.max_model_len)","            if stopped:","                # num_computed_tokens covers all new tokens but the last one.","                # Keep that true after trimming: resumable requests resume from it.","                if not is_stale:","                    request.num_computed_tokens -= len(new_token_ids) - num_new","                del new_token_ids[num_new:]  # Trim new tokens if needed.","                break","","        if not is_stale and request.num_output_placeholders > 0:","            # Resolve all returned tokens, including those trimmed at a stop.","            request.num_output_placeholders -= num_new_tokens","            assert request.num_output_placeholders >= 0","        return new_token_ids, stopped"]}],"notes":[{"t":"note","k":"n8","lv":null,"html":"追加 token：「已有」+1。","tag":null,"who":null,"more":null,"ev":[],"a":2942,"b":2942},{"t":"note","k":"n9","lv":"注释","html":"先判停，再做输出：输出里要带结束原因。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"This must be called before we make the EngineCoreOutput.","raw":["vllm/v1/core/sched/scheduler.py:2945-2946"],"rh":"<a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:2945-2946\" title=\"vllm/v1/core/sched/scheduler.py:2945-2946\">scheduler.py:2945–2946<\/a>"}],"a":2945,"b":2946},{"t":"note","k":"n10","lv":"注释","html":"一次回来多个 token 且中途停了：截掉后面的，回退「已算」。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"num_computed_tokens covers all new tokens but the last one.","raw":["vllm/v1/core/sched/scheduler.py:2947-2953"],"rh":"<a class=\"ref\" data-k=\"vllm/v1/core/sched/scheduler.py:2947-2953\" title=\"vllm/v1/core/sched/scheduler.py:2947-2953\">scheduler.py:2947–2953<\/a>"}],"a":2947,"b":2953},{"t":"note","k":"n11","lv":"测试","html":"占位 −N，并断言不为负：这里曾因抢占时的计数错误让 EngineCore 崩溃，现在有回归测试守着。","tag":null,"who":null,"more":null,"ev":[{"lv":"测试","q":"Regression for the num_output_placeholders underflow EngineCore crash:","raw":["tests/v1/core/test_async_scheduler.py:578-578"],"rh":"<a class=\"ref\" data-k=\"tests/v1/core/test_async_scheduler.py:578-578\" title=\"tests/v1/core/test_async_scheduler.py:578\">test_async_scheduler.py:578<\/a>"}],"a":2955,"b":2958}],"cap":"_update_request_with_output：追加、判停、消占位"},{"t":"code","file":"vllm/v1/core/sched/utils.py","parts":[{"a":98,"b":119,"lines":["def check_stop(request: Request, max_model_len: int) -> bool:","    assert not request.pooling_params","","    sampling_params = request.sampling_params","    assert sampling_params is not None","","    last_token_id = request.output_token_ids[-1]","    if last_token_id == sampling_params.eos_token_id:","        request.status = RequestStatus.FINISHED_STOPPED","        return True","","    if last_token_id in sampling_params.stop_token_ids_set:","        request.status = RequestStatus.FINISHED_STOPPED","        request.stop_reason = last_token_id","        return True","","    if (","        request.num_tokens >= max_model_len","        or request.num_output_tokens >= request.max_tokens","    ):","        request.status = RequestStatus.FINISHED_LENGTH_CAPPED","        return True"]}],"notes":[{"t":"note","k":"n12","lv":null,"html":"第一道：EOS。本例第 7 个 token 在这里命中 → <code>FINISHED_STOPPED<\/code>。","tag":null,"who":null,"more":null,"ev":[],"a":104,"b":107},{"t":"note","k":"n13","lv":null,"html":"长度：输出数到 <code>max_tokens<\/code>（本例 8）或总长到 <code>max_model_len<\/code>。","tag":null,"who":null,"more":null,"ev":[],"a":114,"b":119}],"cap":"check_stop：判停顺序"}],"refs":["vllm/v1/core/sched/scheduler.py:1880-1888","vllm/v1/core/sched/scheduler.py:2415-2423","vllm/v1/core/sched/scheduler.py:2945-2946","vllm/v1/core/sched/scheduler.py:2947-2953","tests/v1/core/test_async_scheduler.py:578-578"],"children":[],"back":["sched"]}],"back":["root"]},{"id":"gpu","nav":"GPU 执行","title":"GPU 执行：一步之内 GPU 上排了哪些活","short":"常驻槽位、拼输入内核、CUDA graph、单槽暂存、copy_stream 和 event：CPU 为什么不用等上一个 token 就能排下一步。","lead":"你在顶层「GPU 执行」（<code>GPUModelRunner<\/code>）这个框里面。一圈 A→F 是一步之内排在<b>同一条主 stream<\/b> 上的活，G 在另一条 <code>copy_stream<\/code> 上；按 ▶ 接着顶层的例子走 S1、S2，看 <code>&lt;法国&gt;<\/code> 怎么不经过 CPU 就进了下一步。","src":"vllm/v1/worker/gpu/model_runner.py:1865-2424","blocks":[{"t":"scene","w":1220,"h":470,"mw":340,"mh":1504,"parts":[{"id":"cpu","name":"引擎主线程","code":"EngineCore","kind":"ext","n":null,"d":[10,20,170,160],"m":[56,8,228,124],"glyph":{"g":"list","rows":["execute_model","sample_tokens","get_output"],"on":[]},"say":"每步调两次，晚一步取","why":"只排活，几乎不等 GPU","trap":"异步≠另开一个线程","card":{"does":[{"t":"p","html":"这一层的调用方：引擎进程的主线程（顶层的「引擎忙循环」）。单卡时经 <code>UniProcExecutor<\/code> → <code>Worker<\/code> 直接调进 <code>GPUModelRunner<\/code>，始终是同一个线程。"}],"how":[{"t":"p","html":"每一步调两次：<code>execute_model(scheduler_output)<\/code> 发射前向，<code>sample_tokens(grammar_output)<\/code> 发射采样。两次都只是把内核排进 CUDA stream，返回时 GPU 多半还没算完。 <a class=\"ref\" data-k=\"vllm/v1/engine/core.py:788-790\" title=\"vllm/v1/engine/core.py:788-790\">core.py:788–790<\/a> <a class=\"ref\" data-k=\"vllm/v1/engine/core.py:812-814\" title=\"vllm/v1/engine/core.py:812-814\">core.py:812–814<\/a>"},{"t":"p","html":"晚一步（<code>batch_queue<\/code> 满了）才对最早那批调 <code>get_output()<\/code> 取回 token id。 <a class=\"ref\" data-k=\"vllm/v1/executor/uniproc_executor.py:32-44\" title=\"vllm/v1/executor/uniproc_executor.py:32-44\">uniproc_executor.py:32–44<\/a>"}],"why":[{"t":"note","k":"n1","lv":"文档","html":"MRV2 假定核心执行循环是一条没有 CPU 同步点的 CUDA stream，CPU 入口只往上排活。","tag":null,"who":null,"more":null,"ev":[{"lv":"文档","q":"CPU entrypoints queue work onto the stream.","raw":["docs/design/model_runner_v2.md:47-47"],"rh":"<a class=\"ref\" data-k=\"docs/design/model_runner_v2.md:47-47\" title=\"docs/design/model_runner_v2.md:47\">model_runner_v2.md:47<\/a>"}]}],"traps":[{"t":"p","html":"「异步」不是另开线程：<code>execute_model<\/code> / <code>sample_tokens<\/code> 里的 Python 和内核发射都实打实占着这个线程的 CPU 时间。重叠的是「GPU 在算第 N 步」和「CPU 在排第 N+1 步」。"}]},"to":[]},{"id":"state","name":"常驻请求状态","code":"req_states","kind":"store","n":"A","d":[300,20,210,160],"m":[56,196,228,140],"glyph":{"g":"kv","rows":[["槽 1023","空闲"],["total / 已算","— / —"],["last_sampled","—"]]},"say":"每个请求占一行，一直占到结束","why":"只收差量，不每步重建","trap":"槽号≠批内序号","card":{"does":[{"t":"p","html":"每个请求在 worker 里的「常驻档案」：从加入到结束（或被抢占），一直占同一行，这一行叫<b>槽位<\/b>。"}],"how":[{"t":"p","html":"一组第一维是 <code>max_num_reqs<\/code> 的张量，一个请求一行。"},{"t":"p","html":"取槽 <code>free_indices.pop()<\/code>（弹列表末尾），还槽 <code>append<\/code> 回去。本例第一个请求拿到槽 <b>1023<\/b>（设 <code>max_num_seqs=1024<\/code>）。 <a class=\"ref\" data-k=\"vllm/v1/worker/gpu/states.py:30-30\" title=\"vllm/v1/worker/gpu/states.py:30\">states.py:30<\/a> <a class=\"ref\" data-k=\"vllm/v1/worker/gpu/states.py:100-100\" title=\"vllm/v1/worker/gpu/states.py:100\">states.py:100<\/a> <a class=\"ref\" data-k=\"vllm/v1/worker/gpu/states.py:133-133\" title=\"vllm/v1/worker/gpu/states.py:133\">states.py:133<\/a>"},{"t":"p","html":"每槽存：<code>prompt_len<\/code>、<code>prefill_len<\/code>、<code>total_len<\/code>、<code>num_computed_tokens<\/code>、<code>last_sampled_tokens<\/code>、<code>all_token_ids<\/code>。大部分在显存；<code>all_token_ids<\/code> 太大，默认放主机内存经 UVA 读写。 <a class=\"ref\" data-k=\"vllm/v1/worker/gpu/states.py:32-70\" title=\"vllm/v1/worker/gpu/states.py:32-70\">states.py:32–70<\/a>"},{"t":"p","html":"调度器每步只发差量（新 block、已算数），其余由 worker 自己往前推。"}],"why":[{"t":"note","k":"n2","lv":"文档","html":"每步从零构建这些张量在 Python 里很慢，block table 这种大张量尤其慢。","tag":null,"who":null,"more":null,"ev":[{"lv":"文档","q":"Building these tensors from scratch each step is often very slow in Python, especially for large tensors like block tables.","raw":["docs/design/model_runner_v2.md:17-17"],"rh":"<a class=\"ref\" data-k=\"docs/design/model_runner_v2.md:17-17\" title=\"docs/design/model_runner_v2.md:17\">model_runner_v2.md:17<\/a>"}]},{"t":"note","k":"n3","lv":"文档","html":"GPU 能推出 CPU 还不知道的值（比如刚采出的 token）。CPU 排下一步时根本不知道上一步采出了什么，状态只能留在 worker 里自己演进。","tag":null,"who":null,"more":null,"ev":[{"lv":"文档","q":"GPU can derive values (for example with speculative decoding) that CPU may not know yet.","raw":["docs/design/model_runner_v2.md:138-138"],"rh":"<a class=\"ref\" data-k=\"docs/design/model_runner_v2.md:138-138\" title=\"docs/design/model_runner_v2.md:138\">model_runner_v2.md:138<\/a>"}]}],"traps":[{"t":"p","html":"<b>槽号 ≠ 批内序号<\/b>：槽位固定不动，批内顺序每步可能重排，中间靠 <code>idx_mapping<\/code>（批序号 → 槽号）换算。"},{"t":"p","html":"CPU 上还有一份 <code>num_computed_tokens_np<\/code>：GPU 真值的乐观镜像（上界），给注意力后端算 <code>seq_lens<\/code> 上界用，省掉一次 GPU→CPU 同步。 <a class=\"ref\" data-k=\"vllm/v1/worker/gpu/states.py:64-64\" title=\"vllm/v1/worker/gpu/states.py:64\">states.py:64<\/a>"},{"t":"p","html":"被抢占按「结束」处理：恢复时当新请求重新加进来，带上已生成的 token，所以 <code>prefill_len<\/code> 会大于 <code>prompt_len<\/code>。 <a class=\"ref\" data-k=\"vllm/v1/worker/gpu/states.py:48-49\" title=\"vllm/v1/worker/gpu/states.py:48-49\">states.py:48–49<\/a>"}]},"to":["gpu.state_src"]},{"id":"prep","name":"拼输入内核","code":"prepare_inputs","kind":"gate","n":"B","d":[630,20,180,160],"m":[56,400,228,136],"glyph":{"g":"checks","rows":[["还在预填？",null],["填 last_sampled",null]]},"say":"按批顺序从槽里摘输入","why":"GPU 上拼，CPU 不用等","trap":"预填的输入不许被覆盖","card":{"does":[{"t":"p","html":"一组 GPU 内核：按本批的顺序，从槽位张量里「摘」出这一步的输入，写进定长缓冲。"}],"how":[{"t":"p","html":"CPU 先算本批顺序（decode 在前、预填在后）和每个请求几个 token，得到 <code>idx_mapping<\/code>。 <a class=\"ref\" data-k=\"vllm/v1/worker/gpu/model_runner.py:2674-2675\" title=\"vllm/v1/worker/gpu/model_runner.py:2674-2675\">model_runner.py:2674–2675<\/a>"},{"t":"p","html":"<code>prepare_prefill_inputs<\/code>（有预填才跑）从 <code>all_token_ids<\/code> 拷 prompt；<code>prepare_pos_seq_lens<\/code> 算位置和长度；<code>combine_sampled_and_draft_tokens<\/code> 把上一步采出的 token 填进来。 <a class=\"ref\" data-k=\"vllm/v1/worker/gpu/model_runner.py:1593-1627\" t pt_len: Number of tokens in the user-provided prompt.","        # - prefill_len: Number of tokens passed into the model runner.","        #   This can include the prompt and additional partial output tokens,","        #   so prefill_len >= prompt_len.","        # Usually, prefill_len equals prompt_len, but in cases such as resumption after","        # preemption, prefill_len may be greater. Differentiating between these values","        # is crucial, as certain features such as prompt logprobs or frequency penalties","        # must treat prompt and output tokens separately.","        self.prompt_len = UvaBackedTensor(self.max_num_reqs, dtype=torch.int32)","        self.prefill_len = UvaBackedTensor(self.max_num_reqs, dtype=torch.int32)","        # total_len = prompt_len + output_len. It grows as the request progresses.","        self.total_len = StagedWriteTensor(","            self.max_num_reqs, dtype=torch.int32, device=device","        )","","        # Number of computed tokens.","        self.num_computed_prefill_tokens = np.zeros(self.max_num_reqs, dtype=np.int32)","        self.num_computed_tokens = StagedWriteTensor(","            self.max_num_reqs, dtype=torch.int32, device=device","        )","        # Optimistic CPU mirror of num_computed_tokens (upper bound on GPU value).","        self.num_computed_tokens_np = np.zeros(self.max_num_reqs, dtype=np.int32)","","        # Last sampled tokens.","        self.last_sampled_tokens = torch.zeros(","            self.max_num_reqs, 1, dtype=torch.int64, device=device","        )","","        # Max total seq length (prompt_len + max_tokens)."]}],"notes":[{"t":"note","k":"n1","lv":"推断","html":"空槽号列表 <code>[0 … 1023]<\/code>。<code>pop()<\/code> 弹末尾，所以第一个请求拿到 <b>1023<\/b>；没有注释说明这是有意的。","tag":null,"who":null,"more":null,"ev":[],"a":30,"b":30},{"t":"note","k":"n2","lv":"注释","html":"<code>all_token_ids<\/code> 可能有好几 GB（设 1024 槽 × 131072 长 × int32 ≈ 512 MiB），默认放 UVA 而不是显存。","tag":null,"who":null,"more":null,"ev":[{"lv":"注 gine/core_client.py:1249-1254\">core_client.py:1249–1254<\/a> <a class=\"ref\" data-k=\"vllm/v1/engine/core_client.py:1294-1295\" title=\"vllm/v1/engine/core_client.py:1294-1295\">core_client.py:1294–1295<\/a>"},{"t":"p","html":"<code>outputs_queue<\/code> 是一个<b>没有 maxsize<\/b> 的 <code>asyncio.Queue<\/code>。 <a class=\"ref\" data-k=\"vllm/v1/engine/core_client.py:1209-1209\" title=\"vllm/v1/engine/core_client.py:1209\">core_client.py:1209<\/a>"}],"why":[{"t":"note","k":"n2","lv":"注释","html":"IO 单独一个 task：处理那边每次 <code>await<\/code>（比如块间让出），这里都能插进来继续收包。","tag":null,"who":null,"more":null,"ev":[{"lv":"注释","q":"Perform IO in separate task to parallelize as much as possible.","raw":["vllm/v1/engine/core_client.py:1233-1233"],"rh":"<a class=\"ref\" data-k=\"vllm/v1/engine/core_client.py:1233-1233\" title=\"vllm/v1/engine/core_client.py:1233\">core_client.py:1233<\/a>"}]}],"traps":[{"t":"p","html":"它和处理任务<b>在同一个事件循环线程上<\/b>，不是并行的线程；「并行」指的是在对方 await 的空当里收包。"},{"t":"p","html":"队列没有上限：处理跟不上时包会在这里堆着，不会让引擎慢下来。"}]},"to":["outproc.handler_src"]},{"id":"handler","name":"分块处理","code":"output_handler","kind":"act","n":"2","d":[600,96,180,140],"m":[20,360,210,130],"glyph":{"g":"kv","rows":[["本包","—"],["分块","—"],["当前","—"]]},"say":"取一包，每 128 条一块","why":"不让一包独占事件循环","trap":"分块不是并行","card":{"does":[{"t":"p","html":"常驻 task：取一包，切成每块最多 128 条，逐块交给 <code>process_outputs<\/code>；块与块之间让出一次事件循环；每块做完立刻把该 abort 的请求发回引擎。"}],"how":[{"t":"p","html":"<code>await get_output_async()<\/code> 取包 → <code>for start in range(0, n, chunk_size)<\/code> 切片 → 同步调用 <code>process_outputs<\/code>。 <a class=\"ref\" data-k=\"vllm/v1/engine/async_llm.py:894-924\" title=\"vllm/v1/engine/async_llm.py:894-924\">async_llm.py:894–924<\/a>"},{"t":"p","html":"块后 <code>if end &lt; num_outputs: await asyncio.sleep(0)<\/code>；然后 <code>if reqs_to_abort: await abort_requests_async(...)<\/code>。 <a class=\"ref\" data-k=\"vllm/v1/engine/async_llm.py:928-936\" title=\"vllm/v1/engine/async_llm.py:928-936\">async_llm.py:928–936<\/a> "a":142,"b":201,"lines":["    def update(self, new_token_ids: list[int], stop_terminated: bool) -> str | None:","        \"\"\"Update RequestState for the request_id by:","            1) Detokenize the new token ids incrementally.","            2) Evaluate stop criteria.","","        Return matched stop string or None.","        \"\"\"","        if not new_token_ids:","            # Skip detokenization if no new token ids.","            return None","","        if stop_terminated and not self.include_stop_str_in_output:","            # If stop-terminated, exclude last token from detokenization","            # based on include_stop_str_in_output parameter.","            skipped_stop_token_id = new_token_ids[-1]","            new_token_ids = new_token_ids[:-1]","        else:","            skipped_stop_token_id = None","","        # 1) Detokenize the new token ids incrementally.","        num_prev_tokens = self.num_output_tokens()","        first_new_token_index = len(self.token_ids)","        # Output text offsets at the boundaries of the new tokens.","        token_offsets = [len(self.output_text)] if self.stop else None","        for new_token_id in new_token_ids:","            self.token_ids.append(new_token_id)","            self.output_text += self.decode_next(new_token_id)","            if token_offsets is not None:","                token_offsets.append(len(self.output_text))","","        if skipped_stop_token_id is not None:","            # Cleanup after skipping detokenization.","            self.token_ids.append(skipped_stop_token_id)","            if token_offsets is not None:","                token_offsets.append(len(self.output_text))","","        # 2) Evaluate stop strings.","        stop_string = None","        if token_offsets is not None and self.num_output_tokens() > self.min_tokens:","            # Support min_tokens, see https://github.com/vllm-project/vllm/pull/22014","            stop_check_offset = token_offsets[max(self.min_tokens - num_prev_   function cost(r){var c=0;rec.b.parts.forEach(function(x){c+=ov(r,rec.pos[x.id],3);});placed.forEach(function(q){c+=ov(r,q,4);});return c;}

    var id=el.getAttribute('data-w'),w=rec.ob[id],g=rec.G[id],lw=el.offsetWidth,lh=el.offsetHeight,p=rec.mob?w.mlp:w.lp,at,s;

    }else auto.push([el,g,lw,lh]);

    for(i=0;i<TT.length;i++){
      t=TT[i];u=1-t;
      x=u*u*u*P[0][0]+3*u*u*t*P[1][0]+3*u*t*t*P[2][0]+t*t*t*P[3][0];
      y=u*u*u*P[0][1]+3*u*u*t*P[1][1]+3*u*t*t*P[2][1]+t*t*t*P[3][1];
      if(a[2]<rec.W-4)x=Math.min(Math.max(x,a[2]/2+2),rec.W-a[2]/2-2);
      if(a[3]<rec.H-4)y=Math.min(Math.max(y,a[3]/2+2),rec.H-a[3]/2-2);
      r=[x-a[2]/2,y-a[3]/2,a[2],a[3]];c=cost(r);

/* 落点对齐到整像素。
   每一页（.nf）都是缩小了塞在上一层格子里的。带 scale 的元素，浏览器「画它」和「判定点没点中它」时，
   会把它在上一层里的落点四舍五入到整像素；可 getBoundingClientRect 量到的仍是带小数的落点。
   两者最多差半个像素——是上一层尺度里的半个像素。镜头飞到第三、四层要放大三十到一百多倍，
   这半个像素就成了十几到几十个屏幕像素：镜头按量到的位置停，停歪；脚本按量到的位置点，点空。
   （实测：第四层差 81px。跟屏幕密度无关，只看排版恰好落在几点几像素上。）
   所以这里把每一页相对「上一层那一页」的落点补成整数：量到的 = 画出来的 = 点得中的。
   画面不会因此挪动——它本来就画在整像素上，补的只是排版位置里那点小数。
   所有数都取 1/64 像素的整倍数（浏览器排版的最小单位），免得它再舍入一次。 */
function q64(v){return Math.round(v*64)/64;}
function snapAll(){
  var m=[];
  ORD.forEach(function(id){
    if(id===ROOT)return;
    var el=F[id],pe=F[par[id]];
    if(!el||!pe||el._bl==null)return;
    var a=el.getBoundingClientRect(),b=pe.getBoundingClientRect(),k=b.width/pe.offsetWidth;
    if(!(k>0))return;
    m.push({el:el,x:(a.left-b.left)/k-(el._sx||0),y:(a.top-b.top)/k-(el._sy||0)});
  });
  m.forEach(function(o){
    var sx=q64(Math.round(o.x)-o.x),sy=q64(Math.round(o.y)-o.y),el=o.el;
    if(sx===el._sx&&sy===el._sy)return;
    el._sx=sx;el._sy=sy;
    el.style.left=(el._bl+sx)+'px';
    el.style.top=sy+'px';
  });
}
