<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Canvas</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #f6f8fa; color: #1f2328;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }

  #vp { position: fixed; inset: 0; overflow: hidden; cursor: grab; touch-action: none; }
  #vp.dragging { cursor: grabbing; }
  #world { position: absolute; transform-origin: 0 0;
    transition: transform .55s cubic-bezier(.22,.9,.26,1);
    background-image: radial-gradient(circle, #d8dee4 1px, transparent 1px);
    background-size: 28px 28px; }
  #world.notrans { transition: none; }

  /* ---- storyline regions ---- */
  .region { position: absolute; border-radius: 18px; border: 1.5px dashed; z-index: 0; }
  .rlabel { position: absolute; top: -12px; left: 20px; padding: 2px 12px; font-size: 11px;
    border-radius: 99px; background: #ffffff; letter-spacing: .5px; border: 1px solid; }
  .rblurb { position: absolute; top: 12px; left: 22px; font-size: 11px; opacity: .85;
    letter-spacing: .3px; }

  /* ---- code cards ---- */
  .card { position: absolute; background: #ffffff; border: 1px solid #d0d7de; border-radius: 10px;
    box-shadow: 0 6px 18px rgba(31,35,40,.10); z-index: 2; transition: opacity .35s; overflow: hidden; }
  .card .hdr { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #f6f8fa;
    border-bottom: 1px solid #e4e8ec; border-radius: 10px 10px 0 0; cursor: pointer; white-space: nowrap; }
  .card.collapsed .hdr { border-bottom: none; border-radius: 10px; }
  .card.collapsed .body { display: none; }
  .chev { color: #8c959f; font-size: 9px; width: 10px; flex: none; }
  .fname { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px;
    color: #1f2328; font-weight: 600; }
  .file { margin-left: auto; color: #8c959f; font-size: 10px; padding-left: 14px; }
  .body { padding: 8px 0; }
  .ln { white-space: pre; font: 12px/1.75 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    padding: 0 14px 0 10px; color: #24292f; }
  .ln .no { display: inline-block; width: 20px; text-align: right; margin-right: 12px;
    color: #a8b0b9; user-select: none; }
  .ln.hot { background: rgba(9,105,218,.08); box-shadow: inset 2px 0 0 #0969da; }
  .ln.add { background: rgba(26,127,55,.09); box-shadow: inset 2px 0 0 #1a7f37; }
  .ln.add.hot { box-shadow: inset 2px 0 0 #0969da; }
  .ln.del { background: rgba(207,34,46,.05); color: #a8626a; text-decoration: line-through; }
  .ln.del .no { color: #cf5b64; text-decoration: none; }
  .dbadge { font: 10px ui-monospace, Menlo, Consolas, monospace; padding: 0 7px;
    border-radius: 99px; background: rgba(31,35,40,.03); border: 1px solid #d0d7de; flex: none; }
  .dbadge b { color: #1a7f37; font-weight: 600; }
  .dbadge i { color: #cf222e; font-style: normal; }
  /* ---- plan canvas: ghost cards + intent / delta badges ---- */
  .card.ghost { border: 1.5px dashed #2da44e; }
  .card.ghost .hdr { background: rgba(26,127,55,.06); }
  .pbadge { font: 10px -apple-system, 'PingFang SC', sans-serif; padding: 0 7px; flex: none;
    border-radius: 99px; border: 1px solid; }
  .pbadge.add { color: #1a7f37; border-color: #2da44e; }
  .pbadge.modify { color: #9a6700; border-color: #bf8700; }
  .pbadge.remove { color: #cf222e; border-color: #e16f64; }
  .pbadge.offplan { color: #cf222e; border-color: #cf222e; background: rgba(207,34,46,.08); font-weight: 600; }
  .pbadge.missed { color: #57606a; border-color: #8c959f; }
  .kw { color: #cf222e; } .fn { color: #8250df; } .str { color: #0a3069; }
  .num { color: #0550ae; } .cmt { color: #6e7781; }
  .card.dim { opacity: .32; }
  /* ---- 上下文窥视：摘选周边的文件原文，点展开条逐段展开 ---- */
  .ctx-bar { text-align: center; font-size: 10.5px; color: #57606a; background: #f6f8fa;
    border-top: 1px dashed #e4e8ec; border-bottom: 1px dashed #e4e8ec; padding: 2px 0;
    cursor: pointer; user-select: none; }
  .ctx-bar:hover { color: #0969da; background: #eef4fb; }
  .ctx-bar .fold { margin-left: 16px; color: #8c959f; }
  .ctx-bar .fold:hover { color: #cf222e; }
  .ln.ctxln { opacity: .55; background: #fbfcfd; }
  .ln.ctxln .no { visibility: hidden; }
  .ctxlines { overflow-y: auto; touch-action: pan-y; overscroll-behavior: contain; }
  /* ---- 预览分区卡（district）：地图语言，零代码排版 ---- */
  .card.district { border-radius: 14px; border-width: 0; box-shadow: 0 4px 16px rgba(31,35,40,.12); }
  .card.district .hdr { border-bottom: none; background: transparent; padding: 14px 18px 2px; }
  .card.district .fname { font: 700 17px -apple-system, 'PingFang SC', sans-serif; }
  .card.district .dbody { padding: 4px 18px 14px; max-width: 340px; }
  .card.district.size-l .dbody { max-width: 400px; }
  .card.district.size-s .dbody { max-width: 260px; }
  .card.district.size-s .fname { font-size: 14px; }
  .drole { display: inline-block; font-size: 11px; font-weight: 600; border-radius: 99px;
    padding: 1px 10px; color: #fff; margin-bottom: 6px; }
  .doneliner { font-size: 12.5px; color: #424a53; line-height: 1.55; margin-bottom: 8px; }
  .dstat { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #6e7781;
    margin-bottom: 8px; }
  .dbar { height: 6px; border-radius: 99px; background: #eaeef2; flex: 1; overflow: hidden; }
  .dbar > i { display: block; height: 100%; border-radius: 99px; }
  .dchips { display: flex; flex-wrap: wrap; gap: 5px; }
  .dchip { font: 11px ui-monospace, Menlo, monospace; color: #424a53; background: #f0f2f5;
    border-radius: 6px; padding: 1px 8px; }
  /* ---- 实例快照卡（数据结构的具象例子，随步进演化，diff 自动高亮） ---- */
  .card.state .hdr { background: #eef6fb; }
  .sbody { padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 9px;
    max-width: 400px; }
  .snlabel { font: 600 11px ui-monospace, Menlo, monospace; color: #57606a;
    margin-bottom: 3px; }
  .scells { display: flex; flex-wrap: wrap; gap: 3px; }
  .scell { font: 12px/1.7 ui-monospace, Menlo, monospace; border: 1px solid #d0d7de;
    border-radius: 6px; padding: 0 8px; background: #fff; transition: background .3s; }
  .srow { display: flex; gap: 6px; align-items: baseline; font: 12px/1.8 ui-monospace, Menlo, monospace; }
  .skey { color: #6e7781; min-width: 96px; text-align: right; font-size: 11px; }
  .scell.chg { background: #fff3c2; border-color: #bf8700; font-weight: 600; }
  .scell.add { background: #dafbe1; border-color: #2da44e; font-weight: 600; }
  .snote { font-size: 11px; color: #9a6700; border-top: 1px dashed #e6d5a5;
    padding-top: 6px; line-height: 1.6; }
  /* 结构关系线：含/引用/索引（虚点线，区别于调用与数据流） */
  .wire.struct { stroke: #7d6bb0; stroke-width: 1.5; stroke-dasharray: 2 5; }
  .wire.on.struct { stroke: #8250df; stroke-width: 2.4; }
  .port.struct { fill: #7d6bb0; }
  .port.on.struct { fill: #8250df; }

  /* 故事线路（地铁线）：独立底层 SVG（#routes，卡片之下），浅弧几何 */
  #routes { position: absolute; left: 0; top: 0; z-index: 1; pointer-events: none; overflow: visible; }
  .wire.route { stroke-width: 6; stroke-linecap: round; fill: none; opacity: 0;
    transition: opacity .3s; }
  .wire.route.on { opacity: .8; }
  .wire.route.off { opacity: .1; }
  .wire.route-0 { stroke: #0969da; } .wire.route-1 { stroke: #1a7f37; }
  .wire.route-2 { stroke: #8250df; } .wire.route-3 { stroke: #bf8700; }
  .wire.route-4 { stroke: #d1242f; }
  .rchip { cursor: pointer; }
  .rchip .rdot { display: inline-block; width: 9px; height: 9px; border-radius: 99px;
    margin-right: 5px; vertical-align: -1px; }
  .rchip:hover { color: #1f2328; }

  /* 步内阅读顺序徽标：当前步 focus/order 元素左上角的 ①②③ */
  .ordchip { position: absolute; z-index: 6; min-width: 26px; height: 26px; padding: 0 4px;
    border-radius: 99px; background: #0969da; color: #fff; font: 700 14px/26px -apple-system, sans-serif;
    text-align: center; box-shadow: 0 2px 8px rgba(9,105,218,.4), 0 0 0 2px #fff;
    pointer-events: none; }

  /* ---- intra-function logical blocks ---- */
  .blk { border-left: 3px solid var(--bc); background: var(--bt); margin: 3px 0 3px 8px;
    border-radius: 0 6px 6px 0; }
  .blk .ln { padding-left: 6px; }
  .bbar { display: flex; align-items: baseline; gap: 7px; padding: 3px 10px 3px 7px;
    cursor: pointer; font-size: 10.5px; line-height: 1.7; white-space: nowrap; }
  .bbar:hover { background: rgba(31,35,40,.035); }
  .bchev { color: var(--bc); font-size: 8px; }
  .bname { color: var(--bc); font-weight: 600; }
  .bsum { color: #57606a; }
  .brange { margin-left: 10px; color: #8c959f; font-size: 9.5px; padding-left: 4px;
    font-family: ui-monospace, Menlo, Consolas, monospace; }
  .blk.folded > .bcode { display: none; }
  .bbtn { font-size: 9px; padding: 0 7px; border-radius: 99px; border: 1px solid #d0d7de;
    color: #57606a; cursor: pointer; line-height: 1.6; flex: none; align-self: center; }
  .bbtn:hover { color: #1f2328; border-color: #8c959f; }
  .bxplain { display: none; padding: 7px 14px 8px 10px; font-size: 11.5px; line-height: 1.7;
    color: #424a53; border-top: 1px dashed rgba(31,35,40,.15); white-space: normal;
    max-width: 560px; }
  .blk.explained > .bxplain { display: block; }
  .blk.qa-target { box-shadow: 0 0 0 2px var(--bc), 0 4px 16px rgba(31,35,40,.22); }
  .blk.qa-target > .bbar { background: var(--bt); }
  .blk.qa-target > .bbar .bname::after { content: ' · 问答中'; font-weight: 400; opacity: .75; }

  /* ---- term annotations: dotted identifiers that expand a note ---- */
  .term { border-bottom: 1px dotted #6e7781; cursor: pointer; }
  .term:hover { border-bottom-color: #1f2328; color: #0a0c10; }
  .term.on { background: rgba(154,103,0,.12); border-bottom-color: #bf8700; }
  .tnote { display: none; margin: 1px 14px 4px 48px; padding: 5px 10px; font-size: 11px;
    line-height: 1.65; color: #6a5518; background: rgba(191,135,0,.07);
    border-left: 2px solid #bf8700; border-radius: 0 6px 6px 0; white-space: normal;
    max-width: 480px; }
  .tnote.open { display: block; }

  /* ---- per-block Q&A drawer ---- */
  #qa { position: fixed; top: 0; right: -420px; width: 390px; height: 100%; z-index: 20;
    background: #ffffff; border-left: 1px solid #d0d7de; display: flex; flex-direction: column;
    transition: right .3s ease; box-shadow: -12px 0 30px rgba(31,35,40,.16); }
  #qa.open { right: 0; }
  #qa header { padding: 14px 44px 10px 16px; border-bottom: 1px solid #e4e8ec; position: relative; }
  #qa-path { font-size: 10.5px; color: #6e7781; margin-bottom: 3px; }
  #qa-name { font: 600 13px ui-monospace, Menlo, Consolas, monospace; color: #1f2328; }
  .qa-dot { display: inline-block; width: 9px; height: 9px; border-radius: 99px;
    margin-right: 7px; vertical-align: 0; }
  #qa-close { position: absolute; top: 10px; right: 10px; width: 26px; height: 26px;
    background: none; border: 1px solid #d0d7de; border-radius: 7px; color: #57606a;
    cursor: pointer; font-size: 12px; }
  #qa-close:hover { color: #1f2328; }
  #qa-log { flex: 1; overflow-y: auto; padding: 12px 16px; }
  .qa-q { background: #f0f2f5; border-radius: 10px 10px 3px 10px; padding: 8px 11px;
    margin: 10px 0 6px auto; max-width: 88%; width: fit-content; font-size: 12px; color: #24292f; }
  .qa-a { font-size: 12px; line-height: 1.7; color: #424a53; margin: 0 0 10px;
    padding: 8px 11px; background: #f6f8fa; border-radius: 10px 10px 10px 3px;
    border-left: 2px solid #0969da; white-space: pre-wrap; }
  .qa-a.err { border-left-color: #cf222e; color: #a2464e; }
  .qa-a.busy { border-left-color: #8c959f; color: #8c959f; font-style: italic; }
  .qa-hint { font-size: 11px; color: #6e7781; line-height: 1.7; padding: 6px 0; }
  .qa-meta { font: 10px ui-monospace, Menlo, monospace; color: #8c959f;
    margin: -7px 0 10px 2px; }
  #qa-form { padding: 12px 16px 16px; border-top: 1px solid #e4e8ec; display: flex; gap: 8px; }
  #qa-input { flex: 1; background: #ffffff; border: 1px solid #d0d7de; color: #24292f;
    border-radius: 8px; padding: 8px 10px; font-size: 12px; resize: none; height: 62px;
    font-family: inherit; }
  #qa-send { align-self: flex-end; background: #0969da; border: none; color: #ffffff;
    border-radius: 8px; padding: 8px 16px; cursor: pointer; font-size: 12px; }
  #qa-send:disabled { opacity: .45; cursor: default; }

  /* ---- notes ---- */
  .note { position: absolute; width: 250px; background: #fdf7e7; border: 1px solid #e6d5a5;
    border-left: 3px solid #bf8700; border-radius: 8px; padding: 9px 12px; font-size: 11.5px;
    line-height: 1.65; color: #6a5518; z-index: 4; transition: opacity .35s; }
  .note .tag { font-size: 9.5px; color: #9a6700; margin-bottom: 3px; letter-spacing: 1px; }
  .note.hot { border-color: #bf8700; border-left-color: #9a6700; color: #5c4a10;
    box-shadow: 0 0 0 1px rgba(191,135,0,.35), 0 8px 20px rgba(31,35,40,.14); }
  .note.dim { opacity: .32; }
  .note.bg { background: #eef6fb; border-color: #b6d5e6; border-left-color: #1a91c2; color: #315e75; }
  .note.bg .tag { color: #4a86a3; }
  .note.bg.hot { border-color: #1a91c2; border-left-color: #0e7aa8; color: #24485c;
    box-shadow: 0 0 0 1px rgba(26,145,194,.32), 0 8px 20px rgba(31,35,40,.14); }

  /* ---- wires ---- */
  #wires { position: absolute; left: 0; top: 0; z-index: 3; pointer-events: none; overflow: visible; }
  .wire { fill: none; transition: opacity .3s; }
  .wire.call { stroke: #8c959f; stroke-width: 1.6; }
  .wire.data { stroke: #bf8700; stroke-width: 1.6; }
  .wire.off { opacity: .1; }
  .wire.on.call { stroke: #24292f; stroke-width: 2.6; }
  .wire.on.data { stroke: #9a6700; stroke-width: 2.6; }
  .port.call { fill: #8c959f; } .port.data { fill: #bf8700; }
  .port.on.call { fill: #24292f; } .port.on.data { fill: #9a6700; }
  .port.off { opacity: .1; }
  /* plan wires: 计划加/删的线，虚线（后置以覆盖 kind 色） */
  .wire.plan-add { stroke: #2da44e; stroke-dasharray: 7 5; }
  .wire.plan-remove { stroke: #d1242f; stroke-dasharray: 7 5; }
  .wire.on.plan-add { stroke: #1a7f37; }
  .wire.on.plan-remove { stroke: #a40e26; }
  .port.plan-add { fill: #2da44e; } .port.plan-remove { fill: #d1242f; }
  .leader { stroke: #bf8700; stroke-width: 1; stroke-dasharray: 3 4; opacity: .6; fill: none; }
  .leader.off { opacity: .12; }
  .wlabel { font: 10.5px -apple-system, sans-serif; fill: #9a6700; }
  .wlabel.on { fill: #6a5518; font-weight: 600; }
  .wlabel.off { opacity: .1; }

  /* ---- chrome ---- */
  #topbar { position: fixed; top: 14px; left: 18px; z-index: 10;
    background: rgba(255,255,255,.92); backdrop-filter: blur(6px);
    border: 1px solid #d0d7de; border-radius: 12px; padding: 10px 14px;
    box-shadow: 0 4px 14px rgba(31,35,40,.08);
    max-width: min(880px, calc(100vw - 260px)); }
  .legend { flex-wrap: wrap; row-gap: 4px; }
  #home-link { display: inline-block; font-size: 11px; color: #57606a; text-decoration: none;
    background: #ffffff; border: 1px solid #d0d7de; border-radius: 99px; padding: 3px 11px;
    margin-bottom: 7px; }
  #home-link:hover { color: #1f2328; border-color: #8c959f; }
  #home-link[hidden] { display: none; }
  #topbar h1 { font-size: 14px; font-weight: 600; color: #1f2328; margin-bottom: 6px; }
  #topbar h1 small { color: #6e7781; font-weight: 400; margin-left: 8px; }
  .legend { display: flex; gap: 16px; font-size: 11px; color: #57606a; align-items: center; }
  .sw { display: inline-block; width: 22px; height: 0; border-top: 2px solid; margin-right: 5px;
    vertical-align: middle; }
  #hint { position: fixed; top: 16px; right: 18px; z-index: 10; font-size: 11px; color: #8c959f;
    text-align: right; line-height: 1.7; background: rgba(255,255,255,.85);
    backdrop-filter: blur(6px); border-radius: 10px; padding: 6px 10px; }

  /* ---- reader profile ---- */
  #canvas-ask-btn { position: fixed; top: 118px; right: 18px; z-index: 15; font-size: 11px;
    color: #57606a; background: #ffffff; border: 1px solid #d0d7de; border-radius: 99px;
    padding: 4px 12px; cursor: pointer; }
  #canvas-ask-btn:hover { color: #1f2328; border-color: #8c959f; }
  #dl-btn { position: fixed; top: 150px; right: 18px; z-index: 15; font-size: 11px;
    color: #57606a; background: #ffffff; border: 1px solid #d0d7de; border-radius: 99px;
    padding: 4px 12px; text-decoration: none; }
  #dl-btn:hover { color: #1f2328; border-color: #8c959f; }
  #dl-btn[hidden] { display: none; }
  #profile-btn { position: fixed; top: 86px; right: 18px; z-index: 15; font-size: 11px;
    padding: 4px 12px; border-radius: 99px; border: 1px solid #d0d7de; background: #ffffff;
    color: #57606a; cursor: pointer; }
  #profile-btn:hover { color: #1f2328; border-color: #8c959f; }
  body.has-profile #profile-btn { color: #0969da; border-color: #79b8ff; }
  #pp { position: fixed; top: 120px; right: 18px; z-index: 15; width: 320px;
    background: #ffffff; border: 1px solid #d0d7de; border-radius: 12px; padding: 14px;
    box-shadow: 0 14px 34px rgba(31,35,40,.18); }
  #pp[hidden] { display: none; }
  .pp-t { font-size: 12px; font-weight: 600; color: #1f2328; margin-bottom: 8px; }
  #pp-input { width: 100%; height: 92px; background: #ffffff; border: 1px solid #d0d7de;
    color: #24292f; border-radius: 8px; padding: 8px 10px; font-size: 11.5px; resize: none;
    font-family: inherit; line-height: 1.6; }
  .pp-row { display: flex; gap: 8px; margin: 10px 0 8px; }
  .pp-row button { border-radius: 7px; padding: 5px 14px; font-size: 11.5px; cursor: pointer;
    border: 1px solid #d0d7de; background: #f6f8fa; color: #24292f; }
  #pp-save { background: #0969da; border-color: #0969da; color: #ffffff; }
  .pp-hint { font-size: 10.5px; color: #6e7781; line-height: 1.65; }

  /* rewrite affordances only exist once a profile is set */
  body:not(.has-profile) .bbtn[data-act="rewrite"] { display: none; }
  .bx-tools, .tn-tools { display: inline-flex; gap: 8px; align-items: center; }
  .bx-tools { display: flex; margin-top: 7px; }
  .rw-badge { font-size: 9px; color: #0969da; border: 1px solid #9cc7f7; border-radius: 99px;
    padding: 0 7px; line-height: 1.6; flex: none; }

  #bar { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 10;
    display: flex; align-items: center; gap: 14px; padding: 11px 16px;
    background: rgba(255,255,255,.93); border: 1px solid #d0d7de; border-radius: 14px;
    max-width: min(880px, 95vw); backdrop-filter: blur(6px);
    box-shadow: 0 8px 24px rgba(31,35,40,.12); }
  .navbtn { background: #f6f8fa; border: 1px solid #d0d7de; color: #24292f; border-radius: 8px;
    width: 32px; height: 32px; cursor: pointer; font-size: 13px; flex: none; }
  .navbtn:hover { background: #eef1f4; }
  .navbtn:disabled { opacity: .35; cursor: default; }
  #dots { display: flex; gap: 6px; flex: none; }
  .dot { width: 7px; height: 7px; border-radius: 99px; background: #d0d7de; cursor: pointer; }
  .dot.cur { background: #0969da; }
  #stext { min-width: 0; }
  .schip { display: inline-block; font-size: 10px; padding: 1px 8px; border-radius: 99px;
    border: 1px solid; margin-right: 8px; vertical-align: 1px; }
  #stitle { font-weight: 600; font-size: 13px; color: #1f2328; margin-bottom: 2px; }
  #scap { font-size: 12px; color: #57606a; line-height: 1.5; max-width: 560px; }
  #sdetail-btn { display: inline-block; font-size: 10.5px; color: #0969da; cursor: pointer;
    margin-top: 3px; user-select: none; }
  #sdetail-btn:hover { text-decoration: underline; }
  #sdetail-btn[hidden] { display: none; }
  #dive-btn { display: inline-block; font-size: 10.5px; color: #1a7f37; cursor: pointer;

<script>
const DATA = {"meta": {"title": "缓存防雪崩 PR", "subtitle": "diff 画布示例 · TTL 抖动 + singleflight 击穿锁", "audience": "评审这个 PR 的后端工程师；中文；关注正确性与回归风险", "mode": "diff"}, "regions": [{"id": "A", "title": "故事线 A · 本次变更", "blurb": "两招：过期时刻打散、热 key 只放一个回源", "hue": "amber", "cards": ["handler", "jittered", "store"]}, {"id": "B", "title": "故事线 B · 未改动的邻居", "blurb": "变更周边的上下文，读懂连锁影响用", "hue": "blue", "cards": ["get", "fetch"]}], "cards": [{"id": "handler", "name": "handle_request(req)", "file": "server/handler.py:12", "lang": "py", "layout": {"col": 0, "band": 0}, "collapsed": false, "code": "def handle_request(req):\n    key = cache_key(req)\n    cached = get_cached(key)\n    if cached is not None:\n        metrics.hit()\n        return cached\n    with keyed_lock(key):\n        cached = get_cached(key)\n        if cached is not None:\n            return cached\n        resp = fetch_upstream(req)\n        store(key, resp, ttl=req.ttl)\n    return resp", "diff": {"added": [7, 8, 9, 10, 11, 12], "removed": [{"after": 6, "code": "    resp = fetch_upstream(req)"}, {"after": 6, "code": "    store(key, resp, ttl=req.ttl)"}]}, "terms": [{"line": 7, "token": "keyed_lock", "note": "进程内按 key 的互斥锁：同一 key 的并发未命中只放一个去回源，其余等它回填。"}]}, {"id": "jittered", "name": "jittered(ttl)", "file": "server/cache.py:9", "lang": "py", "layout": {"col": 1, "band": 0}, "collapsed": false, "code": "def jittered(ttl):\n    return ttl * random.uniform(0.9, 1.1)", "diff": {"added": [1, 2], "removed": []}}, {"id": "store", "name": "store(key, resp, ttl)", "file": "server/cache.py:14", "lang": "py", "layout": {"col": 1, "band": 1}, "collapsed": false, "code": "def store(key, resp, ttl):\n    ttl = jittered(ttl)\n    _table[key] = Entry(resp, now() + ttl)\n    _evict_if_needed()", "diff": {"added": [2], "removed": []}}, {"id": "get", "name": "get_cached(key)", "file": "server/cache.py:24", "lang": "py", "layout": {"col": 2, "band": 0}, "collapsed": true, "code": "def get_cached(key):\n    entry = _table.get(key)\n    if entry is None or entry.expired():\n        return None\n    return entry.value"}, {"id": "fetch", "name": "fetch_upstream(req)", "file": "server/upstream.py:31", "lang": "py", "layout": {"col": 2, "band": 2}, "collapsed": true, "code": "def fetch_upstream(req):\n    conn = pool.acquire(req.host)\n    try:\n        return conn.send(req)\n    finally:\n        pool.release(conn)"}], "wires": [{"id": "w-get", "kind": "call", "from": {"card": "handler", "line": 3}, "to": {"card": "get"}}, {"id": "w-fetch", "kind": "call", "from": {"card": "handler", "line": 11}, "to": {"card": "fetch", "side": "left"}}, {"id": "w-store", "kind": "call", "from": {"card": "handler", "line": 12}, "to": {"card": "store"}}, {"id": "w-jit", "kind": "call", "from": {"card": "store", "line": 2, "side": "left"}, "to": {"card": "jittered", "side": "left"}}, {"id": "d-resp", "kind": "data", "label": "resp", "from": {"card": "fetch", "line": 4, "side": "left"}, "to": {"card": "store", "side": "right"}}], "notes": [{"id": "bg0", "flavor": "bg", "tag": "背景 · 这个 PR 治什么病", "text": "雪崩：大批 key 同秒过期，回源洪峰打垮上游；击穿：热 key 过期瞬间并发全部回源。本 PR 各用一招：TTL 抖动打散过期，singleflight 锁同 key 并发。", "place": {"corner": "nw"}, "step": 0}, {"id": "n-jit", "flavor": "intent", "tag": "NOTE · cache.py:10", "text": "抖动窗口 ±10%：足够打散过期时刻，又不至于让 TTL 明显失真。", "anchor": {"card": "jittered", "line": 2}, "place": {"side": "left", "of": "jittered"}, "step": 1}, {"id": "n-dc", "flavor": "intent", "tag": "NOTE · handler.py:19", "text": "双重检查：拿到锁先再查一次缓存——排队期间别人可能已经回填了。", "anchor": {"card": "handler", "line": 8}, "place": {"side": "left", "of": "handler"}, "step": 2}, {"id": "n-risk", "flavor": "intent", "tag": "风险 · 观测与告警", "text": "jittered 之后 TTL 观测值 ≠ 配置值：监控里按 ttl 精确值报警的规则会误报，要跟着改。", "anchor": {"card": "store", "line": 2}, "place": {"side": "left", "of": "store"}, "step": 3}], "steps": [{"title": "总览", "caption": "一个防雪崩 PR 的评审画布：绿 = 新增行，红删除线 = 被删原文，卡头有 +/− 统计。三步走：这个 PR 治什么病 → 抖动 → 击穿锁 → 风险。", "fit": true, "detail": "这个 PR 的两处改动治两种不同的病，别混为一谈：TTL 抖动治「雪崩」（大批 key 同秒过期，回源洪峰压垮上游），singleflight 锁治「击穿」（单个热 key 过期瞬间，并发请求全部穿透）。两者常被一起提，但机制独立——抖动改的是写路径（store），锁改的是读路径的未命中分支（handler）。评审时可以分开判断各自的正确性。"}, {"title": "① TTL 抖动", "storyline": "A", "caption": "store 写入前把 TTL 过一遍 jittered()：±10% 均匀抖动，同批写入的 key 过期时刻被打散——雪崩的「同秒过期」前提直接消失。", "wires": ["w-jit"], "lines": [["store", 2], ["jittered", 2]], "focus": ["store", "jittered", "n-jit"], "detail": "为什么在 store 里做而不是调用方：写入是 TTL 的唯一入口，在这里抖动能覆盖所有调用方，且调用方无感知。±10% 的窗口是权衡：太小打散不了同批 key 的过期时刻，太大让 TTL 语义失真（用户设 60s 结果活了 70s）。均匀分布而非正态，是为了让过期时刻在窗口内摊平而不是在中心聚堆。"}, {"title": "② singleflight 击穿锁", "storyline": "A", "caption": "未命中路径包进 keyed_lock：同一 key 只放一个请求去回源，其余排队。注意被删的原文——原来是裸奔直接回源。拿到锁先做双重检查。", "wires": ["w-fetch", "w-store"], "lines": [["handler", 7], ["handler", 8], ["handler", 9], ["handler", 10]], "focus": ["handler", "n-dc", "fetch"], "detail": "锁的粒度是 per-key 而非全局——不同 key 的未命中互不阻塞。拿到锁后必须再查一次缓存（双重检查）：排队等锁期间，前一个持锁者可能已经回填了，不查就白白多回源一次。注意被删的两行原文：原来未命中就裸奔回源，并发下同一个 key 会同时打出 N 个上游请求。锁持有期覆盖整个回源+写入，这是正确性要求，也是风险来源（见下一步）。"}, {"title": "③ 回归风险", "storyline": "A", "caption": "两个要盯的点：抖动让 TTL 观测值偏离配置值，相关告警规则要改；keyed_lock 持锁期间包含整个回源耗时，慢上游会让排队请求堆积。", "wires": ["w-store", "w-jit"], "lines": [["store", 2]], "focus": ["store", "n-risk", "handler"], "detail": "两个回归风险都不在改动行本身，而在它们的涟漪：① 抖动后 TTL 观测值≠配置值，任何按精确 TTL 值报警/断言的监控规则都会误报，要跟着改；② keyed_lock 持锁期含整个回源耗时——上游一旦变慢，同 key 的等待请求会排队堆积，线程池可能被占满。评审要问的不是「这段代码对不对」，而是「谁依赖了旧行为」。"}]};

const vp = document.getElementById('vp');
const world = document.getElementById('world');
const svg = document.getElementById('wires');
const NS = 'http://www.w3.org/2000/svg';

if (!DATA) {
  document.getElementById('stitle').textContent = '未注入数据';
  document.getElementById('scap').textContent = '用 render.py 将 canvas JSON 注入此模板。';
  throw new Error('no data');
}

/* ================= syntax highlighting ================= */
const KW = {
  py: 'def return if elif else for while in is not None True False and or with try except finally continue break class import from as lambda yield raise pass global nonlocal assert del await async',
  js: 'function return if else for while const let var new class import from export try catch finally throw await async of in typeof instanceof null undefined true false break continue switch case default do yield delete void this super extends static get set',
};
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function highlight(line, lang) {
  const kws = (KW[lang] || KW.py).split(' ');
  const re = new RegExp(
    '(#.*$|\\/\\/.*$)'                                     // comment
    + '|("(?:[^"\\\\]|\\\\.)*"|\'(?:[^\'\\\\]|\\\\.)*\')'  // string
    + '|\\b(' + kws.join('|') + ')\\b'                     // keyword
    + '|\\b(\\d+(?:\\.\\d+)?)\\b'                          // number
    + '|([A-Za-z_][A-Za-z0-9_]*)(?=\\()',                  // call
    'g');
  return esc(line).replace(re, (m, c, s, k, n, f) => {
    if (c) return `<span class="cmt">${c}</span>`;
    if (s) return `<span class="str">${s}</span>`;
    if (k) return `<span class="kw">${k}</span>`;
    if (n) return `<span class="num">${n}</span>`;
    if (f) return `<span class="fn">${f}</span>`;
    return m;
  });
}

/* ================= build DOM ================= */
const HUES = {
  blue:   { bg: 'rgba(9,105,218,.045)',  bd: 'rgba(9,105,218,.38)',  lb: '#0969da' },
  green:  { bg: 'rgba(26,127,55,.05)',   bd: 'rgba(26,127,55,.38)',  lb: '#1a7f37' },
  violet: { bg: 'rgba(130,80,223,.05)',  bd: 'rgba(130,80,223,.38)', lb: '#8250df' },
  amber:  { bg: 'rgba(154,103,0,.05)',   bd: 'rgba(154,103,0,.42)',  lb: '#9a6700' },
};
const BLOCK_PALETTE = [
  ['#0969da', '#8250df', '#1a7f37', '#bc4c00', '#9a6700'],   // depth 0
  ['#bf3989', '#0f766e', '#b45309', '#1d4ed8'],              // depth 1+
];
function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}

document.getElementById('t-title').firstChild.textContent = (DATA.meta?.title || 'Code Canvas') + ' ';
document.getElementById('t-sub').textContent = DATA.meta?.subtitle || '';
document.title = DATA.meta?.title || 'Code Canvas';

/* regions (positioned later) */
for (const r of DATA.regions || []) {
  const hue = HUES[r.hue] || HUES.blue;
  const el = document.createElement('div');
  el.className = 'region';
  el.id = 'reg-' + r.id;
  el.style.background = hue.bg;
  el.style.borderColor = hue.bd;
  el.innerHTML = `<span class="rlabel" style="color:${hue.lb}; border-color:${hue.bd}">${esc(r.title)}</span>`
    + (r.blurb ? `<span class="rblurb" style="color:${hue.lb}; opacity:.7">${esc(r.blurb)}</span>` : '');
  world.appendChild(el);
}

/* cards: lines + nested block tree */
function buildBlocks(blocks, lines, lo, hi, cardId, depth) {
  // returns HTML for line range [lo, hi] with blocks interleaved
  let html = '', i = lo;
  const blks = (blocks || []).slice().sort((a, b) => a.lines[0] - b.lines[0]);
  for (const b of blks) {
    for (; i < b.lines[0]; i++) html += lines[i - 1];
    const c = BLOCK_PALETTE[Math.min(depth, 1)][b._idx % BLOCK_PALETTE[Math.min(depth, 1)].length];
    const btns = (b.explain ? `<span class="bbtn" style="margin-left:auto" data-act="explain">说明</span>` : '')
      + `<span class="bbtn"${b.explain ? '' : ' style="margin-left:auto"'} data-act="ask">问</span>`;
    html += `<div class="blk${b.folded !== false ? ' folded' : ''}" style="--bc:${c}; --bt:${rgba(c, .05)}">`
      + `<div class="bbar" data-card="${cardId}" data-bname="${esc(b.name)}">`
      + `<span class="bchev">${b.folded !== false ? '▸' : '▾'}</span>`
      + `<span class="bname">${esc(b.name)}</span><span class="bsum">${esc(b.summary || '')}</span>`
      + btns + `<span class="brange">${b.lines[0]}–${b.lines[1]}</span></div>`
      + (b.explain ? `<div class="bxplain" data-card="${cardId}" data-bname="${esc(b.name)}">`
        + `<span class="bx-text">${esc(b.explain)}</span>`
        + `<div class="bx-tools"><span class="bbtn" data-act="rewrite">按我的画像重讲</span></div></div>` : '')
      + `<div class="bcode">`
      + buildBlocks(b.children, lines, b.lines[0], b.lines[1], cardId, depth + 1)
      + `</div></div>`;
    i = b.lines[1] + 1;
  }
  for (; i <= hi; i++) html += lines[i - 1];
  return html;
}
function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
const cardById = {};
for (const c of DATA.cards) {
  cardById[c.id] = c;
  if (c.kind === 'state') {      // 实例快照卡：具象数据结构，body 随步进重绘
    const el = document.createElement('div');
    el.className = 'card state';
    el.id = 'card-' + c.id;
    el.innerHTML = `<div class="hdr"><span class="chev">▾</span><span class="fname">${esc(c.name)}</span>`
      + `<span class="file">${esc(c.file || '')}</span></div><div class="body sbody"></div>`;
    world.appendChild(el);
    continue;
  }
  if (c.kind === 'district') {   // 预览分区卡：地图语言，零代码排版
    const el = document.createElement('div');
    el.className = 'card district size-' + (c.size || 'm');
    el.id = 'card-' + c.id;
    const rc = c.role_color || '#57606a';
    el.innerHTML = `<div class="hdr"><span class="chev">▾</span><span class="fname">${esc(c.name)}</span>`
      + `<span class="file">${esc(c.file || '')}</span></div>`
      + `<div class="body dbody">`
      + (c.role ? `<span class="drole" style="background:${rc}">${esc(c.role)}</span>` : '')
      + (c.oneliner ? `<div class="doneliner">${esc(c.oneliner)}</div>` : '')
      + (c.stat ? `<div class="dstat"><span>${esc(c.stat)}</span><span class="dbar">`
        + `<i style="width:${Math.round((c.frac || 0) * 100)}%;background:${rc}"></i></span></div>` : '')
      + ((c.highlights || []).length ? `<div class="dchips">`
        + c.highlights.map(h => `<span class="dchip">${esc(h)}</span>`).join('') + `</div>` : '')
      + `</div>`;
    world.appendChild(el);
    continue;
  }
  const raw = c.code.split('\n');
  const diff = c.diff || {};
  const addSet = new Set(diff.added || []);
  const delAfter = {};
  (diff.removed || []).forEach(r => (delAfter[r.after] ||= []).push(r.code));
  const delHtml = k => (delAfter[k] || []).map(t =>
    `<div class="ln del"><span class="no">−</span>${esc(t)}</div>`).join('');
  const lineHtml = raw.map((t, i) => {
    // mark annotated terms with sentinels before highlighting, wrap after
    let marked = t;
    const terms = (c.terms || []).map((tm, j) => ({ ...tm, _id: `tn-${c.id}-${j}`, _j: j }))
      .filter(tm => tm.line === i + 1);
    for (const tm of terms)
      marked = marked.replace(new RegExp('\\b' + escRe(tm.token) + '\\b'), '\x01' + tm.token + '\x02');
    let h = highlight(marked, c.lang);
    for (const tm of terms) {
      h = h.replace('\x01', `<span class="term" data-tn="${tm._id}">`).replace('\x02', '</span>');
    }
    const notes = terms.map(tm =>
      `<div class="tnote" id="${tm._id}" data-card="${c.id}" data-tid="${tm._j}">`
      + `<b>${esc(tm.token)}</b> — <span class="tn-text">${esc(tm.note)}</span> `
      + `<span class="tn-tools"><span class="bbtn" data-act="rewrite">重讲</span></span></div>`).join('');
    return (i === 0 ? delHtml(0) : '')
      + `<div class="ln${addSet.has(i + 1) ? ' add' : ''}" id="${c.id}-L${i + 1}"><span class="no">${i + 1}</span>${h}</div>`
      + delHtml(i + 1) + notes;
  });
  (c.blocks || []).forEach((b, i) => { b._idx = i; (function mark(bs) { (bs || []).forEach((x, j) => { x._idx = j; mark(x.children); }); })(b.children); });
  const el = document.createElement('div');
  el.className = 'card' + (c.plan === 'add' ? ' ghost' : '');
  el.id = 'card-' + c.id;
  const PLAN_LABEL = { add: '新建', modify: '将改', remove: '将删' };
  const DELTA_LABEL = { offplan: '⚠ 计划外', missed: '○ 计划未动' };
  const badge = (c.diff
    ? `<span class="dbadge"><b>+${(diff.added || []).length}</b> <i>−${(diff.removed || []).length}</i></span>` : '')

/* ================= layout ================= */
const L = { margin: 40, top: 160, gutter: 230, bandH: 280, vGap: 90,
  noteW: 250, noteGap: 60, regPadX: 30, regPadTop: 46, regPadBot: 26 };

function layout() {
  // measure natural card widths (expanded, unfolded)
  for (const c of DATA.cards) {
    const el = document.getElementById('card-' + c.id);
    el.classList.remove('collapsed');
    el.querySelectorAll('.blk').forEach(b => b.classList.remove('folded'));
    el.style.width = 'max-content';
    c._w = Math.min(el.offsetWidth + 2, 800);
  }
  // apply default states + fixed widths
  for (const c of DATA.cards) {
    const el = document.getElementById('card-' + c.id);
    el.style.width = c._w + 'px';
    if (c.collapsed) { el.classList.add('collapsed'); el.querySelector('.chev').textContent = '▸'; }
    el.querySelectorAll('.blk').forEach(b => b.classList.add('folded'));
    el.querySelectorAll('.bchev').forEach(v => v.textContent = '▸');
    // honor explicit folded:false
    applyFoldDefaults(c);
  }
  // columns; a column whose cards have left-notes gets a note lane in front of it
  const hasLeftNotes = (DATA.notes || []).some(n => n.place
    && (n.place.corner || (n.place.side === 'left' && cardById[n.place.of]?.layout.col === 0)));
  const leftNoteCols = new Set();
  for (const n of DATA.notes || []) if (n.place && n.place.side === 'left') {
    const t = cardById[n.place.of];
    if (t && t.layout.col > 0) leftNoteCols.add(t.layout.col);
  }
  const cols = {};
  for (const c of DATA.cards) (cols[c.layout.col] ||= []).push(c);
  let x = L.margin + (hasLeftNotes ? L.noteW + 80 : 0);
  const colX = {};
  for (const k of Object.keys(cols).map(Number).sort((a, b) => a - b)) {
    if (leftNoteCols.has(k)) x += L.noteW + 70;
    colX[k] = x;
    x += Math.max(...cols[k].map(c => c._w)) + L.gutter;
  }
  // x + base y from coarse hints; dynamic push-down happens on every draw
  for (const c of DATA.cards) {
    const el = document.getElementById('card-' + c.id);
    el.style.left = colX[c.layout.col] + 'px';
    c._x = colX[c.layout.col];
    c._baseY = L.top + c.layout.band * L.bandH;
  }
  relayoutColumns();
  placeNotes();
  fitRegions();
  sizeWorld();
}
/* notes follow their target cards on every redraw; an "above" note squeezed
   out by an expanding card slides down, and falls back to hanging left of
   its target when there is no room at all */
function placeNotes() {
  const leftSlots = {};
  for (const n of DATA.notes || []) {
    const el = document.getElementById('note-' + n.id);
    const p = n.place || {};
    if (p.corner === 'nw') { el.style.left = L.margin + 'px'; el.style.top = (L.top - 40) + 'px'; continue; }
    const target = cardById[p.of];
    const tEl = target && document.getElementById('card-' + target.id);
    if (!tEl) { el.style.left = L.margin + 'px'; el.style.top = L.top + 'px'; continue; }
    const ty = tEl.offsetTop, h = el.offsetHeight;
    if (p.side === 'above') {
      const above = DATA.cards
        .filter(c => c.layout.col === target.layout.col && c.id !== target.id)
        .map(c => document.getElementById('card-' + c.id))
        .filter(e => e.offsetTop < ty);
      const floor = above.length
        ? Math.max(...above.map(e => e.offsetTop + e.offsetHeight)) + 10 : 20;
      let y = Math.max(ty - h - L.regPadTop - 44, floor);
      if (y <= ty - h - 6) {
        el.style.left = (target._x + 120) + 'px';
        el.style.top = Math.max(20, y) + 'px';
      } else {
        el.style.left = (target._x - L.noteW - 40) + 'px';
        el.style.top = ty + 'px';
      }
    } else { // left
      el.style.left = (target._x - L.noteGap - L.noteW) + 'px';
      let y = ty + 40;
      if (n.anchor && n.anchor.card === p.of) {
        const le = document.getElementById(n.anchor.card + '-L' + n.anchor.line);
        if (le && le.offsetParent !== null) y = wpos(le).y - 20;
      }
      const floor = leftSlots[p.of] || 0;
      if (y < floor) y = floor;
      el.style.top = y + 'px';
      leftSlots[p.of] = y + h + 16;
    }
  }
}
function applyFoldDefaults(c) {
  const walk = (bs, prefix) => (bs || []).forEach(b => {
    if (b.folded === false) {
      // find the matching blk element by name (names unique within a card in practice)
      const el = [...document.getElementById('card-' + c.id).querySelectorAll('.blk')]
        .find(e => e.querySelector('.bname').textContent === b.name);
      if (el) { el.classList.remove('folded'); el.querySelector('.bchev').textContent = '▾'; }
    }

}
function relayoutColumns() {
  // cards grow and shrink as they expand/fold; keep columns overlap-free
  const cols = {};
  for (const c of DATA.cards) (cols[c.layout.col] ||= []).push(c);
  for (const k of Object.keys(cols)) {
    const list = cols[k].slice().sort((a, b) => a._baseY - b._baseY);
    let prevBottom = -1e9;
    for (const c of list) {
      const el = document.getElementById('card-' + c.id);
      const y = Math.max(c._baseY, prevBottom + 60);

      c._y = y;
      prevBottom = y + el.offsetHeight;

}
function fitRegions() {
  for (const r of DATA.regions || []) {

    let x0 = 1e9, y0 = 1e9, x1 = 0, y1 = 0;
    for (const id of r.cards) {
      const c = document.getElementById('card-' + id);
      x0 = Math.min(x0, c.offsetLeft); y0 = Math.min(y0, c.offsetTop);
      x1 = Math.max(x1, c.offsetLeft + c.offsetWidth);
      y1 = Math.max(y1, c.offsetTop + c.offsetHeight);
    }
    el.style.left = (x0 - L.regPadX) + 'px';
    el.style.top = (y0 - L.regPadTop) + 'px';
    el.style.width = (x1 - x0 + 2 * L.regPadX) + 'px';
    el.style.height = (y1 - y0 + L.regPadTop + L.regPadBot) + 'px';

}
function contentBBox() {
  let x0 = 1e9, y0 = 1e9, x1 = 0, y1 = 0;
  for (const el of world.querySelectorAll('.card, .note, .region')) {
    x0 = Math.min(x0, el.offsetLeft); y0 = Math.min(y0, el.offsetTop);
    x1 = Math.max(x1, el.offsetLeft + el.offsetWidth);
    y1 = Math.max(y1, el.offsetTop + el.offsetHeight);

/* ================= geometry / wires ================= */
function wpos(el) {
  let x = 0, y = 0, e = el;
  while (e && e.id !== 'world') { x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; }
  return { x, y, w: el.offsetWidth, h: el.offsetHeight };
}
function visibleProxy(lineEl, cardEl) {
  // line hidden? cascade: outermost folded block bar -> card
  if (cardEl.classList.contains('collapsed')) return cardEl;
  if (lineEl.offsetParent !== null) return lineEl;
  const chain = [];
  let e = lineEl.parentElement;
  while (e && e !== cardEl) { if (e.classList.contains('blk')) chain.unshift(e); e = e.parentElement; }
  for (const b of chain) if (b.classList.contains('folded')) return b.querySelector('.bbar');
  return cardEl;
}
function resolveAnchor(spec, slot) {
  const cardEl = document.getElementById('card-' + spec.card);
  let el = cardEl, isInner = false;
  if (spec.line) {
    const le = document.getElementById(spec.card + '-L' + spec.line);
    if (le) { el = visibleProxy(le, cardEl); isInner = el !== cardEl; }
  }
  const p = wpos(el);
  const side = spec.side || (slot ? 'left' : 'right');
  const x = side === 'right' ? p.x + p.w : p.x;
  let y;
  if (isInner) y = p.y + p.h / 2;
  else if (slot) {
    const collapsed = el.classList.contains('collapsed');
    if (slot === 'data') y = collapsed ? p.y + p.h / 2 + 7 : p.y + Math.min(p.h * 0.62, p.h - 16);
    else y = collapsed ? p.y + p.h / 2 - 5 : p.y + 16;

}
let step = 0;
const STEPS = DATA.steps && DATA.steps.length ? DATA.steps : [{ title: '总览', caption: '', fit: true }];
const ARROW_COLORS = { call: '#24292f', data: '#9a6700', struct: '#8250df',
  'plan-add': '#1a7f37', 'plan-remove': '#a40e26' };

/* ---- 实例快照：按当前步选状态，和上一状态做 cell 级 diff ---- */
function renderStateCards() {
  for (const c of DATA.cards) {
    if (c.kind !== 'state') continue;
    const body = document.querySelector('#card-' + c.id + ' .sbody');
    if (!body) continue;
    const sts = c.states || [];
    let idx = -1;
    sts.forEach((s, i) => { if (s.step <= step) idx = i; });
    const cur = sts[Math.max(idx, 0)];
    const prev = idx > 0 ? sts[idx - 1] : null;
    if (!cur) continue;
    const cls = (now, was, isNew) => isNew ? ' add' : (was !== undefined && was !== now ? ' chg' : '');
    let html = '';
    for (const n of c.nodes || []) {
      const cv = (cur.nodes || {})[n.id] || {};
      const pv = prev ? (prev.nodes || {})[n.id] || {} : {};
      html += `<div class="snode"><div class="snlabel">${esc(n.label || n.id)}</div>`;
      if (n.kind === 'array') {
        // 按值比对：真正的新值标绿；位移（如队列出队后的整体前移）不标——伪变更
        const pset = {};
        (pv.cells || []).forEach(v => { pset[String(v)] = (pset[String(v)] || 0) + 1; });
        html += '<div class="scells">' + (cv.cells || []).map(v => {
          const k = String(v);
          const isNew = prev && !(pset[k] > 0);
          if (pset[k] > 0) pset[k] -= 1;
          return `<span class="scell${isNew ? ' add' : ''}">${esc(k)}</span>`;
        }).join('')
          + ((cv.cells || []).length ? '' : '<span class="scell" style="opacity:.45">（空）</span>') + '</div>';
      } else {  // map / record：rows = [[key, value], …]，按 key 对齐 diff
        const pm = {};
        (pv.rows || []).forEach(([k, v]) => { pm[k] = v; });
        html += (cv.rows || []).map(([k, v]) =>
          `<div class="srow"><span class="skey">${esc(String(k))}</span>`
          + `<span class="scell${prev ? cls(v, pm[k], !(k in pm)) : ''}">${esc(String(v))}</span></div>`).join('');
      }
      html += '</div>';
    }
    if (cur.note && prev !== null) html += `<div class="snote">本步：${esc(cur.note)}</div>`;
    body.innerHTML = html;
  }
}
function drawWires() {
  relayoutColumns(); placeNotes(); fitRegions(); sizeWorld();
  svg.innerHTML = '<defs>' + Object.entries(ARROW_COLORS).map(([k, c]) =>
    `<marker id="ah-${k}" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
       <path d="M 0 1 L 9 5 L 0 9 z" fill="${c}"/></marker>`).join('') + '</defs>';
  const active = STEPS[step].wires || null;
  // 故事线路：底层 SVG、站心浅弧——不走端口贝塞尔（那是绕圈的元凶）
  const routesSvg = document.getElementById('routes');
  routesSvg.innerHTML = '';
  for (const w of DATA.wires || []) {
    if (w.kind !== 'route') continue;
    const ea = document.getElementById('card-' + w.from.card);
    const eb = document.getElementById('card-' + w.to.card);
    if (!ea || !eb) continue;
    const pa = wpos(ea), pb = wpos(eb);
    const a = { x: pa.x + pa.w / 2, y: pa.y + pa.h / 2 };
    const b = { x: pb.x + pb.w / 2, y: pb.y + pb.h / 2 };
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
    const bow = Math.min(len * .12, 60);           // 一致的浅弧，行进方向左侧
    const m = { x: (a.x + b.x) / 2 - dy / len * bow, y: (a.y + b.y) / 2 + dx / len * bow };
    const state = active === null ? '' : (active.includes(w.id) ? ' on' : ' off');
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', `M ${a.x} ${a.y} Q ${m.x} ${m.y}, ${b.x} ${b.y}`);
    p.setAttribute('class', `wire route route-${w.route || 0}${state}`);

  }
  for (const w of DATA.wires || []) {
    if (w.kind === 'route') continue;
    const a = resolveAnchor(w.from, null);
    const b = resolveAnchor({ side: 'left', ...w.to }, w.kind === 'data' ? 'data' : 'call');
    const k = Math.min(Math.max(Math.abs(b.x - a.x) * .55, Math.abs(b.y - a.y) * .25, 30), 170);
    const c1 = { x: a.x + (a.side === 'right' ? k : -k), y: a.y };
    const c2 = { x: b.x + (b.side === 'right' ? k : -k), y: b.y };
    const state = active === null ? '' : (active.includes(w.id) ? ' on' : ' off');
    const planCls = (w.plan ? ` plan-${w.plan}` : '') + (w.route !== undefined ? ` route-${w.route}` : '');
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', `M ${a.x} ${a.y} C ${c1.x} ${c1.y}, ${c2.x} ${c2.y}, ${b.x} ${b.y}`);
    path.setAttribute('class', `wire ${w.kind}${planCls}${state}`);
    if (state === ' on' && w.kind !== 'route')  // 点亮的线带方向箭头（地铁线路除外）
      path.setAttribute('marker-end', `url(#ah-${w.plan ? 'plan-' + w.plan : w.kind})`);
    svg.appendChild(path);
    for (const pt of [a, b]) {
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', pt.x); c.setAttribute('cy', pt.y);
      c.setAttribute('r', state === ' on' ? 4.5 : 3.5);
      c.setAttribute('class', `port ${w.kind}${planCls}${state}`);
      svg.appendChild(c);

      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('class', `wlabel${state}`);
      t.textContent = w.label;
      svg.appendChild(t);
    }
  }

    if (!n.anchor) continue;
    const noteEl = document.getElementById('note-' + n.id);
    const note = wpos(noteEl);

    const a = { x: note.x + note.w, y: note.y + note.h / 2 };
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', `M ${a.x} ${a.y} C ${a.x + 34} ${a.y}, ${b.x - 34} ${b.y}, ${b.x} ${b.y}`);
    p.setAttribute('class', 'leader' + (noteEl.classList.contains('dim') ? ' off' : ''));

    .map(id => document.getElementById('card-' + id) || document.getElementById('note-' + id))
    .filter(Boolean);
  if (ord.length >= 2) ord.forEach((el, i) => {
    const p = wpos(el);
    const chip = document.createElement('div');
    chip.className = 'ordchip';
    chip.textContent = i + 1;
    chip.style.left = (p.x - 12) + 'px';
    chip.style.top = (p.y - 13) + 'px';

}

/* ================= camera ================= */
let cam = { x: 0, y: 0, s: .8 };
function apply(animate = true) {

  world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.s})`;
}
function centerOn(wx, wy, s, animate = true) {
  cam.s = s;
  cam.x = innerWidth / 2 - wx * s;
  cam.y = (innerHeight - 70) / 2 - wy * s;
  apply(animate);
}
function fitAll(animate = true) {
  // never crop the overview — wide canvases fit at whatever scale it takes
  const b = contentBBox();
  const s = Math.min(Math.min(innerWidth / (b.x1 - b.x0 + 60), (innerHeight - 110) / (b.y1 - b.y0 + 60)) * .98, 1.15);
  centerOn((b.x0 + b.x1) / 2, (b.y0 + b.y1) / 2, Math.max(s, .1), animate);

function focusOn(ids, animate = true) {
  let x0 = 1e9, y0 = 1e9, x1 = 0, y1 = 0;
  for (const id of ids) {
    const el = document.getElementById('card-' + id) || document.getElementById('note-' + id);
    if (!el) continue;
    const p = wpos(el);
    x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y);
    x1 = Math.max(x1, p.x + p.w); y1 = Math.max(y1, p.y + p.h);
  }
  if (x1 === 0) return fitAll(animate);
  const minS = innerWidth < 700 ? .12 : .35;  // 手机上宁可小也不裁切 focus 内容
  const s = Math.max(minS, Math.min(Math.min(innerWidth / (x1 - x0 + 160), (innerHeight - 170) / (y1 - y0 + 120)), 1.1));
  centerOn((x0 + x1) / 2, (y0 + y1) / 2, s, animate);
}

/* ================= steps ================= */
function setStep(i, animate = true) {

  });
  document.querySelectorAll('.ln.hot').forEach(e => e.classList.remove('hot'));
  (s.lines || []).forEach(([cid, ln]) => {

  });
  const activeCards = new Set();
  if (s.wires) for (const w of DATA.wires || []) if (s.wires.includes(w.id)) {
    activeCards.add(w.from.card); activeCards.add(w.to.card);
  }
  document.querySelectorAll('.card').forEach(c =>
    c.classList.toggle('dim', s.wires ? !activeCards.has(c.id.slice(5)) : false));
  document.querySelectorAll('.note').forEach(n => {
    const mine = n.dataset.step !== '' && +n.dataset.step === step;
    n.classList.toggle('hot', mine);
    n.classList.toggle('dim', step > 0 && !mine);
  });
  renderStateCards();
  if (s.fit || !s.focus) fitAll(animate); else focusOn(s.focus, animate);
  drawWires();
  const reg = (DATA.regions || []).find(r => r.id === s.storyline);
  const hue = reg && (HUES[reg.hue] || HUES.blue);
  document.getElementById('stitle').innerHTML =
    (reg ? `<span class="schip" style="color:${hue.lb}; border-color:${hue.lb}">${esc(reg.title.replace(/^故事线\s*/, ''))}</span>` : '')
    + esc(s.title || '');
  document.getElementById('scap').textContent = s.caption || '';
  // 步级详解：有 detail 才出「详解」按钮，换步自动收起

  dpanel.hidden = true;
  dbtn.textContent = '详解 ▾';
  dpanel.textContent = s.detail || '';
  updateDive(s);
  document.getElementById('prev').disabled = step === 0;
  document.getElementById('next').disabled = step === STEPS.length - 1;
  document.querySelectorAll('.dot').forEach((d, j) => {
    d.classList.toggle('cur', j === step);
    const r2 = (DATA.regions || []).find(r => r.id === STEPS[j].storyline);
    const h2 = r2 && (HUES[r2.hue] || HUES.blue);
    d.style.background = h2 ? (j === step ? h2.lb : rgba(h2.lb, .35))
                            : (j === step ? '#79a8ff' : '#3c4653');
  });
}

const QA = { live: false, cur: null, log: {} };

function findBlock(blocks, name) {
  for (const b of blocks || []) {
    if (b.name === name) return b;
    const c = findBlock(b.children, name);
    if (c) return c;
  }
  return null;
}
function qaKey() { return QA.cur.card ? QA.cur.card + '::' + QA.cur.block : '__canvas__'; }

/* 画布级问答的上下文：整张图的策展内容（卡片代码按预算截断） */
function canvasContext() {
  const regions = (DATA.regions || [])
    .map(r => `${r.title}${r.blurb ? ' — ' + r.blurb : ''}：${(r.cards || []).join(', ')}`).join('\n');
  const cards = DATA.cards.map(c => {
    const lines = c.code.split('\n');
    const code = lines.length > 60 ? lines.slice(0, 60).join('\n') + '\n…（截断）' : c.code;
    return `— ${c.name}（${c.file || ''}）:\n${code}`;
  }).join('\n\n');
  const notes = (DATA.notes || []).map(n => `${n.tag || 'NOTE'}: ${n.text}`).join('\n');
  const s = STEPS[step];
  return `故事线:\n${regions}\n\n卡片:\n${cards}\n\n注释:\n${notes}\n\n读者当前停在步骤「${s.title || ''}」：${s.caption || ''}`;
}

/* ---- reader profile + personalized rewrites ---- */
const PROFILE_KEY = 'canvas-reader-profile';
function getProfile() { try { return localStorage.getItem(PROFILE_KEY) || ''; } catch (e) { return ''; } }
function setProfile(v) {
  try { v ? localStorage.setItem(PROFILE_KEY, v) : localStorage.removeItem(PROFILE_KEY); } catch (e) {}
  document.body.classList.toggle('has-profile', !!v);
}
function djb2(s) { let h = 5381; for (const ch of s) h = (h * 33 + ch.codePointAt(0)) >>> 0; return h.toString(36); }
function rwContext(el) {
  const card = cardById[el.dataset.card];
  if (el.classList.contains('bxplain')) {
    const b = findBlock(card.blocks, el.dataset.bname);
    return { orig: b.explain, textEl: el.querySelector('.bx-text'), key: `bx-${card.id}-${b.name}`,
      ctx: `卡片: ${card.name}（${card.file || ''}）\n逻辑块: ${b.name} — ${b.summary || ''}\n块内代码:\n`
        + card.code.split('\n').slice(b.lines[0] - 1, b.lines[1]).join('\n') };
  }
  const tm = card.terms[+el.dataset.tid];
  return { orig: tm.note, textEl: el.querySelector('.tn-text'), key: el.id,
    ctx: `卡片: ${card.name}（${card.file || ''}）\n标识符: ${tm.token}（卡片内第 ${tm.line} 行）\n所在函数完整代码:\n${card.code}` };
}
function setTools(el, html) { el.querySelector('.bx-tools, .tn-tools').innerHTML = html; }
function toolsDefault(el) {
  return `<span class="bbtn" data-act="rewrite">${el.classList.contains('tnote') ? '重讲' : '按我的画像重讲'}</span>`;
}
const TOOLS_RW = `<span class="rw-badge">已按画像重讲</span>`
  + `<span class="bbtn" data-act="revert">还原原文</span><span class="bbtn" data-act="rewrite">重新生成</span>`;
async function rewriteEl(el, force = false) {
  const profile = getProfile();
  if (!profile) return;
  const { orig, textEl, key, ctx } = rwContext(el);
  const cacheKey = 'canvas-rw:' + djb2(profile) + ':' + key;
  if (!force) {
    let cached = null;
    try { cached = localStorage.getItem(cacheKey); } catch (e) {}
    if (cached) { textEl.textContent = cached; setTools(el, TOOLS_RW); drawWires(); return; }
  }
  const prompt = `把下面这段代码注释改写给特定读者。保持事实与代码依据不变，只调整讲法、详略、术语和语言风格；长度不超过原文两倍；只输出改写后的正文，不要任何前后缀。\n\n读者画像: ${profile}\n\n${ctx}\n\n原注释: ${orig}`;
  if (!QA.live) {
    try {
      await navigator.clipboard.writeText(prompt);
      setTools(el, `<span class="rw-badge">已复制改写提问 ✓ 粘给任意 agent</span>`);
    } catch (e) {
      setTools(el, `<span class="rw-badge">复制失败——用 serve.py 开启在线模式</span>`);
    }
    setTimeout(() => setTools(el, toolsDefault(el)), 3000);
    return;
  }
  const prevText = textEl.textContent;
  textEl.textContent = '为你重讲中…';
  try {
    const r = await fetch('ask', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt, kind: 'rewrite', target: key }),
    });
    const j = await r.json();
    if (j.ok) {
      textEl.textContent = j.answer;
      setTools(el, TOOLS_RW);
      try { localStorage.setItem(cacheKey, j.answer); } catch (e) {}
    } else {
      textEl.textContent = prevText;
      setTools(el, `<span class="rw-badge">出错：${esc((j.error || '').slice(0, 60))}</span>`);
      setTimeout(() => setTools(el, toolsDefault(el)), 4000);
    }
  } catch (e) {
    textEl.textContent = prevText;
  }
  drawWires();
}
function revertEl(el) {
  const { orig, textEl } = rwContext(el);
  textEl.textContent = orig;
  setTools(el, toolsDefault(el));
  drawWires();
}

function buildQAPrompt(question) {
  const profileLine = getProfile()
    ? `\n读者画像: ${getProfile()}（回答的深度、术语与语言风格按画像来）` : '';
  if (!QA.cur.card) {  // 画布级自由提问
    const hist = (QA.log[qaKey()] || []).filter(x => x.a && !x.err).slice(-3)
      .map(x => `Q: ${x.q}\nA: ${x.a}`).join('\n');
    return `你是一张交互式代码画布（Code Canvas）的讲解员。下面是整张画布的策展内容（真实代码摘选 + 注释）。只根据给出的内容回答；没有依据的不要编造；若问题超出画布覆盖范围，直说并指出该去读哪个文件。用中文回答，尽量不超过 250 字。${profileLine}\n\n主题: ${DATA.meta?.title || ''} — ${DATA.meta?.subtitle || ''}\n\n${canvasContext()}\n${hist ? '\n此前的问答:\n' + hist + '\n' : ''}\n读者的问题: ${question}`;
  }
  const card = cardById[QA.cur.card];
  const b = findBlock(card.blocks, QA.cur.block);
  const lines = card.code.split('\n');
  const blockCode = lines.slice(b.lines[0] - 1, b.lines[1])
    .map((t, i) => `${b.lines[0] + i}  ${t}`).join('\n');
  const hist = (QA.log[qaKey()] || []).filter(x => x.a && !x.err).slice(-3)
    .map(x => `Q: ${x.q}\nA: ${x.a}`).join('\n');
  const profile = getProfile();
  return `你是一张交互式代码画布（Code Canvas）的讲解员。只根据给出的代码与上下文回答；代码里没有依据的不要编造；不确定就直说不确定。用中文回答，尽量不超过 200 字。${profile ? `\n读者画像: ${profile}（回答的深度、术语与语言风格按画像来）` : ''}\n\n主题: ${DATA.meta?.title || ''} — ${DATA.meta?.subtitle || ''}\n卡片: ${card.name}（${card.file || ''}）\n逻辑块: ${b.name} — ${b.summary || ''}${b.explain ? '\n已有说明: ' + b.explain : ''}\n\n块内代码（卡片内行号 ${b.lines[0]}–${b.lines[1]}）:\n${blockCode}\n\n所在函数完整代码:\n${card.code}\n${hist ? '\n此前的问答:\n' + hist + '\n' : ''}\n读者的问题: ${question}`;
}
function renderQALog() {
  const el = document.getElementById('qa-log');
  el.innerHTML = '';
  if (!QA.live) {
    el.innerHTML = `<div class="qa-hint">未检测到本地问答服务：发送会把「问题 + 块代码 + 上下文」复制到剪贴板，粘贴给任意 agent 即可。<br>在线问答：<code>python3 serve.py 本画布.html</code> 后从 localhost 打开。</div>`;
  }
  const fmtTok = n => n == null ? '?' : (n >= 1e6 ? (n / 1e6).toFixed(1) + 'M'
    : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : '' + n);
  for (const x of QA.log[qaKey()] || []) {
    el.insertAdjacentHTML('beforeend', `<div class="qa-q">${esc(x.q)}</div>`);
    el.insertAdjacentHTML('beforeend',
      `<div class="qa-a${x.err ? ' err' : x.busy ? ' busy' : ''}">${esc(x.a || '…')}</div>`);
    if (x.meta) el.insertAdjacentHTML('beforeend',
      `<div class="qa-meta">${x.meta.dur_s}s · ↑${fmtTok(x.meta.in_tok)} ↓${fmtTok(x.meta.out_tok)}`
      + `${x.meta.cache_read ? ' ⟳' + fmtTok(x.meta.cache_read) : ''}`
      + `${x.meta.cost_usd ? ' · $' + x.meta.cost_usd + '*' : ''}</div>`);
  }
  el.scrollTop = el.scrollHeight;
}
/* 抽屉占右侧时，把被问的块平移进可见区（不改缩放）；
   小屏抽屉全屏盖住画布，平移没有意义，跳过 */
function ensureVisible(el) {
  if (innerWidth < 700) return;
  const p = wpos(el);
  const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
  const availW = innerWidth - 410;
  const sx = cx * cam.s + cam.x, sy = cy * cam.s + cam.y;
  if (sx > 60 && sx < availW - 60 && sy > 90 && sy < innerHeight - 140) return;
  cam.x = availW / 2 - cx * cam.s;
  cam.y = (innerHeight - 70) / 2 - cy * cam.s;
  apply(true);
}
function openQA(cardId, bname) {
  QA.cur = { card: cardId, block: bname };
  document.querySelectorAll('.blk.qa-target').forEach(b => b.classList.remove('qa-target'));

    if (bar) {

      ensureVisible(blk);
    } else nameEl.textContent = bname;
  } else {

    nameEl.textContent = '整张画布 · 自由提问';
  }

}
function closeQA() {
  document.getElementById('qa').classList.remove('open');

}
async function sendQA() {
  const input = document.getElementById('qa-input');
  const q = input.value.trim();
  if (!q || !QA.cur) return;
  input.value = '';
  const entry = { q, a: '', busy: true };
  (QA.log[qaKey()] ||= []).push(entry);
  const prompt = buildQAPrompt(q);
  if (!QA.live) {
    try {
      await navigator.clipboard.writeText(prompt);
      entry.a = '已复制完整上下文提问到剪贴板 ✓ 粘贴给你的 agent 即可。';
    } catch (e) {
      entry.a = '复制失败（浏览器限制）。启动 serve.py 使用在线问答。';
      entry.err = true;
    }
    entry.busy = false;
    renderQALog();
    return;
  }
  entry.a = '思考中…';
  renderQALog();
  document.getElementById('qa-send').disabled = true;
  try {
    const r = await fetch('ask', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt, card: QA.cur.card || '__canvas__', block: QA.cur.block || '-', question: q }),
    });
    const j = await r.json();
    if (j.ok) { entry.a = j.answer; if (j.metrics) entry.meta = j.metrics; }
    else { entry.a = '出错了：' + (j.error || '未知错误'); entry.err = true; }
  } catch (e) {
    entry.a = '请求失败：' + e.message; entry.err = true;
  }
  entry.busy = false;
  document.getElementById('qa-send').disabled = false;
  try { localStorage.setItem(QA_STORE, JSON.stringify(QA.log)); } catch (e) {}
  renderQALog();
}

/* 上下文开关：点一次全量载入滚动区（卡片尺寸不再变），再点收起。
   高度纪律：容器限高 ~0.65×核心（卡总高 ≈ 2.3× 核心），滚动看全文 */
function ctxExpand(cardEl, side) {
  const c = cardById[cardEl.id.replace(/^card-/, '')];
  const ctx = c._ctx;
  const box = cardEl.querySelector(`.ctxlines[data-side="${side}"]`);
  const bar = cardEl.querySelector(`.ctx-bar[data-side="${side}"]`);
  const total = side === 'top' ? ctx.start - 1 : ctx.flines.length - ctx.end;
  const open = box.childElementCount > 0;
  if (open) {                                     // 收起
    box.innerHTML = '';
    bar.querySelector('.more').textContent =
      (side === 'top' ? '▲ 上文 ' : '▼ 下文 ') + total + ' 行';
  } else {                                        // 全量展开进滚动区
    if (!ctx.coreH) {
      const body = cardEl.querySelector('.body');
      let h = 0;
      for (const ch of body.children)
        if (!ch.classList.contains('ctxlines') && !ch.classList.contains('ctx-bar'))
          h += ch.offsetHeight;
      ctx.coreH = Math.max(h, 120);
    }
    box.style.maxHeight = Math.round(ctx.coreH * 0.65) + 'px';
    const lines = side === 'top'
      ? ctx.flines.slice(0, ctx.start - 1)
      : ctx.flines.slice(ctx.end);
    box.innerHTML = lines.map(t =>
      `<div class="ln ctxln"><span class="no">·</span>${highlight(t, c.lang)}</div>`).join('');
    // 贴住摘选：上文停底部（最近的先见）、下文停顶部
    box.scrollTop = side === 'top' ? box.scrollHeight : 0;
    bar.querySelector('.more').textContent =
      (side === 'top' ? '▲ 收起（上文 ' : '▼ 收起（下文 ') + total + ' 行·滚动查看）';
  }
  drawWires();
}

/* ================= interactions ================= */
world.addEventListener('click', e => {
  const cbar = e.target.closest('.ctx-bar');
  if (cbar) {
    ctxExpand(cbar.closest('.card'), cbar.dataset.side);
    return;
  }
  const term = e.target.closest('.term');
  if (term) {
    const note = document.getElementById(term.dataset.tn);
    term.classList.toggle('on');
    note.classList.toggle('open');
    drawWires(); return;
  }
  const btn = e.target.closest('.bbtn');
  if (btn) {
    const act = btn.dataset.act;
    if (act === 'rewrite') { rewriteEl(btn.closest('.bxplain, .tnote'), btn.textContent === '重新生成'); return; }
    if (act === 'revert') { revertEl(btn.closest('.bxplain, .tnote')); return; }
    const bar = btn.closest('.bbar');
    if (act === 'explain') {
      bar.parentElement.classList.toggle('explained');
      drawWires();
    } else {
      openQA(bar.dataset.card, bar.dataset.bname);
    }
    return;
  }
  const bar = e.target.closest('.bbar');
  if (bar) {
    const blk = bar.parentElement;
    blk.classList.toggle('folded');
    bar.querySelector('.bchev').textContent = blk.classList.contains('folded') ? '▸' : '▾';
    drawWires(); return;
  }
  const hdr = e.target.closest('.hdr');
  if (hdr) {
    const card = hdr.closest('.card');
    card.classList.toggle('collapsed');
    hdr.querySelector('.chev').textContent = card.classList.contains('collapsed') ? '▸' : '▾';
    drawWires();
  }
});
/* Pan starts only after real movement (>4px). Capturing on pointerdown would
   retarget the click event to the viewport and swallow clicks on terms, bars,
   headers etc. — so a still pointer is a click, a moved pointer is a drag.
   Two pointers = pinch zoom (touch); capture immediately, no click semantics. */
let drag = null, pinch = null;
const pts = new Map();
function pinchState() {
  const [a, b] = [...pts.values()];
  return { d: Math.hypot(a.x - b.x, a.y - b.y), cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 };
}
vp.addEventListener('pointerdown', e => {
  // 可滚动的上下文区里让位给原生滚动（触屏拖动不当作画布平移）
  const sc = e.target.closest('.ctxlines');
  if (sc && sc.scrollHeight > sc.clientHeight) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 2) {
    drag = null;
    pinch = { ...pinchState(), s0: cam.s, x0: cam.x, y0: cam.y };
    world.classList.add('notrans');
    for (const id of pts.keys()) { try { vp.setPointerCapture(id); } catch (err) {} }
  } else if (pts.size === 1) {
    drag = { sx: e.clientX, sy: e.clientY, ox: cam.x, oy: cam.y, moved: false, id: e.pointerId };
  }
});
vp.addEventListener('pointermove', e => {
  if (pts.has(e.pointerId)) pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pts.size === 2) {
    const p = pinchState();
    const ns = Math.min(1.8, Math.max(.1, pinch.s0 * (p.d / (pinch.d || 1))));
    cam.x = p.cx - (pinch.cx - pinch.x0) * (ns / pinch.s0);
    cam.y = p.cy - (pinch.cy - pinch.y0) * (ns / pinch.s0);
    cam.s = ns;
    apply(false);
    return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!drag.moved) {
    if (Math.abs(dx) + Math.abs(dy) <= 4) return;
    drag.moved = true;
    vp.classList.add('dragging');
    vp.setPointerCapture(drag.id);
  }
  cam.x = drag.ox + dx;
  cam.y = drag.oy + dy;
  apply(false);
});
function endPointer(e) {
  pts.delete(e.pointerId);
  if (pts.size < 2) pinch = null;
  if (pts.size === 0) { drag = null; vp.classList.remove('dragging'); }
}
vp.addEventListener('pointerup', endPointer);
vp.addEventListener('pointercancel', endPointer);
vp.addEventListener('wheel', e => {
  // 悬停在可滚动的上下文区：滚轮归它，不缩放画布
  const sc = e.target.closest('.ctxlines');
  if (sc && sc.scrollHeight > sc.clientHeight) return;
  e.preventDefault();
  const f = Math.exp(-e.deltaY * .0012);
  const ns = Math.min(1.8, Math.max(.1, cam.s * f));
  cam.x = e.clientX - (e.clientX - cam.x) * (ns / cam.s);
  cam.y = e.clientY - (e.clientY - cam.y) * (ns / cam.s);
  cam.s = ns;
  apply(false);
}, { passive: false });
addEventListener('resize', () => { drawWires(); if (STEPS[step].fit) fitAll(false); });

/* ================= init =================
   #s2 jumps to step 2; trailing debug letters: x = unfold everything,
   e = open all block explanations, t = open all term notes, q = open Q&A drawer */
const m = location.hash.match(/^#s(\d+)([a-z]*)$/);
const flags = m ? m[2] : '';
requestAnimationFrame(() => {
  layout();
  if (flags.includes('x')) document.querySelectorAll('.blk, .card').forEach(b => {
    b.classList.remove('folded'); b.classList.remove('collapsed');
    const v = b.querySelector('.bchev, .chev'); if (v) v.textContent = '▾';
  });
  if (flags.includes('e')) document.querySelectorAll('.blk').forEach(b => {
    if (b.querySelector(':scope > .bxplain')) b.classList.add('explained');
  });
  if (flags.includes('t')) document.querySelectorAll('.tnote').forEach(n => n.classList.add('open'));
  setStep(m ? +m[1] : 0, false);
  if (flags.includes('q')) {
    const bar = document.querySelector('.bbar');
    if (bar) openQA(bar.dataset.card, bar.dataset.bname);
    else openQA(null, null);  // 无块画布退到画布级问答
  }
});
</script>
</body>
</html>
