<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Code Canvas · Zoom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one header bar (title · breadcrumb · level switch · tools); the canvas fills the rest; a docked inspector on the right
   (bottom sheet on phones); a story player docked at the bottom of the canvas. Levels: system diagram → module anatomy →
   function card (block summaries) → code reader (a screen-space sheet). Every level is framed to fill the free canvas area. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface2:#f6f8fb; --ink:#17202b; --muted:#5d6878; --faint:#9aa4b2; --line:#d9dee6; --cardline:#cdd5e0; --hl:#e8eefa;
  --blue:#2f6fe0; --pink:#d63b6c; --amber:#d9850f; --mint:#14946f; --violet:#7a4fe0; --teal:#0e8fa3; --red:#d14545; --grey:#8a96a6;
  --kw:#7a3fc9; --str:#2e7d32; --com:#8a94a0; --num:#c25e00; --ty:#1565c0;
  --shadow:0 1px 2px rgba(23,32,43,.06),0 8px 24px rgba(23,32,43,.08);
  --sans:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --hh:56px; --pw:360px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1218; --surface:#151b24; --surface2:#1a222d; --ink:#e6ebf2; --muted:#93a0b2; --faint:#647083; --line:#2a3341; --cardline:#313c4d; --hl:#1b2536;
  --blue:#5fa8ff; --pink:#ff7096; --amber:#ffb648; --mint:#4fd1a5; --violet:#b69cff; --teal:#4fc9db; --red:#ff7a7a; --grey:#7f8ca0;
  --kw:#c99bff; --str:#9fd8a3; --com:#6f7c8f; --num:#ffb27a; --ty:#7fc8ff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1218; --surface:#151b24; --surface2:#1a222d; --ink:#e6ebf2; --muted:#93a0b2; --faint:#647083; --line:#2a3341; --cardline:#313c4d; --hl:#1b2536;
  --blue:#5fa8ff; --pink:#ff7096; --amber:#ffb648; --mint:#4fd1a5; --violet:#b69cff; --teal:#4fc9db; --red:#ff7a7a; --grey:#7f8ca0;
  --kw:#c99bff; --str:#9fd8a3; --com:#6f7c8f; --num:#ffb27a; --ty:#7fc8ff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#app{position:fixed;inset:0;overflow:hidden}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;
  background-image:radial-gradient(color-mix(in srgb,var(--line) 80%,transparent) 1px,transparent 1px);background-size:22px 22px}
#svg.drag{cursor:grabbing}
#svg text{font-family:var(--sans);pointer-events:none}
#svg .mono{font-family:var(--mono)}

/* ---------- header ---------- */
.hdr{position:absolute;top:0;left:0;right:0;z-index:5;height:var(--hh);padding:env(safe-area-inset-top,0px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--surface) 94%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ttl{font-weight:600;font-size:15px;white-space:nowrap;flex:none;max-width:30vw;overflow:hidden;text-overflow:ellipsis}
.crumb{display:flex;align-items:center;gap:2px;min-width:0;flex:1;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.crumb::-webkit-scrollbar{display:none}
.crumb button{border:0;background:none;color:var(--muted);font-size:13.5px;padding:4px 7px;border-radius:6px;cursor:pointer;white-space:nowrap}
.crumb button:hover{background:var(--surface2);color:var(--ink)}
.crumb button.cur{color:var(--ink);font-weight:600}
.crumb .sep{color:var(--faint);font-size:12px}
.lvseg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex:none}
.lvseg button{border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:500;padding:4px 11px;border-radius:7px;cursor:pointer}
.lvseg button:hover{color:var(--ink)}
.lvseg button[aria-current="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tools{display:flex;gap:6px;flex:none}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:32px;min-width:32px;padding:0 10px;cursor:pointer;color:var(--ink);font-size:13px;display:inline-flex;align-items:center;gap:6px}
.ib:hover{border-color:var(--blue)}
.ib[aria-pressed="true"]{background:var(--hl);border-color:color-mix(in srgb,var(--blue) 50%,var(--line))}
.ib svg{width:16px;height:16px;flex:none}

/* ---------- inspector ---------- */
.panel{position:absolute;z-index:4;top:var(--hh);right:0;bottom:0;width:var(--pw);background:var(--surface);border-left:1px solid var(--line);overflow:auto;
  padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));font-size:13.5px;line-height:1.6}
.panel .grab,.panel .pclose{display:none}
.eb{font-size:11.5px;letter-spacing:.06em;color:var(--muted);font-weight:600;text-transform:uppercase}
.panel h2{font-size:19px;line-height:1.35;margin:4px 0 8px;text-wrap:balance}
.panel h2.mono{font-family:var(--mono);font-size:16px;overflow-wrap:anywhere}
.panel h4{font-size:12px;color:var(--muted);font-weight:600;margin:18px 0 6px;letter-spacing:.04em}
.panel p{margin:0 0 8px}
.not{border-left:3px solid var(--pink);padding:2px 0 2px 10px;color:var(--muted);margin:10px 0}
.not b{color:var(--ink);font-weight:600}
.lst{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.lst button{flex-wrap:wrap;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.lst button:hover{border-color:var(--blue);background:var(--hl)}
.lst button.on{border-color:var(--blue);background:var(--hl)}
.lst .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.lst .nm.mono{font-family:var(--mono);font-size:12.5px;font-weight:500}
.lst .ty{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap}
.lst .bs{font-size:13px;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;flex:none;align-self:center}
.kv{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:6px 12px;margin:0;background:var(--surface2);border-radius:8px;padding:10px 12px}
.kv dt{font-family:var(--mono);font-size:12px;overflow-wrap:anywhere}
.kv dt small{display:block;color:var(--faint);font-size:10.5px}
.kv dd{margin:0;font-size:13px}
.pits{margin:0;padding-left:18px}
.pits li{margin:0 0 4px}
.legend{display:grid;grid-template-columns:30px 1fr;gap:6px 10px;align-items:center;font-size:13px}
.legend svg{width:30px;height:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.chip .dot{width:7px;height:7px}
.flink{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}

/* ---------- story player ---------- */
.story{position:absolute;z-index:3;left:max(12px,env(safe-area-inset-left,0px));right:calc(var(--pwv,0px) + 12px);bottom:calc(12px + env(safe-area-inset-bottom,0px));
  max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.srow{display:flex;align-items:center;gap:10px;padding:8px 10px}
.pbtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--blue);color:#fff;cursor:pointer;flex:none;display:grid;place-items:center}
.pbtn svg{width:16px;height:16px}
.smain{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.stitle{display:flex;gap:8px;align-items:baseline;min-width:0;font-size:13px}
.stitle b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.stitle span{color:var(--muted);font-family:var(--mono);font-size:12px;white-space:nowrap;margin-left:auto}
.sprog{display:flex;gap:2px;height:6px;cursor:pointer}
.sprog i{flex:1;border-radius:2px;background:var(--line)}
.sprog i.seen{background:color-mix(in srgb,var(--blue) 35%,var(--line))}
.sprog i.cur{background:var(--blue)}
.sbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;flex:none;display:grid;place-items:center}
.sbtn:hover{border-color:var(--blue)}
.sbtn svg{width:14px;height:14px}
.sbody{border-top:1px solid var(--line);padding:9px 14px 11px;display:flex;flex-direction:column;gap:6px}
.story:not(.open) .sbody{display:none}
.stxt{margin:0;font-size:14.5px;line-height:1.6;max-height:4.8em;overflow:auto}
.smeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.val{font-family:var(--mono);font-size:12.5px;color:var(--amber);font-weight:600;background:color-mix(in srgb,var(--amber) 12%,transparent);border-radius:6px;padding:1px 8px}
.val:empty{display:none}
.sref{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.ssel{display:flex;gap:4px;flex-wrap:wrap}
.ssel button{border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:12px;padding:2px 8px;cursor:pointer;color:var(--muted)}
.ssel button[aria-pressed="true"]{border-color:var(--blue);color:var(--ink);font-weight:600}

/* ---------- zoom buttons, toast ---------- */
.zctl{position:absolute;z-index:3;right:calc(var(--pwv,0px) + 14px);display:flex;flex-direction:column;gap:6px}
.zctl .ib{width:36px;height:36px;padding:0;justify-content:center;box-shadow:var(--shadow)}
.toast{position:absolute;z-index:6;top:calc(var(--hh) + 14px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:999px;
  box-shadow:var(--shadow);transition:opacity .4s;white-space:nowrap;pointer-events:none}
.toast.hide{opacity:0}

/* ---------- code reader ---------- */
.scrim{position:absolute;z-index:2;inset:0;background:color-mix(in srgb,var(--bg) 82%,transparent);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.reader{position:absolute;z-index:3;display:none;flex-direction:column;background:var(--surface);border:1px solid var(--cardline);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;transform-origin:0 0}
.reader.on{display:flex}
.rh{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line);flex:none}
.rh .rt{font-family:var(--mono);font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rh .rf{font-family:var(--mono);font-size:11.5px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:auto}
.rbody{overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;flex:1;padding:0 0 45vh;font-family:var(--mono);font-size:13px;line-height:1.6}
.rb{position:sticky;top:0;left:0;z-index:1;font-family:var(--sans);font-size:13px;font-weight:500;background:var(--surface2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:6px 16px;display:flex;gap:8px;align-items:baseline}
.rb:first-child{border-top:0}
.rb::before{content:"";width:3px;align-self:stretch;border-radius:2px;background:var(--blue);flex:none}
.rb small{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap}
.cl{display:grid;grid-template-columns:3.6em max-content;column-gap:1em;padding-right:16px;min-width:max-content}
.cl .n{color:var(--faint);text-align:right;user-select:none}
.cl .x{white-space:pre}
.cl.gap .x{color:var(--com)}
.cl.cur{background:color-mix(in srgb,var(--amber) 16%,transparent);box-shadow:inset 3px 0 0 var(--amber)}
.vnote{display:block;font-family:var(--sans);font-size:12px;color:var(--amber);font-weight:600;margin:1px 0 3px}
.tk{color:var(--kw)} .ts{color:var(--str)} .tc{color:var(--com);font-style:italic} .tn{color:var(--num)} .ty{color:var(--ty)} .tp{color:var(--ink)}
.lnk{text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:2px;cursor:pointer}
.lnk:hover{color:var(--blue);text-decoration-color:var(--blue)}

/* ---------- svg: system level ---------- */
.grp{fill:none;stroke:var(--cardline);stroke-width:1.2;stroke-dasharray:5 5;vector-effect:non-scaling-stroke}
.grpbg{fill:var(--ink);fill-opacity:.018;cursor:zoom-in}
.grpt{fill:var(--muted);font-weight:600;letter-spacing:.04em}
.mf{fill:var(--surface);stroke:var(--cardline);stroke-width:1.2;vector-effect:non-scaling-stroke;cursor:zoom-in;transition:stroke .15s}
.mf:hover,.mf.hov{stroke:var(--blue);stroke-width:2}
.mf.ext{fill:var(--surface2);stroke-dasharray:6 5;cursor:default}
.mf.ext:hover{stroke:var(--cardline);stroke-width:1.2}
.mf.foc{stroke:var(--blue);stroke-opacity:.55}
.mt{fill:var(--ink);font-weight:600}
.mk{font-weight:600;letter-spacing:.06em}
.ms{fill:var(--muted)}
.ch{fill:none;stroke-width:1.8;vector-effect:non-scaling-stroke;opacity:.75}
.ch.return{stroke-dasharray:6 5}
.ch.async{stroke-dasharray:2 5;stroke-linecap:round}
.ch.route{opacity:1;stroke-width:3}
.chl{font-weight:500;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.pdot{pointer-events:none}
/* ---------- svg: anatomy ---------- */
.ab{fill:var(--surface2);stroke:var(--cardline);stroke-width:1.2;vector-effect:non-scaling-stroke}
.ab.hit{cursor:zoom-in}
.ab.hit:hover{stroke:var(--blue);stroke-width:2}
.ab.ctr{fill:var(--surface)}
.ae{fill:none;stroke:var(--faint);stroke-width:1.3;vector-effect:non-scaling-stroke}
.ae.dash{stroke-dasharray:4 4}
.al{fill:var(--ink);font-weight:600}
.as{fill:var(--muted)}
.af{fill:var(--faint)}
.anum{fill:var(--blue);font-weight:600;font-family:var(--mono)}
.ael{fill:var(--muted);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.slot{fill:none;stroke:var(--faint);stroke-width:1;vector-effect:non-scaling-stroke}
.slot.on{fill:var(--blue);fill-opacity:.18;stroke:color-mix(in srgb,var(--blue) 60%,var(--faint))}
.ring{fill:none;stroke:var(--line);stroke-width:1.4;vector-effect:non-scaling-stroke}
/* ---------- svg: function card ---------- */
.cf{fill:var(--surface);stroke:var(--cardline);stroke-width:1.3;vector-effect:non-scaling-stroke;cursor:zoom-in}
.cf.on{stroke:var(--amber);stroke-width:2.2}
.ctl{fill:var(--ink);font-weight:600;font-family:var(--mono)}
.cfile{fill:var(--muted);font-family:var(--mono)}
.crow{fill:var(--surface2);stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke;cursor:pointer}
.crow:hover{stroke:var(--blue);fill:var(--hl)}
.crow.on{stroke:var(--amber);stroke-width:2;fill:color-mix(in srgb,var(--amber) 12%,var(--surface2))}
.crow.gap{fill:none;stroke:none}
.cbt{fill:var(--ink)}
.cbr{fill:var(--faint);font-family:var(--mono)}
.mini{fill:var(--faint);opacity:.55}
.pulse{fill:none;stroke:var(--amber);stroke-width:3;vector-effect:non-scaling-stroke;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{stroke-opacity:.25}}
.tring{fill:none;stroke:var(--amber);stroke-width:2}
.badge circle{fill:var(--blue)}
.badge text{fill:#fff;font-weight:600;font-family:var(--mono);font-size:11px}
@media (prefers-reduced-motion: reduce){.pulse{animation:none}.toast,.scrim{transition:none}}

/* ---------- phone ---------- */
@media (max-width:820px){
  :root{--hh:92px}
  .hdr{flex-wrap:wrap;align-content:center;gap:4px 8px;padding-bottom:4px}
  .ttl{max-width:none;flex:1;font-size:14.5px}
  .crumb{order:3;flex-basis:100%}
  .lvseg{display:none}
  .tools .wide{display:none}
  .panel{top:auto;left:0;width:auto;height:72%;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:var(--shadow);z-index:7;
    transform:translateY(105%);transition:transform .28s ease}
  .panel.open{transform:none}
  .panel .grab{display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 10px}
  .panel .pclose{display:inline-flex;position:sticky;top:0;float:right;margin:-4px -4px 0 8px}
  .story{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .stxt{font-size:14px;max-height:4.8em}
  .zctl{display:none}
  .cl .x{white-space:pre-wrap;overflow-wrap:break-word}
  .cl{grid-template-columns:2.8em minmax(0,1fr);min-width:0;column-gap:.6em}
  .rbody{font-size:12.5px}
  .toast{white-space:normal;text-align:center;max-width:90vw;font-size:12.5px}
  .hideP{display:none}
}
</style>
</head>
<body>
<div id="app">
  <svg id="svg" role="img" aria-label="可以从系统全局一路放大到源码的代码结构图"></svg>
  <header class="hdr">
    <span class="ttl" id="ttl"></span>
    <nav class="crumb" id="crumb" aria-label="当前位置"></nav>
    <div class="lvseg" id="lvseg" role="group" aria-label="层级">
      <button data-lv="0">系统</button><button data-lv="1">模块</button><button data-lv="2">函数</button><button data-lv="3">代码</button>
    </div>
    <div class="tools">
      <button class="ib wide" id="anim" aria-pressed="true" title="连线上的流动动画"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 8h9"/><circle cx="13" cy="8" r="1.6" fill="currentColor"/><circle cx="6" cy="8" r="1.2" fill="currentColor" stroke="none"/></svg>动画</button>
      <button class="ib" id="theme" aria-label="切换明暗"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg></button>
      <button class="ib" id="panelT" aria-pressed="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2.5" width="12" height="11" rx="2"/><path d="M10 2.5v11"/></svg><span>说明</span></button>
    </div>
  </header>
  <div class="scrim" id="scrim"></div>
  <section class="reader" id="reader" aria-label="源码">
    <div class="rh"><span class="rt" id="rt"></span><span class="rf" id="rf"></span><button class="ib" id="rclose" aria-label="回到函数卡"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
    <div class="rbody" id="rbody"></div>
  </section>
  <aside class="panel" id="panel" aria-label="说明"><div class="grab"></div><button class="ib pclose" id="pclose" aria-label="关闭说明"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4l8 8M12 4l-8 8"/></svg></button><div id="pbody"></div></aside>
  <div class="zctl" id="zctl">
    <button class="ib" id="zin" aria-label="放大一层"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3v10M3 8h10"/></svg></button>
    <button class="ib" id="zout" aria-label="退回上一层"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 8h10"/></svg></button>
    <button class="ib" id="zfit" aria-label="看全图"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button>
  </div>
  <div class="story" id="story">
    <div class="srow">
      <button class="pbtn" id="play" aria-label="播放故事线"></button>

function click(tg){const el=tg.closest&&tg.closest('[data-fly],[data-card],[data-ln]');
  if(!el)return zoomOut();
  if(el.classList.contains('crow')&&el.dataset.card){return openCard(CARD[el.dataset.card],el.dataset.ln?+el.dataset.ln:null)}
  if(el.dataset.card&&CARD[el.dataset.card]&&!el.classList.contains('cf')){return flyTo(cardFit(CARD[el.dataset.card]))}
  if(el.classList.contains('cf')){const c=CARD[el.dataset.card];if(c&&c.t>.9)return openCard(c,null);return flyTo(cardFit(c))}
  const [x,y,w,h]=el.dataset.fly.split(',').map(Number);flyTo(fitBox({x,y,w,h},el.classList.contains('mf')?1.03:1.08))}
function zoomOut(){if(reader.c)return closeReader();if(curCard&&(MODCARDS[curCard.M.id]||[]).length>1)return flyTo(modFit(curCard.M));if(curMod)return flyTo(fitAll());}
let hovM=null;function hover(e){const t=e.target.closest&&e.target.closest('.mf');const M=t&&MOD[t.dataset.mod];if(M===hovM)return;hovM=M;
  CH.forEach(c=>c.p.style.opacity=M?(c.from===M.id||c.to===M.id?'1':'.25'):'')}
$('zin').onclick=()=>goLevel(Math.min(3,level()+1));$('zout').onclick=()=>zoomOut();$('zfit').onclick=()=>{closeReader();flyTo(fitAll())};
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea'))return;
  if(e.key==='Escape')zoomOut();else if(e.key==='+'||e.key==='=')goLevel(Math.min(3,level()+1));else if(e.key==='-')zoomOut();
  else if(e.key==='ArrowRight'&&STEPS.length){stopPlay();goStep(si+1)}else if(e.key==='ArrowLeft'&&STEPS.length){stopPlay();goStep(si-1)}
  else if(e.key===' '&&STEPS.length&&!reader.c){e.preventDefault();$('play').click()}});

/* ====================== particles ====================== */
const DOTS=[];for(const c of CH){const n=c.kind==='async'||c.kind==='control'?1:c.kind==='error'?0:2;for(let i=0;i<n;i++)DOTS.push({c,ph:(c.ph+i/n)%1,el:E('circle',{r:3,fill:c.col,class:'pdot'},Ldot)})}
let lastT=0;function tickDots(now){const dt=Math.min(.05,(now-lastT)/1000);lastT=now;if(!partOn||RM||Ldot.style.display==='none')return;const k=cam.k;
  for(const d of DOTS){d.ph=(d.ph+dt*60/d.c.L)%1;const p=d.c.p.getPointAtLength(d.ph*d.c.L);d.el.setAttribute('cx',p.x);d.el.setAttribute('cy',p.y);d.el.setAttribute('r',3.2/k);d.el.style.opacity=Math.min(1,Math.sin(d.ph*Math.PI)*3).toFixed(2)}}

/* ====================== story ====================== */
const STORIES=(D.stories||(D.story?[D.story]:[])).filter(s=>s&&(s.steps||[]).length);
let STORY=null,STEPS=[],si=0,storyOn=false,playing=false,timer=null;
const tokG=E('g',{style:'display:none'},scr);E('circle',{r:15,class:'tring'},tokG);const tokR=E('rect',{x:-9,y:-9,width:18,height:18,rx:5,fill:'var(--amber)'},tokG);
const tokT=E('text',{x:0,y:3.5,'text-anchor':'middle','font-size':8.5,'font-weight':600,fill:'#fff',style:'font-family:var(--mono)'},tokG,'');
let tokW=null;const pulseEl=E('rect',{class:'pulse',style:'display:none'},Lfx);
function stepTarget(s){const a=s.at||{};
  if(a.card&&CARD[a.card]){const c=CARD[a.card];const seg=c.segs.find(q=>q.lines.some(l=>l[0]===a.line))||c.segs[0];const M=c.M;
    return {c,seg,x:c.wb.x+c.wb.w*.03,y:M.ty+(seg.y+seg.h/2)*M.s,box:wRect(M,{x:c.x0,y:seg.y,w:c.w,h:seg.h})}}
  if(a.item){const [m,i]=String(a.item).split('/');const M=MOD[m];const r=M&&M.anch&&M.anch[i];if(r){const b=wRect(M,r);return {M,x:b.x+b.w/2,y:b.y+b.h/2,box:b,item:true}}}
  if(a.module&&MOD[a.module]){const M=MOD[a.module];const b=M.box;return {M,x:b.x+b.w/2,y:b.y+b.h/2,box:b,mod:true}}
  return {x:bnd.x+bnd.w/2,y:bnd.y+bnd.h/2}}
function placeTok(){if(!tokW||!storyOn){tokG.style.display='none';return}tokG.style.display='';
  if(reader.c&&tokW.c===reader.c){const s=STEPS[si];const el=s&&s.at&&rowEl(s.at.line);const rb=$('reader').getBoundingClientRect();
    if(el){const r=el.getBoundingClientRect();tokG.setAttribute('transform',`translate(${rb.left-16},${clamp(r.top+r.height/2,rb.top+60,rb.bottom-14)})`);return}}
  if(reader.c){tokG.style.display='none';return}
  const [x,y]=w2s(tokW.x,tokW.y);tokG.setAttribute('transform',`translate(${x-(tokW.c?12:0)},${y})`)}
function showStep(){const s=STEPS[si];const p=stepTarget(s);
  $('stxt').textContent=s.text||'';$('sval').textContent=s.value||'';$('scount').textContent=`${si+1} / ${STEPS.length}`;
  $('sref').textContent=p.c?`${String(p.c.cd.file).split('/').pop()}:${s.at.line}${s.at.line2?'–'+s.at.line2:''}`:(p.M?p.M.title:'');
  $('sprog').querySelectorAll('i').forEach((e,i)=>{e.className=i===si?'cur':i<si?'seen':''});
  const kind=s.kind||'';tokR.setAttribute('fill',kind==='resp'||kind==='return'?'var(--mint)':kind==='error'?'var(--red)':'var(--amber)');tokR.setAttribute('rx',kind==='resp'||kind==='return'?9:5);
  for(const c of Object.values(CARD)){c.morph.classList.remove('on');c.segs.forEach(q=>q.r.classList.remove('on'))}
  if(p.c){p.c.morph.classList.add('on');if(p.seg&&p.seg.r)p.seg.r.classList.add('on')}
  if(p.box&&!p.c){const b=p.box,pd=Math.min(b.w,b.h)*.04;Object.assign(pulseEl.style,{display:''});pulseEl.setAttribute('x',b.x-pd);pulseEl.setAttribute('y',b.y-pd);pulseEl.setAttribute('width',b.w+2*pd);pulseEl.setAttribute('height',b.h+2*pd);pulseEl.setAttribute('rx',12)}
  else pulseEl.style.display='none';
  return p}
async function goStep(n){if(!STEPS.length)return;storyOn=true;$('story').classList.add('open');si=(n+STEPS.length)%STEPS.length;const s=STEPS[si];const p=showStep();
  const to={x:p.x,y:p.y,c:p.c||null};
  if(p.c){tokW=to;if(reader.c===p.c){openReader(p.c,s.at.line,true);return}await openCard(p.c,s.at.line);return}
  closeReader();let tgt;if(p.mod)tgt=p.M.ext?fitAll():modFit(p.M);else if(p.item)tgt=modFit(p.M);else tgt=fitAll();
  const from=tokW?{...tokW}:{x:p.x,y:p.y};tokW={...from,c:null};const t0=performance.now();
  const anim=()=>{const e=Math.min(1,(performance.now()-t0)/700);tokW={x:lerp(from.x,to.x,e),y:lerp(from.y,to.y,e),c:null};placeTok();if(e<1&&tokW)requestAnimationFrame(anim)};requestAnimationFrame(anim);
  await flyTo(tgt);tokW=to;apply()}
function sched(){clearTimeout(timer);if(!playing)return;const s=STEPS[si];timer=setTimeout(async()=>{if(si+1>=STEPS.length){stopPlay();return}await goStep(si+1);sched()},clamp((s.text||'').length*60,2600,9000))}
const ICON_PLAY='<svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>',ICON_PAUSE='<svg viewBox="0 0 16 16"><rect x="3.5" y="2.5" width="3" height="11" rx="1" fill="currentColor"/><rect x="9.5" y="2.5" width="3" height="11" rx="1" fill="currentColor"/></svg>';
function stopPlay(){playing=false;$('play').innerHTML=ICON_PLAY;$('play').setAttribute('aria-label','播放故事线');clearTimeout(timer)}
$('play').onclick=()=>{hideToast();if(playing){stopPlay();return}playing=true;$('play').innerHTML=ICON_PAUSE;$('play').setAttribute('aria-label','暂停');(storyOn?goStep(si+1>=STEPS.length?0:si+1):goStep(0)).then(sched)};
$('next').onclick=()=>{stopPlay();goStep(storyOn?si+1:0)};$('prev').onclick=()=>{stopPlay();goStep(si-1)};
$('sexp').onclick=()=>{const s=$('story');s.classList.toggle('open');$('sexp').style.transform=s.classList.contains('open')?'rotate(180deg)':'';resize();apply();if(reader.c)placeReader(false)};
$('sprog').addEventListener('click',e=>{const r=$('sprog').getBoundingClientRect();const i=Math.floor((e.clientX-r.left)/r.width*STEPS.length);stopPlay();goStep(clamp(i,0,STEPS.length-1))});
// route badges: the order in which the story visits modules, shown on the system view
const ROUTE=[];
function setStory(i){stopPlay();STORY=STORIES[i];STEPS=STORY.steps;si=0;storyOn=false;tokW=null;$('story').classList.remove('open');
  $('sname').textContent=STORY.title?`故事：${STORY.title}`:'跟着一个例子走一遍';$('scount').textContent=`${STEPS.length} 步`;$('stxt').textContent='';$('sval').textContent='';$('sref').textContent='';
  $('sprog').innerHTML=STEPS.map(()=>'<i></i>').join('');tokT.textContent=(STORY.token||'').slice(0,3);
  $('ssel').querySelectorAll('button').forEach((b,j)=>b.setAttribute('aria-pressed',String(j===i)));
  ROUTE.length=0;for(const s of STEPS){const p=stepTarget(s);const M=p.c?p.c.M:p.M;if(M&&ROUTE[ROUTE.length-1]!==M)ROUTE.push(M)}
  scr.querySelectorAll('.badge').forEach(b=>b.remove());const seen=new Map();ROUTE.forEach((M,i)=>{if(!seen.has(M))seen.set(M,[]);seen.get(M).push(i+1)});
  for(const [M,ns] of seen){const g=E('g',{class:'badge'},scr);const t=ns.slice(0,3).join('·')+(ns.length>3?'…':'');const w=Math.max(22,t.length*7+10);E('rect',{x:-w/2,y:-11,width:w,height:22,rx:11,fill:'var(--blue)'},g);E('text',{x:0,y:4,'text-anchor':'middle'},g,t);g._M=M}
  for(const c of CH)c.p.classList.toggle('route',ROUTE.some((M,i)=>i&&((ROUTE[i-1].id===c.from&&M.id===c.to))));showStep();pulseEl.style.display='none';
  for(const c of Object.values(CARD)){c.morph.classList.remove('on');c.segs.forEach(q=>q.r.classList.remove('on'))}$('sprog').querySelectorAll('i').forEach(e=>e.className='');apply()}
function placeBadges(){const show=STORIES.length&&cam.k<fitAllK()*1.6&&!reader.c;scr.querySelectorAll('.badge').forEach(g=>{if(!show){g.style.display='none';return}g.style.display='';const b=g._M.box;const [x,y]=w2s(b.x+b.w,b.y);g.setAttribute('transform',`translate(${x-6},${y+2})`)})}
if(STORIES.length>1)$('ssel').innerHTML=STORIES.map((s,i)=>`<button>${esc(s.title||'故事 '+(i+1))}</button>`).join('');
$('ssel').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setStory([...$('ssel').children].indexOf(b))});

/* ====================== boot ====================== */
let toastT=null;function hideToast(){$('toast').classList.add('hide');clearTimeout(toastT)}
function calcK(){for(const c of Object.values(CARD))c.kfit=cardFit(c).k}
addEventListener('resize',()=>{const wasFit=Math.abs(cam.k/fitAllK()-1)<.02;resize();calcK();buildL0();if(wasFit)cam=fitAll();apply();if(reader.c)placeReader(false)});
if(phone()){$('panel').classList.remove('open');$('panelT').setAttribute('aria-pressed','false')}
$('play').innerHTML=ICON_PLAY;
if(!STORIES.length)$('story').hidden=true;
resize();calcK();buildL0();
if(STORIES.length)setStory(0);
cam=fitAll();apply();
try{if(!localStorage.getItem('cc-zoom-hint')){$('toast').classList.remove('hide');toastT=setTimeout(hideToast,7000);localStorage.setItem('cc-zoom-hint','1')}}catch(e){$('toast').classList.remove('hide');toastT=setTimeout(hideToast,7000)}
(function loop(now){tickFly(now);tickDots(now);requestAnimationFrame(loop)})(performance.now());
window.__zoom={flyTo,fitBox,fitAll,CARD,MOD,cam:()=>cam,goStep,steps:()=>STEPS,openCard,closeReader,goLevel,level};
})();
