<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Code Canvas · Zoom</title>
<style>
/* One infinite canvas. Level 0 = system framework diagram (module boxes + channels with moving particles).
   Zooming into a box reveals its anatomy (loop / pipeline / dispatch / state machine / flow / layers / grid + data-structure glyphs);
   anatomy parts morph into function cards; card block bars dissolve into real source lines. */
:root{
  --bg:#0d1015; --panel:#141920; --panel2:#1a2029; --ink:#e6e9ee; --muted:#8d96a3; --faint:#5d6672; --line:#2a313b;
  --hot:#e6c25c; --c1:#e9a03b; --c2:#5ea8f0; --c3:#b29cf5; --c4:#3cc3b3; --c5:#f06c6c; --c6:#56c48a;
  --kw:#c792ea; --str:#a5d6a7; --com:#6b7686; --num:#f6a96b; --ty:#7fc8f8;
  --sans:"IBM Plex Sans","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f3f4f6; --panel:#ffffff; --panel2:#f0f2f5; --ink:#1a1e24; --muted:#5f6772; --faint:#9aa2ad; --line:#d6dbe2;
  --hot:#b8860b; --c1:#d07f12; --c2:#2f78d6; --c3:#7b62d6; --c4:#0d8d82; --c5:#d13f3f; --c6:#1f9a5c;
  --kw:#8a3fc9; --str:#2e7d32; --com:#8a94a0; --num:#c25e00; --ty:#1565c0; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f3f4f6; --panel:#ffffff; --panel2:#f0f2f5; --ink:#1a1e24; --muted:#5f6772; --faint:#9aa2ad; --line:#d6dbe2;
  --hot:#b8860b; --c1:#d07f12; --c2:#2f78d6; --c3:#7b62d6; --c4:#0d8d82; --c5:#d13f3f; --c6:#1f9a5c;
  --kw:#8a3fc9; --str:#2e7d32; --com:#8a94a0; --num:#c25e00; --ty:#1565c0; color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;overflow:hidden}
#app{position:relative;height:100%;overflow:hidden}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;
  background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:24px 24px}
#svg.drag{cursor:grabbing}
#svg text{font-family:var(--mono);pointer-events:none}
.ov{position:absolute;background:color-mix(in srgb,var(--panel) 93%,transparent);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:2}
.top{top:calc(10px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));padding:7px 10px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.top .ttl{font-weight:600;font-size:14.5px}
.top .sub{font-size:12.5px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--panel2);border-radius:8px;padding:2px}
.seg button{font:inherit;font-size:12.5px;border:0;background:transparent;color:var(--muted);padding:3px 9px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.btn{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:7px;padding:3px 10px;cursor:pointer;white-space:nowrap}
.btn[aria-pressed="true"]{border-color:var(--hot);color:var(--hot)}
button:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.crumb{top:calc(58px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));padding:4px 7px;display:flex;flex-wrap:wrap;gap:2px 3px;align-items:center;font-size:13px;max-width:calc(100% - 400px)}
.crumb button{font:inherit;font-size:13px;background:none;border:0;color:var(--muted);cursor:pointer;padding:2px 5px;border-radius:5px}
.crumb button:hover{color:var(--ink);background:var(--panel2)}
.crumb button.cur{color:var(--hot);font-weight:600}
.crumb .sep{color:var(--faint)}
.rail{left:max(10px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);padding:10px 8px;display:flex;flex-direction:column;gap:4px;width:78px}
.rail .tr{position:relative;height:200px;margin:4px 0 4px 10px;width:4px;background:var(--line);border-radius:2px}
.rail .mk{position:absolute;left:-6px;width:16px;height:4px;border-radius:2px;background:var(--hot)}
.rail .lv{position:absolute;left:12px;font-size:12px;color:var(--muted);background:none;border:0;cursor:pointer;padding:0;white-space:nowrap;transform:translateY(-50%)}
.rail .lv.on{color:var(--ink);font-weight:600}
.rail .zb{display:flex;gap:4px}
.info{top:calc(58px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));width:350px;overflow:auto;padding:12px 14px;font-size:13px;line-height:1.6}
.infoT{position:absolute;top:calc(58px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));z-index:3}
.info .kick{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.03em;margin-top:24px;overflow-wrap:anywhere}
.info .ih{font-size:18px;font-weight:600;margin:2px 0 6px}
.info p{margin:0 0 6px}
.info .mnot{color:var(--muted)}
.info .mnot b{color:var(--ink);font-weight:600}
.info h4{font-size:11.5px;letter-spacing:.08em;color:var(--muted);margin:14px 0 4px;font-weight:600}
.kv{width:100%;border-collapse:collapse}
.kv td{vertical-align:top;padding:5px 6px 5px 0;border-top:1px solid var(--line)}
.kv td:first-child{width:42%}
.kv code{font-family:var(--mono);font-size:11.5px;color:var(--ink);overflow-wrap:anywhere}
.kv .ty{font-family:var(--mono);font-size:10.5px;color:var(--faint);overflow-wrap:anywhere}
.dflt{font-family:var(--mono);font-size:11px;color:var(--hot)}
.pits{margin:0;padding-left:16px}
.fl{list-style:none;margin:0;padding:0}
.fl li{border-top:1px solid var(--line)}
.fl button{font:inherit;font-size:12.5px;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:5px 2px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.fl button:hover{background:var(--panel2)}
.fl button.on{color:var(--hot)}
.fl code{font-family:var(--mono);font-size:12px}
.fl .ty{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-left:auto;white-space:nowrap}
.legend{display:grid;grid-template-columns:28px 1fr;gap:4px 8px;align-items:center;font-size:12.5px}
.legend svg{width:28px;height:10px}
.story{left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(700px,calc(100% - 20px));padding:9px 12px;display:flex;flex-direction:column;gap:5px}
body.withInfo .story{left:calc(50% - 180px);width:min(700px,calc(100% - 400px))}
.story .row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.story .meta{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.story .txt{font-size:14px;line-height:1.55;height:4.65em;overflow:auto}
.story .val{font-family:var(--mono);font-size:12px;color:var(--hot)}
.story .sp{flex:1}
.story.min .txt,.story.min .val{display:none}
@media (max-width:900px){
  .rail{display:none}.crumb{max-width:calc(100% - 20px)}
  .info{left:10px;width:auto;top:auto;height:55%;z-index:4}
  .infoT{top:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));right:10px;z-index:5}
  .top .sub{display:none}
  .story{width:calc(100% - 20px);padding:7px 9px;bottom:calc(46px + env(safe-area-inset-bottom,0px))}
  .story .txt{font-size:13px}
  .hideM{display:none}
}

/* svg */
.grp{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5;vector-effect:non-scaling-stroke}
.grpt{fill:var(--muted);font-size:11px;letter-spacing:.04em}
.mbg{fill:var(--panel);stroke:var(--line);stroke-width:1.3;vector-effect:non-scaling-stroke;cursor:zoom-in}
.mbg.ext{fill:var(--panel2);stroke-dasharray:5 4}
.mbg.foc{stroke:var(--hot);stroke-opacity:.75}
.mttl{fill:var(--ink);font-weight:600}
.msub{fill:var(--muted)}
.ch{fill:none;stroke-width:1.5;vector-effect:non-scaling-stroke;opacity:.8}
.ch.return{stroke-dasharray:5 4}
.ch.async{stroke-dasharray:2 4}
.chl{font-size:10px;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.dot{pointer-events:none}
/* anatomy */
.ab{fill:var(--panel2);stroke:var(--line);stroke-width:1.2;vector-effect:non-scaling-stroke}
.ab.hit{cursor:zoom-in}
.ab.hit:hover{stroke:var(--hot)}
.ab.ctr{fill:var(--panel)}
.ae{fill:none;stroke:var(--muted);stroke-width:1.2;vector-effect:non-scaling-stroke}
.ae.dash{stroke-dasharray:4 4}
.al{fill:var(--ink);font-weight:600}
.as{fill:var(--muted)}
.af{fill:var(--faint)}
.ael{fill:var(--muted);paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round}
.slot{fill:none;stroke:var(--faint);stroke-width:1;vector-effect:non-scaling-stroke}
.slot.on{fill:var(--faint);fill-opacity:.35}
.ring{fill:none;stroke:var(--line);stroke-width:1.2;vector-effect:non-scaling-stroke}
/* cards */
.morph{fill:var(--panel);stroke:var(--line);stroke-width:1.4;vector-effect:non-scaling-stroke;cursor:zoom-in}
.morph.on{stroke:var(--hot);stroke-width:2.2}
.ctl{fill:var(--ink);font-weight:600}
.cfile{fill:var(--muted)}
.blk{fill:var(--panel2);stroke:var(--line);stroke-width:.8;vector-effect:non-scaling-stroke;cursor:zoom-in}
.blk.on{stroke:var(--hot);fill:color-mix(in srgb,var(--hot) 15%,var(--panel2))}
.blkt{fill:var(--ink);font-family:var(--sans)!important;paint-order:stroke;stroke:var(--panel2);stroke-width:.3em;stroke-linejoin:round}
.mlab{fill:var(--muted);font-family:var(--sans)!important}
.mini{fill:var(--muted);opacity:.32}
.lnno{fill:var(--faint)}
.code{white-space:pre}
.code.haslnk{pointer-events:auto}
.lnk{text-decoration:underline;text-decoration-color:var(--faint);cursor:pointer}
.lnk:hover{fill:var(--hot)}
.hl{fill:var(--hot);opacity:.2}
.note{fill:var(--hot);font-weight:600;font-family:var(--mono)}
.tring{fill:none;stroke:var(--hot);stroke-width:2}
.tk{fill:var(--kw)} .ts{fill:var(--str)} .tc{fill:var(--com)} .tn{fill:var(--num)} .ty{fill:var(--ty)} .tp{fill:var(--ink)}
/* code layer: when zooming past a card, its code reflows in screen space (wraps to the screen width, scrolls vertically) */
#codev{position:absolute;z-index:1;display:none;flex-direction:column;background:var(--panel);border:1.4px solid var(--hot);border-radius:12px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.18)}
#codev .cvh{display:flex;align-items:center;gap:8px;padding:8px 10px 7px 12px;border-bottom:1px solid var(--line);flex:none}
#codev .cvt{font-family:var(--mono);font-weight:600;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#codev .cvf{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#codev .cvx{flex:none}
#codev .cvs{overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:4px 0 40vh;font-family:var(--mono);font-size:13px;line-height:1.55}
#codev .cvb{position:sticky;top:0;z-index:1;font-family:var(--sans);font-size:12.5px;color:var(--ink);background:var(--panel2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 12px;margin-top:6px}
#codev .cvb::before{content:'▎';color:var(--hot)}
#codev .cl{display:grid;grid-template-columns:3.4em 1fr;column-gap:.8em;padding-right:10px}
#codev .cl .n{color:var(--faint);text-align:right;user-select:none}
#codev .cl .x{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
#codev .cl.cur{background:color-mix(in srgb,var(--hot) 20%,transparent)}
#codev .cl.gap .x{color:var(--com)}
#codev .tk{color:var(--kw)} #codev .ts{color:var(--str)} #codev .tc{color:var(--com)} #codev .tn{color:var(--num)} #codev .ty{color:var(--ty)} #codev .tp{color:var(--ink)}
#codev .lnk{text-decoration:underline;text-decoration-color:var(--faint);cursor:pointer}
#codev .lnk:hover{color:var(--hot)}
#codev .vnote{display:block;text-indent:0;margin:1px 0 2px;font-size:11.5px;color:var(--hot);font-weight:600;white-space:nowrap}

/* ---------- v3: one level per screen, shared-element zoom between levels ---------- */
#svg{display:none}
#stage{position:absolute;inset:0;overflow:hidden;touch-action:none;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:24px 24px}
.layer{position:absolute;inset:0;transform-origin:0 0;will-change:transform,opacity}
.layer>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.layer svg text{font-family:var(--mono);pointer-events:none}
.mbg{cursor:zoom-in}.mbg:hover{stroke:var(--hot)}
.mbg.ext{cursor:default}.mbg.ext:hover{stroke:var(--line)}
.frame{fill:var(--panel);stroke:var(--hot);stroke-opacity:.7;stroke-width:1.5}
.ab.hit{cursor:zoom-in}
.chipc{fill:var(--panel2);stroke:var(--line);stroke-width:1.2;cursor:zoom-in}
.chipc:hover{stroke:var(--hot)}
.pulse{fill:none;stroke:var(--hot);stroke-width:3;animation:pl 1.3s ease-in-out infinite}
@keyframes pl{50%{stroke-opacity:.25}}
.vtag{font-family:var(--mono);font-size:12px;font-weight:600;fill:var(--hot);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.rail{width:auto;padding:6px}
.rail .lvb{display:block;width:100%;font:inherit;font-size:12.5px;border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:7px;cursor:pointer;text-align:left}
.rail .lvb:hover{color:var(--ink);background:var(--panel2)}
.rail .lvb.on{color:var(--ink);font-weight:600;background:var(--panel2);box-shadow:inset 3px 0 0 var(--hot)}
.rail .lvb:disabled{opacity:.35;cursor:default}
/* function card (summary) and code */
.cardpg{position:absolute;display:flex;flex-direction:column;gap:12px;overflow:auto;overscroll-behavior:contain;touch-action:pan-y}
.cd{background:var(--panel);border:1.4px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;flex:1 1 0;overflow:hidden}
.cd.read{flex:none;overflow:visible}
.cdh{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;padding:10px 14px 8px;flex:none}
.cdh b{font-family:var(--mono);font-size:15px;min-width:0;flex:1 1 auto;overflow-wrap:anywhere}
.cdh span{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;direction:rtl}
.cdb{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px;padding:0 8px 10px}
.brow{position:relative;flex:1 1 0;min-height:26px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);cursor:zoom-in;overflow:hidden;display:flex;align-items:center}
.brow:hover{border-color:var(--hot)}
.brow.gap{background:none;border-color:transparent;cursor:default;min-height:6px;flex-grow:.4}
.brow.on{border-color:var(--hot);background:color-mix(in srgb,var(--hot) 15%,var(--panel2))}
.brow .mm{position:absolute;inset:4px 10px 4px 12px;display:flex;flex-direction:column;justify-content:space-evenly;pointer-events:none}
.brow .mm i{display:block;height:max(1.5px,18%);max-height:5px;border-radius:3px;background:var(--muted);opacity:.3}
.brow .bt{position:relative;font-family:var(--sans);font-size:clamp(13px,1.9vh,19px);padding:2px 14px;color:var(--ink);text-shadow:0 0 6px var(--panel2),0 0 6px var(--panel2),0 0 3px var(--panel2);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.brow .br{position:absolute;right:10px;bottom:3px;font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.codeb{font-family:var(--mono);font-size:var(--cfs,13px);line-height:1.55;padding:0 0 10px;overflow-x:auto}
.bh{position:sticky;top:0;z-index:1;font-family:var(--sans);font-size:13px;background:var(--panel2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 14px;display:flex;gap:8px;align-items:baseline}
.bh::before{content:"▎";color:var(--hot)}
.bh small{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--faint);white-space:nowrap}
.cl{display:grid;grid-template-columns:3.6em max-content;column-gap:1em;padding-right:14px;min-width:max-content}
.cl .n{color:var(--faint);text-align:right;user-select:none}
.cl .x{white-space:pre}
.cl.cur{background:color-mix(in srgb,var(--hot) 20%,transparent);box-shadow:inset 3px 0 0 var(--hot)}
.cl .vn{display:block;font-family:var(--sans);font-size:12px;font-weight:600;color:var(--hot)}
.cardpg .tk{color:var(--kw)} .cardpg .ts{color:var(--str)} .cardpg .tc{color:var(--com)} .cardpg .tn{color:var(--num)} .cardpg .ty{color:var(--ty)} .cardpg .tp{color:var(--ink)}
.cardpg .lnk{text-decoration:underline;text-decoration-color:var(--faint);cursor:pointer}
.hint{position:absolute;z-index:3;left:50%;transform:translateX(-50%);top:calc(66px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);font-size:12.5px;padding:6px 14px;border-radius:999px;pointer-events:none;transition:opacity .4s;white-space:nowrap}
.hint.hide{opacity:0}
@media (max-width:900px){.cl{grid-template-columns:2.8em minmax(0,1fr);min-width:0;column-gap:.6em}.cl .x{white-space:pre-wrap;overflow-wrap:break-word}.hint{white-space:normal;text-align:center;max-width:88vw;top:auto;bottom:46%}}
/* pseudo-code beside the source */
.duo{display:grid;grid-template-columns:minmax(0,1.04fr) minmax(0,1fr);border-top:1px solid var(--line)}
.ps{position:sticky;top:0;align-self:start;max-height:var(--pgh,70vh);overflow:auto;overscroll-behavior:contain;padding:10px 0 14px;border-right:1px solid var(--line);font-family:var(--mono);font-size:13px;line-height:1.7}
.pb{color:var(--com);padding:0 12px 0 calc(12px + 2.6em);margin-top:.85em;font-family:var(--sans);font-size:12.5px}.pb:first-child{margin-top:0}
.pr{position:relative;display:grid;grid-template-columns:2em minmax(0,1fr);column-gap:.6em;padding:0 12px 0 9px;cursor:pointer;border-left:3px solid transparent}
.pr:hover{background:var(--panel2)}
.pr.act{background:color-mix(in srgb,var(--hot) 16%,transparent);border-left-color:var(--hot)}
.pk{color:var(--faint);text-align:right;user-select:none;font-size:11.5px}
.pt{min-width:0;overflow-wrap:break-word;white-space:pre-wrap;color:var(--ink);padding-left:calc(var(--d,0)*3ch + 3ch);text-indent:-3ch;
  background-image:repeating-linear-gradient(to right,var(--line) 0 1px,transparent 1px 3ch);background-repeat:no-repeat;background-size:calc(var(--d,0)*3ch) 100%}
.pkw{color:var(--kw);font-weight:600}
.pcmt{color:var(--com);font-family:var(--sans);font-size:12px}
.pcmt.note{display:block;text-indent:0}
.pt .pc{font-style:normal;font-family:var(--sans);font-size:11.5px;color:var(--hot);border:1px solid color-mix(in srgb,var(--hot) 45%,transparent);border-radius:999px;padding:0 7px;margin-left:8px;white-space:nowrap;text-decoration:none;text-indent:0;display:inline-block;line-height:1.5}
.pl{position:absolute;right:6px;top:0;font-size:10.5px;color:var(--muted);white-space:nowrap;opacity:0;background:var(--panel);border-radius:4px;padding:0 5px}
.pr:hover .pl,.pr.act .pl{opacity:1}
.pom{margin:14px 12px 0 calc(12px + 2.6em);font-family:var(--sans);font-size:12px;color:var(--muted)}
.pom summary{cursor:pointer}.pom div{margin-top:3px;color:var(--faint)}
.cl.sel{background:color-mix(in srgb,var(--hot) 11%,transparent)}
.cl.omd .x{opacity:.45}
.duo .cl{grid-template-columns:3.2em minmax(0,1fr);min-width:0;column-gap:.7em}.duo .cl .x{white-space:pre-wrap;overflow-wrap:anywhere}
.duo .bh{display:none}

   ${(I.fields||[]).length?`<h4>关键状态</h4><table class="kv"><tbody>${I.fields.map(f=>`<tr><td><code>${esc(f[0])}</code><div class="ty">${esc(f[1]||'')}</div></td><td>${esc(f[2]||'')}</td></tr>`).join('')}</tbody></table>`:''}
   ${(I.methods||[]).length?`<h4>关键方法</h4><table class="kv"><tbody>${I.methods.map(m=>`<tr><td><code>${esc(m[0])}</code><div class="ty">${esc(m[1]||'')}</div></td><td>${esc(m[2]||'')}</td></tr>`).join('')}</tbody></table>`:''}
   ${(I.config||[]).length?`<h4>相关配置</h4><table class="kv"><tbody>${I.config.map(c=>`<tr><td><code>${esc(c[0])}</code></td><td>${c[1]!=null&&c[1]!==''?`<span class="dflt">默认 ${esc(c[1])}</span> `:''}${esc(c[2]||'')}</td></tr>`).join('')}</tbody></table>`:''}
   ${(I.pitfalls||[]).length?`<h4>读代码时要注意</h4><ul class="pits">${I.pitfalls.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}`;
  box.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const C=CARDS[b.dataset.c];goto({type:'card',ids:[C.id],mod:C.mod})})}
$('infoT').onclick=()=>{const i=$('info');i.hidden=!i.hidden;$('infoT').setAttribute('aria-pressed',String(!i.hidden));relayout()};
$('theme').onclick=()=>{const r=document.documentElement;const dark=getComputedStyle(r).colorScheme.includes('dark');r.dataset.theme=dark?'light':'dark'};
let partV=true;$('anim').onclick=()=>{partV=!partV;$('anim').setAttribute('aria-pressed',String(partV))};

/* ====================== story ====================== */
const STORIES=(D.stories||(D.story?[D.story]:[])).filter(s=>s&&(s.steps||[]).length);if(D.scene){STORIES.length=0;STORIES.push({title:D.scene.title,steps:D.scene.steps})}
let STORY=null,STEPS=[],si=0,storyOn=false,playing=false,timer=null;
function stepPage(s){const a=s.at||{};if(a.card&&CARDS[a.card]){const C=CARDS[a.card];const host=(MODCARDS[C.mod]||[]);return {type:'code',ids:[C.id],mod:C.mod,card:C.id,line:a.line}}
  if(a.item){const [m]=String(a.item).split('/');if(MOD[m]&&!MOD[m].ext)return {type:'mod',id:m}}return {type:'sys'}}
function markStory(){if(!storyOn||!cur.mark)return;const s=STEPS[si];const a=s.at||{};
  if(cur.type==='sys'){const m=a.module||(a.item&&String(a.item).split('/')[0])||(a.card&&CARDS[a.card]&&CARDS[a.card].mod);cur.mark(m,s.value)}
  else if(cur.type==='mod'){if(a.item)cur.mark(String(a.item).split('/')[1],s.value)}
  else if(a.card)cur.mark(a.card,s.value,a.line,a.line2)}
function showStep(){const s=STEPS[si];$('smeta').textContent=`${STORY.title?STORY.title+' · ':''}${si+1} / ${STEPS.length}`;$('stxt').textContent=s.text||'';$('sval').textContent=s.value||'';
  const a=s.at||{};$('sref').textContent=a.card&&CARDS[a.card]?`${String(CARDS[a.card].cd.file).split('/').pop()}:${a.line}`:''}
async function goSceneStep(n){if(busy||TR)return;storyOn=true;si=(n+STEPS.length)%STEPS.length;showStep();if(cur.type!=='sys')await goto({type:'sys'});if(!cur.scene)return;sceneSi=si;buildInfo();await cur.scene.go(si,true)}
async function goStep(n){if(D.scene)return goSceneStep(n);if(!STEPS.length||busy||TR)return;storyOn=true;si=(n+STEPS.length)%STEPS.length;showStep();const t=stepPage(STEPS[si]);
  if(same(cur,t)){markStory()}else{ // walk up/down one level at a time so the camera move stays readable
    const chainT=[];for(let p=t;p;p=parentOf(p))chainT.unshift(p);let guard=0;while(!same(cur,t)&&guard++<8){const idx=chainT.findIndex(p=>same(p,cur));if(idx>=0)await enter(chainT[idx+1]);else if(parentOf(cur))await leave();else break}markStory()}}
function sched(){clearTimeout(timer);if(!playing)return;timer=setTimeout(async()=>{if(si+1>=STEPS.length){stopPlay();return}await goStep(si+1);sched()},Math.max(2400,(STEPS[si].text||'').length*62))}
const stopPlay=()=>{playing=false;$('play').textContent='▶ 播放';clearTimeout(timer)};
$('play').onclick=()=>{if(playing)return stopPlay();playing=true;$('play').textContent='❚❚ 暂停';goStep(storyOn?si+1:0).then(sched)};
$('next').onclick=()=>{stopPlay();goStep(storyOn?si+1:0)};$('prev').onclick=()=>{stopPlay();goStep(si-1)};
$('smin').onclick=()=>{const s=$('story');s.classList.toggle('min');$('smin').textContent=s.classList.contains('min')?'▴':'▾';relayout()};
function setStory(i){stopPlay();STORY=STORIES[i];STEPS=STORY.steps;si=0;storyOn=false;showStep();$('stxt').textContent=STEPS[0].text||'';const st=$('stories');if(st)st.querySelectorAll('button').forEach((b,j)=>b.setAttribute('aria-pressed',String(j===i)))}
if(STORIES.length>1)STORIES.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.title||('故事 '+(i+1));b.onclick=()=>setStory(i);$('stories').appendChild(b)});else $('stories').remove();

/* ====================== boot ====================== */
let tickOn=true,lastT=0;
function tick(now){const dt=Math.min(.05,(now-lastT)/1000);lastT=now;const S=(TR&&TR.outer.type==='sys')?TR.outer:(cur&&cur.type==='sys'?cur:null);
  if(S&&partV&&!RM)for(const d of S.dots){d.ph=(d.ph+dt*55/d.c.L)%1;const p=d.c.p.getPointAtLength(d.ph*d.c.L);d.el.setAttribute('cx',p.x);d.el.setAttribute('cy',p.y);d.el.style.opacity=Math.min(1,Math.sin(d.ph*Math.PI)*3).toFixed(2)}
  else if(S)for(const d of S.dots)d.el.style.opacity='0';requestAnimationFrame(tick)}
function relayout(){W=innerWidth;H=innerHeight;document.body.classList.toggle('withInfo',PANEL()>0);if(!cur||TR||busy)return;const spec=cur.type==='sys'?{type:'sys'}:cur.type==='mod'?{type:'mod',id:cur.id}:cur.type==='card'?{type:'card',ids:cur.ids,mod:cur.mod}:{type:'code',ids:cur.ids,mod:cur.mod,card:cur.card};const B=build(spec);cur.el.remove();cur=B;after()}
let rz=null;addEventListener('resize',()=>{sysPan=null;clearTimeout(rz);rz=setTimeout(relayout,120)});
function hideHint(){$('hint').classList.add('hide')}
if(innerWidth<900){$('info').hidden=true;$('infoT').setAttribute('aria-pressed','false')}
document.body.classList.toggle('withInfo',PANEL()>0);
if(STORIES.length)setStory(0);else $('story').hidden=true;
cur=build({type:'sys'});after();
try{if(!localStorage.getItem('cc-zoom3-hint')){$('hint').classList.remove('hide');setTimeout(hideHint,4500);localStorage.setItem('cc-zoom3-hint','1')}}catch(e){}
requestAnimationFrame(tick);
window.__zoom={goto,enter,leave,cur:()=>cur,MOD,CARD:CARDS,MODCARDS,goStep,steps:()=>STEPS,busy:()=>busy||!!TR};
})();
</script>
</body>
