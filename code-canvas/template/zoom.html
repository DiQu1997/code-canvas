<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Code Canvas · Zoom</title>
<style>
/* One infinite canvas. Level 0 = system framework diagram (module boxes + channels with moving particles).
   Zooming into a box reveals its anatomy (loop / pipeline / dispatch / state machine / flow / layers / grid + data-structure glyphs);
   anatomy parts morph into function cards; card block bars dissolve into real source lines. */
:root{
  --bg:#0d1015; --panel:#141920; --panel2:#1a2029; --ink:#e6e9ee; --muted:#8d96a3; --faint:#5d6672; --line:#2a313b;
  --hot:#e6c25c; --c1:#e9a03b; --c2:#5ea8f0; --c3:#b29cf5; --c4:#3cc3b3; --c5:#f06c6c; --c6:#56c48a;
  --kw:#c792ea; --str:#a5d6a7; --com:#6b7686; --num:#f6a96b; --ty:#7fc8f8;
  --sans:"IBM Plex Sans","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f3f4f6; --panel:#ffffff; --panel2:#f0f2f5; --ink:#1a1e24; --muted:#5f6772; --faint:#9aa2ad; --line:#d6dbe2;
  --hot:#b8860b; --c1:#d07f12; --c2:#2f78d6; --c3:#7b62d6; --c4:#0d8d82; --c5:#d13f3f; --c6:#1f9a5c;
  --kw:#8a3fc9; --str:#2e7d32; --com:#8a94a0; --num:#c25e00; --ty:#1565c0; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f3f4f6; --panel:#ffffff; --panel2:#f0f2f5; --ink:#1a1e24; --muted:#5f6772; --faint:#9aa2ad; --line:#d6dbe2;
  --hot:#b8860b; --c1:#d07f12; --c2:#2f78d6; --c3:#7b62d6; --c4:#0d8d82; --c5:#d13f3f; --c6:#1f9a5c;
  --kw:#8a3fc9; --str:#2e7d32; --com:#8a94a0; --num:#c25e00; --ty:#1565c0; color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;overflow:hidden}
#app{position:relative;height:100%;overflow:hidden}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;
  background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:24px 24px}
#svg.drag{cursor:grabbing}
#svg text{font-family:var(--mono);pointer-events:none}
.ov{position:absolute;background:color-mix(in srgb,var(--panel) 93%,transparent);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:2}
.top{top:calc(10px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));padding:7px 10px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.top .ttl{font-weight:600;font-size:14.5px}
.top .sub{font-size:12.5px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--panel2);border-radius:8px;padding:2px}
.seg button{font:inherit;font-size:12.5px;border:0;background:transparent;color:var(--muted);padding:3px 9px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.btn{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:7px;padding:3px 10px;cursor:pointer;white-space:nowrap}
.btn[aria-pressed="true"]{border-color:var(--hot);color:var(--hot)}
button:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.crumb{top:calc(58px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));padding:4px 7px;display:flex;flex-wrap:wrap;gap:2px 3px;align-items:center;font-size:13px;max-width:calc(100% - 400px)}
.crumb button{font:inherit;font-size:13px;background:none;border:0;color:var(--muted);cursor:pointer;padding:2px 5px;border-radius:5px}
.crumb button:hover{color:var(--ink);background:var(--panel2)}
.crumb button.cur{color:var(--hot);font-weight:600}
.crumb .sep{color:var(--faint)}
.rail{left:max(10px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);padding:10px 8px;display:flex;flex-direction:column;gap:4px;width:78px}
.rail .tr{position:relative;height:200px;margin:4px 0 4px 10px;width:4px;background:var(--line);border-radius:2px}
.rail .mk{position:absolute;left:-6px;width:16px;height:4px;border-radius:2px;background:var(--hot)}
.rail .lv{position:absolute;left:12px;font-size:12px;color:var(--muted);background:none;border:0;cursor:pointer;padding:0;white-space:nowrap;transform:translateY(-50%)}
.rail .lv.on{color:var(--ink);font-weight:600}
.rail .zb{display:flex;gap:4px}
.info{top:calc(58px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));width:350px;overflow:auto;padding:12px 14px;font-size:13px;line-height:1.6}
.infoT{position:absolute;top:calc(58px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));z-index:3}
.info .kick{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.03em;margin-top:24px;overflow-wrap:anywhere}
.info .ih{font-size:18px;font-weight:600;margin:2px 0 6px}
.info p{margin:0 0 6px}
.info .mnot{color:var(--muted)}
.info .mnot b{color:var(--ink);font-weight:600}
.info h4{font-size:11.5px;letter-spacing:.08em;color:var(--muted);margin:14px 0 4px;font-weight:600}
.kv{width:100%;border-collapse:collapse}
.kv td{vertical-align:top;padding:5px 6px 5px 0;border-top:1px solid var(--line)}
.kv td:first-child{width:42%}
.kv code{font-family:var(--mono);font-size:11.5px;color:var(--ink);overflow-wrap:anywhere}
.kv .ty{font-family:var(--mono);font-size:10.5px;color:var(--faint);overflow-wrap:anywhere}
.dflt{font-family:var(--mono);font-size:11px;color:var(--hot)}
.pits{margin:0;padding-left:16px}
.fl{list-style:none;margin:0;padding:0}
.fl li{border-top:1px solid var(--line)}
.fl button{font:inherit;font-size:12.5px;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:5px 2px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.fl button:hover{background:var(--panel2)}
.fl button.on{color:var(--hot)}
.fl code{font-family:var(--mono);font-size:12px}
.fl .ty{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-left:auto;white-space:nowrap}
.legend{display:grid;grid-template-columns:28px 1fr;gap:4px 8px;align-items:center;font-size:12.5px}
.legend svg{width:28px;height:10px}
.story{left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(700px,calc(100% - 20px));padding:9px 12px;display:flex;flex-direction:column;gap:5px}
body.withInfo .story{left:calc(50% - 180px);width:min(700px,calc(100% - 400px))}
.story .row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.story .meta{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.story .txt{font-size:14px;line-height:1.55;height:4.65em;overflow:auto}
.story .val{font-family:var(--mono);font-size:12px;color:var(--hot)}
.story .sp{flex:1}
.story.min .txt,.story.min .val{display:none}
@media (max-width:900px){
  .rail{display:none}.crumb{max-width:calc(100% - 20px)}
  .info{left:10px;width:auto;top:auto;height:55%;z-index:4}
  .infoT{top:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));right:10px;z-index:5}
  .top .sub{display:none}
  .story{width:calc(100% - 20px);padding:7px 9px;bottom:calc(46px + env(safe-area-inset-bottom,0px))}
  .story .txt{font-size:13px}
  .hideM{display:none}
}

/* svg */
.grp{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5;vector-effect:non-scaling-stroke}
.grpt{fill:var(--muted);font-size:11px;letter-spacing:.04em}
.mbg{fill:var(--panel);stroke:var(--line);stroke-width:1.3;vector-effect:non-scaling-stroke;cursor:zoom-in}
.mbg.ext{fill:var(--panel2);stroke-dasharray:5 4}
.mbg.foc{stroke:var(--hot);stroke-opacity:.75}
.mttl{fill:var(--ink);font-weight:600}
.msub{fill:var(--muted)}
.ch{fill:none;stroke-width:1.5;vector-effect:non-scaling-stroke;opacity:.8}
.ch.return{stroke-dasharray:5 4}
.ch.async{stroke-dasharray:2 4}
.chl{font-size:10px;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.dot{pointer-events:none}
/* anatomy */
.ab{fill:var(--panel2);stroke:var(--line);stroke-width:1.2;vector-effect:non-scaling-stroke}
.ab.hit{cursor:zoom-in}
.ab.hit:hover{stroke:var(--hot)}
.ab.ctr{fill:var(--panel)}
.ae{fill:none;stroke:var(--muted);stroke-width:1.2;vector-effect:non-scaling-stroke}
.ae.dash{stroke-dasharray:4 4}
.al{fill:var(--ink);font-weight:600}
.as{fill:var(--muted)}
.af{fill:var(--faint)}
.ael{fill:var(--muted);paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round}
.slot{fill:none;stroke:var(--faint);stroke-width:1;vector-effect:non-scaling-stroke}
.slot.on{fill:var(--faint);fill-opacity:.35}
.ring{fill:none;stroke:var(--line);stroke-width:1.2;vector-effect:non-scaling-stroke}
/* cards */
.morph{fill:var(--panel);stroke:var(--line);stroke-width:1.4;vector-effect:non-scaling-stroke;cursor:zoom-in}
.morph.on{stroke:var(--hot);stroke-width:2.2}
.ctl{fill:var(--ink);font-weight:600}
.cfile{fill:var(--muted)}
.blk{fill:var(--panel2);stroke:var(--line);stroke-width:.8;vector-effect:non-scaling-stroke;cursor:zoom-in}
.blk.on{stroke:var(--hot);fill:color-mix(in srgb,var(--hot) 15%,var(--panel2))}
.blkt{fill:var(--ink);font-family:var(--sans)!important;paint-order:stroke;stroke:var(--panel2);stroke-width:.3em;stroke-linejoin:round}
.mlab{fill:var(--muted);font-family:var(--sans)!important}
.mini{fill:var(--muted);opacity:.32}
.lnno{fill:var(--faint)}
.code{white-space:pre}
.code.haslnk{pointer-events:auto}
.lnk{text-decoration:underline;text-decoration-color:var(--faint);cursor:pointer}
.lnk:hover{fill:var(--hot)}
.hl{fill:var(--hot);opacity:.2}
.note{fill:var(--hot);font-weight:600;font-family:var(--mono)}
.tring{fill:none;stroke:var(--hot);stroke-width:2}
.tk{fill:var(--kw)} .ts{fill:var(--str)} .tc{fill:var(--com)} .tn{fill:var(--num)} .ty{fill:var(--ty)} .tp{fill:var(--ink)}
</style>
</head>
<body>
<div id="app">
  <svg id="svg" role="img" aria-label="可以从系统全局一路放大到源码的代码结构图"></svg>
  <div class="ov top">
    <span class="ttl" id="ttl"></span><span class="sub" id="subt"></span>
    <div class="seg" id="stories" role="group" aria-label="故事线"></div>
    <button class="btn" id="anim" aria-pressed="true" title="通道上的流动粒子">流动</button>
    <button class="btn" id="theme" aria-label="切换明暗">◐</button>
  </div>
  <div class="ov crumb" id="crumb"></div>
  <div class="ov rail"><div class="tr" id="tr"><div class="mk" id="mk"></div></div><div class="zb"><button class="btn" id="zin" aria-label="放大">＋</button><button class="btn" id="zout" aria-label="缩小">－</button></div></div>
  <button class="btn infoT" id="infoT" aria-pressed="true">说明</button>
  <aside class="ov info" id="info"><div id="infoBody"></div></aside>
  <div class="ov story" id="story" aria-live="polite">
    <div class="row"><span class="meta" id="smeta"></span><span class="sp"></span><span class="meta hideM" id="sref"></span></div>
    <div class="txt" id="stxt"></div>
    <div class="row"><button class="btn" id="prev" aria-label="上一步">◀</button><button class="btn" id="play">▶ 播放</button><button class="btn" id="next" aria-label="下一步">▶|</button>
      <button class="btn hideM" id="followB" aria-pressed="true">镜头跟随</button><button class="btn" id="demo">演示</button><button class="btn" id="smin" aria-label="收起">▾</button><span class="sp"></span><span class="val" id="sval"></span></div>
  </div>
</div>
<script>
const DATA=/*ZOOM_DATA*/null;
(()=>{
'use strict';
const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id),svg=$('svg');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function E(t,a,p,s){const e=document.createElementNS(NS,t);for(const k in a)if(a[k]!=null)e.setAttribute(k,a[k]);if(s!=null)e.textContent=s;if(p)p.appendChild(e);return e}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lr=(v,a,b)=>{const t=(Math.log(Math.max(v,1e-9))-Math.log(a))/(Math.log(b)-Math.log(a));return Math.max(0,Math.min(1,t))};
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
// text width in em: CJK ≈1, others ≈0.6 (mono) / 0.55 (sans)
const tw=s=>{let w=0;for(const ch of String(s))w+=/[⺀-￿]/.test(ch)?1:.6;return w};
function fitStr(s,maxEm){s=String(s??'');if(tw(s)<=maxEm)return s;let o='';for(const ch of s){if(tw(o+ch)>maxEm-1)break;o+=ch}return o+'…'}
function wrap(s,maxEm,maxLines){s=String(s??'');const out=[];let cur='';for(const ch of s){if(tw(cur+ch)>maxEm){out.push(cur);cur=ch.trim()?ch:'';if(out.length===maxLines)break}else cur+=ch}
  if(out.length<maxLines&&cur)out.push(cur);if(out.length===maxLines&&tw(out.join(''))<tw(s)-.5)out[maxLines-1]=fitStr(out[maxLines-1]+'……',maxEm);return out}
const defs=E('defs',{},svg);
const KC={flow:'var(--hot)',call:'var(--c2)',queue:'var(--c1)',return:'var(--c4)',async:'var(--c3)',control:'var(--muted)',data:'var(--c6)',error:'var(--c5)'};
for(const [k,c] of Object.entries({...KC,an:'var(--muted)'})){const mk=E('marker',{id:'ar-'+k,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse',markerUnits:'strokeWidth'},defs);E('path',{d:'M0 0L10 5L0 10z',fill:c},mk)}
const MODC={thread:'var(--hot)',queue:'var(--c1)',component:'var(--c2)',store:'var(--c3)',external:'var(--muted)',loop:'var(--hot)',api:'var(--c4)',state:'var(--c3)'};

const D=DATA||{meta:{title:'empty'},modules:[],cards:[]};
const meta=D.meta||{};
$('ttl').textContent=meta.title||'';$('subt').textContent=meta.subtitle||'';document.title=meta.title||'Code Canvas';
const world=E('g',{},svg);
const Lg=E('g',{},world),Lch=E('g',{},world),Lm=E('g',{},world),Ldot=E('g',{},world),Lz=E('g',{},world);
const tokL=E('g',{},svg);

/* ====================== level 0: system layout ====================== */
const COLW=D.layout?.colw||330,ROWH=D.layout?.rowh||260,GAP=D.layout?.gap||44;
const MODS=(D.modules||[]).map(m=>({...m}));
const MOD={};MODS.forEach(M=>{MOD[M.id]=M;const ext=M.kind==='external';const [c,r]=M.pos||[0,0];const [sw,sh]=M.span||(ext?[.55,.5]:[1,1]);
  M.box={x:c*COLW,y:r*ROWH,w:sw*COLW-GAP,h:sh*ROWH-GAP};M.ext=ext||!M.anatomy});
const bnd=(()=>{let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const M of MODS){const b=M.box;x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.w);y1=Math.max(y1,b.y+b.h)}
  if(!MODS.length)return {x:0,y:0,w:100,h:100};return {x:x0-40,y:y0-60,w:x1-x0+80,h:y1-y0+100}})();
const CHL=[],GRT=[];
// groups (dashed regions)
for(const G of D.groups||[]){const ms=(G.modules||[]).map(i=>MOD[i]).filter(Boolean);if(!ms.length)continue;const p=16;
  const x0=Math.min(...ms.map(m=>m.box.x))-p,y0=Math.min(...ms.map(m=>m.box.y))-p-16,x1=Math.max(...ms.map(m=>m.box.x+m.box.w))+p,y1=Math.max(...ms.map(m=>m.box.y+m.box.h))+p;
  E('rect',{x:x0,y:y0,width:x1-x0,height:y1-y0,rx:14,class:'grp'},Lg);GRT.push(E('text',{x:x0+12,y:y0+14,class:'grpt'},Lg,G.title||''))}
// channels
function side(b,s){return s==='r'?[b.x+b.w,b.y+b.h/2]:s==='l'?[b.x,b.y+b.h/2]:s==='t'?[b.x+b.w/2,b.y]:[b.x+b.w/2,b.y+b.h]}
const CH=[];const pairN={};
(D.channels||[]).forEach((c,i)=>{const A=MOD[c.from],B=MOD[c.to];if(!A||!B)return;const a=A.box,b=B.box;
  const acx=a.x+a.w/2,acy=a.y+a.h/2,bcx=b.x+b.w/2,bcy=b.y+b.h/2;let sa,sb;
  if(c.sides){[sa,sb]=c.sides.split('')}
  else if(b.x>=a.x+a.w-4){sa='r';sb='l'}else if(b.x+b.w<=a.x+4){sa='l';sb='r'}else if(bcy>acy){sa='b';sb='t'}else{sa='t';sb='b'}
  const key=[c.from,c.to].sort().join('|');const n=pairN[key]=(pairN[key]||0)+1;const off=(n-1)*16*(n%2?1:-1)/1;
  let [x1,y1]=side(a,sa),[x2,y2]=side(b,sb);
  if(sa==='r'||sa==='l'){y1+=off+(c.dy1||0);}else x1+=off+(c.dx1||0);
  if(sb==='r'||sb==='l'){y2+=off+(c.dy2||0);}else x2+=off+(c.dx2||0);
  const h=(sa==='r'||sa==='l'),v2=(sb==='r'||sb==='l');const dd=Math.max(30,Math.hypot(x2-x1,y2-y1)*.4);
  const c1=h?[x1+(sa==='r'?dd:-dd),y1]:[x1,y1+(sa==='b'?dd:-dd)],c2=v2?[x2+(sb==='r'?dd:-dd),y2]:[x2,y2+(sb==='b'?dd:-dd)];
  const d=`M${x1} ${y1} C${c1} ${c2} ${x2} ${y2}`;const kind=c.kind||'flow';const col=KC[kind]||KC.flow;
  const p=E('path',{d,class:'ch '+kind,stroke:col,'marker-end':`url(#ar-${KC[kind]?kind:'flow'})`},Lch);
  const L=p.getTotalLength();const mid=p.getPointAtLength(L/2);
  if(c.label){const t=E('text',{x:mid.x,y:mid.y-5,'text-anchor':'middle',class:'chl',fill:col},Lch,c.label);CHL.push(t)}
  CH.push({...c,p,L,col,kind,ph:Math.random()})});
// module frames
for(const M of MODS){const b=M.box;const g=E('g',{},Lm);M.gF=g;const col=MODC[M.kind]||'var(--c2)';
  M.bgEl=E('rect',{x:b.x,y:b.y,width:b.w,height:b.h,rx:10,class:'mbg'+(M.ext?' ext':'')},g);M.bgEl.dataset.fly=[b.x,b.y,b.w,b.h].join(',');M.bgEl.dataset.mod=M.id;
  if(!M.ext)E('rect',{x:b.x,y:b.y+10,width:3,height:Math.min(28,b.h-20),rx:1.5,fill:col},g);
  M.hg=E('g',{},g);
  M.tEl=E('text',{x:b.x+12,y:b.y+21,class:'mttl','font-size':14},M.hg,M.title||M.id);
  const subEm=(b.w-24)/12;M.subLines=wrap(M.oneliner||'',subEm,M.ext?3:1);
  M.sEl=M.subLines.map((s,i)=>E('text',{x:b.x+12,y:b.y+36+i*13,class:'msub','font-size':10.5},M.hg,s));
  M.HB=M.ext?b.h:48}

/* ====================== level 1: anatomy ====================== */
const CARDS={};(D.cards||[]).forEach(c=>{CARDS[c.id]={cd:c}});
function itemCards(it){if(!it||!it.card)return [];return (Array.isArray(it.card)?it.card:[it.card]).filter(id=>CARDS[id])}

  for(const M of MODS)if(!M.ext&&M.r>.55&&inB(M.box,cam.x,cam.y)){curMod=M;items.push([M.title,fitBox(M.box,1.04)]);break}
  if(curMod)for(const c of MODCARDS[curMod.id]||[]){if(c.t>.6&&inB(c.wb,cam.x,cam.y)){curCard=c;items.push([c.cd.title,fitBox(c.wb,1.25)]);
    if(c.co>.4){const ly=(cam.y-c.M.ty)/c.M.s;const bl=c.blk.find(q=>ly>=q.y1&&ly<=q.y2);if(bl){curBlk=bl;items.push([bl.lab,fitBox(bl.bw)])}}break}}
  const key=items.map(i=>i[0]).join('|');if(key===lastCrumb)return;lastCrumb=key;
  const el=$('crumb');el.innerHTML='';items.forEach(([n,t],i)=>{if(i){const s=document.createElement('span');s.className='sep';s.textContent='›';el.appendChild(s)}
    const b=document.createElement('button');b.textContent=n;if(i===items.length-1)b.className='cur';b.onclick=()=>flyTo(t||fitAll());el.appendChild(b)});
  buildInfo()}
let infoFor=null;
const LEG=[['flow','主流程'],['call','调用'],['queue','入队 / 出队'],['return','返回 / 回程'],['async','异步 / 回调'],['data','数据读写'],['control','控制 / 配置']];
function buildInfo(){const M=curMod;const key=(M?M.id:'')+'|'+(curCard?curCard.id:'');if(key===infoFor)return;infoFor=key;const box=$('infoBody');
  if(!M){const used=new Set(CH.map(c=>c.kind));const ov=meta.overview?(Array.isArray(meta.overview)?meta.overview:[meta.overview]):[];
    box.innerHTML=`<div class="kick">${esc(meta.kicker||'全局')}</div><div class="ih">${esc(meta.title||'')}</div>${ov.map(p=>`<p>${esc(p)}</p>`).join('')}
    <h4>模块</h4><ul class="fl">${MODS.filter(m=>!m.ext).map(m=>`<li><button data-m="${esc(m.id)}"><b>${esc(m.title)}</b><span class="ty">${esc(m.kind||'')}</span></button></li>`).join('')}</ul>
    ${used.size?`<h4>连线</h4><div class="legend">${LEG.filter(l=>used.has(l[0])).map(([k,n])=>`<svg viewBox="0 0 28 10"><path d="M1 5H27" stroke="${KC[k]}" stroke-width="2" ${k==='return'?'stroke-dasharray="5 4"':k==='async'?'stroke-dasharray="2 4"':''}/></svg><span>${n}</span>`).join('')}</div>`:''}
    <h4>怎么看</h4><ul class="pits"><li>滚轮 / 双指缩放，拖动平移；点空白处退回上一层</li><li>点模块、圆圈、方块、卡片里的代码块，都会飞进去</li><li>代码里带下划线的函数名可以点，飞到它的定义</li>${STEPS.length?'<li>底部的故事线会带你从图一路走到代码行</li>':''}</ul>`;
    box.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>flyTo(fitBox(MOD[b.dataset.m].box,1.04)));return}
  const I=M.info||{};const cards=MODCARDS[M.id]||[];
  box.innerHTML=`<div class="kick">${esc(I.kicker||M.kicker||M.kind||'')}</div><div class="ih">${esc(M.title)}</div><p>${esc(I.role||M.oneliner||'')}</p>${I.not?`<p class="mnot"><b>它不是：</b>${esc(I.not)}</p>`:''}
   ${cards.length?`<h4>函数卡</h4><ul class="fl">${cards.map(c=>`<li><button data-c="${esc(c.id)}" class="${curCard===c?'on':''}"><code>${esc(c.cd.title)}</code><span class="ty">${esc(c.cd.file.split('/').pop())}:${c.lines.find(l=>l[0])[0]}</span></button></li>`).join('')}</ul>`:''}
   ${(I.fields||[]).length?`<h4>关键状态</h4><table class="kv"><tbody>${I.fields.map(f=>`<tr><td><code>${esc(f[0])}</code><div class="ty">${esc(f[1]||'')}</div></td><td>${esc(f[2]||'')}</td></tr>`).join('')}</tbody></table>`:''}
   ${(I.methods||[]).length?`<h4>关键方法</h4><table class="kv"><tbody>${I.methods.map(m=>`<tr><td><code>${esc(m[0])}</code><div class="ty">${esc(m[1]||'')}</div></td><td>${esc(m[2]||'')}</td></tr>`).join('')}</tbody></table>`:''}
   ${(I.config||[]).length?`<h4>相关配置</h4><table class="kv"><tbody>${I.config.map(c=>`<tr><td><code>${esc(c[0])}</code></td><td>${c[1]!=null&&c[1]!==''?`<span class="dflt">默认 ${esc(c[1])}</span> `:''}${esc(c[2]||'')}</td></tr>`).join('')}</tbody></table>`:''}
   ${(I.pitfalls||[]).length?`<h4>读代码时要注意</h4><ul class="pits">${I.pitfalls.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`:''}`;
  box.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>flyTo(fitBox(CARD[b.dataset.c].wb,1.25)))}
$('infoT').onclick=()=>{const i=$('info');i.hidden=!i.hidden;$('infoT').setAttribute('aria-pressed',String(!i.hidden));calcLevels();apply()};
$('theme').onclick=()=>{const r=document.documentElement;const dark=getComputedStyle(r).colorScheme.includes('dark');r.dataset.theme=dark?'light':'dark'};

/* ====================== story ====================== */
const STORIES=(D.stories||(D.story?[D.story]:[])).filter(s=>s&&(s.steps||[]).length);
let STEPS=[],SI=0;
const tokG=E('g',{},tokL),tokR=E('rect',{x:-9,y:-9,width:18,height:18,rx:4,fill:'var(--c1)'},tokG),tokRing=E('circle',{r:15,class:'tring'},tokG);
const tokT=E('text',{x:0,y:3.5,'text-anchor':'middle','font-size':8.5,'font-weight':600,fill:'var(--bg)'},tokG,'');const tokNote=E('text',{x:16,y:4,'font-size':12,class:'note'},tokG,'');
let si=0,tokW=null,playing=false,followCam=true,timer=null;
function stepPos(s){const a=s.at||{};
  if(a.card&&CARD[a.card]){const c=CARD[a.card];let l1=a.line,l2=a.line2||a.line;if(c.lineY[l1]==null){const ks=Object.keys(c.lineY).map(Number);l1=ks.reduce((p,q)=>Math.abs(q-l1)<Math.abs(p-l1)?q:p,ks[0]);l2=Math.max(l1,c.lineY[l2]!=null?l2:l1)}
    const y1=c.lineY[l1],y2=c.lineY[l2]+c.LH;const [wx,wy]=toW(c.M,c.x0,(y1+y2)/2);return {x:wx,y:wy,c,y1,y2,l1}}
  if(a.item){const [m,i]=String(a.item).split('/');const M=MOD[m];const r=M&&M.anch&&M.anch[i];if(r){const b=wRect(M,r);return {x:b.x+b.w/2,y:b.y+b.h/2,box:b,M}}}
  if(a.module&&MOD[a.module]){const b=MOD[a.module].box;return {x:b.x+b.w/2,y:b.y+(MOD[a.module].ext?b.h/2:20),box:b,M:MOD[a.module],mod:true}}
  return {x:bnd.x+20,y:bnd.y+20}}
function placeTok(){if(!tokW){tokG.style.display='none';return}tokG.style.display='';const k=cam.k;let x=tokW.x;if(tokW.c)x-=Math.min(14/k,6);
  tokG.setAttribute('transform',`translate(${viewCX()+(x-cam.x)*k},${viewCY()+(tokW.y-cam.y)*k})`);
  const show=tokW.c&&tokW.c.co>.5;tokNote.style.display=show?'':'none';if(show)tokNote.setAttribute('x',tokW.c.wb.w*k+24)}
function clearHL(){for(const c of Object.values(CARD)){c.hlG.innerHTML='';c.morph.classList.remove('on');c.blk.forEach(b=>b.r.classList.remove('on'))}}
function showStep(){const s=STEPS[si];clearHL();const p=stepPos(s);
  if(p.c){const c=p.c;E('rect',{x:c.x0+c.fs*.3,y:p.y1,width:c.w-c.fs*.6,height:p.y2-p.y1,class:'hl'},c.hlG);c.morph.classList.add('on');c.blk.forEach(b=>{if(p.l1>=b.a&&p.l1<=b.b)b.r.classList.add('on')})}
  const kind=s.kind||'';tokR.setAttribute('fill',kind==='resp'||kind==='return'?'var(--c4)':kind==='error'?'var(--c5)':'var(--c1)');tokR.setAttribute('rx',kind==='resp'||kind==='return'?9:4);
  tokNote.textContent=s.value||'';tokT.textContent=(STORY.token||'').slice(0,3);
  $('smeta').textContent=`${STORY.title?STORY.title+' · ':''}${si+1} / ${STEPS.length}`;$('stxt').textContent=s.text||'';$('sval').textContent=s.value||'';
  $('sref').textContent=p.c?`${p.c.cd.file.split('/').pop()}:${s.at.line}${s.at.line2?'–'+s.at.line2:''}`:(p.M?p.M.title:'');return p}
async function goStep(n){si=(n+STEPS.length)%STEPS.length;const p=showStep();const from=tokW?{...tokW}:{x:p.x,y:p.y};const to={x:p.x,y:p.y,c:p.c};
  const mv=e=>{tokW={x:from.x+(to.x-from.x)*e,y:from.y+(to.y-from.y)*e,c:e>.97?to.c:null}};
  if(followCam){let tgt;const VW=W-PANEL();
    if(p.c){const c=p.c;const VV=VW-RAILW();let k=Math.min(KMAX,Math.max((VV-160)/(c.wb.w*1.15),11.5/c.fsW));const x=c.wb.w*k>VV-140?c.wb.x+(VV/2-80)/k:c.wb.x+c.wb.w/2;tgt={x,y:p.y,k}}
    else if(p.box)tgt=fitBox(p.box,p.mod?1.04:2.2);else tgt=fitAll();
    await flyTo(tgt,1,mv)}
  else{const t0=performance.now(),d=RM?0:500;await new Promise(r=>{const f=now=>{const e=d?Math.min(1,(now-t0)/d):1;mv(e);apply();e<1?requestAnimationFrame(f):r()};requestAnimationFrame(f)})}
  tokW=to;apply()}
function sched(){clearTimeout(timer);if(!playing)return;timer=setTimeout(async()=>{if(si+1>=STEPS.length){stopPlay();return}await goStep(si+1);sched()},Math.max(1700,(STEPS[si].text||'').length*60))}
const stopPlay=()=>{playing=false;$('play').textContent='▶ 播放';clearTimeout(timer)};
$('play').onclick=()=>{if(playing){stopPlay();return}playing=true;$('play').textContent='❚❚ 暂停';(tokW?goStep(si+1):goStep(si)).then(sched)};
$('next').onclick=()=>{stopPlay();goStep(tokW?si+1:si)};$('prev').onclick=()=>{stopPlay();goStep(si-1)};
$('followB').onclick=()=>{followCam=!followCam;$('followB').setAttribute('aria-pressed',String(followCam))};
$('smin').onclick=()=>{const s=$('story');s.classList.toggle('min');$('smin').textContent=s.classList.contains('min')?'▴':'▾';apply()};
let STORY=null;
function setStory(i){stopPlay();STORY=STORIES[i];STEPS=STORY.steps;si=0;tokW=null;clearHL();showStep();
  $('stories')&&$('stories').querySelectorAll('button').forEach((b,j)=>b.setAttribute('aria-pressed',String(j===i)));apply()}
if(STORIES.length>1)STORIES.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.title||('故事 '+(i+1));b.onclick=()=>setStory(i);$('stories').appendChild(b)});else $('stories').remove();
$('demo').onclick=async()=>{stopPlay();await flyTo(fitAll());tokW=null;si=0;showStep();apply();await new Promise(r=>setTimeout(r,500));
  const p=stepPos(STEPS.find(s=>s.at&&s.at.card)||STEPS[0]);
  if(p.c){await flyTo(fitBox(p.c.M.box,1.04),1.4);await new Promise(r=>setTimeout(r,900));if(MODCARDS[p.c.M.id].length>1){await flyTo(fitBox(p.c.wb,1.25),1.4);await new Promise(r=>setTimeout(r,1000))}}
  playing=true;$('play').textContent='❚❚ 暂停';await goStep(0);sched()};

/* ====================== boot ====================== */
addEventListener('resize',()=>{const fa=Math.abs(cam.k-fitAllK())<1e-3;resize();calcLevels();buildL0();if(fa)cam=fitAll();apply()});
if(innerWidth<900){$('info').hidden=true;$('infoT').setAttribute('aria-pressed','false')}
resize();calcLevels();buildL0();
if(STORIES.length)setStory(0);else $('story').hidden=true;
cam=fitAll();apply();
(function loop(now){tickFly(now);tickDots(now);requestAnimationFrame(loop)})(performance.now());
window.__zoom={flyTo,fitBox,fitAll,CARD,MOD,cam:()=>cam,goStep,steps:()=>STEPS};
})();
</script>
