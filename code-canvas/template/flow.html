<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Code Canvas · 逻辑线</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: header (back · title · breadcrumb · tools); the stage shows ONE level of the logic line as a page of 3-9 uniform step cards,
   laid out for the screen; entering a card pushes the camera into it and swaps in the next page. Right: inspector (bottom sheet on phones).
   Bottom: example player. Leaves open a source reader sheet. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface2:#f6f8fb; --ink:#17202b; --muted:#5d6878; --faint:#9aa4b2; --line:#d9dee6; --cardline:#cdd5e0; --hl:#e8eefa;
  --blue:#2f6fe0; --pink:#d63b6c; --amber:#d9850f; --mint:#14946f; --violet:#7a4fe0; --teal:#0e8fa3; --red:#d14545; --grey:#8a96a6;
  --kw:#7a3fc9; --str:#2e7d32; --com:#8a94a0; --num:#c25e00; --ty:#1565c0;
  --shadow:0 1px 2px rgba(23,32,43,.06),0 8px 24px rgba(23,32,43,.08);
  --sans:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --hh:56px; --pw:372px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1218; --surface:#151b24; --surface2:#1a222d; --ink:#e6ebf2; --muted:#93a0b2; --faint:#647083; --line:#2a3341; --cardline:#313c4d; --hl:#1b2536;
  --blue:#5fa8ff; --pink:#ff7096; --amber:#ffb648; --mint:#4fd1a5; --violet:#b69cff; --teal:#4fc9db; --red:#ff7a7a; --grey:#7f8ca0;
  --kw:#c99bff; --str:#9fd8a3; --com:#6f7c8f; --num:#ffb27a; --ty:#7fc8ff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1218; --surface:#151b24; --surface2:#1a222d; --ink:#e6ebf2; --muted:#93a0b2; --faint:#647083; --line:#2a3341; --cardline:#313c4d; --hl:#1b2536;
  --blue:#5fa8ff; --pink:#ff7096; --amber:#ffb648; --mint:#4fd1a5; --violet:#b69cff; --teal:#4fc9db; --red:#ff7a7a; --grey:#7f8ca0;
  --kw:#c99bff; --str:#9fd8a3; --com:#6f7c8f; --num:#ffb27a; --ty:#7fc8ff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mono{font-family:var(--mono)}
#app{position:fixed;inset:0;overflow:hidden;background-image:radial-gradient(color-mix(in srgb,var(--line) 80%,transparent) 1px,transparent 1px);background-size:22px 22px}

/* header */
.hdr{position:absolute;top:0;left:0;right:0;z-index:5;height:var(--hh);padding:env(safe-area-inset-top,0px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--surface) 94%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ttl{font-weight:600;font-size:15px;white-space:nowrap;flex:none;max-width:32vw;overflow:hidden;text-overflow:ellipsis}
.crumb{display:flex;align-items:center;gap:2px;min-width:0;flex:1;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.crumb::-webkit-scrollbar{display:none}
.crumb button{border:0;background:none;color:var(--muted);font-size:13.5px;padding:4px 7px;border-radius:6px;cursor:pointer;white-space:nowrap;max-width:22em;overflow:hidden;text-overflow:ellipsis}
.crumb button:hover{background:var(--surface2);color:var(--ink)}
.crumb button.cur{color:var(--ink);font-weight:600}
.crumb .sep{color:var(--faint);font-size:12px}
.tools{display:flex;gap:6px;flex:none}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:32px;min-width:32px;padding:0 10px;cursor:pointer;color:var(--ink);font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none}
.ib:hover{border-color:var(--blue)}
.ib:disabled{opacity:.35;cursor:default;border-color:var(--line)}
.ib[aria-pressed="true"]{background:var(--hl);border-color:color-mix(in srgb,var(--blue) 50%,var(--line))}
.ib svg{width:16px;height:16px;flex:none}

/* stage */
.stage{position:absolute;top:var(--hh);left:0;right:var(--pwv,0px);bottom:var(--pb,0px);overflow:hidden}
.page{position:absolute;inset:0;overflow:auto;padding:18px 20px 14px;will-change:transform,opacity}
.phead{max-width:760px;margin:0 auto 14px}
.eb{font-size:11.5px;letter-spacing:.06em;color:var(--muted);font-weight:600;text-transform:uppercase;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.phead h1{font-size:22px;line-height:1.3;margin:3px 0 4px;font-weight:600;text-wrap:balance}
.phead .pcode{font-family:var(--mono);font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.phead p{margin:6px 0 0;color:var(--muted);font-size:14.5px;max-width:68ch}
.board{position:relative;margin:0 auto}
.board svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.edge{fill:none;stroke:var(--faint);stroke-width:1.6}
.edge.x{stroke-dasharray:5 4}
.edge.hot{stroke:var(--amber);stroke-width:2.4}
.elab{font-family:var(--sans);font-size:12px;font-weight:500;fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.ring{fill:none;stroke:var(--line);stroke-width:1.4;stroke-dasharray:3 6}
.rlab{position:absolute;transform:translate(-50%,-50%);text-align:center;color:var(--muted);font-size:13px;max-width:220px}
.rlab b{display:block;color:var(--ink);font-size:15px}

/* step card */
.card{position:absolute;display:flex;flex-direction:column;justify-content:center;gap:3px;text-align:left;border:1.2px solid var(--cardline);background:var(--surface);border-radius:12px;
  padding:8px 12px 8px 16px;cursor:pointer;overflow:hidden;transition:border-color .15s,box-shadow .15s,opacity .25s,transform .15s}
.card:hover{border-color:var(--blue);box-shadow:var(--shadow)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--lane,var(--cardline))}
.card .r1{display:flex;gap:8px;align-items:flex-start;min-width:0}
.card .num{flex:none;width:20px;height:20px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);color:var(--muted);font-family:var(--mono);font-size:11px;display:grid;place-items:center;margin-top:1px}
.card .t{flex:1;min-width:0;font-weight:600;font-size:14.5px;line-height:1.35;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.card .tag{flex:none;font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;background:var(--surface2);color:var(--muted);white-space:nowrap;margin-top:1px}
.card .c{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:28px}
.card .f{display:flex;gap:8px;align-items:center;padding-left:28px;font-size:11.5px;color:var(--faint);min-width:0}
.card .f .ref{font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.card .f .go{margin-left:auto;white-space:nowrap;color:var(--blue);font-weight:500}
.card.sm .f{display:none}
.card.xs .c{display:none}
.card.xs .t{-webkit-line-clamp:1}
.card.xs{padding-top:4px;padding-bottom:4px}
.card.k-decision{border-style:solid;border-radius:12px}
.card.k-decision .tag{background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber)}
.card.k-loop .tag{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}
.card.k-write .tag{background:color-mix(in srgb,var(--pink) 14%,transparent);color:var(--pink)}
.card.k-wait .tag{background:color-mix(in srgb,var(--violet) 14%,transparent);color:var(--violet)}
.card.k-return .tag{background:color-mix(in srgb,var(--mint) 16%,transparent);color:var(--mint)}
.card.k-box{background:var(--surface2);border-style:dashed}
.card.k-external{background:transparent;border-style:dashed}
.card.k-external .go,.card.k-external .f{display:none}
.card.dim{opacity:.38}
.card.cur{border-color:var(--amber);box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 28%,transparent),var(--shadow);opacity:1}
.card.flash{animation:flash 1s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 6px color-mix(in srgb,var(--blue) 45%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
.card .v{position:absolute;right:10px;bottom:6px;font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--amber);background:color-mix(in srgb,var(--amber) 14%,var(--surface));border-radius:6px;padding:0 7px;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* inspector */
.panel{position:absolute;z-index:4;top:var(--hh);right:0;bottom:0;width:var(--pw);background:var(--surface);border-left:1px solid var(--line);overflow:auto;
  padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));font-size:13.5px;line-height:1.6}
.panel .grab,.panel .pclose{display:none}
.panel h2{font-size:18px;line-height:1.35;margin:4px 0 8px;text-wrap:balance}
.panel h4{font-size:12px;color:var(--muted);font-weight:600;margin:18px 0 6px;letter-spacing:.04em}
.panel p{margin:0 0 8px}
.q{border-left:3px solid var(--blue);padding:2px 0 2px 10px;margin:8px 0;font-size:14.5px}
.lst{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.lst li{border:1px solid var(--line);border-radius:9px;overflow:hidden}
.lst li.on{border-color:var(--blue);box-shadow:0 0 0 2px color-mix(in srgb,var(--blue) 22%,transparent)}
.lst button{width:100%;text-align:left;border:0;background:var(--surface);padding:7px 10px;cursor:pointer;display:flex;gap:9px;align-items:baseline}
.lst button:hover{background:var(--hl)}
.lst .n{font-family:var(--mono);font-size:11px;color:var(--faint);flex:none}
.lst .nm{font-weight:600;min-width:0}
.lst .ty{margin-left:auto;font-size:11px;color:var(--faint);white-space:nowrap}
.lst .d{padding:0 10px 8px 30px;color:var(--muted);font-size:13px}
.lst .d code{font-family:var(--mono);font-size:11.5px;color:var(--ink);overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 12px;margin:0;background:var(--surface2);border-radius:8px;padding:10px 12px}
.kv dt{color:var(--muted);white-space:nowrap;font-size:12.5px}
.kv dd{margin:0;font-size:13px;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:2px 9px;font-family:var(--mono)}
.chip i{width:7px;height:7px;border-radius:50%;flex:none}
.om{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.om code{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-right:6px}
.srcb{width:100%;justify-content:flex-start;margin-top:6px;height:auto;padding:7px 10px;text-align:left}
.srcb span{font-family:var(--mono);font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.ev{font-size:11px;font-weight:600;border-radius:4px;padding:0 5px;margin-left:6px;background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber)}
.pits{margin:0;padding-left:18px}

/* player */
.player{position:absolute;z-index:3;left:max(12px,env(safe-area-inset-left,0px));right:calc(var(--pwv,0px) + 12px);bottom:calc(12px + env(safe-area-inset-bottom,0px));
  max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.srow{display:flex;align-items:center;gap:10px;padding:8px 10px}
.pbtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--blue);color:#fff;cursor:pointer;flex:none;display:grid;place-items:center}
.pbtn svg{width:16px;height:16px}
.smain{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.stitle{display:flex;gap:8px;align-items:baseline;min-width:0;font-size:13px}
.stitle b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.stitle span{color:var(--muted);font-family:var(--mono);font-size:12px;white-space:nowrap;margin-left:auto}
.sprog{display:flex;gap:2px;height:6px;cursor:pointer}
.sprog i{flex:1;border-radius:2px;background:var(--line)}
.sprog i.seen{background:color-mix(in srgb,var(--amber) 40%,var(--line))}
.sprog i.cur{background:var(--amber)}
.sbody{border-top:1px solid var(--line);padding:9px 14px 11px;display:flex;flex-direction:column;gap:7px}
.player:not(.open) .sbody{display:none}
.stxt{margin:0;font-size:14.5px;line-height:1.6;max-height:6.4em;overflow:auto}
.smeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.val{font-family:var(--mono);font-size:12.5px;color:var(--amber);font-weight:600;background:color-mix(in srgb,var(--amber) 12%,transparent);border-radius:6px;padding:1px 8px}
.val:empty{display:none}
.st{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:0 7px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st b{color:var(--ink);font-weight:500}
.st.chg{border-color:var(--amber);color:var(--ink)}
.lineb{font-family:var(--mono);font-size:11.5px;height:24px;padding:0 8px}

/* reader */
.scrim{position:absolute;z-index:6;inset:0;background:color-mix(in srgb,var(--bg) 82%,transparent);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.reader{position:absolute;z-index:7;display:none;flex-direction:column;background:var(--surface);border:1px solid var(--cardline);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;
  top:calc(var(--hh) + 14px);bottom:14px;left:50%;width:min(1000px,calc(100% - 28px));transform:translateX(-50%)}
.reader.on{display:flex;animation:rin .22s ease-out}
@keyframes rin{from{opacity:0;transform:translateX(-50%) scale(.97)}to{opacity:1;transform:translateX(-50%)}}
.rh{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line);flex:none}
.rh .rt{font-weight:600;font-size:15px;min-width:0}
.rh .rf{font-family:var(--mono);font-size:11.5px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:auto}
.rnote{padding:8px 16px;border-bottom:1px solid var(--line);color:var(--muted);font-size:13.5px;flex:none}
.rbody{overflow:auto;overscroll-behavior:contain;flex:1;padding:0 0 30vh;font-family:var(--mono);font-size:13px;line-height:1.6}
.rb{position:sticky;top:0;left:0;z-index:1;font-family:var(--sans);font-size:13px;font-weight:500;background:var(--surface2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 16px;display:flex;gap:8px;align-items:baseline}
.rb:first-child{border-top:0}
.rb::before{content:"";width:3px;align-self:stretch;border-radius:2px;background:var(--blue);flex:none}
.rb.o{color:var(--muted);font-weight:400}.rb.o::before{background:var(--faint)}
.rb small{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap}
.cl{display:grid;grid-template-columns:3.8em max-content;column-gap:1em;padding-right:16px;min-width:max-content}
.cl .n{color:var(--faint);text-align:right;user-select:none}
.cl .x{white-space:pre}
.cl.gap .x{color:var(--com)}
.cl.o{opacity:.45}
.cl.cur{background:color-mix(in srgb,var(--amber) 16%,transparent);box-shadow:inset 3px 0 0 var(--amber);opacity:1}
.tk{color:var(--kw)} .ts{color:var(--str)} .tc{color:var(--com);font-style:italic} .tn{color:var(--num)} .ty{color:var(--ty)} .tp{color:var(--ink)}

@media (prefers-reduced-motion: reduce){.card,.scrim{transition:none}.reader.on,.card.flash{animation:none}}
@media (max-width:820px){
  :root{--hh:92px}
  .hdr{flex-wrap:wrap;align-content:center;gap:4px 8px;padding-bottom:4px}
  .ttl{max-width:none;flex:1;font-size:14.5px}
  .crumb{order:3;flex-basis:100%}
  .page{padding:12px 12px 10px}
  .phead h1{font-size:19px}
  .phead p{font-size:14px}
  .panel{top:auto;left:0;width:auto;height:74%;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:var(--shadow);z-index:8;transform:translateY(105%);transition:transform .28s ease}
  .panel.open{transform:none}
  .panel .grab{display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 10px}
  .panel .pclose{display:inline-flex;position:sticky;top:0;float:right;margin:-4px -4px 0 8px}
  .player{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .stxt{font-size:14px;max-height:5em}
  .reader{top:calc(var(--hh) + 8px);bottom:8px;width:calc(100% - 16px)}
  .cl{grid-template-columns:2.9em minmax(0,1fr);min-width:0;column-gap:.6em}
  .cl .x{white-space:pre-wrap;overflow-wrap:break-word}
  .rbody{font-size:12.5px}
  .ib .lbl{display:none}
}
</style>
</head>
<body>
<div id="app">
  <header class="hdr">
    <button class="ib" id="back" aria-label="回到上一层"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 3L5 8l5 5"/></svg></button>
    <span class="ttl" id="ttl"></span>
    <nav class="crumb" id="crumb" aria-label="当前位置"></nav>
    <div class="tools">
      <button class="ib" id="theme" aria-label="切换明暗"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg></button>
      <button class="ib" id="panelT" aria-pressed="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2.5" width="12" height="11" rx="2"/><path d="M10 2.5v11"/></svg><span class="lbl">说明</span></button>
    </div>
  </header>
  <main class="stage" id="stage"><div class="page" id="page"></div></main>
  <aside class="panel" id="panel" aria-label="说明"><div class="grab"></div><button class="ib pclose" id="pclose" aria-label="关闭说明"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4l8 8M12 4l-8 8"/></svg></button><div id="pbody"></div></aside>
  <div class="player" id="player">
    <div class="srow">
      <button class="pbtn" id="play" aria-label="用例子走一遍"></button>
      <div class="smain"><div class="stitle"><b id="sname"></b><span id="scount"></span></div><div class="sprog" id="sprog"></div></div>
      <button class="ib" id="prev" aria-label="上一步"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 3L5 8l5 5"/></svg></button>
      <button class="ib" id="next" aria-label="下一步"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3l5 5-5 5"/></svg></button>
      <button class="ib" id="sexp" aria-label="展开或收起"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10l5-5 5 5"/></svg></button>
    </div>
    <div class="sbody" aria-live="polite"><p class="stxt" id="stxt"></p><div class="smeta" id="smeta"></div></div>
  </div>
  <div class="scrim" id="scrim"></div>
  <section class="reader" id="reader" aria-label="源码">
    <div class="rh"><span class="rt" id="rt"></span><span class="rf" id="rf"></span><button class="ib" id="rclose" aria-label="关闭源码"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
    <div class="rnote" id="rnote"></div>
    <div class="rbody" id="rbody"></div>
  </section>
</div>
<script>
const DATA=/*FLOW_DATA*/null;
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const D=DATA||{meta:{title:'（空）'},root:{id:'root',children:[]}};
const meta=D.meta||{};$('ttl').textContent=meta.title||'';document.title=meta.title||'Code Canvas';
const FILES=D.files||{};
const LANEC=['var(--blue)','var(--teal)','var(--amber)','var(--violet)','var(--mint)','var(--pink)','var(--grey)'];
const LANE={};(D.lanes||[]).forEach((l,i)=>LANE[l.id]={...l,col:LANEC[i%LANEC.length]});
const STATE={};(D.state||[]).forEach(s=>STATE[s.id]=s);
const KIND={decision:'判断',loop:'循环',write:'写状态',wait:'等待',return:'出口',box:'黑盒',external:'外部'};
// index the tree
const N={},PARENT={};(function ix(n,p){N[n.id]=n;PARENT[n.id]=p;(n.children||[]).forEach(c=>ix(c,n.id))})(D.root,null);
const kids=n=>n.children||[];
const rangesOf=n=>n.ranges?n.ranges:(n.lines?[n.lines]:[]);
const refOf=n=>{const r=rangesOf(n);return n.file&&r.length?`${String(n.file).split('/').pop()}:${r[0][0]}`:''};
const pathTo=id=>{const p=[];for(let x=id;x;x=PARENT[x])p.unshift(x);return p};

/* ====================== layout of one level ====================== */
const phone=()=>innerWidth<=820;
function ranksOf(L,edges){const ids=L.map(n=>n.id),rank={};ids.forEach(i=>rank[i]=0);
  for(let it=0;it<ids.length;it++){let ch=false;for(const [a,b] of edges){if(rank[a]==null||rank[b]==null||a===b)continue;if(ids.indexOf(b)<ids.indexOf(a))continue;if(rank[b]<rank[a]+1){rank[b]=rank[a]+1;ch=true}}if(!ch)break}
  const nr=Math.max(0,...Object.values(rank))+1;const rows=[...Array(nr)].map(()=>[]);L.forEach(n=>rows[rank[n.id]].push(n));return rows}
function layout(node,bw,bh){const L=kids(node);const n=L.length;let kind=node.layout||'line';let edges=(node.edges||[]).map(e=>({a:e[0],b:e[1],label:e[2]||''}));const P={};let H=0,ring=null;
  if(kind==='dispatch'&&!edges.length&&n>1)edges=L.slice(1).map(c=>({a:L[0].id,b:c.id,label:''}));
  if((kind==='loop'||kind==='statemachine')&&bw<660)kind=kind==='loop'?'line-loop':'flow';
  if(kind==='flow'||kind==='dispatch'||kind==='statemachine'&&bw<660){
    const rows=ranksOf(L,edges.map(e=>[e.a,e.b]));const maxM=Math.max(...rows.map(r=>r.length));const gx=18;const cw=Math.min(300,(bw-(maxM-1)*gx-(bw<660?0:40))/maxM);
    if(cw<172){kind=node.layout==='dispatch'?'line-d':'line-x'}else{const gy=38,ch=clamp(Math.floor((bh-(rows.length-1)*gy)/rows.length),64,92);
      rows.forEach((row,ri)=>{const w=row.length===1?Math.min(300,bw-8,Math.max(cw,220)):cw;const tw=row.length*w+(row.length-1)*gx;row.forEach((c,j)=>{P[c.id]={x:(bw-tw)/2+j*(w+gx),y:ri*(ch+gy),w,h:ch}})});H=rows.length*ch+(rows.length-1)*gy;
      return {P,H,edges:edges.map(e=>({...e,mode:'rank'})),kind:'rank'}}}
  if(kind==='loop'||kind==='statemachine'){const cw=Math.min(236,bw*.27),ch=76;const rx=Math.min((bw-cw)/2-6,380),ry=clamp((bh-ch)/2-4,150,250);H=2*ry+ch;const cx=bw/2,cy=ry+ch/2;
    L.forEach((c,i)=>{const a=(-90+360*i/n)*Math.PI/180;P[c.id]={x:cx+rx*Math.cos(a)-cw/2,y:cy+ry*Math.sin(a)-ch/2,w:cw,h:ch}});
    if(kind==='loop'&&!edges.length)edges=L.map((c,i)=>({a:c.id,b:L[(i+1)%n].id,label:''}));
    return {P,H,edges:edges.map(e=>({...e,mode:'ring'})),kind:'ring',ring:{cx,cy,rx,ry,loop:kind==='loop'}}}
  // line (default; also the phone fallback for loops and too-wide flows)
  const idx=id=>L.findIndex(c=>c.id===id);const isSeq=e=>idx(e.b)===idx(e.a)+1;const explicit=kind==='line-x';
  const extra=kind==='line-loop'?[{a:L[n-1].id,b:L[0].id,label:'下一圈'}]:kind==='line-d'?[]:edges.filter(e=>!isSeq(e));const side=extra.length?Math.min(84,bw*.16):0;
  const gap=n>7?13:n>5?18:22,ch=clamp(Math.floor((bh-(n-1)*gap)/n),phone()?62:52,100),cw=Math.min(bw-side-(phone()?0:8),620),x=Math.max(0,(bw-side-cw)/2);
  const top=Math.max(0,Math.min(28,(bh-(n*ch+(n-1)*gap))/2));
  L.forEach((c,i)=>{P[c.id]={x,y:top+i*(ch+gap),w:cw,h:ch}});H=top+n*ch+(n-1)*gap;
  const seq=[];if(kind!=='line-d')for(let i=0;i+1<n;i++){const ex=edges.find(e=>e.a===L[i].id&&e.b===L[i+1].id);if(explicit?ex:(L[i].kind!=='return'))seq.push({a:L[i].id,b:L[i+1].id,label:ex?ex.label:'',mode:'seq'})}
  return {P,H,edges:[...seq,...extra.map((e,i)=>({...e,mode:'side',i}))],kind:'line'}}
function edgePath(e,P){const a=P[e.a],b=P[e.b];if(!a||!b)return null;const acx=a.x+a.w/2,acy=a.y+a.h/2,bcx=b.x+b.w/2,bcy=b.y+b.h/2;
  if(e.mode==='seq')return {d:`M${acx} ${a.y+a.h}L${bcx} ${b.y-3}`,lx:acx+10,ly:(a.y+a.h+b.y)/2+4,anc:'start'};
  if(e.mode==='side'){const x0=Math.max(a.x+a.w,b.x+b.w),off=26+18*(e.i%3);return {d:`M${a.x+a.w} ${acy}C${x0+off} ${acy} ${x0+off} ${bcy} ${b.x+b.w+4} ${bcy}`,lx:x0+off*.78+4,ly:(acy+bcy)/2+4,anc:'start',x:true}}
  if(e.mode==='ring'){const dx=bcx-acx,dy=bcy-acy;const clip=(r,cx,cy,sx,sy)=>{const tx=sx?((r.w/2+4)/Math.abs(sx)):1e9,ty=sy?((r.h/2+4)/Math.abs(sy)):1e9,t=Math.min(tx,ty);return [cx+sx*t,cy+sy*t]};
    const p1=clip(a,acx,acy,dx,dy),p2=clip(b,bcx,bcy,-dx,-dy);const mx=(p1[0]+p2[0])/2,my=(p1[1]+p2[1])/2,L=Math.hypot(p2[0]-p1[0],p2[1]-p1[1])||1,bend=L*.1;
    const qx=mx-(p2[1]-p1[1])/L*bend,qy=my+(p2[0]-p1[0])/L*bend;return {d:`M${p1}Q${qx} ${qy} ${p2}`,lx:qx,ly:qy-5,anc:'middle'}}
  // ranked
  if(b.y>=a.y+a.h-1){const y1=a.y+a.h,y2=b.y-3,m=(y1+y2)/2;return {d:`M${acx} ${y1}C${acx} ${m} ${bcx} ${m} ${bcx} ${y2}`,lx:(acx+bcx)/2+(acx===bcx?8:0),ly:m+(acx===bcx?4:-4),anc:acx===bcx?'start':'middle'}}
  if(Math.abs(a.y-b.y)<2){const r=bcx>acx;const x1=r?a.x+a.w:a.x,x2=r?b.x-4:b.x+b.w+4;return {d:`M${x1} ${acy}L${x2} ${bcy}`,lx:(x1+x2)/2,ly:acy-6,anc:'middle'}}
  const x0=Math.max(a.x+a.w,b.x+b.w),off=30;return {d:`M${a.x+a.w} ${acy}C${x0+off} ${acy} ${x0+off} ${bcy} ${b.x+b.w+4} ${bcy}`,lx:x0+off*.8,ly:(acy+bcy)/2,anc:'start',x:true}}

/* ====================== render a level ====================== */
let cur='root',LAY=null,sel=null;
const page=$('page');
function cardHTML(c,i,p){const k=kids(c);const tag=KIND[c.kind]||'';const lane=LANE[c.lane];const ref=refOf(c);
  const go=k.length?`${k.length} 步 ›`:c.kind==='box'?'契约':c.kind==='external'?'':'源码 ›';
  const cls=['card','k-'+(c.kind||'step'),p.h<80?'sm':'',p.h<62?'xs':''].join(' ');
  return `<button class="${cls}" data-id="${esc(c.id)}" style="left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px;${lane?`--lane:${lane.col}`:''}">
    <span class="r1"><span class="num">${i+1}</span><span class="t">${esc(c.title)}</span>${tag?`<span class="tag">${tag}</span>`:''}</span>
    ${c.code?`<span class="c">${esc(c.code)}</span>`:''}
    <span class="f"><span class="ref">${esc(ref)}${lane?` · ${esc(lane.title)}`:''}</span><span class="go">${go}</span></span></button>`}
function render(){const node=N[cur];const st=$('stage');const isRoot=cur==='root';const lane=LANE[node.lane];
  const eb=isRoot?'<span>问题</span>':`<span>第 ${pathTo(cur).length-1} 层</span>${lane?`<span style="color:${lane.col}">${esc(lane.title)}</span>`:''}${node.kind&&KIND[node.kind]?`<span>${KIND[node.kind]}</span>`:''}`;
  const head=isRoot?`<div class="eb">${eb}</div><h1>${esc(meta.question||meta.title||'')}</h1>${meta.answer?`<p>${esc(meta.answer)}</p>`:''}`
    :`<div class="eb">${eb}</div><h1>${esc(node.title)}</h1>${node.code?`<div class="pcode">${esc(node.code)}${refOf(node)?' · '+esc(refOf(node)):''}</div>`:''}${node.problem?`<p>${esc(node.problem)}</p>`:''}`;
  page.innerHTML=`<div class="phead">${head}</div><div class="board" id="board"></div>`;
  const board=$('board');const cs=getComputedStyle(page);const bw=Math.min(page.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),1040);
  const bh=Math.max(260,st.clientHeight-page.querySelector('.phead').offsetHeight-14-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom));
  LAY=layout(node,bw,bh);board.style.width=bw+'px';board.style.height=LAY.H+'px';{const ph=page.querySelector('.phead');const x0=Math.min(...Object.values(LAY.P).map(p=>p.x));ph.style.maxWidth=bw+'px';ph.style.paddingLeft=(LAY.kind==='line'?x0:0)+'px';if(LAY.kind!=='line')ph.style.textAlign='center',ph.querySelectorAll('p,.eb').forEach(e=>{e.style.marginLeft='auto';e.style.marginRight='auto';e.style.justifyContent='center'})}
  let h='<svg><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L10 5L0 9z" fill="var(--faint)"/></marker><marker id="ahh" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L10 5L0 9z" fill="var(--amber)"/></marker></defs>';
  if(LAY.ring)h+=`<ellipse class="ring" cx="${LAY.ring.cx}" cy="${LAY.ring.cy}" rx="${LAY.ring.rx}" ry="${LAY.ring.ry}"/>`;
  for(const e of LAY.edges){const p=edgePath(e,LAY.P);if(!p)continue;h+=`<path class="edge${p.x?' x':''}" data-e="${esc(e.a)}>${esc(e.b)}" d="${p.d}" marker-end="url(#ah)"/>`;if(e.label)h+=`<text class="elab" x="${p.lx}" y="${p.ly}" text-anchor="${p.anc}">${esc(e.label)}</text>`}
  h+='</svg>';
  if(LAY.ring&&LAY.ring.loop)h+=`<div class="rlab" style="left:${LAY.ring.cx}px;top:${LAY.ring.cy}px"><b>每一圈</b>${esc(node.code||'')}</div>`;
  kids(node).forEach((c,i)=>{h+=cardHTML(c,i,LAY.P[c.id])});board.innerHTML=h;
  crumb();buildPanel();markWalk();$('back').disabled=isRoot}
const cardEl=id=>page.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
function crumb(){const el=$('crumb');el.innerHTML='';pathTo(cur).forEach((id,i,arr)=>{if(i){const s=document.createElement('span');s.className='sep';s.textContent='›';el.appendChild(s)}
  const b=document.createElement('button');b.textContent=id==='root'?(meta.short||'全程'):N[id].title;if(i===arr.length-1)b.className='cur';b.onclick=()=>nav(id,{select:arr[i+1]});el.appendChild(b)});el.scrollLeft=el.scrollWidth}

/* ====================== navigation with a push-in transition ====================== */
let busy=false;
async function nav(id,o={}){if(busy||!N[id])return;if(id===cur){if(o.select)flash(o.select);return}busy=true;closeReader();
  const deeper=pathTo(id).length>pathTo(cur).length;const from=o.zoomFrom&&cardEl(o.zoomFrom);
  if(!RM){const pr=page.getBoundingClientRect();if(from){const r=from.getBoundingClientRect();page.style.transformOrigin=`${r.left+r.width/2-pr.left+page.scrollLeft}px ${r.top+r.height/2-pr.top+page.scrollTop}px`}else page.style.transformOrigin='50% 40%';
    page.style.transition='transform .24s cubic-bezier(.4,0,1,1),opacity .22s';page.style.transform=`scale(${deeper?1.7:.86})`;page.style.opacity='0';await wait(230)}
  cur=id;if(o.push!==false){try{history.pushState(null,'',id==='root'?location.pathname+location.search:'#'+encodeURIComponent(id))}catch(e){}}
  page.scrollTop=0;render();
  if(!RM){page.style.transition='none';page.style.transformOrigin='50% 40%';if(o.select){const c=cardEl(o.select);if(c){const pr=page.getBoundingClientRect(),r=c.getBoundingClientRect();page.style.transformOrigin=`${r.left+r.width/2-pr.left}px ${r.top+r.height/2-pr.top}px`}}
    page.style.transform=`scale(${deeper?.9:1.25})`;void page.offsetWidth;page.style.transition='transform .3s cubic-bezier(0,0,.2,1),opacity .28s';page.style.transform='none';page.style.opacity='1';await wait(300);page.style.transition='';}
  else{page.style.opacity='1';page.style.transform='none'}
  if(o.select)flash(o.select);busy=false}
function flash(id){const c=cardEl(id);if(!c)return;c.classList.remove('flash');void c.offsetWidth;c.classList.add('flash');c.scrollIntoView({block:'nearest',behavior:RM?'auto':'smooth'})}
function up(){if(reader.on)return closeReader();if(cur==='root')return;const from=cur;nav(PARENT[from],{select:from})}
page.addEventListener('click',e=>{const c=e.target.closest('.card');if(!c)return;const n=N[c.dataset.id];
  if(kids(n).length)nav(n.id,{zoomFrom:n.id});else if(n.kind==='box'||n.kind==='external'||!rangesOf(n).length)focusItem(n.id);else openReader(n.id)});
$('back').onclick=up;
addEventListener('popstate',()=>{const id=decodeURIComponent(location.hash.slice(1))||'root';nav(N[id]?(kids(N[id]).length?id:PARENT[id]):'root',{push:false})});
addEventListener('keydown',e=>{if(e.key==='Escape')up();else if(e.key==='ArrowRight'&&WALK.length){stopPlay();goStep(wi+1)}else if(e.key==='ArrowLeft'&&WALK.length){stopPlay();goStep(wi-1)}else if(e.key===' '&&WALK.length&&!reader.on&&e.target===document.body){e.preventDefault();$('play').click()}});

/* ====================== inspector ====================== */
function stateChips(ids,col){return (ids||[]).filter(i=>STATE[i]).map(i=>`<span class="chip"><i style="background:${col}"></i>${esc(STATE[i].name)}</span>`).join('')}
function itemHTML(c,i){const k=kids(c);const ty=k.length?`${k.length} 步`:c.kind==='box'?'黑盒':c.kind==='external'?'外部':'源码';
  let d='';if(c.note)d+=`<div>${esc(c.note)}</div>`;
  if(c.contract)d+=`<div>吃：${esc(c.contract.in||'—')}<br>吐：${esc(c.contract.out||'—')}<br>副作用：${esc(c.contract.effect||'—')}</div>`;
  const rw=stateChips(c.reads,'var(--teal)')+stateChips(c.writes,'var(--pink)');if(rw)d+=`<div class="chips" style="margin-top:4px">${rw}</div>`;
  if(c.file)d+=`<div><code>${esc(c.file)}:${rangesOf(c).map(r=>r[0]===r[1]?r[0]:r[0]+'–'+r[1]).join(', ')}</code></div>`;
  return `<li data-i="${esc(c.id)}"><button data-go="${esc(c.id)}"><span class="n">${i+1}</span><span class="nm">${esc(c.title)}${c.ev?`<span class="ev">${c.ev==='infer'?'推断':'没把握'}</span>`:''}</span><span class="ty">${ty}</span></button>${d?`<div class="d">${d}</div>`:''}</li>`}
function buildPanel(){const node=N[cur];const b=$('pbody');let h='';
  if(cur==='root'){const ov=meta.overview?(Array.isArray(meta.overview)?meta.overview:[meta.overview]):[];
    h+=`<div class="eb">逻辑线</div><h2>${esc(meta.title||'')}</h2><p class="q">${esc(meta.question||'')}</p>${ov.map(p=>`<p>${esc(p)}</p>`).join('')}`;
    if(D.example)h+=`<h4>例子</h4><p><b>${esc(D.example.title||'')}</b></p>${D.example.setup?`<p style="color:var(--muted)">${esc(D.example.setup)}</p>`:''}`;
  }else{h+=`<div class="eb">${esc(pathTo(cur).slice(1,-1).map(i=>N[i].title).join(' › ')||'顶层阶段')}</div><h2>${esc(node.title)}</h2>${node.note?`<p>${esc(node.note)}</p>`:''}`;
    const rw=stateChips(node.reads,'var(--teal)')+stateChips(node.writes,'var(--pink)');if(rw)h+=`<div class="chips">${rw}</div>`;
    if(node.file)h+=`<button class="ib srcb" data-src="${esc(node.id)}"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 4L2 8l4 4M10 4l4 4-4 4"/></svg><div>读这一段的源码<br><span>${esc(node.file)}:${rangesOf(node).map(r=>r[0]+'–'+r[1]).join(', ')}</span></div></button>`}
  h+=`<h4>这一层的 ${kids(node).length} 步</h4><ol class="lst">${kids(node).map(itemHTML).join('')}</ol>`;
  if((node.omitted||[]).length){const cov=node._cov;h+=`<h4>这一层省略了什么${cov?` · ${cov.omitted} / ${cov.lines} 行`:''}</h4><ul class="om">${node.omitted.map(o=>`<li><code>L${o[0]}${o[1]!==o[0]?'–'+o[1]:''}</code>${esc(o[2])}</li>`).join('')}</ul>`}
  if(cur==='root'){if((D.lanes||[]).length)h+=`<h4>谁在执行（卡片左侧色条）</h4><div class="chips">${D.lanes.map(l=>`<span class="chip" style="font-family:var(--sans)"><i style="background:${LANE[l.id].col}"></i>${esc(l.title)}</span>`).join('')}</div>`;
    if((D.state||[]).length)h+=`<h4>贯穿全程的状态</h4><dl class="kv">${D.state.map(s=>`<dt class="mono">${esc(s.name)}</dt><dd>${esc(s.note||s.type||'')}</dd>`).join('')}</dl>`;
    h+=`<h4>怎么看</h4><ul class="pits"><li>每一页是这条逻辑线的一层，卡片从上到下就是执行顺序。</li><li>点一张卡进到它内部的步骤；到底了就是源码。左上角箭头或 Esc 返回。</li><li>同一页的卡片可以来自不同文件：这里按逻辑走，不按文件分。</li>${WALK.length?'<li>底部 ▶ 用一个具体例子把整条线跑一遍。</li>':''}</ul>`}
  b.innerHTML=h;b.parentElement.scrollTop=0;if(sel)focusItem(sel,true)}
function focusItem(id,quiet){sel=id;$('pbody').querySelectorAll('.lst li').forEach(li=>li.classList.toggle('on',li.dataset.i===id));const li=$('pbody').querySelector(`.lst li[data-i="${CSS.escape(id)}"]`);
  if(!quiet){if(phone())togglePanel(true);else if($('panel').hidden)togglePanel(true);if(li)li.scrollIntoView({block:'center',behavior:RM?'auto':'smooth'});flash(id)}}
$('pbody').addEventListener('click',e=>{const s=e.target.closest('[data-src]');if(s){if(phone())togglePanel(false);return openReader(s.dataset.src)}
  const g=e.target.closest('[data-go]');if(!g)return;const n=N[g.dataset.go];if(phone())togglePanel(false);
  if(kids(n).length)nav(n.id,{zoomFrom:n.id});else if(rangesOf(n).length&&n.kind!=='box')openReader(n.id);else focusItem(n.id)});
function togglePanel(on){const p=$('panel');if(phone()){p.hidden=false;p.classList.toggle('open',on??!p.classList.contains('open'));$('panelT').setAttribute('aria-pressed',String(p.classList.contains('open')));return}
  p.hidden=on===undefined?!p.hidden:!on;$('panelT').setAttribute('aria-pressed',String(!p.hidden));sizes();render()}
$('panelT').onclick=()=>togglePanel();$('pclose').onclick=()=>togglePanel(false);
$('theme').onclick=()=>{const r=document.documentElement;const dark=matchMedia('(prefers-color-scheme: dark)').matches;const c=r.dataset.theme||(dark?'dark':'light');r.dataset.theme=c==='dark'?'light':'dark'};

/* ====================== source reader ====================== */
const KW=new Set(('val var def private protected public override class object trait case match if else elif try catch except finally while for do throw throws raise new delete null nil None true false True False return import from as extends implements with yield type sealed lazy implicit this self super boolean int long short char byte float double void final static const constexpr auto struct enum union namespace using template typename virtual inline noexcept co_await co_return co_yield async await fn let mut impl pub mod use crate where loop move ref func go chan select defer package interface switch default break continue in is not and or lambda pass assert global nonlocal export function readonly unsigned signed sizeof typedef goto volatile register extern explicit friend operator mutable thread_local static_assert decltype nullptr unsafe dyn').split(' '));
function hiLine(t,lang,st){const out=[];const hash=['py','sh','rb','yaml','yml','toml','pl','r','cmake','bash','tcl'].includes(lang);
  if(st.inBlock){const j=t.indexOf('*/');if(j<0)return [['c',t]];out.push(['c',t.slice(0,j+2)]);t=t.slice(j+2);st.inBlock=false}
  if(st.inTriple){const j=t.indexOf(st.inTriple);if(j<0)return [['s',t]];out.push(['s',t.slice(0,j+3)]);t=t.slice(j+3);st.inTriple=null}
  const re=hash?/(#.*$)|("""|''')|([rbfu]?"(?:[^"\\]|\\.)*"|[rbfu]?'(?:[^'\\]|\\.)*')|(\b\d[\d_.xa-fA-F]*\b)|([A-Za-z_][A-Za-z0-9_]*)|(\s+)|(.)/g
               :/(\/\/.*$)|(\/\*)|(s?"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.){0,2}'|`[^`]*`)|(\b\d[\d_.xa-fA-FuUlL]*\b)|([A-Za-z_][A-Za-z0-9_]*)|(\s+)|(.)/g;
  let m;while((m=re.exec(t))){if(m[1])out.push(['c',m[1]]);
    else if(m[2]){const rest=t.slice(m.index);if(hash){const j=rest.indexOf(m[2],3);if(j<0){out.push(['s',rest]);st.inTriple=m[2];break}out.push(['s',rest.slice(0,j+3)]);re.lastIndex=m.index+j+3}
      else{const j=rest.indexOf('*/',2);if(j<0){out.push(['c',rest]);st.inBlock=true;break}out.push(['c',rest.slice(0,j+2)]);re.lastIndex=m.index+j+2}}
    else if(m[3])out.push(['s',m[3]]);else if(m[4])out.push(['n',m[4]]);else if(m[5])out.push([KW.has(m[5])?'k':/^[A-Z]/.test(m[5])?'y':'p',m[5]]);else out.push(['p',m[0]])}return out}
const reader={on:false,id:null};
function openReader(id,line){const n=N[id];const rs=rangesOf(n);if(!n.file||!rs.length)return;const F=FILES[n.file]||{};const lang=String(n.file).split('.').pop().toLowerCase();
  // section headers: children in the same file (their first line), and omitted ranges
  const heads={},om=[];for(const c of kids(n))if(c.file===n.file)for(const r of rangesOf(c)){heads[r[0]]=heads[r[0]]||{t:c.title,a:r[0],b:r[1]}}
  for(const o of n.omitted||[]){om.push(o);if(!heads[o[0]])heads[o[0]]={t:'省略：'+o[2],a:o[0],b:o[1],o:true}}
  const lines=[];rs.forEach((r,i)=>{if(i)lines.push([0,'⋯']);for(let l=r[0];l<=r[1];l++)lines.push([l,F[l]??''])});
  const ind=Math.min(...lines.filter(l=>l[0]&&l[1].trim()).map(l=>l[1].length-l[1].trimStart().length),99);const st={};let h='';
  for(const [ln,t0] of lines){if(!ln){h+=`<div class="cl gap"><span class="n"></span><span class="x">⋯</span></div>`;continue}
    const hd=heads[ln];if(hd)h+=`<div class="rb${hd.o?' o':''}"><span>${esc(hd.t)}</span><small>L${hd.a}${hd.b!==hd.a?'–'+hd.b:''}</small></div>`;
    const t=t0.slice(Math.min(ind,t0.length-t0.trimStart().length));const isO=om.some(o=>ln>=o[0]&&ln<=o[1]);
    h+=`<div class="cl${isO?' o':''}" data-ln="${ln}"><span class="n">${ln}</span><span class="x">${hiLine(t,lang,st).map(([c,s])=>`<span class="t${c}">${esc(s)}</span>`).join('')}</span></div>`}
  $('rt').textContent=n.title;$('rf').textContent=`${n.file}:${rs.map(r=>r[0]+'–'+r[1]).join(', ')}`;$('rnote').textContent=n.note||n.problem||'';$('rnote').hidden=!(n.note||n.problem);
  $('rbody').innerHTML=h;$('reader').classList.add('on');$('scrim').classList.add('on');reader.on=true;reader.id=id;
  const b=$('rbody');if(line){const el=b.querySelector(`.cl[data-ln="${line}"]`);if(el){el.classList.add('cur');b.scrollTop=Math.max(0,el.offsetTop-b.clientHeight*.3)}}else b.scrollTop=0}
function closeReader(){if(!reader.on)return;reader.on=false;$('reader').classList.remove('on');$('scrim').classList.remove('on')}
$('rclose').onclick=closeReader;$('scrim').onclick=closeReader;

/* ====================== example walk ====================== */
const WALK=D.walk||[];let wi=-1,playing=false,timer=null;
const ICON_PLAY='<svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>',ICON_PAUSE='<svg viewBox="0 0 16 16"><rect x="3.5" y="2.5" width="3" height="11" rx="1" fill="currentColor"/><rect x="9.5" y="2.5" width="3" height="11" rx="1" fill="currentColor"/></svg>';
function stateAt(i){const cur={},chg=new Set();for(let j=0;j<=i;j++)for(const [k,v] of Object.entries(WALK[j].state||{})){cur[k]=v;if(j===i)chg.add(k)}return {cur,chg}}
function markWalk(){page.querySelectorAll('.card').forEach(c=>{c.classList.remove('cur','dim');const v=c.querySelector('.v');if(v)v.remove()});page.querySelectorAll('.edge.hot').forEach(e=>{e.classList.remove('hot');e.setAttribute('marker-end','url(#ah)')});
  if(wi<0)return;const s=WALK[wi];const path=pathTo(s.node);const here=path.find(id=>PARENT[id]===cur);if(!here)return;
  page.querySelectorAll('.card').forEach(c=>c.classList.add('dim'));const c=cardEl(here);if(c){c.classList.remove('dim');c.classList.add('cur');if(s.value&&here===s.node){const v=document.createElement('span');v.className='v';v.textContent=s.value;c.appendChild(v)}}
  // light the edge we arrived by
  if(wi>0){const prev=pathTo(WALK[wi-1].node).find(id=>PARENT[id]===cur);if(prev&&prev!==here){const e=page.querySelector(`.edge[data-e="${CSS.escape(prev)}>${CSS.escape(here)}"]`);if(e){e.classList.add('hot');e.setAttribute('marker-end','url(#ahh)')}const pc=cardEl(prev);if(pc)pc.classList.remove('dim')}}}
function showStep(){const s=WALK[wi];const n=N[s.node];$('stxt').textContent=s.text||'';$('scount').textContent=`${wi+1} / ${WALK.length}`;
  $('sprog').querySelectorAll('i').forEach((e,i)=>{e.className=i===wi?'cur':i<wi?'seen':''});
  const {cur:sv,chg}=stateAt(wi);let h=s.value?`<span class="val">${esc(s.value)}</span>`:'';
  if(n.file&&rangesOf(n).length)h+=`<button class="ib lineb" id="lineb">${esc(String(n.file).split('/').pop())}:${s.line||rangesOf(n)[0][0]} ›</button>`;
  for(const [k,v] of Object.entries(sv))if(STATE[k])h+=`<span class="st${chg.has(k)?' chg':''}" title="${esc(STATE[k].note||'')}">${esc(STATE[k].name)} = <b>${esc(v)}</b></span>`;
  $('smeta').innerHTML=h;const lb=$('lineb');if(lb)lb.onclick=()=>{stopPlay();openReader(n.id,s.line)}}
async function goStep(i){if(!WALK.length||busy)return;wi=(i+WALK.length)%WALK.length;const s=WALK[wi];const was=$('player').classList.contains('open');$('player').classList.add('open');if(!was){sizes()}
  showStep();closeReader();{const o=getComputedStyle(document.documentElement).getPropertyValue('--pb');sizes();if(o!==getComputedStyle(document.documentElement).getPropertyValue('--pb')&&(PARENT[s.node]||'root')===cur)render()}const target=PARENT[s.node]||'root';if(target!==cur){const deeper=pathTo(target).length>pathTo(cur).length;await nav(target,deeper&&PARENT[target]===cur?{zoomFrom:target}:{select:s.node})}else{if(!was)render();markWalk()}
  const c=cardEl(s.node);if(c)c.scrollIntoView({block:'nearest',behavior:RM?'auto':'smooth'})}
function sched(){clearTimeout(timer);if(!playing)return;const s=WALK[wi];timer=setTimeout(async()=>{if(wi+1>=WALK.length){stopPlay();return}await goStep(wi+1);sched()},clamp((s.text||'').length*65,2800,9000))}
function stopPlay(){playing=false;$('play').innerHTML=ICON_PLAY;$('play').setAttribute('aria-label','用例子走一遍');clearTimeout(timer)}
$('play').onclick=()=>{if(playing)return stopPlay();playing=true;$('play').innerHTML=ICON_PAUSE;$('play').setAttribute('aria-label','暂停');goStep(wi+1>=WALK.length?0:wi+1).then(sched)};
$('next').onclick=()=>{stopPlay();goStep(wi+1)};$('prev').onclick=()=>{stopPlay();goStep(wi<=0?0:wi-1)};
$('sexp').onclick=()=>{const p=$('player');p.classList.toggle('open');$('sexp').style.transform=p.classList.contains('open')?'rotate(180deg)':'';sizes();render()};
$('sprog').addEventListener('click',e=>{const r=$('sprog').getBoundingClientRect();stopPlay();goStep(clamp(Math.floor((e.clientX-r.left)/r.width*WALK.length),0,WALK.length-1))});

/* ====================== boot ====================== */
function sizes(){const pw=(!phone()&&!$('panel').hidden)?372:0;document.documentElement.style.setProperty('--pwv',pw+'px');document.documentElement.style.setProperty('--pb',($('player').hidden?0:$('player').offsetHeight+16)+'px');$('sexp').style.transform=$('player').classList.contains('open')?'rotate(180deg)':''}
let rz=null;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{sizes();render()},120)});
$('play').innerHTML=ICON_PLAY;
if(WALK.length){$('sname').textContent='例子：'+((D.example&&D.example.title)||'走一遍');$('scount').textContent=`${WALK.length} 步`;$('sprog').innerHTML=WALK.map(()=>'<i></i>').join('')}else $('player').hidden=true;
if(phone())$('panelT').setAttribute('aria-pressed','false');
sizes();
{const id=decodeURIComponent(location.hash.slice(1));if(N[id])cur=kids(N[id]).length?id:(PARENT[id]||'root')}
render();
window.__flow={nav,N,PARENT,goStep,openReader,closeReader,cur:()=>cur,walk:()=>WALK,pages:()=>Object.keys(N).filter(i=>kids(N[i]).length)};
})();
</script>
