<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Code Canvas · 结构图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: header (back · title · breadcrumb · tools); the stage shows ONE level of the logic line as a page of 3-9 uniform step cards,
   laid out for the screen; entering a card pushes the camera into it and swaps in the next page. Right: inspector (bottom sheet on phones).
   Bottom: example player. Leaves open a source reader sheet. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface2:#f6f8fb; --ink:#17202b; --muted:#5d6878; --faint:#9aa4b2; --line:#d9dee6; --cardline:#cdd5e0; --hl:#e8eefa;
  --blue:#2f6fe0; --pink:#d63b6c; --amber:#d9850f; --mint:#14946f; --violet:#7a4fe0; --teal:#0e8fa3; --red:#d14545; --grey:#8a96a6;
  --kw:#7a3fc9; --str:#2e7d32; --com:#8a94a0; --num:#c25e00; --ty:#1565c0;
  --shadow:0 1px 2px rgba(23,32,43,.06),0 8px 24px rgba(23,32,43,.08);
  --sans:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --hh:56px; --pw:340px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1218; --surface:#151b24; --surface2:#1a222d; --ink:#e6ebf2; --muted:#93a0b2; --faint:#647083; --line:#2a3341; --cardline:#313c4d; --hl:#1b2536;
  --blue:#5fa8ff; --pink:#ff7096; --amber:#ffb648; --mint:#4fd1a5; --violet:#b69cff; --teal:#4fc9db; --red:#ff7a7a; --grey:#7f8ca0;
  --kw:#c99bff; --str:#9fd8a3; --com:#6f7c8f; --num:#ffb27a; --ty:#7fc8ff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1218; --surface:#151b24; --surface2:#1a222d; --ink:#e6ebf2; --muted:#93a0b2; --faint:#647083; --line:#2a3341; --cardline:#313c4d; --hl:#1b2536;
  --blue:#5fa8ff; --pink:#ff7096; --amber:#ffb648; --mint:#4fd1a5; --violet:#b69cff; --teal:#4fc9db; --red:#ff7a7a; --grey:#7f8ca0;
  --kw:#c99bff; --str:#9fd8a3; --com:#6f7c8f; --num:#ffb27a; --ty:#7fc8ff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mono{font-family:var(--mono)}
#app{position:fixed;inset:0;overflow:hidden;background-image:radial-gradient(color-mix(in srgb,var(--line) 80%,transparent) 1px,transparent 1px);background-size:22px 22px}

/* header */
.hdr{position:absolute;top:0;left:0;right:0;z-index:5;height:var(--hh);padding:env(safe-area-inset-top,0px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--surface) 94%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ttl{font-weight:600;font-size:15px;white-space:nowrap;flex:none;max-width:32vw;overflow:hidden;text-overflow:ellipsis}
.crumb{display:flex;align-items:center;gap:2px;min-width:0;flex:1;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.crumb::-webkit-scrollbar{display:none}
.crumb button{border:0;background:none;color:var(--muted);font-size:13.5px;padding:4px 7px;border-radius:6px;cursor:pointer;white-space:nowrap;max-width:22em;overflow:hidden;text-overflow:ellipsis}
.crumb button:hover{background:var(--surface2);color:var(--ink)}
.crumb button.cur{color:var(--ink);font-weight:600}
.crumb .sep{color:var(--faint);font-size:12px}
.tools{display:flex;gap:6px;flex:none}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:32px;min-width:32px;padding:0 10px;cursor:pointer;color:var(--ink);font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none}
.ib:hover{border-color:var(--blue)}
.ib:disabled{opacity:.35;cursor:default;border-color:var(--line)}
.ib[aria-pressed="true"]{background:var(--hl);border-color:color-mix(in srgb,var(--blue) 50%,var(--line))}
.ib svg{width:16px;height:16px;flex:none}

/* stage */
.stage{position:absolute;top:var(--hh);left:0;right:var(--pwv,0px);bottom:var(--pb,0px);overflow:hidden}
.page{position:absolute;inset:0;overflow:auto;padding:18px 20px 14px;will-change:transform,opacity}
.phead{max-width:760px;margin:0 auto 14px}
.eb{font-size:11.5px;letter-spacing:.06em;color:var(--muted);font-weight:600;text-transform:uppercase;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.phead h1{font-size:22px;line-height:1.3;margin:3px 0 4px;font-weight:600;text-wrap:balance}
.phead .pcode{font-family:var(--mono);font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.phead p{margin:6px 0 0;color:var(--muted);font-size:14.5px;max-width:68ch}
.board{position:relative;margin:0 auto}
.board svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.edge{fill:none;stroke:var(--faint);stroke-width:1.6}
.edge.x{stroke-dasharray:5 4}
.edge.hot{stroke:var(--amber);stroke-width:2.4}
.elab{font-family:var(--sans);font-size:12px;font-weight:500;fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.ring{fill:none;stroke:var(--line);stroke-width:1.4;stroke-dasharray:3 6}
.rlab{position:absolute;transform:translate(-50%,-50%);text-align:center;color:var(--muted);font-size:13px;max-width:220px}
.rlab b{display:block;color:var(--ink);font-size:15px}


/* ---------- diagram level ---------- */
.board{position:relative;margin:0 auto}
.binner{position:absolute;left:0;top:0;transform-origin:0 0}
.binner>svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.grp{fill:color-mix(in srgb,var(--ink) 2.5%,transparent);stroke:var(--cardline);stroke-width:1.2;stroke-dasharray:5 5}
.grpt{font-family:var(--sans);font-size:12px;font-weight:600;fill:var(--muted);letter-spacing:.04em}
.edge{fill:none;stroke-width:1.8;opacity:.8}
.edge.return{stroke-dasharray:6 5}
.edge.async{stroke-dasharray:2 5;stroke-linecap:round}
.edge.dimd{opacity:.14}
.edge.hot{stroke-width:3.2;opacity:1}
.elab{font-family:var(--sans);font-size:12px;font-weight:500;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.elab.dimd,.enum.dimd{opacity:.15}
.enum circle{stroke:var(--bg);stroke-width:2}
.enum text{font-family:var(--mono);font-size:10.5px;font-weight:600;fill:#fff}
.node{position:absolute;display:flex;flex-direction:column;gap:4px;text-align:left;border:1.2px solid var(--cardline);background:var(--surface);border-radius:14px;padding:11px 13px 9px;cursor:pointer;overflow:hidden;
  transition:border-color .15s,box-shadow .15s,opacity .25s}
.node:hover{border-color:var(--blue);box-shadow:var(--shadow)}
.node .h{display:flex;gap:9px;align-items:center;min-width:0}
.node .ic{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:color-mix(in srgb,var(--kc,var(--teal)) 14%,transparent);color:var(--kc,var(--teal))}
.node .ic svg{width:15px;height:15px}
.node .t{flex:1;min-width:0;font-weight:600;font-size:14.5px;line-height:1.3;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.node .d{font-size:12.5px;line-height:1.45;color:var(--muted);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--dl,2);overflow:hidden}
.node .f{margin-top:auto;display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--faint);min-width:0}
.node .f .c{font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.node .f .go{margin-left:auto;white-space:nowrap;color:var(--blue);font-weight:500;background:color-mix(in srgb,var(--blue) 10%,transparent);border-radius:999px;padding:0 8px}
.node.k-external,.node.k-outside{background:var(--surface2);border-style:dashed}
.node.k-outside{padding:8px 12px;justify-content:center;border-radius:999px}
.node.k-outside .t{font-size:13px;font-weight:500;color:var(--muted)}
.node.k-queue,.node.k-store,.node.k-state{background:color-mix(in srgb,var(--kc) 5%,var(--surface))}
.slots{display:flex;gap:3px;margin:1px 0}
.slots i{width:13px;height:11px;border-radius:2.5px;border:1px solid color-mix(in srgb,var(--kc) 55%,var(--line))}
.slots i.on{background:color-mix(in srgb,var(--kc) 30%,transparent)}
.node.dim{opacity:.32}
.node.cur{border-color:var(--amber);box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 28%,transparent),var(--shadow);opacity:1}
.node.flash{animation:flash 1s ease-out}
.node .v{position:absolute;right:9px;top:9px;font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--amber);background:color-mix(in srgb,var(--amber) 16%,var(--surface));border-radius:6px;padding:0 7px;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---------- function level: pseudo-code + source ---------- */
.fn{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px;max-width:1180px;margin:0 auto;align-items:start}
.pc{display:flex;flex-direction:column;gap:5px;min-width:0}
.pc h3,.srcw h3{margin:0 0 4px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.ps{display:flex;gap:9px;align-items:flex-start;text-align:left;border:1.2px solid var(--cardline);background:var(--surface);border-radius:10px;padding:7px 10px;cursor:pointer;min-width:0;position:relative}
.ps:hover{border-color:var(--blue)}
.ps.sel{border-color:var(--blue);background:var(--hl)}
.ps.cur{border-color:var(--amber);box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 26%,transparent)}
.ps.dim{opacity:.4}
.ps .num{flex:none;width:20px;height:20px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);color:var(--muted);font-family:var(--mono);font-size:11px;display:grid;place-items:center;margin-top:1px}
.ps .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ps .t{font-weight:600;font-size:14px;line-height:1.4}
.ps .c{font-family:var(--mono);font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.ps .n{font-size:12.5px;color:var(--muted)}
.ps .tag{flex:none;font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.ps .tag.decision{background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber)}
.ps .tag.loop{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}
.ps .tag.write{background:color-mix(in srgb,var(--pink) 14%,transparent);color:var(--pink)}
.ps .tag.wait{background:color-mix(in srgb,var(--violet) 14%,transparent);color:var(--violet)}
.ps .tag.return{background:color-mix(in srgb,var(--mint) 16%,transparent);color:var(--mint)}
.ps .tag.call{background:color-mix(in srgb,var(--teal) 14%,transparent);color:var(--teal);cursor:pointer}
.ps .v{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--amber)}
.pom{font-size:12.5px;color:var(--faint);padding:2px 10px}
.srcw{min-width:0;position:sticky;top:0}
.srcbox{border:1px solid var(--cardline);background:var(--surface);border-radius:12px;overflow:auto;font-family:var(--mono);font-size:12.5px;line-height:1.6;padding-bottom:12px}
.cl.sel{background:var(--hl)}
@media (max-width:820px){.fn{grid-template-columns:minmax(0,1fr)}.srcw{position:static}.srcbox{max-height:none!important}}

/* step card (unused) */
.card{position:absolute;display:flex;flex-direction:column;justify-content:center;gap:3px;text-align:left;border:1.2px solid var(--cardline);background:var(--surface);border-radius:12px;
  padding:8px 12px 8px 16px;cursor:pointer;overflow:hidden;transition:border-color .15s,box-shadow .15s,opacity .25s,transform .15s}
.card:hover{border-color:var(--blue);box-shadow:var(--shadow)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--lane,var(--cardline))}
.card .r1{display:flex;gap:8px;align-items:flex-start;min-width:0}
.card .num{flex:none;width:20px;height:20px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);color:var(--muted);font-family:var(--mono);font-size:11px;display:grid;place-items:center;margin-top:1px}
.card .t{flex:1;min-width:0;font-weight:600;font-size:14.5px;line-height:1.35;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.card .tag{flex:none;font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;background:var(--surface2);color:var(--muted);white-space:nowrap;margin-top:1px}
.card .c{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:28px}
.card .f{display:flex;gap:8px;align-items:center;padding-left:28px;font-size:11.5px;color:var(--faint);min-width:0}
.card .f .ref{font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.card .f .go{margin-left:auto;white-space:nowrap;color:var(--blue);font-weight:500}
.card.sm .f{display:none}
.card.xs .c{display:none}
.card.xs .t{-webkit-line-clamp:1}
.card.xs{padding-top:4px;padding-bottom:4px}
.card.k-decision{border-style:solid;border-radius:12px}
.card.k-decision .tag{background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber)}
.card.k-loop .tag{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}
.card.k-write .tag{background:color-mix(in srgb,var(--pink) 14%,transparent);color:var(--pink)}
.card.k-wait .tag{background:color-mix(in srgb,var(--violet) 14%,transparent);color:var(--violet)}
.card.k-return .tag{background:color-mix(in srgb,var(--mint) 16%,transparent);color:var(--mint)}
.card.k-box{background:var(--surface2);border-style:dashed}
.card.k-external{background:transparent;border-style:dashed}
.card.k-external .go,.card.k-external .f{display:none}
.card.dim{opacity:.38}
.card.cur{border-color:var(--amber);box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 28%,transparent),var(--shadow);opacity:1}
.card.flash{animation:flash 1s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 6px color-mix(in srgb,var(--blue) 45%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
.card .v{position:absolute;right:10px;bottom:6px;font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--amber);background:color-mix(in srgb,var(--amber) 14%,var(--surface));border-radius:6px;padding:0 7px;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* inspector */
.panel{position:absolute;z-index:4;top:var(--hh);right:0;bottom:0;width:var(--pw);background:var(--surface);border-left:1px solid var(--line);overflow:auto;
  padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));font-size:13.5px;line-height:1.6}
.panel .grab,.panel .pclose{display:none}
.panel h2{font-size:18px;line-height:1.35;margin:4px 0 8px;text-wrap:balance}
.panel h4{font-size:12px;color:var(--muted);font-weight:600;margin:18px 0 6px;letter-spacing:.04em}
.panel p{margin:0 0 8px}
.q{border-left:3px solid var(--blue);padding:2px 0 2px 10px;margin:8px 0;font-size:14.5px}
.lst{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.lst li{border:1px solid var(--line);border-radius:9px;overflow:hidden}
.lst li.on{border-color:var(--blue);box-shadow:0 0 0 2px color-mix(in srgb,var(--blue) 22%,transparent)}
.lst button{width:100%;text-align:left;border:0;background:var(--surface);padding:7px 10px;cursor:pointer;display:flex;gap:9px;align-items:baseline}
.lst button:hover{background:var(--hl)}
.lst .n{font-family:var(--mono);font-size:11px;color:var(--faint);flex:none}
.lst .nm{font-weight:600;min-width:0}
.lst .ty{margin-left:auto;font-size:11px;color:var(--faint);white-space:nowrap}
.lst .d{padding:0 10px 8px 30px;color:var(--muted);font-size:13px}
.lst .d code{font-family:var(--mono);font-size:11.5px;color:var(--ink);overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 12px;margin:0;background:var(--surface2);border-radius:8px;padding:10px 12px}
.kv dt{color:var(--muted);white-space:nowrap;font-size:12.5px}
.kv dd{margin:0;font-size:13px;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:2px 9px;font-family:var(--mono)}
.chip i{width:7px;height:7px;border-radius:50%;flex:none}
.om{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.om code{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-right:6px}
.srcb{width:100%;justify-content:flex-start;margin-top:6px;height:auto;padding:7px 10px;text-align:left}
.srcb span{font-family:var(--mono);font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.ev{font-size:11px;font-weight:600;border-radius:4px;padding:0 5px;margin-left:6px;background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber)}
.pits{margin:0;padding-left:18px}

/* player */
.player{position:absolute;z-index:3;left:max(12px,env(safe-area-inset-left,0px));right:calc(var(--pwv,0px) + 12px);bottom:calc(12px + env(safe-area-inset-bottom,0px));
  max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.srow{display:flex;align-items:center;gap:10px;padding:8px 10px}
.pbtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--blue);color:#fff;cursor:pointer;flex:none;display:grid;place-items:center}
.pbtn svg{width:16px;height:16px}
.smain{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.stitle{display:flex;gap:8px;align-items:baseline;min-width:0;font-size:13px}
.stitle b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.stitle span{color:var(--muted);font-family:var(--mono);font-size:12px;white-space:nowrap;margin-left:auto}
.sprog{display:flex;gap:2px;height:6px;cursor:pointer}
.sprog i{flex:1;border-radius:2px;background:var(--line)}
.sprog i.seen{background:color-mix(in srgb,var(--amber) 40%,var(--line))}
.sprog i.cur{background:var(--amber)}
.sbody{border-top:1px solid var(--line);padding:9px 14px 11px;display:flex;flex-direction:column;gap:7px}
.player:not(.open) .sbody{display:none}
.stxt{margin:0;font-size:14.5px;line-height:1.6;max-height:6.4em;overflow:auto}
.smeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.val{font-family:var(--mono);font-size:12.5px;color:var(--amber);font-weight:600;background:color-mix(in srgb,var(--amber) 12%,transparent);border-radius:6px;padding:1px 8px}
.val:empty{display:none}
.st{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:0 7px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st b{color:var(--ink);font-weight:500}
.st.chg{border-color:var(--amber);color:var(--ink)}
.lineb{font-family:var(--mono);font-size:11.5px;height:24px;padding:0 8px}

/* reader */
.scrim{position:absolute;z-index:6;inset:0;background:color-mix(in srgb,var(--bg) 82%,transparent);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.reader{position:absolute;z-index:7;display:none;flex-direction:column;background:var(--surface);border:1px solid var(--cardline);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;
  top:calc(var(--hh) + 14px);bottom:14px;left:50%;width:min(1000px,calc(100% - 28px));transform:translateX(-50%)}
.reader.on{display:flex;animation:rin .22s ease-out}
@keyframes rin{from{opacity:0;transform:translateX(-50%) scale(.97)}to{opacity:1;transform:translateX(-50%)}}
.rh{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line);flex:none}
.rh .rt{font-weight:600;font-size:15px;min-width:0}
.rh .rf{font-family:var(--mono);font-size:11.5px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:auto}
.rnote{padding:8px 16px;border-bottom:1px solid var(--line);color:var(--muted);font-size:13.5px;flex:none}
.rbody{overflow:auto;overscroll-behavior:contain;flex:1;padding:0 0 30vh;font-family:var(--mono);font-size:13px;line-height:1.6}
.rb{position:sticky;top:0;left:0;z-index:1;font-family:var(--sans);font-size:13px;font-weight:500;background:var(--surface2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 16px;display:flex;gap:8px;align-items:baseline}
.rb:first-child{border-top:0}
.rb::before{content:"";width:3px;align-self:stretch;border-radius:2px;background:var(--blue);flex:none}
.rb.o{color:var(--muted);font-weight:400}.rb.o::before{background:var(--faint)}
.rb small{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap}
.cl{display:grid;grid-template-columns:3.8em max-content;column-gap:1em;padding-right:16px;min-width:max-content}
.cl .n{color:var(--faint);text-align:right;user-select:none}
.cl .x{white-space:pre}
.cl.gap .x{color:var(--com)}
.cl.o{opacity:.45}
.cl.cur{background:color-mix(in srgb,var(--amber) 16%,transparent);box-shadow:inset 3px 0 0 var(--amber);opacity:1}
.tk{color:var(--kw)} .ts{color:var(--str)} .tc{color:var(--com);font-style:italic} .tn{color:var(--num)} .ty{color:var(--ty)} .tp{color:var(--ink)}

@media (prefers-reduced-motion: reduce){.card,.scrim{transition:none}.reader.on,.card.flash{animation:none}}
@media (max-width:820px){
  :root{--hh:92px}
  .hdr{flex-wrap:wrap;align-content:center;gap:4px 8px;padding-bottom:4px}
  .ttl{max-width:none;flex:1;font-size:14.5px}
  .crumb{order:3;flex-basis:100%}
  .page{padding:12px 12px 10px}
  .phead h1{font-size:19px}
  .phead p{font-size:14px}
  .panel{top:auto;left:0;width:auto;height:74%;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:var(--shadow);z-index:8;transform:translateY(105%);transition:transform .28s ease}
  .panel.open{transform:none}
  .panel .grab{display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 10px}
  .panel .pclose{display:inline-flex;position:sticky;top:0;float:right;margin:-4px -4px 0 8px}
  .player{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .stxt{font-size:14px;max-height:5em}
  .reader{top:calc(var(--hh) + 8px);bottom:8px;width:calc(100% - 16px)}
  .cl{grid-template-columns:2.9em minmax(0,1fr);min-width:0;column-gap:.6em}
  .cl .x{white-space:pre-wrap;overflow-wrap:break-word}
  .rbody{font-size:12.5px}
  .ib .lbl{display:none}
}
</style>
</head>
<body>
<div id="app">
  <header class="hdr">
    <button class="ib" id="back" aria-label="回到上一层"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 3L5 8l5 5"/></svg></button>
    <span class="ttl" id="ttl"></span>
    <nav class="crumb" id="crumb" aria-label="当前位置"></nav>
    <div class="tools">
      <button class="ib" id="theme" aria-label="切换明暗"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg></button>
      <button class="ib" id="panelT" aria-pressed="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2.5" width="12" height="11" rx="2"/><path d="M10 2.5v11"/></svg><span class="lbl">说明</span></button>
    </div>
  </header>
  <main class="stage" id="stage"><div class="page" id="page"></div></main>
  <aside class="panel" id="panel" aria-label="说明"><div class="grab"></div><button class="ib pclose" id="pclose" aria-label="关闭说明"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4l8 8M12 4l-8 8"/></svg></button><div id="pbody"></div></aside>
  <div class="player" id="player">
    <div class="srow">
      <button class="pbtn" id="play" aria-label="用例子走一遍"></button>
      <div class="smain"><div class="stitle"><b id="sname"></b><span id="scount"></span></div><div class="sprog" id="sprog"></div></div>
      <button class="ib" id="prev" aria-label="上一步"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 3L5 8l5 5"/></svg></button>
      <button class="ib" id="next" aria-label="下一步"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3l5 5-5 5"/></svg></button>
      <button class="ib" id="sexp" aria-label="展开或收起"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10l5-5 5 5"/></svg></button>
    </div>
    <div class="sbody" aria-live="polite"><p class="stxt" id="stxt"></p><div class="smeta" id="smeta"></div></div>
  </div>
  <div class="scrim" id="scrim"></div>
  <section class="reader" id="reader" aria-label="源码">
    <div class="rh"><span class="rt" id="rt"></span><span class="rf" id="rf"></span><button class="ib" id="rclose" aria-label="关闭源码"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
    <div class="rnote" id="rnote"></div>
    <div class="rbody" id="rbody"></div>
  </section>
</div>
<script>
const DATA=/*FLOW_DATA*/null;
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const D=DATA||{meta:{title:'（空）'},root:{id:'root',children:[]}};
const meta=D.meta||{};$('ttl').textContent=meta.title||'';document.title=meta.title||'Code Canvas';
const FILES=D.files||{};
const LANEC=['var(--blue)','var(--teal)','var(--amber)','var(--violet)','var(--mint)','var(--pink)','var(--grey)'];
const LANE={};(D.lanes||[]).forEach((l,i)=>LANE[l.id]={...l,col:LANEC[i%LANEC.length]});
const STATE={};(D.state||[]).forEach(s=>STATE[s.id]=s);
// index the tree
const N={},PARENT={};(function ix(n,p){N[n.id]=n;PARENT[n.id]=p;(n.children||[]).forEach(c=>ix(c,n.id))})(D.root,null);
const kids=n=>n.children||[];
const rangesOf=n=>n.ranges?n.ranges:(n.lines?[n.lines]:[]);
const refOf=n=>{const r=rangesOf(n);return n.file&&r.length?`${String(n.file).split('/').pop()}:${r[0][0]}`:''};
const pathTo=id=>{const p=[];for(let x=id;x;x=PARENT[x])p.unshift(x);return p};

/* ====================== one level = one diagram ====================== */
const phone=()=>innerWidth<=820;
const steps=n=>n.steps||[];
const isPage=n=>kids(n).length>0||steps(n).length>0;
const KC={flow:'var(--blue)',call:'var(--teal)',queue:'var(--amber)',return:'var(--mint)',async:'var(--violet)',data:'var(--grey)',error:'var(--red)'};
const KN={flow:'主流程',call:'调用',queue:'入队 / 出队',return:'返回 / 回程',async:'异步 / 回调',data:'读写数据',error:'错误'};
const NK={thread:['线程','var(--blue)'],loop:['循环','var(--blue)'],component:['部件','var(--teal)'],function:['函数','var(--mint)'],queue:['队列','var(--amber)'],store:['存储','var(--violet)'],state:['状态','var(--violet)'],external:['外部','var(--grey)'],outside:['','var(--grey)']};
const ICON={thread:'<path d="M12.5 8a4.5 4.5 0 1 1-1.5-3.4M11.5 2.5v2.4H9.1"/>',loop:'<path d="M12.5 8a4.5 4.5 0 1 1-1.5-3.4M11.5 2.5v2.4H9.1"/>',component:'<rect x="3" y="3" width="10" height="10" rx="2"/>',
  function:'<path d="M10.5 3.5c-2 0-2.3 1.2-2.6 3L7 12c-.3 1.3-1 1.6-2 1.4M5.5 7h5"/>',queue:'<rect x="2" y="5" width="3" height="6" rx=".8"/><rect x="6.5" y="5" width="3" height="6" rx=".8"/><rect x="11" y="5" width="3" height="6" rx=".8"/>',
  store:'<ellipse cx="8" cy="4.5" rx="5" ry="2"/><path d="M3 4.5v7c0 1.1 2.2 2 5 2s5-.9 5-2v-7M3 8c0 1.1 2.2 2 5 2s5-.9 5-2"/>',state:'<circle cx="5" cy="8" r="2.2"/><circle cx="11.5" cy="8" r="2.2"/><path d="M7.2 8h2"/>',
  external:'<circle cx="8" cy="8" r="5" stroke-dasharray="2.5 2.5"/>',outside:'<path d="M5 11l6-6M6.5 5H11v4.5"/>'};
const CW=272,RH=176,GX=84,GY=58;
const edgesOf=n=>(n.edges||[]).map(e=>Array.isArray(e)?{from:e[0],to:e[1],label:e[2]||'',kind:e[3]||'flow',n:e[4]}:e).map(e=>({...e,kind:KC[e.kind]?e.kind:'flow'}));
let cur='root',LAY=null,sel=null;
const page=$('page');
function side(b,s){return s==='r'?[b.x+b.w,b.y+b.h/2]:s==='l'?[b.x,b.y+b.h/2]:s==='t'?[b.x+b.w/2,b.y]:[b.x+b.w/2,b.y+b.h]}
function nodeHTML(c,b){const k=NK[c.kind]||NK.component;const ref=c.ref&&N[c.ref];
  if(c.kind==='outside')return `<button class="node k-outside" data-id="${esc(c.id)}" style="left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px"><span class="h"><span class="ic" style="--kc:var(--grey);width:20px;height:20px"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">${ICON.outside}</svg></span><span class="t">${esc(c.title||(ref&&ref.title)||'')}</span></span></button>`;
  const go=kids(c).length?`${kids(c).filter(x=>x.kind!=='outside').length} 个部件 ›`:steps(c).length?'伪代码 ›':'';
  const glyph=c.kind==='queue'?`<span class="slots">${[1,1,1,0,0,0,0].map(x=>`<i class="${x?'on':''}"></i>`).join('')}</span>`:'';
  const dl=Math.max(1,Math.floor((b.h-(glyph?86:70)-(c.title.length>12&&b.w<240?20:0))/18));
  return `<button class="node k-${c.kind||'component'}" data-id="${esc(c.id)}" style="left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px;--kc:${k[1]};--dl:${dl}">
    <span class="h"><span class="ic"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${ICON[c.kind]||ICON.component}</svg></span><span class="t">${esc(c.title)}</span></span>
    ${glyph}${c.desc?`<span class="d">${esc(c.desc)}</span>`:''}
    <span class="f"><span class="c">${esc(c.code||'')}</span>${go?`<span class="go">${go}</span>`:''}</span></button>`}
function renderDiagram(node,bw,bh){const L=kids(node);const B={};let x1=0,y1=0,x0=1e9,y0=1e9;
  L.forEach((c,i)=>{const [col,row]=c.pos||[i%3,Math.floor(i/3)];const out=c.kind==='outside';const [sw,sh]=c.span||(out?[.62,.36]:[1,1]);
    const b={x:col*CW,y:row*RH+(out&&!c.span?(RH-GY)*.32:0),w:sw*CW-GX,h:sh*RH-GY};B[c.id]=b;x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.w);y1=Math.max(y1,b.y+b.h)});
  const G=(node.groups||[]).map(g=>{const ms=(g.nodes||[]).map(i=>B[i]).filter(Boolean);if(!ms.length)return null;const p=16;const gx0=Math.min(...ms.map(m=>m.x))-p,gy0=Math.min(...ms.map(m=>m.y))-p-18,gx1=Math.max(...ms.map(m=>m.x+m.w))+p,gy1=Math.max(...ms.map(m=>m.y+m.h))+p;
    x0=Math.min(x0,gx0);y0=Math.min(y0,gy0);x1=Math.max(x1,gx1);y1=Math.max(y1,gy1);return {x:gx0,y:gy0,w:gx1-gx0,h:gy1-gy0,t:g.title||''}}).filter(Boolean);
  const pad=26;x0-=pad;y0-=pad;x1+=pad;y1+=pad;const nw=x1-x0,nh=y1-y0;for(const b of Object.values(B)){b.x-=x0;b.y-=y0}for(const g of G){g.x-=x0;g.y-=y0}
  const s=Math.max(phone()?.66:.7,Math.min(1.3,bw/nw,bh/nh));
  const E=edgesOf(node);const pairN={};let svg='';const defs=Object.entries(KC).map(([k,c])=>`<marker id="m-${k}" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L10 5L0 9z" fill="${c}"/></marker>`).join('');
  for(const g of G)svg+=`<rect class="grp" x="${g.x}" y="${g.y}" width="${g.w}" height="${g.h}" rx="16"/><text class="grpt" x="${g.x+14}" y="${g.y+16}">${esc(g.t)}</text>`;
  let top='';E.forEach((e,i)=>{const a=B[e.from],b=B[e.to];if(!a||!b)return;let sa,sb;const acy=a.y+a.h/2,bcy=b.y+b.h/2;
    if(e.sides){[sa,sb]=e.sides.split('')}else if(b.x>=a.x+a.w-4){sa='r';sb='l'}else if(b.x+b.w<=a.x+4){sa='l';sb='r'}else if(bcy>acy){sa='b';sb='t'}else{sa='t';sb='b'}
    const key=[e.from,e.to].sort().join('|');const n=pairN[key]=(pairN[key]||0)+1;const off=(n-1)*22*(n%2?1:-1);
    let [px,py]=side(a,sa),[qx,qy]=side(b,sb);if(sa==='r'||sa==='l')py+=off;else px+=off;if(sb==='r'||sb==='l')qy+=off;else qx+=off;
    const h1=sa==='r'||sa==='l',h2=sb==='r'||sb==='l';const dd=Math.max(30,Math.hypot(qx-px,qy-py)*.38);
    const c1=h1?[px+(sa==='r'?dd:-dd),py]:[px,py+(sa==='b'?dd:-dd)],c2=h2?[qx+(sb==='r'?dd:-dd),qy]:[qx,qy+(sb==='b'?dd:-dd)];
    // midpoint of the cubic
    const mx=(px+3*c1[0]+3*c2[0]+qx)/8,my=(py+3*c1[1]+3*c2[1]+qy)/8;const col=KC[e.kind];const key2=`${e.from}>${e.to}`;
    svg+=`<path class="edge ${e.kind}" data-e="${esc(key2)}" data-a="${esc(e.from)}" data-b="${esc(e.to)}" d="M${px} ${py}C${c1} ${c2} ${qx} ${qy}" stroke="${col}" marker-end="url(#m-${e.kind})"/>`;
    const hasN=e.n!=null&&e.n!=='';const horiz=Math.abs(qx-px)>Math.abs(qy-py);
    if(hasN)top+=`<g class="enum" data-a="${esc(e.from)}" data-b="${esc(e.to)}"><circle cx="${mx}" cy="${my}" r="10" fill="${col}"/><text x="${mx}" y="${my+3.8}" text-anchor="middle">${esc(e.n)}</text></g>`;
    if(e.label)top+=horiz?`<text class="elab" data-a="${esc(e.from)}" data-b="${esc(e.to)}" x="${mx}" y="${my+(hasN?24:-7)}" text-anchor="middle" fill="${col}">${esc(e.label)}</text>`
      :`<text class="elab" data-a="${esc(e.from)}" data-b="${esc(e.to)}" x="${mx+(hasN?15:7)}" y="${my+4}" text-anchor="start" fill="${col}">${esc(e.label)}</text>`});
  const board=$('board');board.style.width=Math.min(bw,nw*s)+'px';board.style.height=nh*s+'px';if(nw*s>bw+1){board.style.width=nw*s+'px'}
  board.innerHTML=`<div class="binner" style="width:${nw}px;height:${nh}px;transform:scale(${s})"><svg width="${nw}" height="${nh}"><defs>${defs}</defs>${svg}</svg>${L.map(c=>nodeHTML(c,B[c.id])).join('')}<svg width="${nw}" height="${nh}" style="z-index:2">${top}</svg></div>`;
  LAY={kind:'diagram',B,s}}
function codeHTML(file,rs,heads,om,stepOf){const F=FILES[file]||{};const lang=String(file).split('.').pop().toLowerCase();const lines=[];rs.forEach((r,i)=>{if(i)lines.push([0,'⋯']);for(let l=r[0];l<=r[1];l++)lines.push([l,F[l]??''])});
  const ind=Math.min(...lines.filter(l=>l[0]&&l[1].trim()).map(l=>l[1].length-l[1].trimStart().length),99);const st={};let h='';
  for(const [ln,t0] of lines){if(!ln){h+=`<div class="cl gap"><span class="n"></span><span class="x">⋯</span></div>`;continue}
    const hd=heads[ln];if(hd)h+=`<div class="rb${hd.o?' o':''}"><span>${esc(hd.t)}</span><small>L${hd.a}${hd.b!==hd.a?'–'+hd.b:''}</small></div>`;
    const t=t0.slice(Math.min(ind,t0.length-t0.trimStart().length));const isO=om.some(o=>ln>=o[0]&&ln<=o[1]);const si=stepOf?stepOf(ln):null;
    h+=`<div class="cl${isO?' o':''}" data-ln="${ln}"${si!=null?` data-s="${si}"`:''}><span class="n">${ln}</span><span class="x">${hiLine(t,lang,st).map(([c,s])=>`<span class="t${c}">${esc(s)}</span>`).join('')}</span></div>`}
  return h}
function renderFn(node,bh){const S=steps(node);const rs=rangesOf(node);const om=node.omitted||[];const heads={};
  S.forEach((s,i)=>{const r=s.lines;if(r&&(!s.file||s.file===node.file)&&heads[r[0]]==null)heads[r[0]]={t:`${i+1}  ${s.title}`,a:r[0],b:r[1]}});for(const o of om)if(!heads[o[0]])heads[o[0]]={t:'省略：'+o[2],a:o[0],b:o[1],o:true};
  const stepOf=ln=>{let best=null;S.forEach((s,i)=>{const r=s.lines;if(r&&(!s.file||s.file===node.file)&&ln>=r[0]&&ln<=r[1]&&(best==null||(r[1]-r[0])<(S[best].lines[1]-S[best].lines[0])))best=i});return best};
  let h='<div class="fn"><div class="pc"><h3>伪代码 · 点一步看对应的源码</h3>';
  S.forEach((s,i)=>{const tg=KIND[s.kind]||'';const call=s.call&&N[s.call];
    h+=`<div class="ps" role="button" tabindex="0" data-s="${i}" style="margin-left:${Math.min(4,s.depth||0)*22}px"><span class="num">${i+1}</span><span class="b"><span class="t">${esc(s.title)}</span>${s.code?`<span class="c">${esc(s.code)}</span>`:''}${s.note?`<span class="n">${esc(s.note)}</span>`:''}</span>${call?`<span class="tag call" data-call="${esc(s.call)}">进入 ${esc(call.title)} ›</span>`:tg?`<span class="tag ${s.kind}">${tg}</span>`:''}</div>`});
  if(om.length)h+=`<div class="pom">省略了 ${om.length} 段非核心代码（右侧变淡的行）：${esc(om.map(o=>o[2]).join('；'))}</div>`;
  h+=`</div><div class="srcw"><h3>源码 · ${esc(node.file)}:${rs.map(r=>r[0]+'–'+r[1]).join(', ')}</h3><div class="srcbox" id="srcbox" style="max-height:${Math.max(240,bh-26)}px">${codeHTML(node.file,rs,heads,om,stepOf)}</div></div></div>`;
  $('board').style.width='';$('board').style.height='';$('board').innerHTML=h;LAY={kind:'fn'}}
function selStep(i,scroll){page.querySelectorAll('.ps').forEach(e=>e.classList.toggle('sel',+e.dataset.s===i));const box=$('srcbox');if(!box)return;box.querySelectorAll('.cl').forEach(e=>e.classList.toggle('sel',e.dataset.s!=null&&+e.dataset.s===i));
  const first=box.querySelector(`.cl[data-s="${i}"]`);if(first&&scroll!==false){if(phone())first.scrollIntoView({block:'center',behavior:RM?'auto':'smooth'});else box.scrollTo({top:Math.max(0,first.offsetTop-box.clientHeight*.25),behavior:RM?'auto':'smooth'})}}
const KIND={decision:'判断',loop:'循环',write:'写状态',wait:'等待',return:'出口',call:'调用',step:''};

function hiLine(t,lang,st){const out=[];const hash=['py','sh','rb','yaml','yml','toml','pl','r','cmake','bash','tcl'].includes(lang);
  if(st.inBlock){const j=t.indexOf('*/');if(j<0)return [['c',t]];out.push(['c',t.slice(0,j+2)]);t=t.slice(j+2);st.inBlock=false}
  if(st.inTriple){const j=t.indexOf(st.inTriple);if(j<0)return [['s',t]];out.push(['s',t.slice(0,j+3)]);t=t.slice(j+3);st.inTriple=null}
  const re=hash?/(#.*$)|("""|''')|([rbfu]?"(?:[^"\\]|\\.)*"|[rbfu]?'(?:[^'\\]|\\.)*')|(\b\d[\d_.xa-fA-F]*\b)|([A-Za-z_][A-Za-z0-9_]*)|(\s+)|(.)/g
               :/(\/\/.*$)|(\/\*)|(s?"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.){0,2}'|`[^`]*`)|(\b\d[\d_.xa-fA-FuUlL]*\b)|([A-Za-z_][A-Za-z0-9_]*)|(\s+)|(.)/g;
  let m;while((m=re.exec(t))){if(m[1])out.push(['c',m[1]]);
    else if(m[2]){const rest=t.slice(m.index);if(hash){const j=rest.indexOf(m[2],3);if(j<0){out.push(['s',rest]);st.inTriple=m[2];break}out.push(['s',rest.slice(0,j+3)]);re.lastIndex=m.index+j+3}
      else{const j=rest.indexOf('*/',2);if(j<0){out.push(['c',rest]);st.inBlock=true;break}out.push(['c',rest.slice(0,j+2)]);re.lastIndex=m.index+j+2}}
